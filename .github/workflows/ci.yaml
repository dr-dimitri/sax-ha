name: Continuous Integration

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Abhängigkeiten installieren
        run: python -m pip install --requirement requirements_test.txt

      - name: Release- und Snapshot-Metadaten prüfen
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: >-
          python scripts/release_metadata.py
          --labels-json "$PR_LABELS"
          --manifest custom_components/sax_power/manifest.json

      - name: Ruff ausführen
        run: ruff check custom_components scripts tests

      - name: Black prüfen
        run: black --check custom_components scripts tests

      - name: Tests ausführen
        run: pytest -v

  validate-hacs:
    name: HACS validieren
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: HACS-Validierung ausführen
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    name: hassfest validieren
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: hassfest ausführen
        uses: home-assistant/actions/hassfest@master
