name: Continuous Integration

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Abhängigkeiten installieren
        run: python -m pip install --requirement requirements_test.txt

      - name: Release- und Snapshot-Metadaten prüfen
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: >-
          python scripts/release_metadata.py
          --labels-json "$PR_LABELS"
          --manifest custom_components/sax_power/manifest.json

      - name: Ruff ausführen
        run: ruff check custom_components scripts tests

      - name: Black prüfen
        run: black --check custom_components scripts tests

      - name: Tests ausführen
        run: pytest -v

  frontend:
    name: Vue-Dashboard prüfen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend-Abhängigkeiten installieren
        run: npm ci

      - name: Typen und Formatierung prüfen
        run: npm run check

      - name: Frontend-Tests ausführen
        run: npm test

      - name: Lokale Dashboard-Assets bauen
        run: npm run build

      - name: Eingecheckte Dashboard-Assets vergleichen
        # REQ-VUE-DASHBOARD: Privilegierte Release-Jobs verwenden fertige Assets.
        working-directory: .
        run: |
          git diff --exit-code -- custom_components/sax_power/frontend
          if [[ -n "$(git ls-files --others --exclude-standard -- custom_components/sax_power/frontend)" ]]; then
            echo "Neue Dashboard-Assets müssen mit dem Quellcode eingecheckt werden." >&2
            exit 1
          fi

      - name: Chromium und WebKit für die Dashboard-Abnahme installieren
        run: npx playwright install --with-deps chromium webkit

      - name: Alle Dashboard-Ansichten im Browser prüfen
        run: npm run test:browser

      - name: Browserbericht und Dashboard-Screenshots sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vue-dashboard-browser-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  validate-hacs:
    name: HACS validieren
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: HACS-Validierung ausführen
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    name: hassfest validieren
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: hassfest ausführen
        uses: home-assistant/actions/hassfest@master
