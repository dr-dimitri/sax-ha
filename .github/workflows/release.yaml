name: Automated Release

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Getesteten Commit auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Zugehörigen Pull Request bestimmen
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          pull_requests="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TESTED_COMMIT/pulls")"
          merged_pull_requests="$(
            jq --arg commit "$TESTED_COMMIT" \
              '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $commit)]' \
              <<< "$pull_requests"
          )"
          pull_request_count="$(jq 'length' <<< "$merged_pull_requests")"
          if [[ "$pull_request_count" -ne 1 ]]; then
            echo "Für den getesteten Commit wurde nicht genau ein gemergter Pull Request gefunden." >&2
            exit 1
          fi

          jq -c '.[0].labels | map(.name)' <<< "$merged_pull_requests" \
            | sed 's/^/labels=/' >> "$GITHUB_OUTPUT"
          jq -r '.[0].body // ""' <<< "$merged_pull_requests" \
            > "$RUNNER_TEMP/release-body.md"
          echo "body_path=$RUNNER_TEMP/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Release-Metadaten und Commit prüfen
        if: >-
          !contains(fromJSON(steps.pull_request.outputs.labels),
          'release:snapshot')
        id: version
        env:
          PR_LABELS: ${{ steps.pull_request.outputs.labels }}
          TESTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: >-
          python scripts/release_metadata.py
          --labels-json "$PR_LABELS"
          --manifest custom_components/sax_power/manifest.json
          --expected-commit "$TESTED_COMMIT"
          --github-output "$GITHUB_OUTPUT"

      - name: Versions-Tag erstellen
        if: >-
          !contains(fromJSON(steps.pull_request.outputs.labels),
          'release:snapshot')
        env:
          NEXT_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$NEXT_TAG" --message "Release $NEXT_TAG"
          git push origin "$NEXT_TAG"

      - name: GitHub Release erstellen
        if: >-
          !contains(fromJSON(steps.pull_request.outputs.labels),
          'release:snapshot')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.pull_request.outputs.body_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Snapshot-Merge ohne Produktiv-Release melden
        if: >-
          contains(fromJSON(steps.pull_request.outputs.labels),
          'release:snapshot')
        run: |
          echo "::warning::Ein Snapshot-PR wurde gemergt; stabiler Tag und Release bleiben unverändert."
          echo "### Kein Produktiv-Release" >> "$GITHUB_STEP_SUMMARY"
          echo "Der gemergte PR trug \`release:snapshot\`." >> "$GITHUB_STEP_SUMMARY"
