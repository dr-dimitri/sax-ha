name: Automated Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Erhöhe Versionsnummer (Tag)
        id: bump_version
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: false       # Generiert den Tag als reine Nummer (z. B. 1.0.2)

      - name: Erstelle GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_version.outputs.new_tag }} # Nur die Versionsnummer
          name: ${{ steps.bump_version.outputs.new_tag }}     # Nur die Versionsnummer
          # Fügt den PR-Text ein. GitHub hängt die automatischen Notizen direkt darunter an.
          body: ${{ github.event.pull_request.body }}
          generate_release_notes: true # Aktiviert die automatische Commit-/PR-Liste von GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
