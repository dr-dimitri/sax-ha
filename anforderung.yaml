       prüft den erneuten Schutz auch nach dem Ende eines Preis-Slots."
    - "test_hysteresis_counts_fresh_measurements_not_repeated_evaluations
       prüft alle sechs Leistungs-Hysterese-Zähler über ihre tatsächlichen
