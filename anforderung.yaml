    - "tests/test_coordinator.py deckt coordinator._clamp_int isoliert ab
       (Wert innerhalb/genau auf den Grenzen/außerhalb in beide Richtungen/
       None bleibt None). tests/test_number.py deckt zusätzlich den
       RestoreEntity-Regressionsfall für beide betroffenen Einstellungen
       ab: ein außerhalb [MIN_SOC, MAX_SOC] liegender wiederhergestellter
       Wert wird beim Neustart auf die jeweilige Grenze geklemmt statt
       ungeprüft übernommen zu werden."

# ==============================================================================
# ANFORDERUNG: MANUELLE NETZLADUNG ÜBER DEN ZENTRALEN STEUERPFAD
# ==============================================================================
requirement_manual_grid_charge:
  id: REQ-MANUAL-GRID-CHARGE
  title: "Manueller Netzladeservice als sicherer Adapter auf die zentrale SunSpec-Steuerung"
  status: done
  description: >
    Die Aktionen sax_power.start_grid_charge und
    sax_power.stop_grid_charge stellen eine nicht persistierte manuelle
    Netzladung für Automationen bereit. start_grid_charge verlangt device_id
    und einen ganzzahligen, strikt negativen Watt-Sollwert von -32768 bis -1.
    Boolesche Werte, nicht ganzzahlige Werte, 0, positive Werte und Werte
    außerhalb dieses Gerätegrenzbereichs werden vor jedem Modbus-Write als
    übersetzbare ServiceValidationError (translation_domain sax_power,
    translation_key invalid_grid_charge_power) abgelehnt. Eine positive
    manuelle Entladung bleibt ausgeschlossen (REQ-MANUAL-DISCHARGE).

    Der Service schreibt Register 41 (Basic Mode) nicht. Er hinterlegt nur
    den manuellen Ladeauftrag und wertet unter _charge_control_lock sofort
    SaxPowerCoordinator._async_enforce_grid_charge_locked aus. Die
    verbindliche Gesamtpriorität lautet: Max-SOC-Sperre > manuelle
    Netzladung > zeitgesteuertes Laden > netzdienliches Laden >
    preisoptimiertes Laden. Alle Quellen steuern ausschließlich den einen
    gemeinsamen SunSpec-Writer (_sun_charge_task) für Register 40051/40049;
    _sun_charge_write_lock hält jede Mode-/Sollwertsequenz unteilbar.
    async_start_sun_charge selbst akzeptiert als zusätzliche innere
    Sicherheitsgrenze nur Werte von MIN_SETPOINT_POWER bis 0.

    Liegt der SOC unter dem wirksamen Max-SOC, wartet ein erstmaliger Start
    die vollständige Sequenz 40051 = 1 und 40049 = berechneter negativer
    Sollwert ab. Erst nach beiden Quittungen gilt der Auftrag als
    erfolgreich; Vorvalidierungs- oder Schreibfehler werden an den
    Service-Aufruf zurückgegeben und ein neuer Auftrag wird nicht als aktiv
    veröffentlicht. Ändert start_grid_charge einen bereits laufenden
    Sollwert, schreibt der gemeinsame Pfad die neue Sequenz sofort, ohne bis
    zum periodischen Wiederholungsintervall zu warten. Ist der wirksame
    Max-SOC erreicht, gewinnt stattdessen die Sperre und der Start wartet
    deren 40051=1-/40049=0-Sequenz ab, während der manuelle Auftrag bis zu
    stop_grid_charge vorgemerkt bleibt; eine negative Ladeleistung darf in
    diesem Zustand nie gewinnen.

    stop_grid_charge läuft ebenfalls vollständig unter
    _charge_control_lock. Die Aktion löscht den manuellen Auftrag, storniert
    den gemeinsamen SunSpec-Task, wartet dessen tatsächliches Ende auch bei
    einem gleichzeitig laufenden Schreibabschnitt ab und versucht danach
    Register 40051 aktiv auf 0 (SmartMeter-Nullregelung) zurückzusetzen. Erst
    anschließend wird die zentrale Entscheidung erneut ausgewertet, sodass
    eine weiterhin berechtigte Automatik übernehmen darf. Hat ein
    unvollständiger manueller Start seinen Auftrag bereits verworfen, aber
    nach quittiertem 40051=1 sowohl den 40049-Write als auch den
    Modus-0-Rollback verloren, arbeitet stop_grid_charge den offenen
    _sun_charge_reset_required-Auftrag auch ohne sichtbaren manuellen Auftrag
    ab. Das gilt nur, wenn kein gemeinsamer SunSpec-Writer mehr tatsächlich
    läuft; ein Stop ohne manuellen Auftrag unterbricht dadurch keine laufende
    Automatik und stößt nach einem reinen Fehler-Reset auch keine neu an.

    async_shutdown beendet zuerst Polling und Planner, erwirbt anschließend
    denselben _charge_control_lock, löscht den manuellen Auftrag, storniert
    und erwartet den gemeinsamen Writer und versucht bestmöglich 40051 = 0.
    Während des Shutdowns wird keine Automatik erneut ausgewertet; danach
    existiert kein schreibender Hintergrundtask mehr.
  acceptance_criteria:
    - "tests/test_init.py prüft den echten Service-Aufruf für negative Werte
       außerhalb des int16-Bereichs, 0 und positive Werte: übersetzbare
       ServiceValidationError und kein Modbus-Write."
    - "tests/test_coordinator.py prüft zusätzlich boolesche und gebrochene
       Werte, sichtbare Fehler beim ersten 40051-Write, ausschließlich
       40051/40049 beim Start sowie die sofortige Sollwertänderung."
    - "Coordinator-Tests belegen die Priorität Max-SOC > manuell >
       Automatiken, die Freigabe einer berechtigten Automatik nach Stop,
       den erfolgreichen Stop nach fehlgeschlagenem 40049-Write und ebenfalls
       fehlgeschlagenem Rollback, den Schutz einer tatsächlich laufenden
       Automatik, abgewartete Cancellation während eines Schreibabschnitts
       sowie einen Shutdown ohne verbleibenden Auftrag oder Writer."
    - "tests/test_integration_live.py verifiziert end-to-end, dass
       start_grid_charge Register 41 unverändert lässt, 40051/40049 setzt
       und stop_grid_charge 40051 auf SmartMeter-Nullregelung zurücksetzt."

# ==============================================================================
# ANFORDERUNG: NETZDIENLICHES LADEN (NUR MIT PV-ÜBERSCHUSS)
# ==============================================================================
requirement_grid_serving_charge:
  id: REQ-GRID-SERVING-CHARGE
  title: "Netzdienliches Laden: Speicher innerhalb eines eigenen Zeitfensters mit eigenen aktiven Monaten bei einsetzendem PV-Laden aktiv stoppen, um das Laden in die ertragsreichste Zeit zu verschieben"
  status: done
  description: >
    Eigenständiges Software-Feature (Schalter "Netzdienliches Laden aktiv",
    switch.py, sowie Zeitfenster "Start"/"Ende", time.py), das sich mit
    zeitgesteuertem Laden (REQ-TIMED-SOC-CHARGE) den SunSpec-Modus-
    Schreibpfad (_async_sun_charge_loop), die zentrale Einstellung "Max.
    SOC" (Ziel-SOC) sowie die Max-SOC-Sperre teilt - siehe
    SaxPowerCoordinator._async_enforce_grid_charge/_async_step_grid_serving.
    Netzdienliches Laden schreibt nie einen Sollwert > 0. Im Unterschied zum
    zeitgesteuerten Laden schreibt netzdienliches Laden selbst NIE einen aus
    dem PV-Überschuss berechneten Ladesollwert, sondern überlässt die
    eigentliche Ladung der geräteeigenen SmartMeter-Nullregelung (Register
    40051 = 0), die von sich aus nur mit echtem PV-Überschuss lädt. Die
    Software greift als eigene Zustandsmaschine (_async_step_grid_serving)
    nur ein, um die Ladung innerhalb des konfigurierten Zeitfensters gezielt
    zu unterbrechen, sobald ein Ladevorgang erkannt wurde - Zweck: der
    Speicher soll den PV-Überschuss während dieses Zeitfensters NICHT selbst
    verbrauchen, damit das Laden stattdessen in die Zeit mit dem höchsten
    PV-Ertrag verschoben wird:

    a. Ohne aktiven Sollwertvorgabemodus wird die tatsächliche Ladeleistung
       des SAX geprüft (negativer Anteil von data["storage_power_active"],
       siehe sensor.py "SAX Ladeleistung"/_negative_part). Erreicht oder
       überschreitet sie SMARTMETER_PV_SURPLUS_THRESHOLD_WATT (50 W, Beweis,
       dass die Nullregelung bereits mit nennenswertem Überschuss lädt) über
       PV_SURPLUS_HYSTERESIS_CYCLES aufeinanderfolgende Zyklen (dieselbe
       einheitliche Zyklen-Hysterese wie bei REQ-TIMED-SOC-CHARGE, siehe
       dort "PV-Überschuss-Prüfung"; self._grid_serving_charge_confirm_
       cycles), wechselt der Speicher aktiv in den Sollwertvorgabemodus UND
       die Ladung wird in demselben Aufruf auf 0 % gestoppt (Register 40049,
       async_start_sun_charge(0)). Danach werden zusätzlich einmalig
       PV_SURPLUS_HYSTERESIS_CYCLES weitere frische HIGH-Messwerte abgewartet
       (self._grid_serving_wait_cycles), bevor Schritt b ausgewertet wird,
       damit sich Moduswechsel und gestoppter Sollwert am Gerät setzen
       können. Die Aktivierungsrevision wird sofort als verarbeitet markiert;
       jede folgende _high_sample_revision verbraucht höchstens einen
       Wartezyklus. Preis-/PV-Prognose-Sensor-Events, Planner-Timer und
       Einstellungsänderungen ohne neue HIGH-Messung verkürzen die Wartezeit
       nicht. Auch ein wiederholtes Ereignis auf der letzten Warterevision
       darf Schritt b noch keine Freigabebestätigung liefern; diese beginnt
       erst mit der nächsten frischen Messung. Eine verlorene Berechtigung,
       zeitgesteuerter Haltezustand oder bereits bestätigter Netzbezug darf
       die Wartezeit weiterhin sofort zurücksetzen, auch ohne neue Revision.
    a.1 Netzbezugs-Schutz, mit aktivem Sollwertvorgabemodus, UNABHÄNGIG von
       den Wartezyklen aus Schritt a (self._grid_serving_import_confirm_
       cycles): Solange der Sollwert bei 0 % gehalten wird, fließt kein
       Ladestrom mehr in den Speicher - deckt der Hausverbrauch die
       PV-Erzeugung nicht mehr, entsteht dadurch Netzbezug, den die
       geräteeigene Nullregelung sonst durch eigenständiges Entladen
       abfangen würde. Deshalb wird data["smartmeter_power"] zusätzlich,
       bereits während der Wartezyklen aus Schritt a, auf tatsächlichen
       Netzbezug geprüft (positiver Wert über
       SMARTMETER_PV_SURPLUS_THRESHOLD_WATT, siehe Vorzeichenkonvention in
       REQ-SUNSPEC-MODE-CORRECTION), ebenfalls über dieselbe
       PV_SURPLUS_HYSTERESIS_CYCLES-Zyklen-Hysterese. Bleibt der Netzbezug
       so viele Zyklen in Folge über dem Schwellwert, wird der Speicher
       sofort aktiv zurück in die SmartMeter-Nullregelung gesetzt
       (async_stop_sun_charge, Register 40051 zurück auf 0) - dieser
       Schutz hat Vorrang vor und durchbricht dabei die Wartezyklen-
       Unterdrückung, unter der Schritt b sonst steht. Der Speicher lädt
       dadurch weiterhin nicht (kein PV-Überschuss vorhanden, sonst läge
       kein Netzbezug vor), entlädt sich aber smartmeter-gesteuert über die
       geräteeigene Nullregelung, um den Netzbezug zu vermeiden. Fällt der
       Netzbezug anschließend wieder unter den Schwellwert, wertet die
       Zustandsmaschine ab dem nächsten Zyklus wieder regulär ab Schritt a
       - bei weiterhin ausreichender SAX-Ladeleistung greift Schritt a nach
       erneuten PV_SURPLUS_HYSTERESIS_CYCLES Zyklen wieder ein.
    b. Erst mit aktivem Sollwertvorgabemodus (Wartezyklen abgelaufen, ohne
       durch Schritt a.1 bestätigten Netzbezug) wird die am Smart Meter
       gemessene Netzeinspeisung (data["smartmeter_power"]) gegen denselben
       Schwellwert geprüft, ebenfalls über dieselbe Zyklen-Hysterese
       (self._grid_serving_release_confirm_cycles). Fällt sie über so viele
       aufeinanderfolgende Zyklen darunter, wird der Speicher aktiv zurück
       in die SmartMeter-Nullregelung gesetzt (async_stop_sun_charge,
       Register 40051 zurück auf 0). Bleibt die Einspeisung mindestens beim
       Schwellwert (oder ist der Messwert gerade nicht bekannt, oder reißt
       die Unterschreitung zwischendurch wieder ab), bleibt die Ladung
       bewusst bei 0 % gehalten - der Speicher soll hier gezielt erst wieder
       laden, sobald ein Zeitpunkt mit dauerhaft gefallener Einspeisung
       erreicht ist, statt fortlaufend mit dem Überschuss mitzulaufen.

    Eigentumsübergabe vor Schritt a: Ist das effektive Ladepausenfenster
    freigegeben, self._grid_serving_setpoint_active aber noch False, setzt der
    Coordinator den gemeinsam genutzten SunSpec-Pfad zuerst ausdrücklich in
    die SmartMeter-Nullregelung (async_stop_sun_charge), bevor
    _async_step_grid_serving die reale SAX-Ladeleistung auswertet. Dadurch kann
    kein 0-%-Task einer zuvor höher priorisierten Max-SOC-Sperre ohne logischen
    Eigentümer weiterlaufen, wenn der konfigurierte Max-SOC angehoben oder der
    effektive Max-SOC durch die periodische Zellkalibrierung temporär auf 100 %
    gesetzt wird. Ohne diese Freigabe bliebe storage_power_active bei 0 W,
    Schritt a könnte nie auslösen und sowohl max_soc_clamped als auch
    grid_serving_active wären False, obwohl Register 40051/40049 den Speicher
    weiterhin im 0-%-Sollwertmodus hielten.

    Selbstheilung des Schreib-Tasks: Sowohl im Wartezyklen-Zweig (nach
    Schritt a, vor Ablauf von self._grid_serving_wait_cycles) als auch im
    Halte-Zweig von Schritt b (Einspeisung bleibt beim/über dem Schwellwert)
    ruft _async_step_grid_serving zusätzlich async_start_sun_charge(0) auf,
    statt sich allein auf self._grid_serving_setpoint_active zu verlassen.
    Bei unverändertem Sollwert UND weiterhin laufendem _sun_charge_task ist
    das ein No-Op (siehe async_start_sun_charge) - stirbt der Task jedoch
    unerwartet (z. B. ein einzelner transienter Modbus-Fehler in
    _async_sun_charge_loop, der den Task per re-raise beendet statt ihn zu
    retryen), wird er im selben Zyklus neu gestartet. Ursprünglich gemeldeter
    Bug ohne diese Selbstheilung: self._grid_serving_setpoint_active blieb
    dauerhaft True (Sensor "Netzdienliches Laden aktiv" zeigte weiterhin
    "aktiv"), während Register 40049/40051 nach dem toten Task nie wieder
    neu geschrieben wurden - das Gerät fiel nach seinem eigenen Timeout
    (Register 40050, max. 300 s) unbeaufsichtigt in die SmartMeter-
    Nullregelung zurück und begann unbemerkt wieder mit PV-Überschuss zu
    laden, obwohl netzdienliches Laden laut Software noch aktiv eingriff.

    Fehlt data["storage_power_active"], kann Schritt a nicht auslösen
    (Speicher bleibt in der Nullregelung); fehlt data["smartmeter_power"]
    nach dem Auslösen, können weder Schritt a.1 noch Schritt b
    zurückschalten (Ladung bleibt konservativ gehalten) - in beiden Fällen
    ohne bekannten Messwert keine aktive Entscheidung.

    Optionale PV-Prognose-Freigabe (Issues #78/#81): number.py stellt die
    im versionierten Konfigurations-Store persistierte Einstellung
    "Mindest PV-Prognose" in kWh bereit (0-999 kWh, Schritt 1 kWh, Default 0;
    REQ-CONTROL-CONFIG-BOOTSTRAP). RestoreEntity dient nur als einmaliger
    Migrationspfad für Einträge ohne Store, solange
    control_config_migration_pending gilt. Der Coordinator rundet
    jeden Schreibwert auf volle kWh; bei genau 0,5 wird kaufmännisch
    aufgerundet (8,5 -> 9), anschließend wird auf 0-999 begrenzt. Dadurch
    werden auch aus älteren Versionen restaurierte Dezimalwerte migriert.
    0 kWh deaktiviert die Zusatzbedingung vollständig und erhält damit das
    bisherige statische Verhalten für Bestandsinstallationen. Bei einem
    Wert > 0 verwendet die Ladepause ausschließlich den im Options Flow
    gewählten CONF_GRID_SERVING_PV_FORECAST_SENSOR: den heute noch erwarteten
    PV-Ertrag. SaxPricePlanner.grid_serving_forecast_kwh liest dessen Zustand;
    domain.forecast.normalize_energy_kwh normalisiert endliche Zahlen aus
    Wh/kWh/MWh auf kWh. Eine fehlende Einheit bleibt aus Kompatibilität
    als kWh interpretierbar; Wahrheitswerte, fremde Einheiten (z. B. W)
    sowie ein Überlauf bei der Umrechnung ergeben keine gültige Prognose.
    Der Vergleich nutzt den rohen normalisierten Wert ohne
    CONF_PV_FORECAST_FACTOR; dieser Faktor gehört nur zur Smart-Bedarfsrechnung
    mit der separaten Morgen-Quelle CONF_PV_FORECAST_SENSOR.
    Nur forecast >= Mindestwert gibt die prognoseabhängige Ladepause frei.
    Eine fehlende Auswahl, eine nicht vorhandene Entity sowie
    unknown/unavailable/leere/nichtnumerische oder nicht endliche Zustände
    geben sie nicht frei. Die Zustandsmaschine greift dann nicht ein und
    der Speicher darf früh über die SmartMeter-Nullregelung laden.

    Migration (Issue #216): Die bisher gespeicherte Auswahl
    CONF_PV_FORECAST_SENSOR bleibt unverändert als Morgen-Quelle für Smart
    erhalten. Sie wird nicht als Heute-Quelle übernommen. Bei Mindestwert
    > 0 benötigt die Ladepause eine ausdrückliche Auswahl im neuen Feld;
    im aktiven Zeitfenster meldet sie bis dahin
    "PV-Prognose für heute auswählen". 0 kWh lässt das statische Verhalten
    unverändert. Beide Auswahlen bleiben unabhängig, auch nach Neustarts.
    Der Prognosesensor im Dashboard zeigt nur die Heute-Quelle; sein Datum
    bezeichnet den heutigen Rest-Ertrag, nicht die Smart-Prognose für morgen.

    ChargePolicyInput.grid_serving_forecast_allowed fließt zentral in
    grid_serving_window_active ein. Dieser Wert ist damit das EINE effektive
    Fenster für Zustandsmaschine, Max-SOC-Fensterbindung und die Priorität
    gegenüber preisoptimiertem Laden. Fällt die Prognose während
    eines aktiven 0-%-Eingriffs unter die Schwelle oder wird ungültig, wird
    grid_serving_eligible False, alle Zustandszähler werden zurückgesetzt
    und _async_enforce_grid_charge ruft async_stop_sun_charge auf. Dasselbe
    effektive False gibt den Schreibpfad für price_should_charge bzw.
    price_should_pause frei. Änderungen am Number-Wert werden über dessen
    Coordinator-Setter sofort angewendet; Zustandswechsel an beiden getrennten
    Prognosesensoren werden vom Planner beobachtet und über async_apply_price_plan
    ohne Neustart sofort auf den Coordinator übertragen.

    Jeder Übergang eines zuvor aktiven 0-%-Eingriffs auf inaktiv setzt
    Register 40051 explizit auf SmartMeter-Nullregelung zurück - unabhängig
    davon, ob der Hauptschalter ausgeschaltet, der aktuelle Monat abgewählt,
    das Zeitfenster verlassen/geändert oder die Prognosefreigabe entzogen
    wurde. Das gilt auch, wenn der periodische SunSpec-Schreib-Task zu diesem
    Zeitpunkt bereits beendet ist: Bereits der Startauftrag setzt
    _sun_charge_reset_required als dauerhaften Besitznachweis, bevor der erste
    periodische Schreibvorgang beginnt. async_stop_sun_charge storniert einen
    noch laufenden Task und schreibt Register 40051 = 0; erst nach einem
    erfolgreichen Rückschreiben wird der Besitznachweis gelöscht. Schlägt das
    Rückschreiben transient fehl, bleibt der Auftrag erhalten und jeder
    weitere inaktive Coordinator-Takt versucht die SmartMeter-Nullregelung
    erneut, obwohl _sun_charge_task bereits None ist. Jeder inaktive Pfad
    ruft async_stop_sun_charge auf. Die Methode gleicht einen einfachen
    Sollzustand ab: _sun_charge_commanded_mode startet mit None (noch nicht
    synchronisiert), daher schreibt jede neue Coordinator-Instanz bei ihrer
    ersten inaktiven Entscheidung Register 40051 genau einmal ausdrücklich
    auf 0 - auch wenn der erste Read bereits 0 meldet und kein Task existiert.
    Erst nach dieser quittierten Synchronisierung sind weitere unveränderte
    inaktive Takte No-Ops. Damit hängt die Nullregelung direkt nach Reload/
    Neuinstallation nicht mehr von einem nur im RAM vorhandenen Task- oder
    Besitzmerker und auch nicht von einer erkannten Zustandsflanke ab.
    Zusätzlich wird die tatsächliche Rückmeldung aus Register 40051 weiter
    ausgewertet: Meldet das Gerät später Modus 1, obwohl der Sollzustand 0
    ist, wird die Nullregelung erneut geschrieben. Ein transient
    fehlgeschlagener Write lässt den Sollzustand unsynchronisiert und wird im
    nächsten inaktiven Takt wiederholt.

    Das Aktivieren erzeugt nicht mehr lediglich den periodischen Task. Der
    erste Registersatz wird synchron in der dokumentierten Reihenfolge
    geschrieben und quittiert (40051 = 1, danach 40049 = berechneter Sollwert,
    für die Ladepause 0 %); erst anschließend startet die Schleife mit dem
    nächsten Refresh nach Ablauf des Schreibintervalls. Damit wird ein
    Aktivstatus erst veröffentlicht, wenn die beiden SunSpec-Register
    tatsächlich gesetzt wurden. Scheitert 40049 nach quittiertem Modus 1,
    versucht der gemeinsame Schreibpfad 40051 sofort auf 0 zurückzusetzen;
    bis dieser Rollback oder ein Folge-Reset quittiert ist, bleibt der
    Rücksetzauftrag erhalten und es läuft kein Task weiter. Beim Deaktivieren
    bleibt die Reihenfolge unverändert: Schleife beenden, anschließend
    40051 = 0 schreiben.
    Ein Schreibfehler löscht die bestätigte Aktivität, bewahrt aber eine
    bereits bestehende netzdienliche Halteabsicht für den nächsten Versuch.
    Das gilt auch bei erneut fehlgeschlagenem Wiederanlauf; weiterhin hohe
    Einspeisung darf die zuvor bestätigte Ladepause nicht versehentlich
    freigeben. Deaktivierung, Fensterende, entzogene Prognosefreigabe und
    der SOC-Ausfallpfad dürfen die Halteabsicht weiterhin aufheben.
    Meldet ein späterer Read trotz laufender Schleife wieder 40051 = 0,
    schreibt async_start_sun_charge beide Aktivregister sofort erneut. Damit
    wird auch eine zwischenzeitliche Geräte-Rücksetzung oder ein externer
    Schreibzugriff korrigiert, ohne bis zum nächsten periodischen
    Schreibintervall zu warten. Innerhalb der Integration existiert dagegen
    kein zweiter unabhängiger Schreiber für 40049/40051: Alle Ladefunktionen
    einschließlich des manuellen Netzladeservice verwenden denselben
    serialisierten SunSpec-Pfad.

    Nach jedem erfolgreichen SunSpec-Write wird der HIGH-Readcache
    invalidiert, damit der nächste Coordinator-Takt den tatsächlichen
    Gerätewert unabhängig vom normalen Zwei-Sekunden-Intervall erneut liest.
    Der quittierte Wert von Register 40051 wird zugleich sofort in
    coordinator.data/_high_data übernommen. Der Diagnose-Sensor
    "Steuermodus" und damit das HA-Aktivitätslog zeigen die Nullregelung
    deshalb bereits mit der auslösenden Einstellungsänderung statt zunächst
    erneut den alten Cachewert zu veröffentlichen. In das lokale Ergebnis
    eines laufenden Refreshs darf dieser optimistische Wert jedoch nur dann
    übernommen werden, wenn der Write während genau dieser Auswertung
    quittiert wurde. Ohne neue Quittung gewinnt immer der tatsächliche
    Readback. Wirkt 40051 = 0 bereits am Gerät, obwohl seine Modbus-Antwort
    ausbleibt oder als Fehler ankommt, muss der folgende Read deshalb
    "SmartMeter-Nullregelung" veröffentlichen; der offene Rücksetzauftrag
    bleibt davon unberührt und wird weiter wiederholt. Ein echter Readback
    kann dadurch jede vom Gerät nicht übernommene oder extern überschriebene
    Änderung sichtbar machen und löst den erneuten Abgleich aus.

    Die komplette Auswertung und Anwendung einer Ladeentscheidung ist durch
    self._charge_control_lock serialisiert. Poll-Zyklus, Entity-Setter und
    Prognose-/Preis-Callback dürfen dadurch keine SunSpec-Schreibpfade
    parallel ausführen. Insbesondere kann eine ältere, bereits begonnene
    Aktiv-Auswertung Register 40051 nicht mehr nach einer neueren
    Deaktivierung wieder auf Sollwertvorgabe setzen: Die Deaktivierung läuft
    nach der begonnenen Entscheidung vollständig durch und endet immer mit
    Register 40051 = 0, sofern keine höher priorisierte Ladefunktion den
    Sollwertmodus benötigt. Status und physischer Steuermodus bleiben damit
    atomar konsistent.

    Für das Dashboard veröffentlicht sensor.py zusätzlich "PV-Prognose
    <Tag>.<Monat>." (grid_serving_forecast, kWh; bei fehlender Konfiguration
    oder jedem unbrauchbaren Wert unknown) und "Status"
    (grid_serving_pause_status). Als abgeleitete Anzeige statt physischem
    SAX-Messwert wird die Prognose-Entity nicht dem SAX-Gerät zugeordnet;
    dadurch verwendet Home Assistant ihren dynamischen Namen unverändert und
    stellt nicht "SAX Power Home" voran.
    Der Status beschreibt grundsätzlich das effektive Ladepausen-Fenster,
    nicht erst den späteren Eingriff nach erkannter PV-Ladung. Bei Mindestwert
    > 0 benötigt dieses Fenster eine ausgewählte, gültige Heute-Prognose. Die
    erste passende Bedingung gewinnt: Hauptschalter aus -> "Inaktiv";
    aktueller Monat aus
    -> "Inaktiv im Monat <Monat>"; Uhrzeit außerhalb -> "Außerhalb des
    Zeitfensters"; Mindestwert > 0 ohne Heute-Auswahl -> "PV-Prognose für
    heute auswählen"; konfigurierter, aber ungültiger Sensor bei Mindestwert
    > 0 -> "PV-Prognose
    nicht verfügbar"; Prognose unter Mindestwert -> Satz mit
    beiden kWh-Werten und inaktiver Ladepause; Prognose > Mindestwert ->
    aktiver Satz mit "größer als"; Prognose == Mindestwert -> derselbe aktive
    Satz mit "gleich". Mindestwert 0 ergibt den aktiven Satz ohne
    Prognosezusatz. Der Aktivsatz lautet "Ladepause ist zwischen HH:MM Uhr
    und HH:MM Uhr im <Monat> aktiv." und verwendet immer den aktuellen
    deutschen Monatsnamen. kWh-Werte erscheinen ohne unnötige
    Nachkommastellen.
    is_time_in_window bleibt die gemeinsame Logik für normale,
    mitternachtsübergreifende und leere Fenster. Poll-Zyklen sowie die
    bestehenden sofortigen Setter-/Sensor-Callbacks aktualisieren beide
    Anzeigen dynamisch.

    Priorität (höchste zuerst, siehe
    SaxPowerCoordinator._async_enforce_grid_charge): 1. Max-SOC-Sperre
    ("Auch der angegebene SOC muss berücksichtigt werden" - gilt
    unverändert für alle Lademodi), 2. manuelle Netzladung
    (REQ-MANUAL-GRID-CHARGE), 3. zeitgesteuertes Laden, 4.
    netzdienliches Laden, 5. preisoptimiertes Laden (REQ-DYNAMIC-PRICE-CHARGE)
    - netzdienliches Laden hat also Vorrang vor preisoptimiertem Laden, nicht
    umgekehrt: grid_serving_eligible verlangt nur noch "not
    timed_should_charge" (kein Ausschluss mehr durch price_should_charge/
    price_should_pause), preisoptimiertes Laden schließt seinerseits über
    "not grid_serving_window_active" aus, sobald das Zeitfenster des
    netzdienlichen Ladens effektiv aktiv ist (Zeit/Monat UND optionale
    Prognosefreigabe, unabhängig davon, ob dessen eigene
    Zustandsmaschine gerade tatsächlich eingreift) - zusätzlich zur
    strukturellen if/elif-Priorisierung, damit nie zwei Automatiken im selben
    Zyklus um denselben Sollwertvorgabemodus konkurrieren. Begründung: ohne
    diesen Vorrang konnten sich beide Automatiken gegenseitig ein- und
    ausschalten, sobald ihre jeweiligen Bedingungen gleichzeitig erfüllt
    waren (ursprünglich gemeldeter Bug); netzdienliches Laden ist zudem
    typischerweise nur in den ertragsreichen Sommermonaten aktiv, in denen
    ohnehin kaum oder kein Netzbezug nötig ist, sodass es sinnvollerweise vor
    preisoptimiertem Laden entscheidet.

    Aktive Monate: Zusätzlich zum Zeitfenster hat jedes der beiden Features
    (Netzladung UND netzdienliches Laden) 12 Monats-Schalter
    (switch.SaxPowerMonthSwitch, generische Klasse für beide Features/alle
    12 Monate; translation_key timed_charge_month_1..12 bzw.
    grid_serving_month_1..12, "Netzladung/Netzdienliches Laden aktiv im
    Januar" ... "im Dezember"), die festlegen, in welchen Kalendermonaten
    das jeweilige Zeitfenster überhaupt wirksam ist - z. B. Netzladung nur
    November-Januar zwischen 1 und 5 Uhr, netzdienliches Laden nur
    Mai-August zwischen 11 und 14 Uhr (SaxPowerCoordinator.
    _timed_charge_months/_grid_serving_months, je ein set[int] aus 1-12,
    Properties timed_charge_months/grid_serving_months als frozenset,
    Setter async_set_timed_charge_month/async_set_grid_serving_month).
    Default (beide Sets initial set(const.ALL_MONTHS)): alle 12 Monate
    aktiv, damit sich bestehende Konfigurationen nach diesem Update
    unverändert verhalten, bis der Anwender einzelne Monate bewusst
    abwählt. Ist für ein Feature kein einziger Monat ausgewählt, ist es
    ganzjährig inaktiv (analog zu einem leeren Zeitfenster) -
    SaxPowerCoordinator._async_enforce_grid_charge prüft zusätzlich zum
    Zeitfenster now.month in self._timed_charge_months bzw.
    self._grid_serving_months.

    Eine gültige Monatsauswahl wird als lokale HA-Konfiguration unmittelbar
    bestätigt und zum Speichern vorgemerkt. Serviceantwort und Schalterzustand
    warten nicht auf eine laufende Geräteauswertung oder Modbus-Schreibvorgänge.
    Der Coordinator stößt die Geräteauswertung ohne zusätzlichen Timer an;
    sie bleibt durch den gemeinsamen Control-Lock serialisiert. Mehrere
    Änderungen werden zusammengefasst und Änderungen während einer laufenden
    Auswertung anschließend mit dem neuesten Stand erneut ausgewertet.
    Aktivitäts- und Gerätezustände gelten erst nach der bestehenden quittierten
    Steuersequenz als angewendet. Fehler bleiben diagnostizierbar; der reguläre
    Poll versucht die Steuerung erneut. Während Bootstrap und Shutdown werden
    keine neuen Monatsauswertungen gestartet. Beim Entladen wird eine bereits
    laufende Auswertung vor dem abschließenden Geräte-Reset abgewartet, ohne
    eine Registersequenz mitten im Schreiben abzubrechen.

    Zeitfenster-Nichtüberlappung (Tageszeit UND Monat): Das Zeitfenster des
    netzdienlichen Ladens darf sich nicht mit dem Zeitfenster der Netzladung
    überschneiden - zwei Fenster gelten dabei NUR dann als überlappend, wenn
    sich sowohl ihre Tageszeiten ALS AUCH ihre aktiven Monate überschneiden.
    Laufen beide Fenster nur in disjunkten Monaten, dürfen sich die
    Tageszeiten beliebig überlappen, da die Fenster nie gleichzeitig aktiv
    sein können (siehe Beispiel oben). SaxPowerCoordinator.
    _windows_overlap_with_months kapselt diese Prüfung (Tageszeit über
    coordinator.windows_overlap - unterstützt wie _is_time_in_window über
    Mitternacht laufende sowie unvollständige Fenster, mindestens eine der
    vier Zeiten fehlt gilt als nie überlappend; Monatsprüfung als einfache
    Set-Schnittmenge months_a & months_b). Wie darauf reagiert wird,
    unterscheidet sich je nach betroffener Entitäts-Gruppe:

    - Monats-Setter (async_set_timed_charge_month/async_set_grid_serving_
      month): _assert_windows_dont_overlap lehnt eine Änderung, die zu einer
      echten Überschneidung führen würde, weiterhin mit HomeAssistantError
      ab - die bisherige Monats-Auswahl bleibt dabei unverändert. Der Fehler
      wird über den auslösenden Service-Call an das Frontend durchgereicht
      und dem Anwender direkt als Fehlermeldung angezeigt.
    - Zeit-Setter (async_set_timed_charge_start/-end/-window,
      async_set_grid_serving_start/-end/-window): Eine echte Überschneidung
      wird NICHT mehr mit HomeAssistantError abgelehnt. Stattdessen zeigt
      _notify_time_window_overlap eine Persistent Notification
      (homeassistant.components.persistent_notification, notification_id
      f"{DOMAIN}_{entry_id}_window_overlap") mit beiden betroffenen
      Zeitfenstern (Tageszeit + aktive Monate, formatiert über
      _format_window_for_message) an, und die soeben geänderte Zeit wird auf
      None (leer) gesetzt - bei async_set_timed_charge_start/-end bzw.
      async_set_grid_serving_start/-end nur die jeweils eine geänderte
      Grenze, bei den beiden -window-Settern (siehe unten) beide Grenzen.
      Eine leere Start- oder Endzeit bewirkt immer, dass das jeweilige
      Feature nicht ausgeführt wird (_is_time_in_window/windows_overlap
      behandeln ein unvollständiges Fenster als nie aktiv bzw. nie
      überlappend) - eine geleerte Zeit muss also bewusst neu gesetzt
      werden, damit das Feature wieder aktiv wird.

    Begründung für die unterschiedliche Behandlung: Bei einem Monats-Schalter
    lässt sich eine Ablehnung sauber auf den vorherigen (binären) Zustand
    zurücksetzen. Eine Zeit-Entity dagegen bedient typischerweise nur EINE
    von zwei Grenzen eines Zeitfensters (Start und Ende sind getrennte
    Entities) - würde man eine überlappende Änderung stattdessen komplett
    ablehnen (alten Wert beibehalten), könnte ein rein durch das getrennte
    Bearbeiten von Start und Ende entstehender, in Wahrheit gar nicht
    beabsichtigter Zwischenzustand (neue Grenze + noch nicht aktualisierte
    andere Grenze) fälschlich als Überschneidung erkannt werden, obwohl das
    beabsichtigte Endergebnis nicht überlappen würde - je nachdem, ob zuerst
    Start oder Ende geändert wird. Das Leeren statt Beibehalten des alten
    Werts vermeidet diese Verwirrung, ohne die Nichtüberlappungs-Regel
    aufzuweichen (ein leeres Fenster kann per Definition nie überlappen).

    Services set_timed_charge_window/set_grid_serving_window
    (SaxPowerCoordinator.async_set_timed_charge_window/
    async_set_grid_serving_window, services.yaml): Setzen Start und Ende
    eines Zeitfensters atomar in einem einzigen Aufruf (Felder device_id,
    start, end) - die Überlappungsprüfung läuft dabei genau einmal gegen das
    fertige Ziel-Fenster, ohne den oben beschriebenen Zwischenzustand zu
    durchlaufen; bei einer echten Überschneidung werden ebenfalls beide
    übergebenen Werte geleert (siehe oben). Empfohlen für jede Änderung, bei
    der sich sowohl Start als auch Ende ändern sollen. Die einzelnen
    Start-/Ende-Entities (time.py) bleiben unverändert bestehen und eignen
    sich weiterhin für das Verschieben nur einer einzelnen Zeitgrenze. Aus
    einem verwandten Grund kann das schrittweise Umstellen von
    überlappenden Tageszeiten auf disjunkte Monate in ungünstiger
    Reihenfolge zwischenzeitlich eine Zeit leeren, obwohl das beabsichtigte
    Endergebnis nicht überlappen würde - empfohlen wird, zunächst beide
    Monats-Auswahlen anzupassen (wirkt sich dabei so lange nicht
    überlappend aus, wie mindestens eines der beiden Zeitfenster noch beim
    - nicht überlappenden - Default steht) und erst danach die Zeiten zu
    ändern.

    Die Monats-Setter unterstützen zusätzlich einen validate-Parameter
    (Default True): SaxPowerMonthSwitch.async_added_to_hass ruft sie beim
    Restaurieren eines gespeicherten Zustands mit validate=False auf, um
    False-Positives durch das sequentielle Restaurieren mehrerer
    Monats-Entities zu vermeiden (beide Monats-Sets starten intern bei
    "alle Monate", ein während der Restaurierung zwischenzeitlich noch
    voller Satz auf der jeweils anderen Seite würde sonst fälschlich als
    Überlappung erkannt). Live-Änderungen über den Schalter
    (async_turn_on/-off) validieren dagegen immer.

    Diagnose-Sensor "Netzdienliches Laden aktiv" (sensor.py,
    grid_serving_active_text, analog zu "Zeitgesteuertes Laden aktiv") zeigt
    an, ob netzdienliches Laden gerade aktiv in den Sollwertvorgabemodus
    eingreift, also die Ladung gezielt bei 0 % hält
    (self._grid_serving_setpoint_active) - nicht, ob der Speicher gerade
    über die geräteeigene Nullregelung mit PV-Überschuss lädt (dafür siehe
    Sensor "SAX Ladeleistung"). Das informiert den Anwender laufend über
    den Aktivzustand des Eingriffs.

    Aktiviert-Zustand, Start-/Endzeit, aktive Monate sowie der optionale
    Mindest-Prognosewert werden über Neustarts hinweg persistiert (analog
    zum zeitgesteuerten Laden) - im versionierten Konfigurations-Store, der
    vor dem ersten steuernden Refresh geladen wird, mit dem
    RestoreEntity-Zustand nur noch als einmaligem Migrationspfad (siehe
    REQ-CONTROL-CONFIG-BOOTSTRAP). Ohne zuvor gespeicherten Zustand gelten die
    Defaults DEFAULT_GRID_SERVING_ENABLED (False) sowie
    DEFAULT_GRID_SERVING_START/-END (const.py) - bewusst identisch (Start ==
    Ende), damit das Default-Zeitfenster leer ist und nie mit dem (beliebig
    konfigurierten) Zeitfenster der Netzladung überlappen kann. Kein
    Vorbelegungsschritt im Config Flow (im Unterschied zu
    REQ-TIMED-SOC-CHARGE) - das Feature wird ausschließlich über die
    Entitäten nach der Ersteinrichtung konfiguriert.
  acceptance_criteria:
    - "Getrennte Heute-/Morgen-Auswahlen werden gespeichert und vorbelegt.
       Alte Auswahlen bleiben bei Smart und der optionalen Ladeplanung;
       eine fehlende Heute-Auswahl
       verhindert die prognoseabhängige Pause und wird verständlich angezeigt.
       Unterschiedliche Sensorwerte und Ausfälle beeinflussen jeweils nur
       ihren Zeithorizont. Eine fallende Heute-Prognose beendet einen aktiven
       Eingriff unmittelbar; Mindestwert 0 erhält die statische Pause."
    - "tests/test_price_optimizer.py/test_charge_policy.py/test_forecast.py
       decken die optionale Prognosefreigabe ab: 0 kWh deaktiviert sie;
       unterhalb/exakt auf/oberhalb der Schwelle gilt False/True/True;
       ohne ausgewählten Sensor bleibt die Ladepause trotz Mindestwert aktiv
       und stoppt erkannte SAX-Ladung; Wh, kWh und MWh werden normalisiert;
       bei ausgewähltem Sensor deaktivieren unknown, unavailable,
       nichtnumerische und nicht endliche Werte die Ladepause;
       ein laufender 0-%-Eingriff wird sicher per SmartMeter-Nullregelung
       beendet; bei niedriger Prognose bleibt aktives preisoptimiertes Laden
       freigegeben. tests/test_number.py deckt Default, Restore und Klemmung
       der Number-Entity sowie 1-kWh-Schritt und kaufmännische Rundung ab;
       frontend/tests/charging.test.ts ihre Darstellung. tests/test_coordinator.py
       deckt alle priorisierten Ladepausen-Statustexte einschließlich des
       reinen Aktivsatzes ohne konfigurierten Prognosesensor und der
       getrennten Ausgaben für größer und gleich ab; die bestehende
       Policy-Abdeckung bestätigt, dass Gleichheit die Ladepause freigibt."
    - "tests/test_coordinator.py und tests/test_price_optimizer.py decken
       aktive Übergänge auf inaktiv durch Hauptschalter, Monatsauswahl,
       Zeitfenster und fallende PV-Prognose ab, nachdem der periodische
       Schreib-Task bereits beendet wurde. In jedem Fall wird Register 40051
       explizit mit SmartMeter-Nullregelung beschrieben; die Prognose ist in
       der Übergangsmatrix ausdrücklich enthalten. Weitere Tests erzwingen
       einen transienten Fehler beim ersten Rückschreiben und belegen, dass
       der Rücksetzauftrag erhalten bleibt und sowohl ein direkter Folgeaufruf
       als auch der nächste inaktive Coordinator-Takt Register 40051 erneut
       auf 0 schreibt. Der bestehende Schritt-a-Test deckt den umgekehrten
       Übergang in Sollwertvorgabe plus 0-%-Sollwert ab."
    - "tests/test_coordinator.py deckt windows_overlap (normales Fenster,
       über Mitternacht laufendes Fenster, berührende statt überlappende
       Fenster, unvollständige Fenster) ab - inklusive des Falls, dass
       identische Tageszeiten bei disjunkten aktiven Monaten NICHT als
       überlappend gelten."
    - "tests/test_coordinator.py deckt die Ablehnung überlappender
       Änderungen an den Monats-Settern (async_set_timed_charge_month,
       async_set_grid_serving_month) mit HomeAssistantError ab (bisherige
       Monats-Auswahl bleibt unverändert), sowie für die Zeit-Setter
       (async_set_timed_charge_start/-end/-window, async_set_grid_serving_
       start/-end/-window) das neue Verhalten bei echter Überschneidung:
       kein HomeAssistantError mehr, stattdessen eine Persistent
       Notification (hass.data[persistent_notification.DOMAIN], Eintrag mit
       'window_overlap' in der notification_id) mit beiden Zeitfenstern
       sowie eine geleerte (None) soeben geänderte Zeit - bei den
       -start/-end-Settern nur die jeweils geänderte Grenze, bei den
       -window-Settern beide Grenzen. Ein Regressionstest reproduziert den
       ursprünglich gemeldeten Bug direkt: ein durch getrenntes Setzen von
       Start und Ende über die einzelnen Uhrzeit-Entities entstehender,
       nicht beabsichtigter Zwischenzustand führt zum Leeren der Zeit,
       während der atomare -window-Service dasselbe Ziel-Fenster
       akzeptiert."
    - "tests/test_coordinator.py deckt die Zustandsmaschine von
       netzdienlichem Laden (_async_step_grid_serving) ab: Schritt a
       wechselt erst in den Sollwertvorgabemodus und stoppt die Ladung auf
       0 %, wenn die tatsächliche SAX-Ladeleistung
       (data['storage_power_active']) den Schwellwert über
       PV_SURPLUS_HYSTERESIS_CYCLES aufeinanderfolgende Zyklen erreicht (ein
       einzelner Zyklus reicht noch nicht), und setzt danach zusätzlich
       zwei Wartezyklen; während dieser Wartezyklen bleibt Schritt b
       unterdrückt, selbst wenn die Netzeinspeisung zwischenzeitlich unter
       den Schwellwert fällt. Preisplan- und Einstellungsereignisse ohne
       neuen HIGH-Messwert verbrauchen weder die Wartezyklen noch zählen sie
       Aktivierungs-/Warte-Messwerte vorzeitig für Schritt b; erst zwei neue
       Warte-Messwerte und zwei weitere Freigabe-Messwerte geben wieder frei.
       Nach Ablauf der Wartezyklen bleibt die Ladung
       bei weiterhin hoher Einspeisung bewusst bei 0 % gehalten (kein
       Wiederanstieg des Sollwerts mehr, im Unterschied zum alten
       Verhalten), Schritt b setzt erst bei über ebenso viele
       aufeinanderfolgende Zyklen bestätigter Einspeisung unter dem
       Schwellwert aktiv in die SmartMeter-Nullregelung zurück; ohne
       bekannte SAX-Ladeleistung kann Schritt a nicht auslösen, ohne
       bekannte Netzeinspeisung nach dem Auslösen bleibt Schritt b
       konservativ gehalten statt zurückzuschalten. Zusätzlich deckt es ab:
       kein Eingriff außerhalb des Zeitfensters/außerhalb der aktiven
       Monate/deaktiviert, Vorrang der Max-SOC-Sperre sowie die
       Ausschlusslogik zu zeitgesteuertem Laden über grid_serving_eligible
       (not timed_should_charge). Ebenso deckt es das analoge
       Monats-Verhalten für zeitgesteuertes Laden ab (inaktiv außerhalb der
       ausgewählten Monate, aktiv innerhalb) sowie den Fall, dass ein
       Feature bei keinem ausgewählten Monat ganzjährig inaktiv bleibt.
       Zwei Regressionstests decken zusätzlich die Eigentumsübergabe von der
       Max-SOC-Sperre an eine noch nicht ausgelöste Ladepause ab: Sowohl das
       manuelle Anheben des konfigurierten Max-SOC als auch das automatische
       Anheben des effektiven Max-SOC durch die Zellkalibrierung beenden den
       alten 0-%-Task, schreiben Register 40051 auf SmartMeter-Nullregelung und
       lassen weder max_soc_clamped noch grid_serving_active fälschlich aktiv.
       test_enforce_grid_charge_grid_serving_import_protection_overrides_
       wait_cycles deckt zusätzlich Schritt a.1 (Netzbezugs-Schutz) ab:
       tatsächlicher Netzbezug (positiver data['smartmeter_power']) über
       dem Schwellwert schaltet über dieselbe Zyklen-Hysterese aktiv zurück
       in die SmartMeter-Nullregelung, und zwar auch während der
       Wartezyklen aus Schritt a (durchbricht deren Unterdrückung, ein
       einzelner Zyklus reicht noch nicht). Auch ein fehlgeschlagener
       Rückschaltversuch wird mit bereits bestätigtem Netzbezug ohne weitere
       Messung sofort wiederholt und setzt die Wartezeit zurück; anschließend
       wertet die Zustandsmaschine wieder regulär ab Schritt a, sodass sie bei
       weiterhin hoher SAX-Ladeleistung nach erneuten
       PV_SURPLUS_HYSTERESIS_CYCLES Zyklen wieder eingreift.
       test_enforce_grid_charge_grid_serving_restarts_dead_write_task_while_
       holding deckt die Selbstheilung des Schreib-Tasks ab (siehe oben):
       stirbt _sun_charge_task unerwartet (simuliert durch direktes
       Canceln außerhalb von async_stop_sun_charge, wie es ein re-raise
       nach einem transienten Modbus-Fehler in _async_sun_charge_loop
       bewirken würde), während self._grid_serving_setpoint_active True
       ist - sowohl im Wartezyklen- als auch im Halte-Zweig -, startet der
       nächste _async_enforce_grid_charge-Aufruf den Task automatisch neu,
       statt den Speicher dauerhaft unbeaufsichtigt zu lassen."
    - "tests/test_price_optimizer.py deckt den Vorrang von netzdienlichem vor
       preisoptimiertem Laden ab (test_grid_serving_takes_priority_over_
       price_charge_neutral_band, test_grid_serving_takes_priority_over_
       price_charge_active_charging): ein aktives Zeitfenster des
       netzdienlichen Ladens blockiert sowohl price_should_charge als auch
       die Neutralpreis-Pausezone, nicht umgekehrt - Regressionsschutz für
       den ursprünglich gemeldeten Bug, dass sich beide Automatiken
       gegenseitig ein- und ausschalten konnten."
    - "switch.py/time.py/sensor.py enthalten keine eigene
       Leistungseinstellung für netzdienliches Laden - es schreibt nie
       einen Sollwert > 0 und nutzt nur die zentrale Einstellung 'Max.
       SOC' wie zeitgesteuertes Laden."

# ==============================================================================
# ANFORDERUNG: MANUELLE ENTLADUNG (VERWORFEN)
# ==============================================================================
requirement_manual_discharge:
  id: REQ-MANUAL-DISCHARGE
  title: "Speicher manuell mit fester Leistung entladen - verworfen, da vom Hersteller nicht vorgesehen"
  status: verworfen
  description: >
    Ursprünglich implementiert als Software-Logik analog zu zeitgesteuertem
    Laden/Max-SOC-Sperre: Schalter "Manuelle Entladung" (switch.py) +
    Zahlenfeld "Entladeleistung" (number.py), geschrieben über denselben
    SunSpec-Modus-Pfad (Register 40051 Sollwertvorgabe + Register 40049),
    hier mit POSITIVEM statt negativem Sollwert (Vorzeichenkonvention:
    negativ = Laden, positiv = Entladen, siehe REQ-TIMED-SOC-CHARGE).

    Live-Tests gegen echte Hardware (tests/test_real_hardware.py, siehe
    Git-Historie) zeigten, dass weder dieser SunSpec-Weg noch alternativ
    der ältere Basic-Mode-P-Sollwert (Register 41, ebenfalls positiv) eine
    tatsächliche Entladung auslösten - auch nicht nach Umstellung der
    geräteseitigen Betriebsart auf "P-Sollwert (TCP)" (siehe
    modbus_llm.yaml, operation_modes). Beide Wege schrieben die Register
    nachweislich korrekt (Rücklesen stimmte), das Gerät reagierte aber
    nicht mit realer Leistungsabgabe. Auf Rückfrage hat der Hersteller
    bestätigt: eine ferngesteuerte manuelle Entladung ist auf diesem Weg
    nicht vorgesehen.

    Die Funktionalität (Schalter, Zahlenfeld, Priorisierung in
    SaxPowerCoordinator._async_enforce_grid_charge, Übersetzungen) wurde
    deshalb wieder vollständig entfernt. Warnende Kommentare bei
    REG_SETPOINT_POWER und REG_SUN_IC_POWER_SETPOINT_PCT (const.py)
    erinnern bei einer späteren Umsetzung an diesen Befund - vor einem
    erneuten Versuch unbedingt zuerst erneut beim Hersteller nachfragen,
    ob sich daran etwas geändert hat.
  acceptance_criteria:
    - "Keine Entitäten/Code-Pfade für manuelle Entladung mehr vorhanden
       (switch.py, number.py, coordinator.py, Übersetzungen)."
    - "const.py enthält bei REG_SETPOINT_POWER und
       REG_SUN_IC_POWER_SETPOINT_PCT einen Kommentar mit diesem Befund für
       spätere Umsetzungsversuche."

# ==============================================================================
# ANFORDERUNG: LOW-INTERVALL FÜR STATISCHE SUNSPEC-MODUS-REGISTER
# ==============================================================================
requirement_low_interval_registers:
  id: REQ-LOW-INTERVAL-REGISTERS
  title: "Statische SunSpec-Modus-Register (Geräteidentität, Skalierungsfaktoren) seltener abfragen als Messwerte"
  status: done
  description: >
    Der SunSpec-Modus-Block (Slave-ID 100, Register 40000-40114, siehe
    REQ-SUNSPEC-MODE-CORRECTION) enthält zwei zusammenhängende
    Teilbereiche, die laut modbus_llm.yaml ausschließlich "wellknown" fixe
    bzw. sich im laufenden Betrieb praktisch nie ändernde Werte enthalten:
    das SunSpec Common Model + den Modellkopf von "3Ph Inverter"
    (Hersteller, Gerätemodell, Firmware-Version, Seriennummer,
    Modell-ID/Länge; Register 40000-40016) sowie die
    Battery-Skalierungsfaktoren (Register 40110-40114). Beide Teilbereiche
    liegen direkt am Rand des Gesamtblocks und lassen sich deshalb ohne
    zusätzliche Requests im regulären Poll-Zyklus abtrennen.

    SaxPowerCoordinator._async_read_low_block liest diese beiden
    Teilbereiche per eigenem read_holding_registers-Aufruf nur alle
    READ_BLOCK_EXT_LOW_INTERVAL Sekunden (1 Stunde) neu ein, statt bei
    jedem regulären Poll. Der reguläre (HIGH-)Block
    (READ_BLOCK_EXT_START/READ_BLOCK_EXT_COUNT) schrumpft dadurch von 115
    auf 93 Register. Zwischen den Refreshs werden die zuletzt gelesenen
    Werte weiterverwendet (self._low_block_data bzw.
    self._battery_scale_factors, die der Coordinator beim nächsten HIGH-Read
    an domain.sunspec.decode_high_block übergibt); ein Scheitern des
    LOW-Reads lässt das Update nicht fehlschlagen, analog zu
    REQ-EXTENDED-MODE-RESILIENCE.
  requirements:
    - "Die beiden LOW-Intervall-Teilbereiche werden beim allerersten Poll
       sofort mitgelesen, damit die zugehörigen Diagnose-Sensoren nicht bis
       zum Ablauf des ersten Intervalls 'unbekannt' zeigen."
    - "Ein Scheitern des LOW-Intervall-Reads (bei ansonsten erreichbarem
       SunSpec-Modus) lässt das Update nicht fehlschlagen - die zuletzt
       gelesenen Werte bleiben erhalten, bis der nächste Refresh gelingt."
    - "Sicherheits-/steuerungsrelevante Register (SOC, Zustände,
       Fehlercodes, Smart-Meter-Leistung) bleiben ausdrücklich im
       HIGH-Block und werden weiterhin bei jedem Poll gelesen."
  acceptance_criteria:
    - "tests/test_coordinator.py deckt sowohl das Refresh-Intervall
       (kein Reread innerhalb von READ_BLOCK_EXT_LOW_INTERVAL, Reread nach
       Ablauf) als auch die Fehlerresilienz des LOW-Blocks ab."
    - "DEVELOPMENT.md beschreibt die Drei-Block-Struktur des SunSpec-Modus
       (HIGH + zwei LOW-Teilbereiche) im Abschnitt Register-Mapping."

# ==============================================================================
# ANFORDERUNG: EIGENES, FESTES HIGH-INTERVALL FÜR DYNAMISCHE SUNSPEC-MODUS-REGISTER
# ==============================================================================
requirement_high_interval_registers:
  id: REQ-HIGH-INTERVAL-REGISTERS
  title: "Dynamische SunSpec-Modus-Register (HIGH-Block) mit eigenem, festem 2s-Intervall statt gemeinsam mit Basic Mode (NORMAL)"
  status: done
  description: >
    Vor dieser Anforderung teilten sich der HIGH-Block (siehe
    REQ-LOW-INTERVAL-REGISTERS) und der Basic-Mode-Block (NORMAL, Slave-ID
    64) denselben Coordinator-Timer und damit dasselbe, über
    CONF_SCAN_INTERVAL/DEFAULT_SCAN_INTERVAL nutzerkonfigurierbare
    Intervall (Default 10s) - die Unterscheidung HIGH/NORMAL war rein
    begrifflich, ohne technische Konsequenz.

    Der HIGH-Block enthält u. a. die tatsächliche Lade-/Entladeleistung
    (storage_power_active, Register 40029) und die Netzleistung
    (smartmeter_power, Register 40072), die den Trigger für netzdienliches
    Laden bilden (siehe REQ-GRID-SERVING-CHARGE) - eine zügige Reaktion
    hängt hier direkt an der Poll-Frequenz. NORMAL (Basic Mode: SOC,
    Schaltzustand) hat dagegen keinen vergleichbaren Bedarf an einer
    kürzeren, festen Frequenz und soll über das bestehende
    Config-Flow-Feld "Aktualisierungsintervall" einstellbar bleiben.

    READ_BLOCK_EXT_HIGH_INTERVAL (fest, 2 Sekunden, nicht über die
    Oberfläche konfigurierbar) entkoppelt den HIGH-Block deshalb vom
    NORMAL-Intervall: SaxPowerCoordinator.__init__ setzt den internen
    Coordinator-Timer (update_interval) auf
    min(scan_interval, READ_BLOCK_EXT_HIGH_INTERVAL) - da das
    config_flow-Minimum für scan_interval (5s) immer über
    READ_BLOCK_EXT_HIGH_INTERVAL liegt, läuft der Timer damit faktisch
    immer mit 2s. _async_read_basic (NORMAL) und _async_read_high_block
    (HIGH) prüfen anschließend jeweils per eigenem Zeitstempel-Cache
    (analog zum LOW-Block), ob ihr Teilblock auf einem gegebenen Tick
    tatsächlich fällig ist, und liefern sonst den zuletzt gelesenen Wert.

    Ein Schreibzugriff auf ein Basic-Mode-Register
    (SaxPowerCoordinator.async_write_register, z. B. über den
    Storage-On/Off-Schalter) invalidiert den NORMAL-Cache explizit, damit
    ein direkt danach ausgelöster coordinator.async_refresh() (siehe
    DEVELOPMENT.md, "Refresh-Verhalten") nicht kurzzeitig noch den alten,
    gecachten Wert liefert.
  requirements:
    - "NORMAL (Basic Mode) bleibt über das bestehende Config-Flow-Feld
       'Aktualisierungsintervall' einstellbar (min. 5s, max. 3600s) - keine
       Änderung an config_flow.py/UI nötig."
    - "HIGH-Block-Register werden unabhängig vom NORMAL-Intervall
       spätestens alle READ_BLOCK_EXT_HIGH_INTERVAL Sekunden neu gelesen."
    - "Ein Schreibzugriff auf ein Basic-Mode-Register erzwingt beim nächsten
       _async_read_basic-Aufruf einen echten Read, unabhängig vom
       NORMAL-Intervall-Cache."
    - "Sicherheitsrelevante Fehlerresilienz bleibt unverändert: scheitert
       ausschließlich der (fällige) HIGH-Read, schlägt das Update nicht
       fehl (siehe REQ-EXTENDED-MODE-RESILIENCE); scheitert der (fällige)
       NORMAL-Read, schlägt das Update weiterhin komplett fehl
       (UpdateFailed), da Basic Mode die Mindestanforderung ist."
  acceptance_criteria:
    - "tests/test_coordinator.py deckt ab: update_interval entspricht
       min(scan_interval, READ_BLOCK_EXT_HIGH_INTERVAL); NORMAL wird
       innerhalb des scan_interval nicht erneut gelesen, HIGH dagegen
       gemäß seines eigenen (kürzeren) Intervalls; ein Basic-Mode-Write
       erzwingt einen frischen NORMAL-Read trotz aktivem Cache."
    - "tests/test_integration_live.py (Storage-On/Off-Schalter, echter
       TCP-Read/Write-Zyklus) bleibt grün - der Schalter-Zustand spiegelt
       nach dem Schreiben sofort den neuen Wert."

# ==============================================================================
# ANFORDERUNG: ENERGY-DASHBOARD-KOMPATIBILITÄT
# ==============================================================================
requirement_energy_dashboard_compatibility:
  id: REQ-ENERGY-DASHBOARD
  title: "Selbst akkumulierte kWh-Zähler (geladen/entladen) fürs Home-Assistant-Energy-Dashboard"
  status: done
  description: >
    Der SAX Speicher besitzt keine Energiezähler-Register, nur
    Momentanleistung (storage_power_active, SunSpec-Modus). Ohne einen
    monoton steigenden kWh-Sensor (state_class total_increasing) kann der
    Speicher nicht als Batterie-Ladung/-Entladung im Home-Assistant-Energy-
    Dashboard ausgewählt werden.

    SaxPowerCoordinator akkumuliert deshalb selbst zwei laufende kWh-Zähler
    (_energy_charged_kwh, _energy_discharged_kwh) aus storage_power_active
    per gehaltener Riemann-Summe (Wert seit dem letzten
    _async_update_data-Tick × verstrichene Zeit,
    SaxPowerCoordinator._accumulate_energy) - kein zusätzlicher
    Konfigurationsaufwand (z. B. ein manuell anzulegender
    "Integration"-Helfer) für den Nutzer nötig.

    Beide Zähler werden gemeinsam in einem versionierten Home-Assistant-
    Store gespeichert, dessen Schlüssel die Config-Entry-ID enthält. Diese
    Persistenz ist unabhängig vom sichtbaren RestoreEntity-Zustand: Wird die
    Entity wegen eines Basic-Mode-Fehlers unavailable und Home Assistant
    beendet, bleibt der letzte numerische In-Memory-Zählerstand maßgeblich.
    Häufige Änderungen werden fünf Minuten lang gebündelt; beim Entladen des
    Config Entry wird der neueste Stand zusätzlich best-effort sofort
    geschrieben.

    Beim ersten Start nach Einführung des Stores werden vorhandene
    numerische RestoreEntity-Zustände einmalig und für Lade-/Entladezähler
    unabhängig migriert, sofern für den jeweiligen Zähler noch kein neuer
    Snapshot existiert. Ein ganz neuer Eintrag ohne Restore-Zustand beginnt
    bei 0.0. unknown, unavailable, nicht-endliche, negative, korrupte oder
    rückläufige Zustände werden dagegen niemals als 0 interpretiert, sondern
    verworfen und diagnostisch geloggt; der betroffene Zähler bleibt ohne
    numerische Baseline uninitialisiert. Ein gültiger zweiter Zähler kann
    auch dann restauriert werden, wenn der erste gespeicherte Wert korrupt
    ist.

    Ist storage_power_active zwischenzeitlich unbekannt (SunSpec-Modus nicht
    erreichbar, siehe REQ-EXTENDED-MODE-RESILIENCE), wird die betroffene
    Zeitspanne übersprungen statt mit 0 W verbucht, damit nach Wiederkehr
    kein Nachhol-Sprung entsteht. Auch ein fehlgeschlagener Basic-Mode-Poll
    verändert die internen Zähler und ihren gespeicherten Snapshot nicht -
    er verwirft zusätzlich die Riemann-Baseline (_energy_last_ts = None,
    _async_update_data), weil _accumulate_energy in diesem Fall gar nicht
    mehr erreicht wird: Ohne dieses Verwerfen verbuchte der erste
    erfolgreiche Tick nach einem stundenlangen Geräte-/Netzausfall die
    gesamte Ausfallzeit mit der zuletzt bekannten Leistung als Energie und
    zählte sie als beobachtete Zeit des Kalendertages
    (REQ-ECONOMICS-AMORTIZATION). Der erste Tick nach einem Ausfall setzt
    damit - wie nach jedem Neustart - nur die Zeitbasis neu.
  requirements:
    - "Zwei Sensoren 'energy_charged'/'energy_discharged' (device_class
       energy, state_class total_increasing, Einheit kWh), über Neustarts
       hinweg gemeinsam und pro Config Entry in einem versionierten Store
       persistiert."
    - "Store-Schreibvorgänge werden gedrosselt und bei Shutdown/Unload
       best-effort final geflusht; es gibt keinen Schreibvorgang pro Poll."
    - "Numerische RestoreEntity-Altzustände werden nur ohne neuen Snapshot
       migriert. unknown/unavailable sowie ungültige, negative oder
       rückläufige Werte dürfen niemals einen Zähler auf 0 oder einen
       kleineren Wert setzen und werden mit Warnung verworfen."
    - "Kein Akkumulieren vor Abschluss des Restores und während
       storage_power_active unbekannt ist."
    - "Ein fehlgeschlagenes Update verwirft die Riemann-Baseline, sodass
       die Ausfallzeit weder als Energie noch als beobachtete Zeit eines
       Kalendertages verbucht wird (tests/test_coordinator.py)."
    - "Negative storage_power_active (Ladung) fließt ausschließlich in
       energy_charged, positive (Entladung) ausschließlich in
       energy_discharged."
  acceptance_criteria:
    - "tests/test_coordinator.py und tests/test_energy_persistence.py decken
       ab: Akkumulation/Vorzeichen-Split, SunSpec-Ausfall ohne Nachhol-Sprung,
       Basic-Mode-Ausfall mit exaktem Final-Flush, Legacy-Migration,
       unknown/unavailable, korrupte/negative/rückläufige Snapshots,
       Schreibdrosselung sowie zwei unabhängige Config Entries."
    - "Beide Sensoren lassen sich in der Home-Assistant-UI im
       Energy-Dashboard als Batterie-Ladung/-Entladung auswählen."

# ==============================================================================
# ANFORDERUNG: DIAGNOSEFUNKTION
# ==============================================================================
requirement_diagnostics:
  id: REQ-DIAGNOSTICS
  title: "Diagnose-Download über die Geräteseite (Coordinator-Zustand, IP redigiert)"
  status: done
  description: >
    diagnostics.py implementiert async_get_config_entry_diagnostics - Home
    Assistant bietet dadurch automatisch "Diagnose herunterladen" auf der
    Geräteseite an (keine eigene Registrierung nötig). Für Support-/
    Bugreport-Zwecke werden neben den redigierten Config-Entry-Daten auch
    coordinator.data (alle aktuellen Messwerte) sowie der relevante interne
    Coordinator-Zustand exportiert (Max-SOC-Sperre,
    Netzladung/SunSpec-Netzladung aktiv, zeitgesteuertes/netzdienliches
    Laden, SunSpec-Modus-Erreichbarkeit) - reine Aggregation bereits
    vorhandener Coordinator-Properties, keine neue Business-Logik.

    Die IP-Adresse (CONF_HOST) ist die einzige potenziell identifizierende
    Information in entry.data (lokales Modbus TCP ohne Cloud-Auth, siehe
    AGENTS.md "Security considerations") und wird über
    homeassistant.components.diagnostics.async_redact_data redigiert; Port
    und Slave-IDs sind keine Geheimnisse und bleiben sichtbar.
  acceptance_criteria:
    - "tests/test_diagnostics.py deckt ab: CONF_HOST ist im Ergebnis
       redigiert, Port bleibt unverändert sichtbar, coordinator_data und
       die relevanten state-Felder sind befüllt."

# ==============================================================================
# ANFORDERUNG: PREISOPTIMIERTES LADEN
# ==============================================================================
requirement_dynamic_price_charge:
  id: REQ-DYNAMIC-PRICE-CHARGE
  title: "Preisoptimiertes Laden aus dem Netz nach dynamischem Strompreis (+ PV-Prognose)"
  status: done
  description: >
    Dritte Lade-Automatik neben zeitgesteuertem Laden (REQ-TIMED-SOC-CHARGE)
    und netzdienlichem Laden (REQ-GRID-SERVING-CHARGE): Der Speicher wird
    automatisch dann aus dem Netz geladen, wenn der Strompreis günstig ist,
    und bleibt in teuren Phasen in der geräteeigenen
    SmartMeter-Nullregelung, sodass die günstig eingekaufte Energie den
    Hausverbrauch deckt.

    Die Integration ruft selbst keine Strompreise ab. Sie wertet
    stattdessen eine beliebige, vom Anwender im Options Flow ausgewählte
    Home-Assistant-Sensor-Entity aus (Tibber, Nordpool, EPEX Spot, ENTSO-e,
    Awattar, eigene Template-Sensoren). price_optimizer.parse_price_slots
    erkennt die verbreiteten Attributformate selbstständig - Listen von
    Dicts mit Start-/Preisfeldern ebenso wie reine Zahlenlisten für einen
    Kalendertag - und normalisiert sie auf eine Liste aus
    (Start, Ende, Preis in EUR/kWh). Stunden- und Viertelstunden-Auflösung
    werden gleichermaßen unterstützt; ct/kWh wird anhand der Sensor-Einheit
    (oder einer expliziten Vorgabe) auf EUR/kWh umgerechnet.

    Einträge mit ungültigem Preis behalten ihren lesbaren Startzeitpunkt
    als Grenze des vorherigen Slots ohne explizites Ende. Eine Preislücke
    darf deshalb niemals den vorherigen günstigen Preis verlängern.
    Bei mehrfach vorhandenem Startzeitpunkt gewinnt der erste gültige
    Preis; eine bloße Grenze ohne Preis darf diesen nicht verdrängen.
    Ungültige Kalenderdaten und nicht endliche numerische Zeitstempel
    werden ohne Ausnahme verworfen; die übrigen gültigen Slots bleiben
    für Ladeplanung und die gemeinsame Tarifbewertung verwendbar.

    Numerische Tagesarrays werden zwischen dem lokalen Tagesanfang und
    dem Beginn des nächsten Kalendertags auf einer UTC-Zeitleiste verteilt
    (Issue #105). So ergeben 23/24/25 Stundenwerte und 92/96/100
    Viertelstundenwerte auch an Zeitumstellungstagen jeweils reale
    Stunden- bzw. Viertelstunden-Slots; beide lokalen Herbststunden bleiben
    unterschiedliche Zeitpunkte. Für andere Arraylängen werden die Grenzen
    einzeln aus der realen Tagesdauer berechnet, damit Rundung sich nicht
    aufsummiert und das letzte Ende exakt auf die nächste lokale
    Mitternacht fällt. Morgenattribute beziehen sich auf den nächsten
    lokalen Kalendertag. Explizite Start-/End-Zeitstempel werden weiterhin
    unverändert nach den bestehenden Anbieterregeln interpretiert.

    Der Sensor "Aktueller Preis" (price_charge_current_price) liest den
    Preis des gerade laufenden Slots unabhängig von Strategie und
    Enabled-Schalter aus - er ist eine reine Info-Anzeige und bleibt daher
    auch bei Strategie "off" oder deaktivierter Automatik gefüllt, solange
    der konfigurierte Preis-Sensor auswertbare Daten für "jetzt" liefert
    (price_optimizer.SaxPricePlanner._evaluate_price_charge berechnet ihn
    deshalb vor den Enabled-/Strategie-Prüfungen).

    Arbeitsteilung: price_optimizer.SaxPricePlanner berechnet ohne jeden
    Modbus-Zugriff alle PRICE_EVAL_INTERVAL Sekunden (60s) einen Ladeplan
    aus Preisdaten, gewählter Strategie und optionaler PV-Prognose -
    zusätzlich sofort bei jeder Einstellungsänderung und jedem
    Zustandswechsel der beobachteten Quell-Sensoren.
    SaxPowerCoordinator._async_enforce_grid_charge wertet diesen Plan bei
    jedem Poll-Zyklus aus und setzt ihn über denselben
    SunSpec-Schreibpfad um wie die beiden anderen Automatiken
    (_async_sun_charge_loop, Register 40051 Steuermodus + Register 40049
    Leistungsvorgabe). Ist die Bedingung nicht (mehr) erfüllt, wird
    Register 40051 aktiv auf 0 (SmartMeter-Nullregelung) zurückgesetzt.
    SOC-abhängige Abbrüche greifen dadurch sofort und nicht erst beim
    nächsten 60-Sekunden-Takt.

    Strategien (select.SaxPowerPriceStrategySelect, jederzeit im laufenden
    Betrieb umschaltbar):
      off      - Automatik stillgelegt, ohne die übrigen Einstellungen zu
                 verlieren (entspricht "Manuell / Aus").
      absolute - lädt, solange der Arbeitspreis des aktuellen Slots die
                 Preisgrenze (number "Preisoptimiertes Laden Preisgrenze",
                 EUR/kWh, negative Werte zugelassen) nicht überschreitet.
      relative - lädt in den X günstigsten Stunden des Planungshorizonts
                 (number "Preisoptimiertes Laden Anzahl Stunden", 1-24).
                 Aufsummiert wird die noch verbleibende Dauer je Slot,
                 damit "3 günstigste Stunden" auch bei einer Berechnung
                 mitten in einem Slot drei nutzbare Stunden ergibt.
      smart    - wie relative, leitet die Stundenzahl aber aus dem noch
                 fehlenden Energiebedarf ab: ("Max. SOC" - SOC) × Kapazität
                 (SunSpec-Register 40097) abzüglich des nutzbaren Anteils
                 der PV-Prognose, geteilt durch die angenommene Ladeleistung
                 ("ic_max_power_reference", Register 40053 - der vom Gerät
                 selbst gemeldete Bezugspunkt, seit dem Wegfall von "Max.
                 Netzladeleistung" die realistischere Grundlage, siehe
                 REQ-TIMED-SOC-CHARGE). Deckt die Prognose den Bedarf
                 vollständig, wird gar kein Netzstrom eingekauft (Status
                 "PV-Prognose deckt Bedarf"). "Anzahl Stunden" bleibt dabei
                 Obergrenze. Fehlen Kapazität, SOC oder Ladeleistung,
                 verhält sich smart wie relative.

    Relative und Smart-Strategie planen innerhalb eines festen
    PRICE_PLAN_HORIZON_HOURS-Zyklus von 24 realen Stunden, nicht in einem
    bei jeder Auswertung erneut nach vorn geschobenen Fenster. Sein Anker
    ist die erste Auswertung nach dem Aktivieren bzw. Umschalten auf die
    jeweilige budgetierte Strategie; nach Ablauf beginnt der Folgezyklus
    exakt an der vorigen Zyklusgrenze. Ausschalten oder der Wechsel zu
    einer anderen Strategie beendet den laufenden Zyklus. Bereits
    veröffentlichte Morgenpreise fließen ein, sofern sie vor dem festen
    Zyklusende liegen; neu hinzukommende Preise dürfen noch nicht
    begonnene Fenster ersetzen.

    Die ausgewählte Gesamtdauer bleibt dabei auf das einmalige Zyklusbudget
    begrenzt: Bei jeder Neuplanung werden verstrichene Teile zuvor
    ausgewählter Slots abgezogen, auch bei einem teilweise abgelaufenen
    Stunden- oder Viertelstunden-Slot. Der letzte ausgewählte Slot wird bei
    Bedarf sekundengenau gekürzt, statt das Budget um eine ganze
    Slot-Länge zu überschreiten. Timerläufe und inhaltsgleiche Sensor-
    Updates füllen das Budget nicht wieder auf. Im Smart-Modus bildet der
    beim Zyklusstart berechnete Bedarf das anfängliche Budget; ändert sich
    eine bedarfsrelevante Eingangsgröße tatsächlich (SOC, Kapazität,
    Ladeleistung, Ziel-SOC, PV-Prognose/-Faktor oder die konfigurierte
    Stundenobergrenze), wird nur der ab jetzt verbleibende Bedarf neu
    bemessen und bereits verbrauchte Zeit nie freigegeben. Zyklusanker,
    Budget und ausgewählte Intervalle liegen in einem eigenen,
    Config-Entry-spezifischen Store; ein Home-Assistant-Neustart innerhalb
    des Zyklus eröffnet daher kein frisches Kontingent.

    Leistung: lädt wie das zeitgesteuerte Laden immer mit maximal möglicher
    Leistung, keine eigene (oder geteilte) Watt-Einstellung (siehe
    REQ-TIMED-SOC-CHARGE zum Wegfall von "Max. Netzladeleistung"). Ziel-SOC:
    derselbe Wert wie "Max. SOC" - keine eigene Einstellung, sondern die
    einzige, geräteweite SOC-Obergrenze; ist sie erreicht, endet die
    Netzladung UND löst zusätzlich die Max-SOC-Sperre aus (genau wie beim
    zeitgesteuerten Laden).

    Erreicht der Speicher Max. SOC, während price_planner.plan.charge_now
    einen aktuell ausgewählten Preis-Ladeslot meldet, wird die Max-SOC-
    Sperre an diesen Slot gebunden. Dafür ist bewusst das rohe Planmerkmal
    maßgeblich: price_should_charge ist bei erreichtem Ziel-SOC bereits
    False und kann den Slot dann nicht mehr identifizieren. Der Sollwert
    bleibt bis charge_now False wird bei 0 %, auch nach bestätigtem
    Netzbezug und auch wenn der SOC innerhalb desselben Slots wieder unter
    den Zielwert fällt. Dadurch startet kein zweiter Ladevorgang im selben
    günstigen Slot; der Status bleibt "Pausiert (Max. SOC)". Am Slotende
    setzt der Coordinator Register 40051 aktiv auf SmartMeter-Nullregelung
    zurück und verhindert bei unverändert erreichtem SOC per Freigabe-Latch
    ein sofortiges erneutes Sperren im Folge-Poll.

    Vorrang innerhalb von _async_enforce_grid_charge: Max-SOC-Sperre >
    manuelle Netzladung > zeitgesteuertes Laden > netzdienliches Laden >
    preisoptimiertes Laden.
    Preisoptimiertes Laden bricht - wie das zeitgesteuerte Laden - bei
    bestätigtem PV-Überschuss am Smart Meter sofort ab (dieselbe
    Zyklen-Hysterese, PV_SURPLUS_HYSTERESIS_CYCLES), UND weicht zusätzlich
    einem effektiven Zeitfenster des netzdienlichen Ladens
    (grid_serving_window_active: Zeit/Monat plus optionale Prognosefreigabe
    aus REQ-GRID-SERVING-CHARGE) - unabhängig davon, ob dessen eigene
    Zustandsmaschine gerade tatsächlich eingreift. Siehe
    REQ-GRID-SERVING-CHARGE für die Begründung dieses Vorrangs (netzdienliches
    Laden läuft nur in ertragsreichen Sommermonaten mit ohnehin kaum nötigem
    Netzbezug) sowie den ursprünglich gemeldeten Bug, den dieser Vorrang
    behebt: ohne ihn konnten sich beide Automatiken gegenseitig ein- und
    ausschalten, sobald ihre Bedingungen gleichzeitig erfüllt waren. Der
    Statussensor zeigt in diesem Fall "Pausiert (Netzdienliches Laden aktiv)"
    (PRICE_STATUS_PAUSED_GRID_SERVING).

    Neutralpreis-Pausezone: number "Preisoptimiertes Laden Neutralpreis"
    (EUR/kWh) hält den Speicher bei günstigem Netzstrom an, solange die
    Preisautomatik eingeschaltet ist und nicht gerade aus dem Netz lädt
    (price_should_charge False). Für die Strategie "Absoluter Preis" gilt
    weiterhin das offene Band Preisgrenze < aktueller Preis < Neutralpreis.
    Hier müssen beide Grenzen gesetzt sein und der Neutralpreis oberhalb
    der Preisgrenze liegen. Für "Relativ" und "Smart" gilt dagegen nur
    aktueller Preis < Neutralpreis: Nicht ausgewählte Slots, ein erschöpftes
    Zyklusbudget oder durch PV gedeckter Bedarf erlauben unterhalb dieses
    Werts keine Entladung, auch bei negativen Preisen. Die absolute
    Preisgrenze ist in diesen Strategien weder Untergrenze noch Voraussetzung
    der Pause; sie darf fehlen oder oberhalb des Neutralpreises liegen.

    Die Pause schaltet den Speicher aktiv in den manuellen Sollwertmodus
    mit Sollwert 0 (async_start_sun_charge(0), Status "Pausiert (Preisband)").
    Laden und Entladen bleiben gestoppt; der Hausverbrauch kommt aus dem
    Netz. Das verhindert, dass gespeicherte Energie in günstigen Stunden
    verbraucht wird, obwohl direkter Netzbezug nach Speicherverlusten
    günstiger wäre. Ab einschließlich Neutralpreis wird die normale
    SmartMeter-Nullregelung wieder freigegeben. Fehlt ein gültiger aktueller
    Preis oder Neutralpreis, entsteht keine Pausefreigabe.

    Die bisherigen Prioritäten bleiben wirksam: Max-SOC-Sperre, manuelle
    Netzladung, zeitgesteuerte Netzladung, das wirksame Fenster des
    netzdienlichen Ladens und bestätigter PV-Überschuss haben Vorrang.
    Ein zum Laden ausgewählter Slot wird weiter geladen; die Pause erzeugt
    keinen zusätzlichen Ladeslot und verändert kein Zyklusbudget.

    Reparaturhinweis ISSUE_PRICE_NEUTRAL_BELOW_LIMIT
    (infrastructure/self_diagnostics.SelfDiagnostics._check_price_neutral_below_limit,
    eine der sechs Basisregeln aus REQ-SELF-DIAGNOSIS-REPAIRS): Der
    Coordinator übergibt in _async_check_self_diagnostics einen
    DiagnosticSnapshot an SelfDiagnostics.check. Liegt der Neutralpreis
    in der Strategie "Absoluter Preis" nicht über der Preisgrenze (<=),
    legt SelfDiagnostics ein rein informatives
    (is_fixable=False), sich selbst heilendes Issue an - statische
    Einstellungskombination wie ISSUE_MAX_SOC_BELOW_MIN_SOC, kein
    Zustandsflanken-Timer nötig, schlägt sofort an.
    Beim Wechsel zu Relativ, Smart oder Aus verschwindet dieser Hinweis,
    auch nach einem Reload. translation_placeholders: max_price, neutral_price.

    Gegenseitiger Ausschluss mit der Netzladung: Beide laden aktiv aus dem
    Netz über denselben Schreibpfad und dürfen nicht gleichzeitig aktiv
    sein. Bei explizit gewähltem time_of_use oder dynamic bestimmt seit
    REQ-VUE-ELECTRICITY-TARIFF die Tarifart die passende Automatik; native
    Aktivierungen der anderen werden auch mit force abgelehnt. Bootstrap
    deaktiviert unpassende Restore-Flags, ohne die andere Automatik einzuschalten.
    Für die kompatiblen Tarifwerte fixed und disabled gilt weiterhin der
    bisherige Konfliktdialog: Wird eines eingeschaltet, während das andere läuft, wird die
    Änderung NICHT stillschweigend ausgeführt: Der Coordinator lehnt sie
    zunächst ab (Setter geben False zurück, der Schalter springt zurück)
    und legt ein reparierbares Issue mit Bestätigen/Abbrechen-Dialog an
    (repairs.ChargeConflictRepairFlow) sowie eine Persistent Notification
    für die sofortige Sichtbarkeit. Bestätigen schaltet das jeweils andere
    Feature ab und aktiviert das gewünschte; Abbrechen lässt alles
    unverändert. Beide Artefakte werden gemeinsam entfernt, sobald der
    Konflikt auf irgendeinem Weg aufgelöst ist. Der Restore-Pfad beim Start
    sowie der Service set_price_charge_enabled (force) umgehen die
    Rückfrage bewusst - eine Automation kann auf keinen Dialog antworten,
    und beim Restaurieren hat der Anwender gerade nichts angeklickt.
  requirements:
    - "Options Flow (config_flow.SaxPowerOptionsFlow): Auswahl des
       Strompreis-Sensors, optionales Attribut-Override, Preis-Einheit
       (automatisch/EUR/ct), optionaler PV-Prognose-Sensor für morgen und
       dessen nutzbarer Anteil in Prozent. Die Heute-Quelle der Ladepause
       ist ein separates Feld. Keine YAML-Konfiguration. Bewusst KEIN
       eigenes Feld für die Strategie (bis einschließlich Version mit
       CONF_PRICE_STRATEGY vorhanden, seither entfernt): Ein dort
       hinterlegter Wert hätte ohnehin nur bis zum ersten gespeicherten
       Zustand der Select-Entity gewirkt (siehe unten,
       select.SaxPowerPriceStrategySelect) und dem Anwender fälschlich
       suggeriert, er ließe sich dort jederzeit ändern - vom Anwender
       gemeldet, nachdem eine Options-Flow-Änderung der Strategie im
       Dashboard folgenlos blieb."
    - "Entities am bestehenden SAX-Gerät: switch 'Preisoptimiertes Laden
       aktiv' (Hauptschalter), select 'Preisoptimiertes Laden Strategie',
       number 'Preisoptimiertes Laden Preisgrenze' (ct/kWh), number
       'Preisoptimiertes Laden Neutralpreis' (ct/kWh, bei Absoluter Preis
       oberhalb der Preisgrenze), number 'Preisoptimiertes Laden Anzahl Stunden'
       (1-24), sensor 'Preisoptimiertes Laden nächster Start' (device_class
       timestamp), sensor 'Preisoptimiertes Laden Status' (Klartext),
       sensor 'Preisoptimiertes Laden aktiv' (Diagnose) sowie sensor
       'Aktueller Strompreis'. Kein eigenes Ziel-SOC - number 'Max. SOC' ist
       die einzige SOC-Einstellung der Integration, siehe
       REQ-TIMED-SOC-CHARGE."
    - "Alle Stellgrößen werden über Neustarts hinweg persistiert - im
       versionierten Konfigurations-Store, der vor dem ersten steuernden
       Refresh geladen wird (REQ-CONTROL-CONFIG-BOOTSTRAP); RestoreEntity
       ist nur noch der einmalige Migrationspfad. Ohne beides gelten die
       Defaults aus const.py - für die Strategie DEFAULT_PRICE_STRATEGY
       (kein Options-Flow-Fallback mehr, siehe oben)."
    - "Der Status-Sensor benennt den jeweils wirksamen Grund: Aus, Keine
       Preisdaten, Warten auf Preisabfall, Lade aus Netz, PV-Prognose deckt
       Bedarf, Pausiert (PV-Überschuss), Pausiert (Max. SOC), Pausiert
       (Netzladung aktiv), Pausiert (Preisband). Seine
       Attribute führen Strategie, aktuellen Preis, wirksame Preisgrenze,
       Neutralpreis, benötigte Stunden, eingerechnete PV-Prognose, die
       konfigurierten Quell-Sensoren, Start/Ende des festen Planungszyklus,
       das verbleibende Zeitbudget und die geplanten Zeitfenster mit.
       Das Restbudget beschreibt den Stand der letzten Planberechnung;
       Attributzugriffe zwischen zwei evaluate()-Aufrufen verändern es
       auch bei fortschreitender Uhr nicht. Die vollständige Fensterliste
       bleibt live verfügbar, wird aber nicht als Recorder-Attribut
       gespeichert. tests/test_price_plan_attributes.py prüft unveränderte
       Snapshots und die Budgetaktualisierung bei erneuter Planung."
    - "Services: sax_power.refresh_price_plan bestätigt die sofortige Neuberechnung
       ohne Warten auf Geräte-Control-Lock oder Modbus und übergibt die
       Geräteauswertung an den gemeinsamen Worker. Shutdown wird vor der
       Neuberechnung abgelehnt. sax_power.set_price_charge_enabled dient zum
       nicht-interaktiven Schalten mit
       optionalem force."
    - "Die Prüfung der Ladebedingungen läuft mindestens alle 60 Sekunden."
    - "__init__.async_update_options wendet eine Options-Flow-Änderung
       (Strompreis-/PV-Prognose-Sensor) live auf den laufenden Coordinator
       an (coordinator.options ersetzen + price_planner.async_setup()
       erneut aufrufen), OHNE den Config Entry per
       hass.config_entries.async_reload neu zu laden. Ursprünglich
       gemeldeter Bug: Ein Reload baut SaxPowerCoordinator komplett neu auf
       - SaxPowerCoordinator.async_shutdown ruft dabei async_stop_sun_charge
       auf, das Register 40051 aktiv auf SmartMeter-Nullregelung
       zurücksetzt, selbst wenn netzdienliches Laden (REQ-GRID-SERVING-
       CHARGE) gerade aktiv den Sollwert bei 0 % hält. Bei echtem
       PV-Überschuss beginnt der Speicher dadurch sofort wieder zu laden,
       bis die frisch erzeugte Coordinator-Instanz die
       PV_SURPLUS_HYSTERESIS_CYCLES-Bestätigung erneut durchlaufen hat -
       sichtbar als kurzer, ungewollter Ladevorgang direkt nach dem
       Speichern der Options-Flow-Seite (z. B. beim erstmaligen Hinterlegen
       des Strompreis-/PV-Prognose-Sensors), unabhängig vom preisoptimierten
       Laden selbst. Die Options Flow betrifft ausschließlich den Preis-
       Planner, nie Modbus-Client/Slave-IDs/Scan-Intervall (die stehen
       unveränderlich in entry.data) - ein Reload ist für eine reine
       Options-Änderung deshalb nicht nötig."
  acceptance_criteria:
    - "Fehlt eine explizite gültige Endzeit, endet ein Preisabschnitt am
       nächsten bekannten Beginn; der letzte endet nach dem kleinsten
       positiven Abstand zwischen den bekannten Startzeitpunkten, ohne
       Nachbarabstand nach DEFAULT_PRICE_SLOT_MINUTES. Abstände werden als
       reale UTC-Dauer gemessen. Gültige explizite Endzeiten bleiben maßgeblich.
       Unregelmäßige Vorschauen mit überwiegend längeren Abständen und einem
       einzelnen kurzen Abstand sind in tests/test_price_optimizer.py
       abgesichert (Issue #217); nach dem abgeleiteten Ende fehlt der Preis."
    - "tests/test_charge_policy.py und tests/test_price_optimizer.py sichern
       die Pause nicht ausgewählter Relativ-/Smart-Slots unterhalb der
       absoluten Preisgrenze, negative Preise, Gleichheit am Neutralpreis,
       fehlende Preise, die unveränderten Vorränge und den aktiven Wechsel
       von Sollwert 0 zur SmartMeter-Nullregelung ab (Issue #214)."
    - "tests/test_price_optimizer.py deckt ab: Einlesen der Attributformate
       (raw_today/raw_tomorrow, Zahlenlisten, data/start_time,
       Viertelstunden, ct-Umrechnung, Attribut-Override, unbrauchbare
       Daten), Planberechnung je Strategie inkl. Planungshorizont,
       Smart-Modus mit und ohne ausreichende PV-Prognose sowie ohne
       Kapazität; zusätzlich begrenzen test_compute_plan_clips_last_quarter_
       hour_to_exact_duration, test_relative_replanning_never_refills_
       elapsed_budget, test_replanning_replaces_future_slots_without_
       extending_budget, test_smart_replanning_does_not_refill_unchanged_
       required_duration und test_price_cycle_survives_restart_without_
       refilling_budget das feste Zeitbudget bei Teilslots, wiederholter
       Auswertung, neuen Morgenpreisen, Smart-Bedarf und HA-Neustart;
       Schreibpfad und Rückkehr in die Nullregelung, Abbruch bei
       Max-SOC/PV-Überschuss, Vorrang des zeitgesteuerten Ladens,
       Konfliktdialog (Anlegen, Bestätigen, Abbrechen, force), das
       Restore-Verhalten der Select-/Switch-Entities sowie die
       Neutralpreis-Pausezone: manueller Sollwertmodus mit Sollwert 0
       bei Absoluter Preis zwischen Preisgrenze und Neutralpreis, bei
       Relativ/Smart auch unterhalb der Preisgrenze, Rückkehr in die Nullregelung
       ab dem Neutralpreis, Vorrang von PV-Überschuss vor der Pausezone,
       keine Pause ohne Neutralpreis; bei Absoluter Preis zusätzlich keine
       Pause ohne gültiges Preisband sowie Vorrang von netzdienlichem Laden vor
       preisoptimiertem Laden (test_grid_serving_takes_priority_over_
       price_charge_neutral_band, test_grid_serving_takes_priority_over_
       price_charge_active_charging) - ein aktives Zeitfenster des
       netzdienlichen Ladens blockiert sowohl das aktive preisoptimierte
       Laden als auch dessen Pausezone, nicht umgekehrt; außerdem bindet
       test_price_charge_max_soc_hold_remains_bound_to_selected_slot die
       Max-SOC-Sperre an den ausgewählten Preis-Slot, hält sie trotz
       Netzbezug und SOC-Abfall und weist die aktive Rückkehr zur
       SmartMeter-Nullregelung am Slotende nach."
    - "Die numerischen Preisarray-Tests prüfen today/tomorrow an normalen,
       Frühjahrs- und Herbsttagen mit Stunden- und Viertelstundenwerten,
       exakte Tagesgrenzen bei sieben Werten, beide Herbststunden sowie
       Preisgrenze und reale Ladedauer. Die bestehenden expliziten
       ISO-Slot-Tests sichern deren unveränderte Zeitinterpretation."
    - "tests/test_number.py deckt die Vorbelegung und Klemmung der drei
       neuen Number-Entities (Preisgrenze, Neutralpreis, Anzahl Stunden)
       ab."
    - "tests/test_config_flow.py deckt den Options Flow ab (Speichern und
       Vorbelegung)."
    - "tests/test_init.py deckt async_update_options ab:
       test_async_update_options_applies_live_without_reload verifiziert,
       dass eine Options-Änderung NICHT mehr hass.config_entries.
       async_reload aufruft, sondern coordinator.options ersetzt und
       coordinator.price_planner.async_setup() und anschließend
       coordinator.async_apply_price_plan() aufruft (Regressionsschutz
       für den oben beschriebenen Bug); test_async_update_options_noop_
       without_loaded_entry deckt den Fall ab, dass der Listener feuert,
       während der Coordinator (noch) nicht in hass.data registriert ist."
    - "tests/test_repairs.py deckt ISSUE_PRICE_NEUTRAL_BELOW_LIMIT ab:
       sofortiges Auslösen bei Neutralpreis <= Preisgrenze (auch bei
       Gleichheit) in der Strategie Absoluter Preis, Idempotenz und
       Selbstheilung bei korrigierten Grenzen oder einem Strategiewechsel."
    - "README.md beschreibt Einrichtung, Strategien und Zusammenspiel mit
       den übrigen Lademodi."

# ==============================================================================
# ANFORDERUNG: DASHBOARD SAX POWER
# ==============================================================================
requirement_vue_dashboard:
  id: REQ-VUE-DASHBOARD
  title: "Dashboard SAX Power mit Navigation, automatischer Einrichtung und lokalem Build (Issue #197)"
  status: done
  description: >
    Die Integration liefert ausschließlich das Vue-3-/TypeScript-Dashboard
    SAX Power aus. Der Seitenleisten- und UI-Name trägt keinen Vue- oder
    Vorschauzusatz; der bestehende Pfad sax-power-vue bleibt kompatibel.
    Das Panel enthält die responsive,
    in Deutsch und Englisch beschriftete Navigation zu
    Allgemeine Informationen (allgemein), Stromtarif (stromtarif),
    Zeitvariabler Tarif (ladeautomatik), Netzdienliches Laden
    (netzdienliches-laden) und Amortisation (ersparnis), in dieser Reihenfolge.
    Die englischen Tarif-Tabnamen sind Electricity tariff und Time-of-use tariff;
    Amortisation heißt auf Englisch Amortization.
    Beide Tarifzugänge bleiben unabhängig vom Zustand der Ladeautomatik sichtbar.
    Der gespeicherte Tariftyp bestimmt den Inhalt von Stromtarif, auch bei
    ausgeschalteter Netzladung. Die bisherige Route dynamisches-laden wird ohne
    Serviceaufruf und ohne zusätzlichen History-Eintrag nach stromtarif umgeleitet.
    Zeitvariabler Tarif bleibt als Fallback bestehen; bei aktivem dynamischem
    Tarif zeigt er den Verweis auf Stromtarif statt einer zweiten Ladeautomatik.
    Entity-Schlüssel bleiben unverändert.
    Alle fünf Ansichten zeigen die vorhandenen Entitäten und Bedienfunktionen. Die
    gemeinsame Datenanbindung ist in REQ-VUE-ENTITY-BINDING beschrieben,
    die Ansichten in REQ-VUE-GENERAL, REQ-VUE-CHARGING,
    REQ-VUE-ELECTRICITY-TARIFF und REQ-VUE-SAVINGS. REQ-VUE-PARITY sichert
    ihre HA-Anbindung und Auslieferung ab.

    Die Darstellung nutzt auf normalen Desktop-PCs den verfügbaren Platz
    mit mehrspaltigen Karten und maßvoll reduzierten Abständen. Entscheidend
    ist die tatsächliche Panel- und Inhaltsbreite neben der HA-Seitenleiste,
    nicht allein die Browserfensterbreite. Ab 860 Pixel Inhaltsbreite stehen
    Skalen und Leistung neben den Gerätedaten, Ladeeinstellungen in Spalten
    nebeneinander. Die Monatsauswahl zeigt zunächst eine kompakte
    Zusammenfassung. Aufgeklappt stehen vier Quartalsgruppen auf schmalen
    Bildschirmen in einer Spalte, bei ausreichender Breite in zwei Spalten.
    Monatsnamen bleiben mindestens 14 Pixel groß, Bedienflächen
    mindestens 44 mal 44 Pixel. Die sichtbaren nativen Monatskästchen sind
    22 mal 22 Pixel groß; zugeordnete Labels stellen die größere Klickfläche
    bereit. Der Speicherschalter verwendet dasselbe 22-Pixel-Kästchen in
    einer mindestens 44 mal 44 Pixel großen Klickfläche; die Sicherheitsabfrage
    bleibt beim Ein- und Ausschalten erhalten;
    die DOM-/Tastaturreihenfolge bleibt Januar bis Dezember. In der Amortisationsansicht stehen Übersicht und Tarif nebeneinander;
    Datumsauswahl und Diagramm nutzen die volle Breite.
    Inhalte bleiben vollständig sichtbar; es gibt keine festen Kartenhöhen,
    abgeschnittenen Werte oder verkleinerten normalen Beschriftungen.
    Die Bedienflächen von Eingaben und Schaltflächen bleiben mindestens
    44 Pixel hoch.

    Das Dashboard ist integraler Bestandteil der Integration und wird bei jeder
    Einrichtung und jedem Start automatisch angelegt. Config Flow und Options
    Flow enthalten weder Dashboard-Schritt noch Aktivierungsfeld. Frühere Werte
    von vue_dashboard_enabled, auch explizites False, werden beim Setup entfernt
    und beeinflussen die Verfügbarkeit nicht mehr.

    Setup und Options-Änderungen registrieren das Panel idempotent.
    Deaktivierung der Integration und Unload entfernen den eigenen Panel-Eintrag.
    Frontendfehler verhindern weder Setup noch Betrieb der Batterieintegration.
    Die gemeinsame statische Asset-Route bleibt pro Home-Assistant-Lauf genau
    einmal bestehen, da HA keine API zum Abmelden solcher Routen anbietet.
    Dateizugriffe laufen im Executor; ein Inhalts-Hash in der Modul-URL erneuert
    den Browser-Cache nach Updates.

    Das Custom Element sax-power-vue-panel erhält hass, narrow, panel und
    route vom bestehenden HA-Frontend. Alle Frontend-Abhängigkeiten und
    Shadow-DOM-Styles sind im lokalen Modul gebündelt. Das Frontend eröffnet
    keine zusätzliche Modbus-Verbindung und benötigt weder externe Skripte
    noch einen Node-Prozess zur Laufzeit. Die kompilierten Assets liegen
    im Integrationsverzeichnis im Repository; Stable-/HACS- und Snapshot-
    Pakete liefern dieselben geprüften Bytes aus. CI baut aus dem Lockfile
    reproduzierbar neu und prüft Abweichungen vom eingecheckten Assetstand.
    Privilegierte Release-Workflows führen keinen Frontend-Code des PR aus.

    Der Lovelace-Builder, dessen Erstellungsoption und Abhängigkeit sowie
    create_dashboard/reinstall_dashboard und die Veraltet-Reparatur sind
    entfernt. Beim Entry-Setup bereinigt die Migration create_dashboard,
    dashboard_update_dismissed und vue_dashboard_enabled aus entry.data und
    entry.options sowie dashboard_outdated_<entry_id> aus der Issue Registry.
    Bereits gespeicherte HA-/Lovelace-Dashboards, Panels und Karten
    werden weder gelöscht noch überschrieben. Es gibt keinen Link auf einen
    zweiten mitgelieferten Dashboard-Einstieg.
  acceptance_criteria:
    - "Config Flow und Options Flow bieten keine Dashboard-Auswahl; automatische
       Einrichtung ohne Auswahl und mit früherer Abwahl sind getestet."
    - "Die Migration entfernt alte Anlage-/Ablehnungsschlüssel und den
       Legacy-Repair-Issue sowie die frühere Dashboard-Auswahl und verändert keine
       gespeicherten HA-Dashboards oder Karten. Legacy-Services sind nicht registriert."
    - "Integrationseinrichtung, Deaktivierung, Setup-Wiederholung, Reload und Unload
       erzeugen keine doppelten Panels oder statischen Routen."
    - "Ein Fehler bei Asset- oder Panel-Registrierung lässt die
       Batterieintegration betriebsbereit; fremde Panels werden nicht entfernt."
    - "Alte Dashboard-Options-Werte deaktivieren das Panel nicht und erzeugen
       keine zusätzliche Geräteaktion."
    - "Die fünf Unterpfade funktionieren bei Navigation, direktem Einstieg
       und Browser-Zurück; Mount/Unmount räumt Frontend-Listener auf."
    - "Browserprüfungen belegen geringeren Desktop-Platzbedarf auch mit
       HA-Seitenleiste, vollständige Inhalte, erreichbare Bedienelemente
       und eine weiterhin lesbare mobile Ansicht ohne Seitenüberlauf."
    - "Source-/HACS-Verzeichnis und Snapshot enthalten das geprüfte lokale
       Bundle; Build und Typ-/Komponententests sind in CI eingebunden."
    - "README und DEVELOPMENT beschreiben automatische Einrichtung, Funktionsumfang,
       HA-Anbindung, Build und Paketierung."

# ==============================================================================
# ANFORDERUNG: GEMEINSAME ENTITY-ANBINDUNG IM VUE-DASHBOARD
# ==============================================================================
requirement_vue_entity_binding:
  id: REQ-VUE-ENTITY-BINDING
  title: "Gemeinsame HA-Entitäten, Live-Zustände und Bedienkomponenten für Vue (Issue #198)"
  status: done
  description: >
    Das Vue-Panel verwendet die bestehende angemeldete HA-Sitzung. Ein
    gemeinsamer Kontext verbindet hass.states mit dem read-only WebSocket-Abo
    sax_power/dashboard/subscribe für den panel.config.entry_id. Es werden
    weder Entity-IDs aus Anzeigenamen konstruiert noch zusätzliche
    Modbus-Verbindungen oder Zugangsdaten eingeführt. Entitätszustände kommen
    weiterhin aus der HA-Sitzung; die offene Stromtarifansicht erneuert ihre
    Tagespreisserie und Tarifkonfiguration zusätzlich nach
    REQ-VUE-ELECTRICITY-TARIFF.

    Das Metadatenabo liefert nur aktive SAX-Entitäten des angeforderten
    SAX-Config-Entry, die der angemeldete Benutzer lesen darf. Jede Entität
    enthält tatsächliche entity_id und device_id, Domain, stabilen
    Unique-ID-Suffix als Schlüssel, Anzeigenamen, übersetzte Enum-Zustände
    und can_control gemäß
    HA-Berechtigung. Benutzerdefinierte Namen haben Vorrang; der dynamische
    Prognosename stammt aus dem aktuellen HA-Zustand. Änderungen der Entity
    Registry aktualisieren Zuordnung und optionale Entitäten. Ungültige oder
    fremde Config Entries werden abgewiesen. Abmeldung und Verbindungsende
    räumen das Abo auf; verspätete Antworten eines alten Abos werden ignoriert.

    Zustandsänderungen kommen aus hass.states und werden in allen Ansichten
    reaktiv sichtbar. HA-Formatierung, Einheiten, Sprache und übersetzte Enum-
    Werte bleiben erhalten. Fehlende optionale Entitäten werden ausgelassen;
    unknown und unavailable werden verständlich angezeigt und sind nicht
    bedienbar. Verbindungsverlust sperrt Bedienung, zeigt einen verständlichen
    Hinweis und meldet nach Wiederverbindung Metadaten erneut an. Mount,
    Navigation, Metadatenaktualisierung und Wiederverbindung schreiben nichts.

    Alle Schalter zeigen ihren bestätigten Ein-/Aus-Zustand ausschließlich
    durch das Kontrollkästchen. Die zusätzliche Wertzeile einschließlich
    Bestätigter Wert: beziehungsweise Confirmed value: entfällt in allen
    Ansichten. Status- und Fehlerhinweise bleiben sichtbar und über
    aria-describedby zugänglich; es gibt keine Verweise auf entfernte
    Wertzeilen. Alle sichtbaren Kontrollkästchen messen einheitlich 22 mal
    22 Pixel wie die Monatsauswahl, innerhalb einer mindestens 44 mal
    44 Pixel großen, per Label zugeordneten Klickfläche. Bestätigungsdialoge,
    Tastaturbedienung und HA-Serviceaufrufe bleiben erhalten.

    Einzelbedienkomponenten für switch, number, time und select rufen
    ausschließlich bestehende HA-Services auf: turn_on/turn_off, set_value
    und select_option mit der tatsächlichen Entity-ID. Schalter verwenden
    den ausdrücklich gewählten Zielzustand. Zahlen werden auf endlichen Wert,
    min/max und step geprüft; Zeiten auf gültige Stunden, Minuten und Sekunden;
    Auswahlwerte müssen in den aktuellen options enthalten sein. Zahlen und
    Zeiten bleiben lokale Eingaben bis zur ausdrücklichen Übernahme.
    Die beiden Zeitfenster aus REQ-VUE-CHARGING verwenden stattdessen die
    bestehenden Services sax_power.set_timed_charge_window und
    sax_power.set_grid_serving_window mit device_id, start und end. Beide
    Grenzen werden zusammen validiert und mit genau einem Aufruf übernommen.
    Die aufgelösten Time-Entitäten müssen bedienbar sein und dieselbe Device-ID
    besitzen; Benutzeraufrufe werden auch serverseitig auf Bedienrechte für
    beide Entitäten geprüft.
    Unzulässige Werte erzeugen keine Serviceaufrufe. HA erzwingt weiterhin
    seine Service-Berechtigungen und die bestehende Integration validiert
    Gerätezugriffe.

    Gültige Softwarekonfiguration wird unmittelbar zum Speichern vorgemerkt
    und über HA-Zustandslistener bestätigt. Dies gilt für die drei
    Ladehauptschalter, globalen Max-SOC, Netzladeziel und Min-SOC,
    Preisgrenzen, Anzahl Stunden, Strategie, PV-Prognoseschwelle sowie
    einzelne und atomare Zeitfenster; Monatsschalter folgen demselben Prinzip.
    Entity- und Software-Serviceaufrufe verwenden defer_device_update=True,
    damit Serviceantwort und Konfigurationszustand weder auf den Control-Lock
    noch auf Modbus warten. Der gemeinsam mit den Monatsschaltern verwendete
    Worker fasst Änderungen zusammen und wertet bei einer neueren Revision
    den aktuellen Stand nochmals unter dem Control-Lock aus.
    Die Annahme einer Konfiguration setzt keine geräteseitig quittierungspflichtigen
    Aktivitätsflags. Interne Coordinator-Aufrufe, Bootstrap und manuelle
    physische Steuerbefehle behalten ihre synchrone Gerätebestätigung.
    Das Shutdown-Gate lehnt neue Änderungen bereits vor einer Mutation ab;
    Bootstrap und Shutdown starten keine nachgelagerte Geräteauswertung.

    Ausstehende Serviceaufrufe und Fehlermeldungen werden pro tatsächlicher
    Entität geteilt. Während ein Aufruf läuft, wird kein zweiter für dieselbe
    Entität gestartet. Eine gemeinsame Zeitfensteraktion teilt ausstehende
    Aktion und Fehler mit beiden Time-Entitäten und sperrt dadurch auch
    konkurrierende Einzelaktionen. Der bestätigte Zustand wird nicht
    optimistisch überschrieben; auch nach erfolgreicher Serviceantwort ist
    hass.states maßgeblich. Fehler werden in Deutsch oder Englisch angezeigt, ohne
    automatische Schreibwiederholung. Die Komponenten sind unabhängig von
    den fachlichen Ansichten testbar.
  acceptance_criteria:
    - "Registry-Umbenennungen, deaktivierte und fremde Entitäten sowie
       Lese-/Bedienberechtigungen sind über das HA-WebSocket-Protokoll getestet."
    - "Live-Zustände, übersetzte Namen/Enum-Werte und nicht verfügbare Werte
       werden ohne Ersatz-Nullen und ohne zusätzliche Zustandsabfragen dargestellt."
    - "Alle vier Bedienarten verwenden echte Entity-IDs und validierte Werte;
       ungültige Eingaben und fehlende Berechtigungen erzeugen keine Schreibaktion."
    - "Servicefehler, doppelte Bedienung und verzögerte Zustandsbestätigung
       sind getestet; ausstehende Aktionen werden gemeinsam gesperrt."
    - "Alle Schalter zeigen auf Deutsch und Englisch keine zusätzliche
       Ein-/Aus-Wertzeile. Ihre Haken folgen bestätigten HA-Zuständen;
       ausstehende Aktionen, Fehler und Nichtverfügbarkeit bleiben zugänglich."
    - "Browserprüfungen messen alle Kontrollkästchen mit 22 mal 22 Pixel
       und ihre Klickflächen mit mindestens 44 mal 44 Pixel auf Smartphone
       und Desktop, in hellen und dunklen Themes."
    - "tests/test_control_response.py und tests/test_vue_dashboard_e2e.py
       prüfen Software-Entity- und Software-Serviceantworten samt HA-Zustand
       bei blockierter Geräteauswertung. Folgeänderungen gehen nicht verloren;
       Aktivitätsflags warten auf Gerätebestätigung, und Shutdown verhindert
       Änderungen vor der Mutation."
    - "Eine Zeitfensterübernahme sendet genau einen vorhandenen SAX-Service
       mit vollständigem Zielpaar und gemeinsamer Device-ID. Fehlende oder
       fremde Gerätezuordnung und fehlende Rechte einer der beiden Entitäten
       verhindern die Übernahme; serverseitige Rechteprüfung bleibt wirksam."
    - "Abo-Wechsel, Verbindungsabbruch, Wiederverbindung und Unmount erzeugen
       weder doppelte Abos noch automatische Serviceaufrufe."
    - "Die Entwicklungsvorschau erlaubt eine explizit simulierte Bedienprobe;
       Die bestehenden Geräte-Schreibpfade bleiben unverändert."

# ==============================================================================
# ANFORDERUNG: ALLGEMEINE VUE-GERÄTEÜBERSICHT
# ==============================================================================
requirement_vue_general:
  id: REQ-VUE-GENERAL
  title: "Allgemeine Vue-Geräteübersicht mit Live-Werten und Bedienung (Issue #199)"
  status: done
  description: >
    Der Dashboard-Pfad allgemein zeigt die folgenden Geräte-Entities.
    Alle Werte und Bedienaktionen verwenden den
    gemeinsamen Kontext aus REQ-VUE-ENTITY-BINDING. Beispielwerte sind nur
    in der getrennten Entwicklungsvorschau erlaubt.

    Zuerst erscheinen Skalen für sensor.soc (0 bis 100 Prozent) und
    sensor.storage_max_cell_temp (0 bis 40 Grad Celsius). SOC ist unter
    20 rot, ab 20 gelb und ab 50 grün; Zelltemperatur ist unter 5 rot,
    ab 5 grün und ab 32 rot. Die Anzeige vermittelt den tatsächlichen Wert
    und die Bereichsbedeutung auch als Text; Farbe ist nie der einzige
    Informationsträger. unknown, unavailable und nichtnumerische Werte
    erscheinen ohne vermeintliche Nullwerte oder Zeigerpositionen.

    Danach folgen die Karten Leistung und Gerät in dieser Reihenfolge.
    Leistung enthält
    number.max_soc als Bedienfeld sowie sensor.charge_power,
    sensor.discharge_power und sensor.smartmeter_power (Netzleistung).
    Gerät beginnt mit sensor.energy_charged und sensor.energy_discharged.
    Danach folgen sensor.sun_version_master, sensor.sun_version_gateway,
    sensor.sun_serial_number, sensor.storage_event_text,
    sensor.ic_control_mode_text (Steuermodus), binary_sensor.cell_calibration_active
    und sensor.next_cell_calibration. switch.storage_switch steht als letzte
    Zeile der Gerätekarte. Eine eigene Energie-Karte entfällt.
    Domains und Schlüssel bezeichnen hier
    Registry-Metadaten, keine fest konstruierten Entity-IDs.

    Der Vue-Speicherschalter öffnet vor dem Ein- und vor dem Ausschalten einen
    nativen Bestätigungsdialog. Erst die ausdrückliche Bestätigung sendet
    genau einen bestehenden HA-Schalterservice für den angezeigten Zielzustand.
    Abbrechen, Escape sowie Änderungen an Ausgangszustand, Entity-ID,
    Bedienberechtigung oder Verbindung verwerfen die offene Auswahl ohne
    Schreibaktion. Die übrigen Schalter benötigen diesen zusätzlichen
    Dialog nicht. Bestätigte HA-Zustände bleiben maßgeblich.

    Fehlende optionale Entitäten werden ausgelassen; eine Karte ohne
    verfügbare Metadaten wird nicht erzeugt. Registrierte Entitäten mit
    fehlendem oder nicht verfügbarem Zustand bleiben mit verständlicher
    Kennzeichnung sichtbar. Während Metadaten laden und wenn keine Entitäten
    vorhanden sind, zeigt die Ansicht einen passenden Hinweis. Die entfernten
    Hersteller-/Modell-/Statuskarten werden nicht wieder eingeführt.

    Anordnung, Beschriftung und Bedienelemente funktionieren auf Smartphone
    und Desktop, mit HA-Themes sowie auf Deutsch und Englisch. Die Anzeige
    reagiert auch auf Änderungen über HA-Services oder Automationen und führt
    beim Öffnen, Rendern oder Tabwechsel keine Schreibaktionen aus.
  acceptance_criteria:
    - "Die oben aufgeführten Entitäten und Beschriftungen sind vollständig
       geprüft; Energiezähler stehen zuerst und Speicherschalter zuletzt
       in der Gerätekarte, ohne zusätzliche Energie-Karte."
    - "Grenzen 20/50 Prozent und 5/32 Grad sowie nicht verfügbare Werte
       sind getestet; Farbskalen besitzen eine verständliche Textalternative."
    - "Hauptschalter und Max-SOC verwenden gemeinsame Validierung,
       ausstehende Aktionen und bestätigte HA-Zustände."
    - "Ein- und Ausschalten erfordern jeweils eine Bestätigung. Abbrechen,
       Escape sowie Zustands-, ID-, Rechte- oder Verbindungswechsel schreiben
       nichts; gültige Bestätigung ruft genau einen bestehenden HA-Service auf."
    - "Optionale Gerätedaten fehlen ohne leere Karten; weder Hersteller,
       Modell noch die entfernte Statuskarte werden angezeigt."
    - "Komponenten-/Produktionsmodultests und Browserproben decken Livewerte,
       Navigation, beide Sprachen und eine mobile Ansicht ab."

# ==============================================================================
# ANFORDERUNG: ZEITVARIABLER VUE-TARIF UND NETZDIENLICHE LADEPAUSE
# ==============================================================================
requirement_vue_charging:
  id: REQ-VUE-CHARGING
  title: "Zeitvariabler Vue-Tarif und netzdienliche Ladepause mit Status und Monaten (Issue #200)"
  status: done
  description: >
    Die Vue-Ansichten ladeautomatik und netzdienliches-laden verwenden
    die folgenden vorhandenen Entitäten in der beschriebenen Reihenfolge.
    Gemeinsame Bedienkomponenten verwenden ausschließlich den Kontext aus
    REQ-VUE-ENTITY-BINDING. Namen, Monate, Start/Ende und Enum-Zustände
    stammen aus den übersetzten HA-Metadaten.

    Zeitvariabler Tarif beginnt mit switch.timed_charge_enabled. Danach folgen
    Netzladezeitfenster (EN: Grid charging window) mit time.timed_charge_start
    und time.timed_charge_end,
    direkt darunter Entladestatus mit sensor.timed_charge_discharge_status,
    Einstellungen mit number.timed_charge_max_soc vor
    number.timed_charge_min_soc und Aktive Monate mit den zwölf Schaltern
    timed_charge_month_1 bis timed_charge_month_12. Entladestatus zeigt die
    HA-Zustände normal, discharge_blocked und grid_charging mit ihren
    vorhandenen Texten. Die aktuelle Obergrenze des Netzladeziels wird
    aus dem max-Attribut der zugehörigen Number-Entity übernommen.
    Bei bridge_charge_plan.attributes.enabled=true entfallen das
    Netzladezeitfenster und die Startschwelle timed_charge_min_soc, auch wenn
    der Plan auf Daten wartet oder pausiert. Netzlade-Max-SOC und Monate
    bleiben bedienbar; diese Grenzen gelten weiterhin für REQ-BRIDGE-CHARGE.
    Im TIME_OF_USE-Modus entfällt das Netzladezeitfenster außerdem auch bei
    fester SOC-Ladung nach REQ-TIME-OF-USE-CHARGE-SOURCE; die Startschwelle
    bleibt in dieser Betriebsart sichtbar.

    Bei aktivem dynamischem Tarif ersetzt ein Hinweis auf Stromtarif die
    Bedienung dieser Fallback-Ansicht. Die Tarifwahl folgt den bestätigten
    Tarifdaten, nicht den Zuständen der beiden alten Hauptschalter.

    Nach diesen Ladekarten zeigt der Tab die wiederverwendbare Karte
    Ladeplanung (EN: Charging plan) aus ChargePlan.vue mit
    sensor.bridge_charge_plan nach REQ-BRIDGE-CHARGE. Die Karte erläutert den
    Verbrauchszeitraum, erwartete Entladung, geplante oder laufende
    Niedertarifladung und den PV-Start. Sie meldet auch keinen Ladebedarf,
    unzureichende Bedarfsdeckung sowie fehlende Eingaben und Pausen. Ein
    Fehlbetrag bleibt bei laufender Teilaufladung sichtbar. Bekannte Gründe
    erhalten DE-/EN-Texte, unbekannte Gründe eine allgemeine Meldung. Datum,
    Uhrzeit und Zahlen folgen HA-Sprache und HA-Zeitzone; fehlende Daten
    erzeugen keine erfundenen Zeiten. Fehlt die Sensor-Entity, entfällt die
    Karte. Die Karte liest ausschließlich Backend-Zustände und Attribute.

    Danach zeigt der Tab über die volle Breite dieselbe gemeinsame
    Karte „Dein Stromtarif“ (EN: Your electricity tariff) wie
    Amortisation nach REQ-VUE-SAVINGS (Issue #219).
    Sichtbarkeit und laufende Tarifbewertung folgen dem aktuellen Zustand von
    sensor.economics_current_import_price: bei tariff_type=time_of_use
    erscheinen aktueller Preis und günstigste Ladezeiten; „Alle Preise ansehen“
    öffnet die konfigurierten windows in der vom Sensor gelieferten Reihenfolge.
    Bei anderen Tarifarten entfällt die Karte. Fehlen Entität oder
    Tarifattribute, kann die gesicherte Dashboard-API ein TIME_OF_USE-Profil für
    die Bearbeitung bestätigen. Das erzeugt keine erfundene Preisbewertung.
    Auch zwei oder acht Fenster, Mitternachtsfenster und angrenzende Grenzen
    werden vollständig dargestellt. active_window, Grundpreis,
    Einspeisevergütung, nächster Preiswechsel und Nichtverfügbarkeit werden
    live aus den Sensorattributen übernommen. Preise erscheinen in ct/kWh mit
    zwei Nachkommastellen; der Browser berechnet weder aktive Fenster noch Preise.
    Die Preiseingabe erfolgt im ausklappbaren Editor nach REQ-VUE-TARIFF-EDITOR.
    Ihre Verwendung für
    feste SOC-Ladung und REQ-BRIDGE-CHARGE bestimmt das Backend nach
    REQ-TIME-OF-USE-CHARGE-SOURCE anhand der Konfiguration.
    Ein Tarifwechsel, Mount oder erneutes Rendern löst im Browser keinen
    HA-Service und keinen Registerzugriff aus.

    Die Zahlen-Bedienzeilen im Tab Zeitvariabler Tarif lassen den Präfix
    Bestätigter Wert: beziehungsweise Confirmed value: weg. Der von HA
    bestätigte Wert bleibt auch während eines lokalen Zahlenentwurfs und
    einer ausstehenden Übernahme sichtbar und zugänglich. Die gemeinsame
    Zeitfenster-Zeile Bestätigt: beziehungsweise Confirmed: bleibt erhalten.

    Netzdienliches Laden beginnt mit switch.grid_serving_enabled. Die Karte
    Ladepause enthält in dieser Reihenfolge time.grid_serving_start,
    time.grid_serving_end, sensor.grid_serving_forecast,
    number.grid_serving_forecast_threshold und sensor.grid_serving_pause_status.
    Danach folgen die zwölf Schalter grid_serving_month_1 bis
    grid_serving_month_12 unter Aktive Monate. Die PV-Prognose verwendet
    den dynamischen friendly_name und ihre kWh-Einheit; eine zusätzliche
    Einstellungen-Karte wird nicht erzeugt.

    Beide Monatsauswahlen sind zunächst eingeklappt und zeigen eine kompakte
    Zusammenfassung der bestätigten aktiven Monate samt Anzahl. Nur
    unmittelbar aufeinanderfolgende ausgewählte Monate werden zu Spannen
    zusammengefasst; Lücken bleiben sichtbar, etwa Januar, März–Mai, Oktober.
    Alle zwölf bestätigten on-Zustände erscheinen als Ganzjährig (EN: All year).
    Keine Monate ausgewählt · Ganzjährig inaktiv erscheint ausschließlich
    bei zwölf bekannten, bestätigten off-Zuständen.
    Fehlende, unknown- und unavailable-Zustände
    werden ausdrücklich markiert und nicht als inaktive Monate interpretiert.
    Ändern öffnet vier beschriftete Quartalsgruppen mit je drei unabhängig
    bedienbaren Monatsschaltern. Schließen klappt die Auswahl ohne
    Speicheraktion ein. Öffnen und Schließen lösen keine HA-Services aus;
    jede Monatsänderung verwendet weiterhin einen einzelnen Schalterservice.
    Es gibt keinen gemeinsamen Speicherschritt oder eigene Monatsregeln.
    Kontrollkästchen und Zusammenfassung zeigen ausschließlich bestätigte
    HA-Zustände, ohne zusätzliche Zeile Bestätigter Wert. Zugängliche Namen,
    ausstehende Aktionen, Servicefehler, fehlende Verbindung,
    Bedienbeschränkungen und Nichtverfügbarkeit bleiben auch eingeklappt
    erkennbar. Zusammenfassung, Quartale und Bedienung sind deutsch und
    englisch übersetzt. Der Tab Dynamischer Tarif enthält keine Monatsschalter.

    Die HA-Bestätigung einer gültigen Monatsauswahl wartet nicht auf die
    Geräteauswertung. Der Haken folgt weiterhin ausschließlich dem von HA
    bestätigten Konfigurationszustand. Überlappende Monatsauswahlen werden vor
    jeder Zustandsänderung abgelehnt; der ausstehende Hinweis endet mit der
    Serviceantwort. Eine bestätigte Auswahl bedeutet nicht, dass der Speicher
    bereits einen neuen Steuermodus quittiert hat (REQ-GRID-SERVING-CHARGE).
    Auch Hauptschalter, Ziel-/Min-SOC, Prognoseschwelle und einzelne oder
    atomare Zeitfenster bestätigen die Softwarekonfiguration ohne Warten auf
    Modbus; der gemeinsame Ablauf ist in REQ-VUE-ENTITY-BINDING festgelegt.

    Die beiden editierbaren Zeitfenster verwenden dieselbe Komponente
    TimeWindowControl. Eine 24-Stunden-Leiste mit getrennt verschiebbaren
    Start- und Endmarken sowie Eingabefelder im Format HH:MM bearbeiten
    ein gemeinsames lokales Entwurfspaar. Eingaben mit step=60, Ziehen und
    Tastatur verwenden Minuten bis 23:59, ohne Sekunden-Eingabemöglichkeit.
    Vorhandene HA-Sekunden lösen beim Laden keine Schreibaktion und keinen
    geänderten Entwurf aus; bestätigte Spanne, Dauer und Fläche erhalten diese
    Präzision bis zur ersten Bearbeitung. Erst nach einer bewussten Änderung
    übernimmt Übernehmen beide Grenzen als HH:MM:00. Dies gilt auch für die
    Einzelzeit-Komponente der Controls-Vorschau. Maus, Touch und Tastatur sind
    unterstützt, mit sichtbarem Fokus, zugänglichen Start-/Endbeschriftungen
    und mindestens 44 mal 44 Pixel großen Bedienflächen. Beide Fenster
    bleiben auf mobilen und breiten Ansichten sowie mit hellen und dunklen
    HA-Themes und deutscher oder englischer Sprache bedienbar.

    Ein Fenster über Mitternacht wird auf der Leiste in zwei Abschnitte
    geteilt. Gleiche Start- und Endzeit bedeuten ein leeres Fenster, niemals
    24 Stunden. Die Leiste zeigt bis zur ersten Bearbeitung den bestätigten
    Zeitraum, danach ausschließlich den lokalen Entwurf.
    Erst die gemeinsame Schaltfläche Übernehmen sendet beide Grenzen atomar
    über den vorhandenen set_timed_charge_window- beziehungsweise
    set_grid_serving_window-Service (REQ-VUE-ENTITY-BINDING). Die bestehende
    Überschneidungsprüfung bewertet nur das fertige Zielpaar und leert bei
    echter Überschneidung beide Grenzen mit HA-Benachrichtigung.

    Die bestätigte Zeitspanne stammt ausschließlich aus hass.states; die
    Serviceantwort allein bestätigt keinen neuen Wert. Ändert HA eine
    Zeitgrenze, wird das gesamte Entwurfspaar auf den aktuellen HA-Stand
    gesetzt, damit kein veraltetes Grenzpaar übernommen werden kann. Andere
    Telemetrieänderungen erhalten den lokalen Entwurf. Ungültige Eingaben,
    fehlende Entitäten, Nichtverfügbarkeit, fehlende Rechte oder Verbindung
    sperren die Übernahme. Fehler bleiben sichtbar; eine automatische
    Schreibwiederholung findet nicht statt.

    Beide Fenster zeigen verfügbare bestätigte Start- und Endzeit in einer
    gemeinsamen Zeile. Bei deutscher HA-Sprache erhält diese das Suffix
    " Uhr", etwa 22:00–06:00 Uhr. Eingabefelder und Service-Payloads erhalten
    keinen Sprachzusatz; englische, unbekannte und nicht verfügbare Werte
    bleiben ebenfalls ohne Uhr-Suffix.

    Beide Ansichten zeigen keinen zusätzlichen globalen Max-SOC-Regler.
    Netzladeziel und geräteweiter Max-SOC bleiben unterschiedliche Entitäten.
    Uhrzeiten werden auch für Zeitfenster über Mitternacht unverändert an
    die vorhandenen atomaren Zeitfenster-Services übergeben. Vue ermittelt keine
    Ladeberechtigung, setzt keine Monatsregeln um und wiederholt keine
    Setpoint-Schreibvorgänge. Fehlende Entitäten und leere Karten werden
    ausgelassen; fehlt nur eine Zeitgrenze, bleibt die vorhandene Information
    sichtbar und das Paar ist nicht bedienbar. Geleerte oder unbekannte Werte
    können über die nativen HA-Time-Entitäten korrigiert werden. Unbekannte
    Zustände erhalten keine erfundenen Nullwerte. Die nur angezeigten dynamischen Ladezeiten und
    Tarifpläne sowie die Recorder-Datumsfilter gehören nicht zur Umstellung.
  acceptance_criteria:
    - "frontend/tests/charging.test.ts prüft vollständige Reihenfolge,
       alle zwölf übersetzten Monate und die Trennung von Ladepause und Zeitfenster."
    - "Die Ladeplanung erklärt geplante und laufende Aufträge, keinen Bedarf, Teilaufladung und fehlende Daten in DE/EN. Alle Zeiten und Zahlen stammen aus Sensorattributen; die Anzeige erzeugt keine eigenen Ladeaufträge."
    - "frontend/tests/tariff-plan.test.ts prüft die gemeinsame Tarifpreisfenster-Karte:
       Sie erscheint bei time_of_use in
       Zeitvariabler Tarif und Amortisation; fixed, dynamic, disabled und eine
       fehlende Entity erzeugen keine Karte. DE/EN, alle acht Fenster,
       Mitternacht, Live-Fenster-/Tarifwechsel, Grundpreis, leere Fensterliste
       und Nichtverfügbarkeit sind ohne Serviceaufruf abgesichert."
    - "tests/test_config_flow.py und tests/test_economics_dashboard_e2e.py
       prüfen ein, zwei und acht Fenster vom Dashboard-Editor über gespeicherte
       Options und Tarifmodell bis zu Sensorattributen und authentifizierten
       Dashboard-States, einschließlich Mitternacht und angrenzender Grenzen."
    - "Zeitvariabler Tarif zeigt auf Deutsch und Englisch bestätigte Werte
       ohne Präfix; lokale Entwürfe ersetzen diese Werte nicht. Die gemeinsame
       Zeitfenster-Bestätigung und Beschriftungen anderer Ansichten bleiben erhalten."
    - "22:00 bis 06:00 wird als zwei Abschnitte über Mitternacht dargestellt
       und ohne eigene Zeitplanlogik mit genau einem atomaren HA-Service
       übertragen. Gleiche Grenzen zeigen ein leeres Fenster; Tagesfenster,
       Mitternachtsgrenzen und unbearbeitete Altsekunden bleiben korrekt."
    - "Ziehen mit Maus oder Touch und Tastaturbedienung verändern nur den
       gemeinsamen Entwurf. Die Eingabe erlaubt ausschließlich HH:MM. Erst
       Übernehmen schreibt; eine Serviceantwort ohne HA-Zustandsänderung
       verändert die bestätigte Anzeige nicht."
    - "HA-Änderungen einer Zeitgrenze ersetzen den gesamten Entwurf;
       andere Telemetrie erhält ihn. Fehlende oder nicht verfügbare Grenzen,
       Rechteentzug, Geräte-/Registrywechsel, Verbindungsabbruch, doppelte
       Übernahme und Servicefehler verursachen keine veralteten Schreibaktionen."
    - "Beide Zeitfenster bleiben mit Maus, Touch und Tastatur, auf Smartphone
       und Desktop, auf Deutsch und Englisch sowie in hellen und dunklen
       HA-Themes lesbar und bedienbar. Start- und Endmarken bleiben auch bei
       gleichen Grenzen einzeln erreichbar."
    - "Monatsaktionen im Frontend verwenden ausschließlich HA-Schalterservices."
    - "Beide Monatsauswahlen starten eingeklappt; Ändern und Schließen
       öffnen beziehungsweise schließen vier Quartalsgruppen mit je drei
       Monaten ohne HA-Serviceaufruf oder zusätzlichen Speicherschritt."
    - "Zusammenfassungen in DE/EN zeigen Einzelmonate, zusammenhängende
       Spannen und mehrere getrennte Bereiche korrekt, etwa Januar,
       März–Mai, Oktober. Dezember und Januar werden nicht über eine
       Jahresgrenze verbunden. Alle zwölf aktiven Monate zeigen Ganzjährig
       beziehungsweise All year; null aktive Monate nur bei zwölf bestätigten
       off-Zuständen Keine Monate ausgewählt · Ganzjährig inaktiv."
    - "Fehlende Metadaten oder Zustände sowie unknown und unavailable
       bleiben auch in der Zusammenfassung sichtbar und werden nicht als
       off behandelt. Ausstehende oder fehlgeschlagene Services ändern
       weder Zusammenfassung noch Checkboxen vor HA-Bestätigung;
       Fehler, fehlende Verbindung und Bedienbeschränkungen bleiben
       auch nach dem Einklappen sichtbar."
    - "Beide Monatsauswahlen zeigen keine zusätzliche Bestätigter-Wert-Zeile;
       zugängliche Namen und die DOM-/Tastaturreihenfolge Januar bis Dezember
       bleiben erhalten. Quartale stehen mobil in einer, bei ausreichender
       Breite in zwei Spalten; helle und dunkle Themes bleiben lesbar."
    - "Die sichtbaren Monatskästchen messen 22 mal 22 Pixel innerhalb einer
       mindestens 44 mal 44 Pixel großen Klickfläche. Ein Klick auf deren
       Rand und die Leertaste lösen jeweils genau einen HA-Serviceaufruf aus."
    - "tests/test_vue_dashboard_e2e.py prüft alle zwölf Monatsschalter beider
       Gruppen über echte HA-WebSocket-Services: Serviceantwort und state_changed
       werden auch bei blockierter Geräteauswertung bestätigt; die Auswertung
       läuft nach Freigabe der Sperre weiter."
    - "tests/test_month_switch_response.py prüft schnelle Folgeänderungen,
       Ablehnung von Überschneidungen, Speicherung, Gerätefehler, Bootstrap
       und Entladen ohne abgebrochene Registersequenz."
    - "Die gemeinsame bestätigte Zeitspanne beider Fenster zeigt auf Deutsch
       Uhr; englische, unbekannte und nicht verfügbare Werte sowie
       Eingabefelder und Service-Payloads bleiben ohne zusätzliches Suffix."
    - "Live-Entladestatus, geänderte Ziel-SOC-Grenzen, dynamischer Prognosename
       sowie fehlende und nicht verfügbare Entitäten sind getestet."
    - "Bedienung verwendet echte Entity-IDs, gemeinsame Fehlerbehandlung
       und erst durch HA bestätigte Zustände; Mount und Rendern schreiben nichts."

# ==============================================================================
# ANFORDERUNG: TARIFEDITOR IM DASHBOARD
# ==============================================================================
requirement_vue_tariff_editor:
  id: REQ-VUE-TARIFF-EDITOR
  title: "Tarifpreisfenster direkt im Dashboard bearbeiten und Preise in Cent anzeigen"
  status: done
  description: >
    Die gemeinsame Tarifpreisfenster-Karte in Stromtarif, Zeitvariabler Tarif und Amortisation
    zeigt zunächst eine kompakte Übersicht. Im Stromtarif heißt sie
    „1. Wann ist dein Strom günstig?“, ansonsten „Dein Stromtarif“.
    Gespeicherte tägliche Preiszeiten und Standardpreis sind direkt lesbar;
    günstigste Zeiten werden nur bei exakt zum Profil passenden Sensorattributen
    anhand der Backend-Markierung hervorgehoben. Nach einer Tarifänderung bis
    zur passenden Telemetrie erscheint ein Aktualisierungshinweis statt alter
    Ladezeiten. Außerhalb der kompakten Variante bleibt der aktuelle Preis
    sichtbar, vollständige Preistabelle und Auswahlregeln sind einklappbar.
    Bearbeiten öffnet in dieser Reihenfolge normalen Strompreis, Zeiten mit
    anderem Preis und Vergütung für Solarstrom. Kurze Beispiele erklären ct/kWh,
    den Standardpreis außerhalb der Fenster und 0 bei fehlender Vergütung.
    Solarprognose ist ein optional aufklappbarer Zusatzbereich, bei aktiver
    Bedarfsplanung oder einem Quellfehler offen. Der Hinweis vor Speichern
    erklärt die Wirkung auf Ladezeiten ohne Einschalten der Netzladung.
    Zeitfenster hinzufügen ergänzt bis zu acht Fenster;
    einzelne Fenster lassen sich entfernen. Standardpreis bedeutet den variablen
    Arbeitspreis außerhalb der Fenster, keine monatliche Grundgebühr. Erklärungen
    bleiben bei Bedarf zugänglich, ohne dauerhaft die Karte aufzublähen.

    Der Editor arbeitet mit einem lokalen Entwurf. Speichern übernimmt das gesamte
    gültige Profil atomar und klappt den Editor nach Bestätigung zu; Abbrechen
    verwirft den Entwurf. Speichern ist eine bewusste Tarifänderung und kann sofort
    die erlaubten Ladezeiten ändern. Mount, Rendern und reine Eingaben schreiben
    nichts. Fehler, fehlende Rechte, Verbindungsverlust und konkurrierende
    Tarifänderungen werden angezeigt; gescheiterte Speicherungen behalten den
    Entwurf. Eine alte Revision darf einen inzwischen geänderten Tarif nicht
    überschreiben. Fehlende Pflichtpreise lassen sich im Dashboard ergänzen.

    Die WebSocket-Befehle sax_power/dashboard/tariff/get und
    sax_power/dashboard/tariff/save beziehen sich auf genau einen SAX-Config-Entry.
    Lesen prüft Benutzer- und Leserechte; ein aktiver Administrator kann auch einen
    unvollständigen Tarif reparieren. Speichern verlangt einen aktiven Administrator,
    TIME_OF_USE als aktuelle Tarifart und die aktuelle Revision. Der Server prüft
    endliche Preise, Wertebereiche, höchstens acht vollständige Fenster, verschiedene
    Start-/Endzeiten und Überschneidungen auf dem zyklischen Tag. Fenster über
    Mitternacht und angrenzende Grenzen sind zulässig. Die aktiven Options und
    der gemeinsame Options-Lifecycle bilden weiterhin die einzige aktive Tarifquelle
    und übernehmen Änderungen ohne Config-Entry-Reload in den Coordinator.

    Tarifzeiten werden als Text mit sichtbarem 24-Stunden-Formathinweis eingegeben
    (12:30 oder 1230), ohne missverständliche segmentierte Browser-Platzhalter.
    Eine unvollständige Eingabe wie 12 bleibt sichtbar unvollständig und wird
    nicht automatisch ergänzt. Vollständige vierstellige Zeiten werden bei change
    und beim Speichern in HH:MM normalisiert; vorhandene Sekunden bleiben erhalten.
    Beim Speichern liest der Editor die sichtbaren Zeitfelder; auch separat
    bestätigte change-Werte werden übernommen. Unvollständige Zeiten und gleiche
    Grenzen benennen das betroffene Fenster und Feld, markieren es zugänglich und
    setzen den Fokus dorthin. Der Entwurf bleibt erhalten, auch bei Serverfehlern.
    Die getrennten Niedertarife 00:00 bis 04:59 und 12:30 bis 15:30 sind gültig.
    Browserprüfungen verwenden Tastatureingabe in Chromium und WebKit auf macOS
    während HA-Zustandsupdates sowie getrennte change- und Submit-Übernahmen,
    unvollständige Stunden und die vierstellige Eingabe mit Korrektur und Retry.

    TOU-Standardpreis, Einspeisevergütung und Zeitfenster entfallen vollständig im
    Options Flow. Tarifauswahl und Preiseingaben für Festpreis und dynamische
    Einspeisevergütung bleiben dort. Andere Optionsänderungen bei gleicher Tarifart
    bewahren den aktuell gespeicherten TOU-Tarif. Die erste Auswahl von TIME_OF_USE
    darf ein unvollständiges Profil anlegen, bis es im Dashboard vervollständigt ist.
    Es werden weder Nullpreise noch Ersatzladezeiten erfunden.

    TIME_OF_USE wird im Options Flow ohne zusätzliche Dashboard-Zustimmung
    gespeichert, da das Dashboard immer bereitgestellt wird (REQ-VUE-DASHBOARD).
    Frühere Abwahlen blockieren weder neue noch bestehende Tarifprofile oder
    wiederholte erste Seiten. Aktive und inaktive Profile bleiben erhalten;
    die direkte Speicherung erfolgt ohne zusätzliche TOU-Preisseite.

    Sämtliche sichtbaren Tarifpreise, die Einspeisevergütung und die Preisgrenzen
    verwenden ct/kWh. TOU-Eingaben haben eine Schrittweite von 0,01 ct/kWh;
    NumberEntity-Grenzen und Schrittweiten werden entsprechend ihrer bisherigen
    Euro-Werte umgerechnet. Die API benennt Centwerte ausdrücklich mit *_ct_kwh.
    Interne Tarifberechnung, Options, Steuerungs-Store und bestehende Attribute
    *_eur_kwh bleiben EUR/kWh. So entspricht 32,00 ct/kWh weiterhin intern 0,32
    EUR/kWh. Geldbilanzen und Investitionskosten bleiben EUR. Die explizite Auswahl
    der Einheit eines externen Preissensors beschreibt weiterhin dessen tatsächliche
    Einheit (EUR/kWh, ct/kWh, EUR/MWh oder ct/MWh).

    Alte Restore-Werte der Preis-NumberEntities werden anhand ihrer gespeicherten
    Einheit übernommen. Vorhandene Preisstatistiken der drei umgestellten Sensoren
    werden einmalig in der Recorder-Warteschlange mit Faktor 100 skaliert und
    zusammen mit ihren Metadaten atomar auf ct/kWh umgestellt. Andere Statistiken
    und rohe historische Zustände bleiben unberührt. Der gemischte Übergangsabschnitt
    kann von HA bei der Statistikbildung übersprungen werden; folgende Abschnitte
    und die konvertierte Historie verwenden dieselbe Einheit.
  acceptance_criteria:
    - "Frontend-Tests prüfen Speichern, Abbrechen, Hinzufügen/Entfernen, Null und
       negative Preise, Dezimalkomma, fehlende Felder, Mitternacht, Überlappungen,
       acht Fenster, Leserechte, Verbindungsverlust und Speicherfehler."
    - "Backend-Tests prüfen aktive Benutzer, Administratorrechte, Entry-Zuordnung,
       Tariftyp, Revision, endliche Preise, Wertebereiche, Fensterregeln und atomare
       Speicherung ohne Änderung fremder Options."
    - "Config-Flow-Tests prüfen das Entfallen der TOU-Folgeseite, Erhalt bestehender
       Profile und Cent/Euro-Roundtrips der verbleibenden Preisfelder."
    - "tests/test_tou_dashboard_options.py prüft direkte Tarifauswahl trotz alter
       Abwahlen in Options/Entry-Daten, neue/aktive/inaktive Tarifprofile und
       wiederholte erste Seiten ohne Dashboard-Abfrage."
    - "Number-/Sensor-Tests prüfen Wert und Einheit gemeinsam sowie die Migration
       alter Euro- und neuer Cent-Restore-Werte ohne Faktor-100-Fehler."
    - "Recorder-Tests prüfen Kurz-/Langzeitstatistik, Idempotenz, unbeteiligte
       Sensoren und nachfolgende neue Cent-Statistiken."
    - "Browserprüfungen decken schmale Darstellung, Tastaturbedienung und DE/EN ab."

# ==============================================================================
# ANFORDERUNG: VUE-PREISOPTIMIERTES LADEN
# ==============================================================================
requirement_vue_dynamic_charging:
  id: REQ-VUE-DYNAMIC-CHARGING
  title: "Dynamische Tarifbedienung im gemeinsamen Stromtarif"
  status: superseded
  description: >
    Die dynamische Tarifbedienung ist in REQ-VUE-ELECTRICITY-TARIFF enthalten.
    Die Route dynamisches-laden leitet nach stromtarif um. Bestehende Entities,
    Preisstrategien und globale SOC-Obergrenze bleiben erhalten.

requirement_vue_electricity_tariff:
  id: REQ-VUE-ELECTRICITY-TARIFF
  title: "Gemeinsamer Stromtarif mit Tagespreisen und kompakter Bearbeitung"
  status: done
  description: >
    Der Tab Stromtarif unter stromtarif zeigt ausschließlich den gespeicherten
    aktiven Tariftyp. Tarif wechseln bietet Zeitvariabel und Dynamisch; erst
    Übernehmen speichert die Auswahl. Der Hauptschalter Automatische Netzladung
    ist von der Tarifauswahl unabhängig. Bei ausgeschalteter Automatik bleiben
    Tarif, aktuelle Preise und Amortisationsbewertung aktiv. Der zeitvariable
    Tarif führt in drei Schritten durch die Einrichtung: „1. Wann ist dein Strom
    günstig?“, „2. Wie viel möchtest du laden?“ und „3. Automatik einschalten“.
    Die Reihenfolge im DOM entspricht der sichtbaren Reihenfolge. Tarif- und
    Ladeeinstellungen beginnen mit einer Zusammenfassung und einer ausdrücklichen
    Bearbeiten-Aktion; Öffnen und Schließen ändern keine Werte. Aktueller Preis
    und Entladestatus bleiben sichtbar, der vollständige Tagespreisverlauf ist
    unter „Preisverlauf anzeigen“ einklappbar. Dynamisch bleiben Tarifauswahl,
    breite Tagespreiskurve, kompakte Einstellungen und Ladeplan erhalten.

    Die bestehende Route ladeautomatik bleibt als Fallback erhalten und verwendet
    dieselben aktiven Tarifdaten und Steuerwerte. Bei dynamischem Tarif zeigt
    sie einen Verweis auf Stromtarif. Der Tab Dynamischer Tarif entfällt; seine
    alten Links werden ohne zusätzliche History-Einträge nach stromtarif geleitet.
    Festpreis und deaktivierte Tarife bleiben als bestehende Optionswerte gültig;
    die neue Auswahl erfindet dafür weder einen zeitvariablen noch dynamischen Preis.

    Tarif & Preise verwendet lokale Entwürfe mit Speichern und Abbrechen. Bei
    Zeitvariabel enthält es Standardpreis, Einspeisevergütung und bis zu acht
    tägliche Zeitfenster nach REQ-VUE-TARIFF-EDITOR. Dynamisch erlaubt Preis-Sensor,
    optionales Attribut, tatsächliche Quelleneinheit, Einspeisevergütung sowie
    PV-Quelle und PV-Anteil. Gespeicherte inaktive Profile bleiben in
    dashboard_tariff_profiles erhalten; die flachen aktiven Options bleiben die
    gemeinsame Quelle für Tarifbewertung und Ladeplanung. Der PV-Anteil ist
    eine ganze Prozentzahl von 0 bis 100. Frontend und Backend prüfen diese
    Grenze einschließlich Ganzzahligkeit; eine ungültige Eingabe wie 50,5 wird
    vor dem Speichern mit einer konkreten DE-/EN-Meldung abgelehnt und der
    Entwurf bleibt erhalten (frontend/tests/electricity-tariff.test.ts).
    Ein Wechsel verwirft
    weder Investitionsdaten noch native SOC-, Monats- oder Strategieeinstellungen.

    Ladeverhalten bleibt zunächst eingeklappt. Vorhandene EntityControls
    übernehmen bestätigte Einzelwerte über die vorhandenen HA-Services; Fertig
    schließt den Bereich. Zeitvariabel bietet zwei beschriebene Ladeweisen:
    „Festes Ladeziel“ schaltet ausschließlich bridge_charge_enabled aus,
    „Nur Bedarf bis Solarstrom“ schaltet ausschließlich diesen Schalter ein.
    Nur bestätigte, verfügbare on/off-Zustände markieren die Auswahl; fehlende,
    unbekannte und nicht verfügbare Werte erhalten keine erfundene Ladeweise.
    Die Auswahl aktiviert weder den Hauptschalter noch setzt sie Zielwerte.
    Das sichtbare Netzladeziel heißt bei Verbrauchsplanung „Höchstens laden bis“
    und wird als Obergrenze erklärt. Startschwelle (nur bei festem Ladeziel),
    globale Ladegrenze und Monate bleiben unter „Weitere Einstellungen“
    erreichbar. Bestätigte Startschwelle und Monatsauswahl sind auch geschlossen
    sichtbar; 0 % wird als verhinderter Neustart erklärt. Fehlende Monatswerte
    dürfen nicht als ganzjährig inaktiv erscheinen. Die globale Grenze erklärt
    ihre Wirkung auch auf Solarstrom und ein höheres Netzladeziel. Ein sichtbarer
    Hinweis beim Ladeziel und in der geschlossenen Zusammenfassung erklärt
    die vorübergehende 100-%-Ausnahme bei fälliger Zellkalibrierung; bei
    Verbrauchsplanung autorisiert sie keine ungeplante Vollladung. Die feste
    Ladeweise erklärt ihre Entladesperre nach erfolgter Netzladung bis zum
    Fensterende, die Bedarfsladung die anschließende normale Entladefreigabe.
    PV-Voraussetzungen werden neben der Ladeweise verständlich erklärt;
    bridge_pv_start_required und bridge_tariff_required aus dem HA-Service
    erhalten konkrete DE-/EN-Hinweise. Ausstehende Änderungen sperren weitere
    Modusaufrufe. Bestätigte Zustände, Fehlermeldungen und Zahlentwürfe bleiben
    beim Schließen und erneuten Öffnen erhalten. Dynamisch führt
    die Bedienung mit alltagssprachlichen Ladeweisen durch die Einrichtung:
    bedarfsgerechtes Laden (Smart), günstigste Stunden (Relativ), feste
    Preisgrenze (Absolut) oder ausgeschaltete Preisautomatik (Off). Die Ansicht
    erklärt die Wirkung der bestätigten Auswahl und zeigt nur die passenden
    Eingaben: Preisgrenze bei Absolut, maximale Ladedauer bei Relativ/Smart.
    Das Ladeziel bezeichnet den maximalen Speicherfüllstand in Prozent und
    erklärt ausdrücklich seine Gültigkeit für alle Ladearten. Smart berücksichtigt
    den Energiebedarf und die optionale PV-Prognose; fehlen Gerätedaten,
    gilt weiterhin der bestehende Rückfall auf die günstigsten Stunden.
    Die Preisgrenze wirkt bei Relativ/Smart nicht als zusätzliche Obergrenze.
    Bestehende Strategien und Werte werden weder beim Öffnen noch durch
    Empfehlungen eigenmächtig geändert. Eine verständliche Zusammenfassung
    beschreibt die gespeicherte Wirkung auch außerhalb des Editors.

    Der Neutralpreis bleibt in erweiterten Ladeeinstellungen erreichbar.
    Die Erklärung macht den Netzbezug des Hauses während der Speicherpause
    sowie das unterschiedliche Preisband bei Absolut verständlich. Auch
    außerhalb der erweiterten Einstellungen bleibt eine vorhandene Pausegrenze
    erkennbar. Die einfache Preisquellen-Einrichtung zeigt Strompreis-Sensor
    und Einspeisevergütung. Preisattribut, Einheit und PV-Anteil sind weiterhin
    erreichbar, aber nachgeordnet; vorhandene Sonderwerte bleiben erhalten.
    Hinweise erklären Preisvorschau, optionale PV-Quelle und die Wirkung des
    anrechenbaren PV-Anteils. Globale SOC-Obergrenze und eigenes TOU-Ladeziel bleiben
    getrennte Größen. Prognose-, Status-, Entlade- und Planungsinformationen
    bleiben zugänglich. Der Stundenzyklus ist unabhängig vom angezeigten Kalendertag.

    Preisfehler benennen das konkrete Feld: fehlender oder gelöschter Strompreis-
    Sensor, Einheit, Einspeisevergütung, PV-Quelle, Preisattribut oder PV-Anteil.
    Das betroffene Feld wird zugänglich markiert und fokussiert, gegebenenfalls
    werden die erweiterten Einstellungen geöffnet. Gewählte Quellen und Preise
    bleiben im Entwurf. Eine fehlende Einspeisevergütung wird nicht eigenmächtig
    auf 0 gesetzt; der Hinweis erklärt die Eingabe von 0 ohne Vergütung.
    EPEX-Daten in €/kWh mit data-Intervallen aus start_time, end_time und
    price_per_kwh bleiben ebenso zulässig wie das bestehende Cent-Format.
    Unbekannte Einheiten oder Fremdwährungen werden nicht als Euro angenommen.

    sax_power/dashboard/tariff/configure speichert Profil und aktive Tarifwahl
    mit Revisionsprüfung. Ein optionaler automation_enabled-Wert stellt den
    Hauptschalter; fehlt er, bleibt dessen Gesamtzustand beim Tarifwechsel
    erhalten. Reines Ein-/Ausschalten des unveränderten aktiven Tarifs nimmt
    der Coordinator nach vollständiger Validierung ohne Warten auf den
    Control-Lock oder Modbus an. Es verändert weder Tarif-Options noch deren
    Revision und startet keine Preis-/Prognoseanbieter neu. Der gespeicherte
    Softwarezustand wird unmittelbar zur Persistenz vorgemerkt und bestätigt;
    der bestehende gemeinsame Worker übernimmt die Geräteauswertung unter
    dem Control-Lock. Tatsächliche Geräteaktivität bleibt an quittierte
    Gerätebefehle gebunden. Erneutes Speichern ohne Änderung aktiver Tarifquellen
    und reine Archivpflege benötigen ebenfalls keinen Geräte-Lock. Auch echte
    Tarif- und Quellenänderungen übernehmen Options und passende, sich
    ausschließende Steuerflags atomar ohne Warten auf den Geräte-Lock.
    Eine Quellenrevision sperrt veraltete negative Sollwerte. Der gemeinsame
    Worker wartet laufende Quittierungssequenzen unter dem Schreib-Lock ab,
    beendet alte periodische Writer sicher und wendet den neuesten Stand an.
    Während einer Quittierung veraltete Schreibentscheidungen werden kontrolliert
    zurückgesetzt; fehlgeschlagene Rücksetzungen werden erneut versucht.
    Globale SOC-Sperren bleiben beim Tarifwechsel erhalten. Ein gleichzeitiger
    manueller Ladebefehl bewertet den neuesten Stand erneut und bestätigt seinen
    Erfolg weiterhin erst nach Gerätequittierung. Alle Wege verwenden weiterhin die
    zentrale ChargePolicy und denselben SunSpec-Schreibpfad. Native Aufrufe können
    die zum aktiven dynamischen beziehungsweise zeitvariablen Tarif unpassende
    Automatik nicht aktivieren. Beim Bootstrap werden unpassende gespeicherte
    Schalter deaktiviert, ohne eigenmächtig eine andere Automatik einzuschalten.
    Options Flow und Dashboard verwenden denselben Laufzeitabgleich; ein
    verspäteter Optionslistener darf keinen älteren Stand wiederherstellen.

    Beim Wechsel auf ein noch unvollständiges Profil erklärt die Auswahl,
    dass die automatische Netzladung ausgeschaltet wird, und übergibt dafür
    automation_enabled=false. Das Profil ist danach erreichbar und kann
    vervollständigt werden. Live-Änderungen anderer Clients und nativer Schalter
    werden übernommen; ältere Leseantworten überschreiben keine bestätigten
    Schreibvorgänge. Die offene Ansicht aktualisiert Zeitmarkierung, Tagesgrenzen
    und Tarifzustand zusätzlich minütlich und räumt den Timer beim Verlassen ab.
    Ein extern geänderter Tariftyp schließt offene Editoren mit sichtbarem Hinweis,
    ohne unsichtbare Bediensperren zurückzulassen. Preisantworten müssen weiterhin
    zum angefragten Tarif, seiner Revision und dem angezeigten Tag passen. Das
    vom Server gelieferte lokale Tagesdatum bleibt auch bei abweichender
    Browserzeitzone unverändert; wiederholte Stunden zeigen ihre UTC-Offsets.

    sax_power/dashboard/tariff/series liefert die vollständige Preisabdeckung
    für heute, bei dynamischen Tarifen auch morgen, unabhängig von ausgewählten
    Ladefenstern. ISO-Intervallgrenzen, HA-Zeitzone und tatsächliche Tageslänge
    erhalten 23-/25-Stunden-Tage und wiederholte Stunden eindeutig. Die Kurve
    verwendet ct/kWh, eine Stufendarstellung, sichtbare Lücken und negative Preise.
    Fehlende Morgenpreise bleiben ausdrücklich nicht verfügbar. Ein reiner
    aktueller Sensorwert liefert keine erfundene Tageskurve. Relative Heute- und
    Morgenlisten werden am Aktualisierungsdatum des Quellsensors verankert.
    Unverfügbare Quellen, fremde Einheiten und widersprüchliche Überlappungen
    autorisieren keine Ladung und erhalten keinen Ersatzpreis.

    Lesen und Schreiben prüfen aktive Benutzer, Entry-Zuordnung und die
    erforderlichen Rechte. Preisserien prüfen zusätzlich die Leserechte der
    externen Quelle. Aktive Administratoren können unvollständige Profile
    reparieren; ungültige, veraltete oder unberechtigte Schreibanforderungen
    verändern weder Options noch Steuerflags. Fehler und Verbindungsabbrüche
    erhalten den lokalen Entwurf. Reines Anzeigen oder Wechseln des Diagrammtags
    verändert keine Gerätesteuerung.

    Beim Hauptschalter erscheint unmittelbar nach dem Klick eine zugängliche
    Fortschrittsmeldung. Bis zur Serverbestätigung bleibt der letzte bestätigte
    Hakenwert sichtbar und weiteres Schalten gesperrt. Fehler erhalten den
    bestätigten Zustand und erlauben einen ausdrücklichen neuen Versuch.

    Vor dem Speichern oder Wiederherstellen prüft bridge_configuration_error
    die vollständigen aktiven Ziel-Options; der Dashboard-Coordinator prüft sie
    erneut unmittelbar vor der atomaren Softwareübernahme. Eine aktive
    verbrauchsbasierte Ladeplanung ohne konfigurierte PV-Quelle wird mit
    bridge_pv_start_required abgelehnt,
    ohne Profile, Preise oder Steuerflags zu ändern. Der TOU-Editor kennzeichnet
    die Quelle als erforderlich und erklärt den Fehler in DE/EN bei erhaltenem
    Entwurf. Die optionale dynamische PV-Quelle und archivierte TOU-Einstellungen
    bleiben beim Wechsel zu Dynamisch unabhängig (Issue #244).
  acceptance_criteria:
    - "Backendtests decken Profilwechsel, aktive/inaktive Werte, Revisionskonflikte,
       Berechtigungen und vollständige Preisserien mit negativen Preisen, Lücken,
       überlappenden Quellen und Sommer-/Winterzeit ab."
    - "Coordinator-Tests prüfen genau eine passende Automatik, ausgeschalteten
       Hauptschalter, globale SOC-Werte, Bootstrap, alte native Schalter, verspätete
       Optionslistener und das Ende des bisherigen periodischen Tarif-Schreibers."
    - "Frontend-/Browsertests prüfen die dauerhafte Navigation, Redirects, Tarifwahl,
       Hauptschalter, kontextabhängige Einstellungen, Speichern/Abbrechen sowie
       heutige/morgige Preiskurven in DE/EN, hell/dunkel und auf schmalen Displays."
    - "Zeitvariable Komponenten-/Browsertests prüfen die drei Schritte, nur ein
       Hauptschalter, Tastaturbedienung, initial geschlossene Zusatzfelder,
       bestätigte Modusauswahl und Zusammenfassung, fehlende PV-/Monatsdaten,
       verzögerte und abgelehnte Dienste ohne Doppelaufrufe oder implizite
       Aktivierung sowie den Erhalt fehlgeschlagener Zahlentwürfe. Desktop und
       Mobil bis 320 px, DE/EN und beide Themes bleiben ohne Seitenüberlauf."
    - "Tests prüfen die verständlichen Ladeweisen, nur wirksame Einstellfelder,
       erweiterte Einstellungen und den Erhalt vorhandener Werte ohne implizite
       Schreibvorgänge. Verzögerte oder fehlerhafte Hauptschalterantworten zeigen
       sofort den Fortschritt, blockieren Doppelklicks und bestätigen keinen
       erfundenen Zustand."
    - "Backendtests halten den Geräte-Control-Lock belegt und weisen die sofortige
       Antwort auf reine Hauptschalteränderungen nach. Options, Revision und
       Anbieter bleiben unverändert; nach Freigabe greift der neueste Steuerstand."
    - "tests/test_dashboard_tariff_transition_response.py prüft echte Tarif- und
       Quellenwechsel über WebSocket bei belegtem Geräte-Lock, beide ACK-Phasen
       von Start und periodischem Writer, Rücksetzfehler mit erneutem Versuch
       sowie globale SOC-Sperren einschließlich Änderungen während Persistenz.
       Ein gleichzeitiger manueller Lade-Service wartet auf die Gerätequittierung
       und gibt fehlgeschlagene Quittierungen als Fehler zurück."
    - "tests/test_epex_price_source.py prüft EPEX €/kWh und ct/kWh durch Speicherung,
       Preisplan, Tageskurve und gemeinsamen Bewertungspreis inklusive negativer
       Preise und vorübergehend nicht verfügbarer Quellen. Frontendtests prüfen die genauen
       Feldfehler in DE/EN, Fokus, erhaltene Quellen und bewusste Preiseingabe."
    - "Ladeentscheidung, aktuelle Preisanzeige und Amortisation verwenden denselben
       gültigen Bezugspreis; die zeitliche Buchung folgt REQ-ECONOMICS-ACCOUNTING."
    - "tests/test_dashboard_bridge_source.py prüft Quellenentfernung bei aktiver
       Ladeplanung, vorhandene/fehlende Laufzeit, ausgeschalteten Hauptschalter,
       Archiv-Restore, zulässigen Quellenwechsel und konkurrierende Optionsänderungen."

# ==============================================================================
# ANFORDERUNG: VUE-ERSPARNIS UND RECORDER-AUSWERTUNG
# ==============================================================================
requirement_vue_savings:
  id: REQ-VUE-SAVINGS
  title: "Vue-Amortisation, Tarifplan und native Recorder-Zeitraumauswertung (Issue #202)"
  status: done
  description: >
    Der Vue-Pfad ersparnis verwendet dieselbe Wirtschaftlichkeitsbilanz
    und deren Recorder-Netto-Ersparnis. Er ersetzt die abgelöste
    Lovelace-spezifische REQ-ECONOMICS-SAVINGS-DASHBOARD.
    Die Blöcke erscheinen in der Reihenfolge Amortisation, Kalenderwerte,
    Dein Stromtarif, freie Datumsauswahl mit Zeitraumwert und Balkendiagramm,
    eingeklappte Berechnungshinweise und höchstens ein Wirtschaftsstatushinweis.

    binary_sensor.economics_investment_configured entscheidet über den
    Konfigurationshinweis bei off beziehungsweise die Amortisationsanzeige
    bei on. Dort erscheinen sensor.economics_amortization_progress als
    blaue Fortschrittsanzeige, sensor.economics_remaining_to_payback,
    der Vorlaufbetrag aus prior_result_eur von sensor.economics_roi,
    sensor.economics_net_savings und economics_started_at von
    sensor.economics_status. Fehlende optionale Entitäten erzeugen keine
    leeren Zeilen. Geldbeträge erhalten zwei Nachkommastellen in EUR;
    Tarifpreise und Einspeisevergütung zwei Nachkommastellen in ct/kWh.
    Die interne Genauigkeit bleibt unverändert.

    Die mit Zeitvariabler Tarif gemeinsam verwendete Karte „Dein Stromtarif“
    (EN: Your electricity tariff) ist sichtbar, wenn die Attribute von
    sensor.economics_current_import_price tariff_type=time_of_use melden oder
    bei fehlenden Sensorattributen die gesicherte API diesen Tarif bestätigt.
    windows, active_window, base_price_eur_kwh, feed_in_price_eur_kwh,
    next_price_change_at und unavailable_reason sind die
    Datenquelle für die laufende Tarifbewertung. Aktueller Preis und günstigste
    Ladezeiten sind sichtbar; „Alle Preise ansehen“ öffnet alle bis zu acht
    konfigurierten Fenster in der vom Sensor gelieferten Reihenfolge, auch über
    Mitternacht und bei angrenzenden Grenzen. Die Preisregeln sind separat
    einklappbar. Tarifwechsel werden live übernommen; ein fehlender
    Preis wird weder zu Null noch zum gültigen aktiven Grundpreis umgedeutet.
    Eine leere Fensterliste zeigt weiterhin die verfügbaren übrigen Tarifdaten.
    Die gemeinsame Komponente führt keine Tarifberechnung aus.
    Der ausklappbare Editor nach REQ-VUE-TARIFF-EDITOR schreibt das vollständige
    Profil über eine gesicherte WebSocket-API in die HA-Options.

    sax_power/dashboard/statistics ist eine authentifizierte, nur lesende
    HA-WebSocket-Abfrage für die registrierte economics_net_savings-Entity
    des angegebenen SAX-Config-Entry. Leserechte, Entity-Zuordnung und
    Eintragsexistenz werden vor und nach der Recorder-Abfrage geprüft.
    Fehlender Recorder und fehlende Entität werden ausdrücklich gemeldet.
    Die Abfragen verwenden den Recorder-Executor und keine Geräteverbindung.

    Heute, Woche, Monat und Jahr verwenden die nativen HA-Funktionen
    resolve_period und statistic_during_period mit change. Die HA-
    Wochentagseinstellung wird berücksichtigt. Der frei gewählte Anfangstag
    beginnt um lokale Mitternacht, der Endtag ist vollständig eingeschlossen;
    maßgeblich ist die HA-Zeitzone einschließlich Sommerzeit. Der
    Zeitraumwert übernimmt die native statistic-card-Endgrenze, der Graph
    die native Energy-Endgrenze eine Millisekunde vor der folgenden
    Mitternacht sowie die zur Auswahl passende Stunden-/Tages-/Monatsauflösung.
    Die Auflösungsheuristik des gepinnten HA-Frontends wird auf die gewählten
    Kalendertage in der konfigurierten HA-Zeitzone angewandt. Bei abweichender
    Browser-Zeitzone ist die vom nativen HA-Frontend gewählte Auflösung kein
    zusätzlicher Gleichheitsvertrag; die Backend-Zeitgrenzen bleiben HA-lokal.
    Wert und Graph verwenden denselben Sensor und dieselbe Datumsauswahl,
    werden aber jeweils mit den nativen Recorder-Funktionen gelesen.
    Die Kennzahl darf deshalb eine jüngere Fünf-Minuten-Randperiode enthalten,
    die im stündlichen Graphen noch nicht vorliegt; sie wird nicht aus
    Balken summiert. Negative Ergebnisse und signierte Änderungen über
    einen kontrollierten last_reset-Bilanzneustart bleiben erhalten.

    Das Frontend lädt Statistiken beim Öffnen, bei neuer bestätigter
    Datumsauswahl, bei recorder_5min_statistics_generated, nach Reconnect
    und auf ausdrücklichen Aktualisierungswunsch. Es verwirft verspätete
    Antworten einer alten Auswahl, eines früheren Eintrags oder einer
    beendeten Verbindung. Ohne Netto-Ersparnis entfallen die zugehörige
    Detailzeile, Kalenderkennzahlen, Datumsauswahl und Statistikabfragen.
    Fehlende Historie wird nicht durch eine Bilanz aus Live-Sensorwerten
    ersetzt; der Vorlaufbetrag verändert keine Zeitraumstatistik.

    Der Wirtschaftsstatus active erzeugt keinen Hinweis. disabled,
    price_unavailable, origin_unavailable, partial_price_coverage und
    storage_error erhalten den jeweils passenden einzelnen Hinweis;
    fehlende, unbekannte oder nicht verfügbare Statuswerte einen gemeinsamen
    Verfügbarkeitshinweis. Der Chart besitzt Beschriftungen und eine
    tabellarische Alternative; Hinweise zur Datenbasis sind zunächst eingeklappt.
  acceptance_criteria:
    - "frontend/tests/savings.test.ts prüft vollständige Blockreihenfolge,
       Amortisations-/Tarif-Sichtbarkeit, Attribute, alle Statuszweige und Formatierung."
    - "tests/test_dashboard_statistics.py vergleicht beide Auswertungsformen
       direkt mit derselben echten Recorder-Datenbank bei gleichen Grenzen
       und gleicher Auflösung, auch für 23-/25-Stunden-Tage,
       mehrere Kalenderauflösungen, Wochenbeginn und negative Bilanzneustarts."
    - "Zeitraumwert und Graph erfinden weder Nullen noch Vorgeschichte;
       Datenlücken und die nativen unterschiedlichen Randperioden bleiben erkennbar."
    - "Datumsvalidierung, verspätete Antworten, Rechteentzug, Verbindungsabbruch,
       Recorderfehler, Aktualisierung und Unmount sind getestet."
    - "Vue führt keine Lade-, Tarif-, Herkunfts- oder Wirtschaftlichkeits-
       Berechnung und keine entfernten Prognose-/Hochrechnungswerte ein."

# ==============================================================================
# ANFORDERUNG: DASHBOARD-FUNKTIONEN, HA-ANBINDUNG UND AUSLIEFERUNG
# ==============================================================================
requirement_vue_parity:
  id: REQ-VUE-PARITY
  title: "Funktionsmatrix, HA-Anbindung, Browser- und isolierte Paketprüfung (Issue #203)"
  status: done
  description: >
    docs/vue-dashboard-parity.md ordnet alle fünf Vue-Ansichten und deren
    Entitäten, Attribute, Sichtbarkeitsregeln und Statistikfunktionen den
    zugehörigen automatisierten Prüfungen zu. README beschreibt Aktivierung,
    Seitenleisteneintrag, Deaktivierung, Migration und Reparatur; DEVELOPMENT
    beschreibt Architektur, Build und Testausführung. Unterstützter
    HA-Mindeststand und Testumgebung entsprechen requirements_test.txt
    und hacs.json; neuere Versionen werden nicht ungeprüft als getestet bezeichnet.

    Komponenten- und Produktionsmodultests prüfen die reaktive Oberfläche.
    Chromium-Browsertests verwenden das tatsächlich ausgelieferte Bundle
    mit simuliertem HA-Kontext auf Desktop und Smartphone in hellem/deutschem
    sowie dunklem/englischem Design. Sie prüfen alle Tabs, Navigation und
    Zurück, Reload, Bedienung, Fokus, zugängliche Namen, Wertebestätigung,
    Fehler und Reconnect. Screenshots und Fehlertraces werden als CI-Artefakte
    bereitgestellt; Beispieldaten sind als solche gekennzeichnet.

    Ein separater E2E-Test startet die Integration gegen einen lokalen
    Modbus-TCP-Simulator. Zwei echte HA-WebSocket-Clients verwenden die
    Dashboard-Metadaten und regulären HA-Services. Änderungen erscheinen
    in beiden Richtungen im selben HA-Zustand. Das Öffnen des Dashboards
    erzeugt weder zusätzliche Geräteabfragen noch einen zweiten Modbus-Client;
    eine ausdrückliche Aktion wird nicht wiederholt. Legacy-Services und
    Lovelace-Builder stehen nicht mehr zur Verfügung. Setup, Reload, Unload,
    Reconnect und ausgeschaltetes Vue-Panel haben eigene Regressionstests. Zwei getrennte
    HA-Instanzen prüfen außerdem nach regulärer Speicherung und erneutem
    Config-Entry-Laden die Aktivierungsoption und den bestätigten Bundle-Hash.

    scripts/verify_dashboard_package.py installiert ein Stable-Quellarchiv
    oder Snapshot-ZIP in einen frischen temporären Baum. Ein isolierter
    Python-Prozess ohne Repository-Konfiguration prüft die Herkunft aller
    importierten Integrationsmodule sowie die lokale HA-HTTP-Auslieferung
    der Paketdatei gegen ihren Inhalts-Hash. Manifest, DE/EN-Übersetzungen
    und Lizenz sind enthalten. Der native Reparaturmanager prüft einen
    Bundlewechsel und die neue Hash-URL. Dafür sind auf dem Testrechner
    die Python-Testabhängigkeiten, aber weder Node noch ein Frontend-Build
    oder eine Batterie notwendig. Die produktive Integration benötigt
    ebenfalls keinen zusätzlichen Webserver oder ein CDN.

    CI führt Python-, Ruff-/Black-, Frontend-Typ-/Format-, Komponenten-,
    Browser- und Buildprüfungen sowie HACS und hassfest aus. Der Build aus
    dem Lockfile muss den eingecheckten Integrationsassets entsprechen.
    Snapshot-Pakete verwenden die Assets des exakt geprüften Commits.
    Paket-, Browser-, Protokoll- und Hardwareprüfungen werden in der
    Abnahmedokumentation voneinander unterschieden.
  acceptance_criteria:
    - "Die Funktionsmatrix ist vollständig und referenziert vorhandene Tests
       für alle Entity-Schlüssel, Attribute, Sichtbarkeiten und Auswertungen."
    - "Browsertests prüfen 1440x1000 und 390x844 Pixel mit DE/hell und EN/dunkel
       und erzeugen Bilder aller fünf Tabs ohne zweiten Dashboard-Einstieg."
    - "tests/test_vue_dashboard_e2e.py prüft bidirektionale HA-Änderungen
       gegen simuliertes Modbus-TCP ohne zweite Verbindung oder doppelte Aktionen."
    - "tests/test_vue_dashboard_restart.py prüft automatische Einrichtung,
       ignorierte alte Abwahlen und ein im Stillstand aktualisiertes Bundle nach HA-Neustart."
    - "tests/test_frontend_package.py prüft Stable-Quellarchiv- und Snapshot-
       Layout in getrennten HA-Prozessen ohne Rückgriff auf Repository-Module."
    - "Die Abnahme benennt ausgeführte Prüfungen, getesteten Commit/Paket-Hash,
       Screenshots und Grenzen; nicht ausgeführte Hardwaretests bleiben erkennbar."

# ==============================================================================
# ANFORDERUNG: VUE-DASHBOARD ÜBER REPARATUREN AKTUALISIEREN
# ==============================================================================
requirement_vue_dashboard_repair:
  id: REQ-VUE-DASHBOARD-REPAIR
  title: "Eigenständige Vue-Aktualisierung über HA-Reparaturen (Issue #205)"
  status: done
  description: >
    Das aktivierte Vue-Dashboard erhält einen eigenen reparierbaren Hinweis
    unter Einstellungen, System, Reparaturen, wenn sich sein lokales Bundle
    verändert hat oder das Panel nicht registriert werden konnte. Der Stand
    wird anhand des SHA-256-Inhalts-Hashes erkannt, unabhängig von stabilen
    oder Snapshot-Versionen des Manifests. Die Reparatur lädt keine Software
    aus dem Internet, sondern verwendet die aktuell installierten Assets.

    Der bestätigte Stand liegt in vue_dashboard_version, ein ausdrücklich
    abgelehnter Hinweis in vue_dashboard_dismissed_version. Eine erstmalige
    Aktivierung bildet ohne Updateaufforderung die Baseline. Auch die Migration
    einer expliziten alten Abwahl ohne Versionsmarker setzt diese Baseline;
    vorhandene Versionsmarker bleiben erhalten. Bereits aktivierte
    ältere Dashboardstände ohne Versionsmarker erhalten einen neutralen einmaligen
    Hinweis zum Neuladen der Browseransicht; es wird kein unbekannter alter
    Versionsstand behauptet. Reconfigure erhält die Marker. Ablehnen gilt nur
    für den angezeigten Stand und unterdrückt keine späteren Bundle-Updates.
    Registrierungsfehler bleiben von der Bestätigung eines zuvor korrekt
    geladenen Bundles unterscheidbar.

    Nach Bestätigung registriert der Reparaturflow ausschließlich das eigene
    Vue-Panel neu und verwendet die aktuelle Modul-URL mit Inhalts-Hash.
    Fremde Panels auf demselben Pfad werden nicht überschrieben. Da bereits
    geladene Custom Elements im Browser ihre bestehende Implementierung
    behalten, führt der Dialog ausdrücklich durch das notwendige vollständige
    Neuladen der Home-Assistant-Seite. Erst der erfolgreiche Ablauf quittiert
    den angezeigten Stand. Fehler liefern eine verständliche Rückmeldung und
    bleiben erneut reparierbar; ein alter Dialog löscht keinen Hinweis für
    einen inzwischen neueren Bundle-Stand.

    Deaktivierte oder entfernte Config Entries werden nicht wieder aktiviert;
    die Deaktivierung der Integration entfernt den zugehörigen Hinweis. Die
    Reparatur verändert keine gespeicherten HA-Dashboards oder Karten.
    Weder Prüfung, Quittierung noch Reparatur lösen Modbus-Schreibvorgänge, Planner-Neustarts
    oder eine neue Tarifrevision aus. Fehler der Oberfläche dürfen
    den Betrieb der Batterieintegration nicht blockieren.
  acceptance_criteria:
    - "Bundlewechsel bei gleicher Manifest-Version erzeugt einen Hinweis;
       neue Aktivierung, Legacy-Stand und persistierte Bestätigung sind getestet."
    - "Bestätigen registriert die aktuelle Hash-URL und erläutert Browser-
       Neuladen; Registrierungsfehler werden nicht als Erfolg abgeschlossen."
    - "Ablehnen gilt nur für den jeweiligen Stand; ein älterer offener
       Reparaturdialog quittiert oder löscht keinen neueren Hinweis."
    - "Deaktivierung, Entry-Entfernung, fremder Panelpfad und gleichzeitige
       Änderungen während asynchroner Registrierung sind abgedeckt."
    - "Versionsmarker überstehen Reconfigure und verändern keine
       Geräte-Steuerung oder gespeicherte HA-Dashboards."

# ==============================================================================
# ANFORDERUNG: MITGELIEFERTES DASHBOARD
# ==============================================================================
requirement_bundled_dashboard:
  id: REQ-BUNDLED-DASHBOARD
  title: "Lovelace-Dashboard abgelöst durch Dashboard SAX Power"
  status: superseded
  description: >
    Die Implementierung und Anforderungen an das generierte Lovelace-
    Storage-Dashboard sind abgelöst. Das einzige mitgelieferte Dashboard
    ist in REQ-VUE-DASHBOARD beschrieben; seine Ansichten stehen in
