       unbegrenzt bestehen) bei fehlendem smartmeter_power."
    - "tests/test_coordinator.py deckt zusätzlich die PV-Überschuss-Prüfung
       ab: kein Start des zeitgesteuerten Ladens im Zeitfenster bei
       smartmeter_power über SMARTMETER_PV_SURPLUS_THRESHOLD_WATT, aktives
       Beenden einer bereits laufenden Netzladung, sobald der Schwellwert
       über PV_SURPLUS_HYSTERESIS_CYCLES aufeinanderfolgende Zyklen mitten
       im Zeitfenster überschritten wird (ein einzelner Zyklus reicht noch
