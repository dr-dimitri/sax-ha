# ==============================================================================
# ANFORDERUNG: ENTLADEPROGNOSE
# ==============================================================================
requirement_discharge_forecast:
  id: REQ-DISCHARGE-FORECAST
  title: "Voraussichtlichen Entladezeitpunkt aus gleitender Entladeleistung schätzen"
  status: done
  description: >
    Der Sensor discharge_forecast (Voraussichtlich entladen um) zeigt als
    zeitzonenbehafteten Timestamp den geschätzten Zeitpunkt des Erreichens der
    Geräte-SOC-Untergrenze. Die Restzeit ist battery_capacity in Wh mal
    max(battery_soc - battery_soc_min, 0) / 100, geteilt durch die mittlere
    Entladeleistung in W. Sie wird in Stunden zum aktuellen Zeitpunkt addiert.
    Der Verlauf beginnt mit einer positiven Speicherleistung und umfasst
    mindestens 60 Sekunden und höchstens die letzten 3600 Sekunden. Die positive
    Speicherleistung wird zeitgewichtet mit dem vorherigen Messwert integriert;
    ein angeschnittenes Intervall an der Fenstergrenze wird anteilig gewertet.
    Leerlauf und kurze Ladungen zählen mit 0 W Entladeleistung zur Fensterdauer.
    Die Attribute observation_minutes, average_discharge_w und observed_at
    liefern die tatsächlich verwendete Beobachtungsdauer, mittlere
    Entladeleistung und den Zeitpunkt der letzten ausgewerteten Messung.
    REQ-BRIDGE-CHARGE verwendet dieselbe Messgrundlage für die Ladeplanung.
  acceptance_criteria:
    - "Vor 60 Sekunden Messverlauf und bei mittlerer Entladeleistung 0 W ist der Sensor unbekannt."
    - "60 Sekunden durchgehend negative Speicherleistung löschen Verlauf und Prognose; kürzere Ladeimpulse nicht."
    - "Nach bestätigtem Laden beginnt erst eine neue positive Speicherleistung einen neuen Verlauf."
    - "Nur neue, gültige HIGH-Messungen zählen; Cache-Refreshs verschieben den Zeitpunkt nicht."
    - "Die Attribute gehören zur veröffentlichten Prognose; Cache-Refreshs erneuern observed_at nicht. Bei verworfener Prognose werden auch ihre Metadaten verworfen."
    - "Neustarts, Basic-/SunSpec-Ausfälle, veraltete Messwerte, Messlücken über zwei HIGH-Intervalle und ungültige Eingaben verwerfen den Verlauf."
    - "Kapazität muss positiv und endlich sein, beide SOC-Werte müssen endlich und zwischen 0 und 100 liegen; fehlende Werte werden nicht geschätzt."
    - "Bei gültiger Prognose und erreichtem Minimal-SOC ist der Entladezeitpunkt jetzt. Nicht darstellbare Zeitpunkte bleiben unbekannt."
    - "Die Berechnung verwendet vorhandene Messwerte und löst keine zusätzlichen Modbus-Abfragen oder Schreibzugriffe aus."

# ==============================================================================
# ANFORDERUNG: VERBRAUCHSABHÄNGIGE NETZLADUNG BIS PV-START
# ==============================================================================
requirement_bridge_charge:
  id: REQ-BRIDGE-CHARGE
  title: "Niedertarifladung anhand des Verbrauchs bis zum erwarteten PV-Start planen"
  status: done
  description: >
    Die optionale Betriebsart bridge_charge_enabled plant im zeitvariablen
    Tarif den fehlenden Speicherbedarf bis zum erwarteten PV-Start aus der
    Entladeprognose nach REQ-DISCHARGE-FORECAST. Der vorhandene Hauptschalter
    timed_charge_enabled und die aktiven Monate bleiben erforderlich.
    Im Dashboard ist bridge_charge_enabled direkt in der Karte Ladeplanung
    ein- und ausschaltbar. Switch-Entity und Optionsdialog verwenden dieselbe
    persistierte Config-Entry-Option ohne separaten Restore-Zustand. Einschalten
    erfordert TIME_OF_USE und eine ausgewählte PV-Prognosequelle; andernfalls
    meldet die Oberfläche die fehlende Konfiguration ohne Änderung. Ausschalten
    bleibt auch bei fehlenden Quellen oder Geräteausfall möglich und wechselt
    zur festen SOC-Steuerung. Der Hauptschalter wird dadurch nicht verändert.
    Änderungen aus dem Optionsdialog aktualisieren auch den Dashboard-Schalter.
    Auch Tarifänderungen im Dashboard erhalten diese Voraussetzung (Issue #244):
    Eine eingeschaltete verbrauchsbasierte Ladeplanung darf ihre PV-Start-Quelle
    nicht verlieren. Das gilt unabhängig vom Netzladehauptschalter sowie beim
    Wiederherstellen eines inaktiven Profils. Quellenwechsel bleibt zulässig;
    zum Entfernen muss die Ladeplanung ausdrücklich ausgeschaltet sein. Ein
    vorübergehend unverfügbarer, weiterhin ausgewählter Sensor ist keine
    fehlende Konfiguration.
    Die Einstellung timed_charge_min_soc wird durch den berechneten Bedarf
    ersetzt. Netzladen Max. SOC und die globale Max-SOC-Grenze begrenzen
    weiterhin das Ziel. Ohne Bedarf findet keine geplante Netzladung statt.

    domain/bridge_charge.py erhält ausschließlich Daten und ausdrücklich
    erlaubte Ladeintervalle. Die Berechnung kennt weder Home Assistant noch
    eine konkrete Tarifquelle. Sie berücksichtigt nutzbare Energie oberhalb
    der Geräte-SOC-Untergrenze, den zeitgewichteten Entladedurchschnitt aus
    mindestens einer und maximal 60 Minuten, die Geräte-Ladeleistung und den
    Verbrauch bis PV-Start. Während Netzladung wird der Hausverbrauch direkt
    vom Netz gedeckt; dies verringert ebenfalls den Überbrückungsbedarf.
    Ein Auftrag ist zusammenhängend und endet innerhalb eines erlaubten
    Intervalls spätestens zum PV-Start. Ausreichende Kandidaten werden nach
    Preis und anschließend spätestem Start ausgewählt. Reicht kein Kandidat,
    ist ein begrenzter Teilauftrag mit größtmöglicher Bedarfsdeckung zulässig;
    die verbleibende Energiemenge wird ausdrücklich als Fehlbetrag angegeben.

    Die erlaubten Intervalle stammen ausschließlich aus den Tarifpreisfenstern
    des gespeicherten TIME_OF_USE-Tarifs nach REQ-TIME-OF-USE-CHARGE-SOURCE.
    Es gelten nur dessen billigste
    tatsächlich vorkommende Preisstufen einschließlich des Basispreises.
    Ein teureres verbleibendes Fenster ersetzt keinen verpassten Niedertarif.
    Das separate Netzladezeitfenster beeinflusst diese Planung nicht.
    application/bridge_inputs.py adaptiert die lokalen Tarifabschnitte unter
    Beachtung der aktiven Monate auf UTC-Intervalle.

    PV-Quelle ist der bereits ausgewählte CONF_PV_FORECAST_SENSOR aus der
    Integration pv_forecast. Die separate Heute-Quelle der netzdienlichen
    Ladepause bleibt davon unabhängig; beide Auswahlen werden beim Speichern
    und erneuten Öffnen der Optionen erhalten. Der Konfigurationseintrag der
    PV-Anlage wird über die Entity Registry zugeordnet.
    Der Service pv_forecast.get_forecast liefert
    die validierte Gesamtanlagen-Zeitreihe in 15-Minuten-Intervallen mit
    mean_ac_power_kw. Als PV-Start gilt der Beginn von mindestens zwei
    aufeinanderfolgenden Intervallen, deren mittlere PV-Leistung den
    Entladedurchschnitt erreicht oder überschreitet. Damit wird für
    mindestens 30 Minuten Verbrauchsdeckung erwartet. Serviceergebnisse
    werden 60 Sekunden zwischengespeichert. Manuelle PV-Uhrzeiten,
    zusätzliche Startsensoren und die Tagesenergiemenge ersetzen diese
    Zeitreihe nicht.

    application/bridge_session.py hält die begrenzte Ausführung. Nach einem
    bestätigten Start bleibt deren Verbrauchsbasis erhalten, obwohl der
    Entladeprognose-Sensor nach einer Minute Ladung zurückgesetzt wird.
    Der Auftrag endet bei erreichtem SOC-Ziel oder festem Endzeitpunkt.
    Anschließend darf der Speicher wieder normal entladen. Die klassische
    fenstergebundene Entladesperre nach zeitgesteuerter Netzladung wird in
    dieser Betriebsart nicht aufgebaut. Eine Neuplanung erfordert mindestens
    eine Minute nach Ladeende und erneut gültige Verbrauchsmesswerte. Ein
    Auftrag wird nicht persistiert; nach einem Neustart werden neue
    Messungen benötigt. Konfigurationsänderungen verwerfen den gebundenen
    Auftrag. Manuelle Ladung, PV-Überschuss und globale Schutzgrenzen bleiben
    wirksam. Bei fälliger Zellkalibrierung steigen effective_max_soc und
    effective_timed_charge_max_soc auf 100 %. Dies erweitert nur die
    wirksamen Obergrenzen; Bedarf und erlaubte Tarifpreisfenster bestimmen
    weiterhin den Auftrag bis PV-Start. Es erfolgt kein Rückfall auf
    separates Netzladezeitfenster oder Min-SOC und keine zusätzliche
    ungeplante Netzladung bis 100 %. PV oder ein ausreichend hoher
    Überbrückungsbedarf können 100 % erreichen. Außerhalb dieser Betriebsart
    bleibt die Kalibrierungssteuerung nach REQ-PERIODIC-FULL-CALIBRATION
    unverändert.

    Der Sensor bridge_charge_plan (Ladeplanung bis PV-Start) trägt einen
    kurzen Enum-Zustand und stellt die Meldungsbestandteile als Attribute
    bereit: observation_minutes, average_discharge_w, discharge_at,
    charge_start, charge_end, pv_start, target_soc, shortfall_kwh und reason.
    Seine Zustände sind off, waiting_for_data, planned, charging, not_needed,
    insufficient, paused und complete. ChargePlan.vue stellt im
    zeitvariablen Tab daraus eine verständliche Meldung mit Verbrauchsbasis,
    erwartetem Entladezeitpunkt, Niedertarif-Ladestart, Ladeende und PV-Start
    zusammen. Kein Ladebedarf, fehlende Eingangsdaten, Pause und ein
    verbleibender Fehlbetrag werden ausdrücklich benannt. Die bestehenden
    Strategien und Schreibpfade des dynamischen Tarifs werden nicht durch
    diese Betriebsart ersetzt; die reine Planung ist für deren spätere
    Verwendung wiederverwendbar.
  acceptance_criteria:
    - "Dashboard-Schalter und Optionsdialog teilen bridge_charge_enabled; Aktivierung benötigt Tarif und PV-Quelle, Ausschalten bleibt möglich. Bestätigte Zustände, Fehler und fehlende Schreibrechte werden im Dashboard angezeigt."
    - "Ohne aktivierte Option oder eingeschaltete zeitvariable Netzladung erfolgt keine verbrauchsbasierte Netzladung. Aktive Monate begrenzen die erlaubten Intervalle."
    - "Ohne gültigen zukünftigen PV-Start, frische Batteriewerte oder mindestens eine Minute gültige Entladebeobachtung wird kein neuer Auftrag freigegeben. Fehlende Werte werden nicht geschätzt."
    - "Niedertarifintervalle stammen nur aus einem gültigen TIME_OF_USE-Tarif. Änderungen am separaten Netzladezeitfenster verändern keinen verbrauchsabhängigen Plan."
    - "PV-Start erfordert zwei lückenlos folgende 15-Minuten-Intervalle der Gesamtanlagen-Prognose mit ausreichender mittlerer Leistung. Tagesenergiesummen und fremde Sensorquellen sind kein Ersatz."
    - "Reicht die Batterie bis PV-Start, lautet der Status not_needed und es gibt keinen Ladeauftrag."
    - "Geplante Start-/Endzeiten liegen innerhalb der gelieferten Erlaubnisintervalle. Ein Ziel überschreitet weder das Netzladeziel noch die wirksame globale SOC-Grenze."
    - "Ein nicht vollständig deckbarer Bedarf bleibt als shortfall_kwh sichtbar, auch wenn eine Teilaufladung bereits läuft."
    - "Während des gestarteten Auftrags beendet der normale Entladeprognose-Reset allein nicht die Ladung. Der feste Endzeitpunkt und das SOC-Ziel bleiben verbindlich."
    - "Nach Auftragsende wird keine fenstergebundene Entladesperre aus dem klassischen zeitgesteuerten Laden aufgebaut."
    - "Bei Kalibrierungsfälligkeit gelten wirksame SOC-Obergrenzen von 100 %, aber weiterhin ausschließlich der Bedarf bis PV-Start und die Tarifpreisfenster. Separates Netzladezeitfenster und Min-SOC werden nicht verwendet; eine zusätzliche ungeplante Vollladung ist ausgeschlossen."
    - "Manuelle Ladung, PV-Überschuss und ungültige Messwerte dürfen keinen konkurrierenden Auftrag erzeugen."
    - "Neustart oder geänderte auftragsrelevante Konfiguration übernimmt keinen alten Auftrag ungeprüft."
    - "Die Anzeige verwendet HA-Metadaten und Sensorattribute, berücksichtigt Sprache und HA-Zeitzone und löst keine Serviceaufrufe aus."

# ==============================================================================
# ANFORDERUNG: ALLE MODBUS-REGISTER LESBAR
# ==============================================================================
requirement_all_registers_readable:
  id: REQ-ALL-REGISTERS-READABLE
  title: "Alle Modbus-Register lesbar über Home Assistant + berechnete Phasensummen"
  status: done
  description: >
    Sämtliche in modbus_llm.yaml/modbus.pdf dokumentierten Register sind
    als Home Assistant Entity abrufbar: Basic Mode (Slave-ID 64) über
    sensor.py/number.py/switch.py, SunSpec-Modus (Slave-ID 100) über
    sensor.py (~56 Sensoren, beschreibungsbasiert). Register, die bereits
    über eine NumberEntity/SwitchEntity weg-/rücklesbar sind, gelten als
    "lesbar" und benötigen keinen zusätzlichen Sensor.
  requirements:
    - "Jedes Sensor-Feld hat einen deutschen, fachlich verständlichen
       Namen (keine reinen Registernummern oder unübersetzten
       SunSpec-Rohbezeichnungen als Anzeigename)."
    - "SunSpec-Skalierungsfaktor-Register (sunssf) werden auf die
       zugehörigen Messwerte angewendet und zusätzlich selbst als
       Diagnose-Sensor (entity_category: diagnostic) exponiert."
    - "Für Registergruppen mit L1/L2/L3-Aufteilung existiert je nach
       Verfügbarkeit ein herstellerseitiger oder berechneter
       Summen-Sensor."
  acceptance_criteria:
    - "Alle dokumentierten Register sind nach dem Setup als sensor.*-Entity
       sichtbar und liefern einen Wert (SunSpec-Modus vorausgesetzt
       erreichbar, siehe REQ-EXTENDED-MODE-RESILIENCE)."
    - "README.md beschreibt die Sensoren gruppiert nach Basic Mode und
       SunSpec-Modus."

# ==============================================================================
# ANFORDERUNG: IP-ADRESSE ÜBER DIE OBERFLÄCHE ÄNDERBAR
# ==============================================================================
requirement_ip_configurable_ui:
  id: REQ-IP-CONFIGURABLE-UI
  title: "IP-Adresse des SAX Speichers über die Home-Assistant-Oberfläche eintragbar, persistiert und jederzeit änderbar"
  status: done
  description: >
    Der Config Flow (config_flow.py) unterstützt sowohl die Ersteinrichtung
    (async_step_user) als auch einen Reconfigure-Flow
    (async_step_reconfigure), erreichbar über
    "Einstellungen -> Geräte & Dienste -> SAX Power Home -> ⋮ -> Neu
    konfigurieren". Das Formular ist mit den aktuell gespeicherten Werten
    vorbelegt. Die neue Verbindung wird vor dem Speichern geprüft
    (derselbe Testread wie bei der Ersteinrichtung); bei Erfolg werden die
    Werte persistiert (entry.data) und die Integration lädt automatisch mit
    den neuen Daten neu. Eine Kollisionsprüfung verhindert Duplikate mit
    einem anderen bereits konfigurierten Speicher, ohne beim unveränderten
    Speichern der eigenen IP fälschlich abzubrechen.

    Die Integration unterstützt derzeit höchstens einen SAX-Speicher pro
    Home-Assistant-Installation. Sobald ein Speicher eingerichtet ist, bricht
    eine weitere Ersteinrichtung bereits vor Anzeige des Verbindungsformulars
    und vor jedem Modbus-Zugriff mit "single_instance_allowed" ab,
    unabhängig von Host, Port und unique_id. Die Meldung erklärt die
    Begrenzung und verweist für Verbindungsänderungen auf "Neu konfigurieren".
    Ignorierte Discovery-Merker zählen nicht als eingerichteter Speicher;
    deaktivierte oder fehlerhaft geladene Config Entries zählen weiterhin.
    Auch die späteren Onboarding-Schritte prüfen vor dem Fortsetzen erneut,
    ob inzwischen ein anderer Flow einen Eintrag angelegt hat. Reconfigure
    und Options bestehender Einträge bleiben möglich. Bereits gespeicherte
    Mehrfacheinträge werden weder gelöscht noch migriert. Das mitgelieferte
    Dashboard bleibt unter "sax-power-vue" erreichbar (REQ-VUE-DASHBOARD).
  requirements:
    - "Reconfigure-Formular verwendet dieselben Felder wie die
       Ersteinrichtung (IP-Adresse, Port, Slave-IDs, Intervall)."
    - "Fehlermeldungen unterscheiden TCP-Verbindungsfehler
       ('cannot_connect') von einer Modbus-Fehlerantwort bei bestehender
       Verbindung ('invalid_response', z. B. falsche Slave-ID)."
    - "Port (1–65535) und Modbus-TCP-Slave-IDs (0–255) werden bereits im
       Formular begrenzt. Der Testread muss einen ganzzahligen SOC von
       0 bis 100 liefern; leere oder fachlich ungültige Antworten melden
       invalid_response und ändern keine gespeicherte Verbindung."
    - "user, grid_charge und finish verhindern zusätzliche
       Config Entries auch bei parallel begonnenen Einrichtungs-Flows;
       vor dem Anlegen des Eintrags wird die Begrenzung erneut geprüft."
    - "Der Abbruch single_instance_allowed enthält in allen angebotenen
       Sprachen den Hinweis auf maximal einen Speicher und Neu konfigurieren."
  acceptance_criteria:
    - "tests/test_config_flow.py deckt sowohl erfolgreiche IP-Änderung
       (inkl. Persistierung + Neuladen) als auch fehlgeschlagene
       Validierung (Daten bleiben unverändert) ab; Reconfigure und Options
       bleiben bei vorhandenem Eintrag erreichbar."
    - "tests/test_config_flow.py prüft den frühzeitigen Abbruch einer
       zweiten manuellen Einrichtung für gleiche und abweichende Hosts/Ports
       sowie MAC- und host:port-IDs, ohne Verbindungsvalidierung oder
       Änderung des vorhandenen Eintrags."
    - "tests/test_config_flow_single_entry.py deckt konkurrierende
       Einrichtungs-Flows in den späteren Onboarding-Schritten ab: Es
       entsteht höchstens ein Config Entry."
    - "tests/test_config_flow_single_entry.py prüft, dass ignorierte
       Discovery-Merker die Einrichtung erlauben und deaktivierte oder
       fehlerhaft geladene Einträge einen weiteren Speicher verhindern."
    - "README.md beschreibt, wie die IP-Adresse nachträglich geändert
       wird."

# ==============================================================================
# ANFORDERUNG: SUNSPEC-MODUS OPTIONAL (KEIN TOTALAUSFALL BEI NICHTVERFÜGBARKEIT)
# ==============================================================================
requirement_extended_mode_resilience:
  id: REQ-EXTENDED-MODE-RESILIENCE
  title: "Nicht erreichbarer SunSpec-Modus-Block darf nicht alle Sensoren lahmlegen"
  status: done
  description: >
    Basic Mode (Slave-ID 64) und SunSpec-Modus (Slave-ID 100) werden im
    Coordinator entkoppelt gelesen (SaxPowerCoordinator._async_read_extended):
      - Scheitert der Basic-Mode-Read: UpdateFailed, da Basic Mode die
        Mindestanforderung für jede Funktion der Integration ist.
      - Scheitert der SunSpec-Modus-Read: Das Update schlägt NICHT fehl;
        die betroffenen Sensoren zeigen "unbekannt", Basic-Mode-Daten
        bleiben unverändert verfügbar. Bei Wiederherstellung werden die
        SunSpec-Sensoren automatisch wieder befüllt.
      - Unvollständige Registerblöcke gelten ebenfalls als Read-Fehler.
        Ein Basic-Block mit ungültigem SOC wird abgelehnt und entzieht die
        SOC-Freigabe wie ein Verbindungsfehler. Ein unvollständiger
        SunSpec-HIGH-Block lässt die Basic-Daten verfügbar; fehlgeschlagene
        LOW-Decodierungen bewahren den zuletzt gültigen LOW-Cache.
      - Zustandswechsel (verfügbar -> nicht verfügbar -> wieder verfügbar)
        werden geloggt und zusätzlich als Home-Assistant-Repair-Issue
        (extended_mode_unavailable) angezeigt.
      - Ein Sollwert von exakt 0 W bleibt ohne gültigen SunSpec-Referenzwert
        oder Skalierungsfaktor als Rohwert 0 schreibbar. Max-SOC-Sperre,
        Neutralpreis-Pause und netzdienliche Ladepause können damit weiterhin
        gehalten werden, solange die Schreibzugriffe quittiert werden.
        Die Leistungsmessung zur Bestätigung des netzdienlichen Ladens
        bleibt erforderlich.
      - Ein HomeAssistantError beim Anwenden der Ladeentscheidung im
        Poll-Tick verwirft keinen erfolgreich gelesenen Messdatensatz:
        Messwerte, aktueller Ladestatus und Selbstdiagnose werden weiterhin
        veröffentlicht, last_update_success bleibt wahr. Der nächste Poll
        versucht die Steuerung erneut. Bereits gemeldete Fehler der
        Sollwertsequenz erzeugen keine zweite Fehlermeldung; andere
        Steuerfehler werden kompakt ohne Traceback geloggt. Diese
        Fehlerbehandlung gilt ausschließlich für den Poll-Pfad; Services
        und Entity-Setter geben Fehler weiterhin an den Aufrufer zurück
        (REQ-MANUAL-GRID-CHARGE / REQ-TIMED-SOC-CHARGE).
  acceptance_criteria:
    - "Live-Test gegen einen simulierten Modbus-Server ohne SunSpec-Modus-
       Gerät zeigt: Config Entry lädt erfolgreich, Basic-Mode-Sensoren
       liefern echte Werte, SunSpec-Sensoren existieren als Entity mit
       Zustand 'unbekannt' (tests/test_integration_live.py)."
    - "Unit-Tests decken sowohl den Übergang verfügbar -> nicht verfügbar
       als auch die Wiederherstellung ab (tests/test_coordinator.py)."
    - "tests/test_charge_soc_availability.py deckt Basic-Ausfall während
       aller Netzladearten, sichere Rücksetzung und Wiederanlauf mit neuem
       SOC sowie Timer-/Service-Aufrufe ohne gültigen SOC ab. Steuerupdates
       dürfen einen fehlgeschlagenen Read nicht als erfolgreich markieren."
    - "Unvollständige Basic-/SunSpec-Blöcke und SOC außerhalb 0–100 werden
       als erwartete Read-Fehler behandelt; nach vollständigen Antworten
       erholt sich die Integration automatisch."
    - "tests/test_control_write_resilience.py prüft fehlgeschlagene Mode-
       und Sollwert-Writes während des Polls: frischer SOC und Ladestatus
       bleiben verfügbar, die Selbstdiagnose läuft, Folgepolls wiederholen
       die Entscheidung und melden nach erfolgreicher Quittung die aktive
       Max-SOC-Sperre. Pro fehlgeschlagener Sequenz gibt es genau eine
       Fehlermeldung ohne Traceback. Vorvalidierungsfehler bleiben ebenfalls
       sichtbar, Basic-Read-Fehler bleiben UpdateFailed und explizite
       Service-/Entity-Aufrufe reichen HomeAssistantError weiter."

# ==============================================================================
# ANFORDERUNG: TESTS GEGEN ECHTE SAX-HARDWARE
# ==============================================================================
requirement_real_hardware_tests:
  id: REQ-REAL-HARDWARE-TESTS
  title: "Testfälle lesen echte Werte von einem physischen SAX Speicher"
  status: done
  description: >
    tests/test_real_hardware.py liest Werte von einem echten SAX Power
    Home (Plus) im lokalen Netz - rein lesend, kein Schreibzugriff. Die
    Verbindungsdaten stehen in tests/real_device.yaml (Host, Port, beide
    Slave-IDs, Verbindungs-Timeout). Ist dort keine IP hinterlegt
    (Auslieferungszustand: host: null) oder der Speicher nicht erreichbar,
    werden die betroffenen Tests automatisch übersprungen (pytest.skip).
  requirements:
    - "Gelesene Basic-Mode-Werte (SOC, Leistung) werden auf plausible
       Wertebereiche geprüft statt auf feste erwartete Werte."
    - "Ist der SunSpec-Modus auf dem realen Gerät nicht erreichbar, wird
       der entsprechende Testfall übersprungen statt fehlzuschlagen
       (konsistent mit REQ-EXTENDED-MODE-RESILIENCE)."
  acceptance_criteria:
    - "pytest läuft ohne hinterlegte IP vollständig durch (betroffene
       Tests werden übersprungen, keine Fehler)."
    - "DEVELOPMENT.md (Abschnitt 'Test gegen echte Hardware') beschreibt
       tests/real_device.yaml und wie der Live-Hardware-Test aktiviert
       wird - als Entwickler-, nicht als Benutzerdokumentation."

# ==============================================================================
# ANFORDERUNG: SUNSPEC-MODUS-REGISTERKARTE (SLAVE-ID 100)
# ==============================================================================
requirement_sunspec_mode_correction:
  id: REQ-SUNSPEC-MODE-CORRECTION
  title: "SunSpec-Modus-Registerkarte (Slave-ID 100) als alleinige Quelle für Speicher-/Netz-/Akkudetails"
  status: done
  description: >
    Der SunSpec-Modus liegt auf Slave-ID 100 mit Adress-Offset -40000
    (Register 40000-40114, siehe modbus.pdf und modbus_llm.yaml) und
    enthält einen zusammenhängenden Block aus fünf SunSpec-Modellen:
    Common (Geräteidentität), "3Ph Inverter" (103, Speicherelektronik),
    "Immediate Controls" (123, Sollwertvorgabe - Register 40049/40051
    zusätzlich als Schreibpfad für zeitgesteuertes Laden, siehe
    REQ-TIMED-SOC-CHARGE), "WYE Connect 3Ph Meter" (203, Netz/Smart Meter)
    und "Battery Base" (802, Akkuzellen).

    Entlade-/Ladeleistung (discharge_power/charge_power) sowie die
    kombinierte Lade-/Entladeleistung (charge_discharge_power) werden aus
    Register 40029 ("Wirkleistung Speicher Summe") abgeleitet. Die beiden
    getrennten Sensoren zeigen jeweils einen nichtnegativen Betrag und 0 W
    für die Gegenrichtung; der kombinierte Sensor erhält das Vorzeichen des
    Registers (positiv = Entladen, negativ = Laden). Die Smart-Meter-Leistung
    stammt aus Register 40072 ("Summenwirkleistung Netz"). Die Basic-Mode-
    Register 47 ("Leistung P des Speichers") und 48 ("Leistung des Smart
    Meters") werden nicht mehr gelesen.

    Vorzeichenkonvention von data["smartmeter_power"] (Standarddarstellung,
    nicht offiziell in modbus.pdf dokumentiert): NEGATIV = Einspeisung ins
    Netz (PV-Überschuss), POSITIV = Netzbezug. Das Rohregister selbst meldet
    das umgekehrte Vorzeichen (positiv bei Einspeisung) -
    domain.sunspec.decode_high_block negiert deshalb den skalierten Wert
    (ScaledField.negate) vor der Ablage in data["smartmeter_power"]; der Sensor "Netzleistung"
    (sensor.py) bleibt dabei ein reiner Durchreicher (_direct) und zeigt
    damit direkt den bereits negierten Wert. Alle Vergleiche gegen
    SMARTMETER_PV_SURPLUS_THRESHOLD_WATT (const.py) - PV-Überschuss-Prüfung
    und Netzbezug-Freigabe-Trigger der Max-SOC-Sperre in REQ-TIMED-SOC-
    CHARGE, Schritt b der Zustandsmaschine in REQ-GRID-SERVING-CHARGE sowie
    die Neutralpreis-Pausezone in REQ-DYNAMIC-PRICE-CHARGE - sind an diese
    Konvention angepasst.

    Dieselbe Negation gilt für die drei Phasenwerte data["grid_power_active_
    l1"/"_l2"/"_l3"] (Register 40073-40075, "Netzleistung L1/L2/L3") - sie
    teilen sich denselben Registerblock und damit dasselbe rohe Vorzeichen
    wie Register 40072, ihre Summe muss weiterhin data["smartmeter_power"]
    entsprechen. data["storage_power_active"] (Register 40029, anderes
    SunSpec-Modell "3Ph Inverter") ist davon unabhängig und folgt einer
    eigenen, unverändert gebliebenen Konvention (positiv = Entladung,
    negativ = Laden, siehe README.md "Bekannte Einschränkungen") -
    storage_power_apparent/storage_power_reactive sowie grid_power_apparent_
    sum/grid_power_reactive_sum (Schein-/Blindleistung) wurden ebenfalls
    nicht angefasst, da ihr Vorzeichen eine andere physikalische Bedeutung
    hat (kapazitiv/induktiv statt Einspeisung/Bezug) und nicht Teil dieser
    Betrachtung war.

    Die "Immediate Controls"-Werte bleiben zusätzlich als
    Nur-Lese-Diagnosesensoren verfügbar (ic_power_setpoint_pct,
    ic_timeout, ic_control_mode_text, ic_max_power_reference) - diese
    Sensoren zeigen den tatsächlichen Geräte-Zustand, unabhängig davon,
    ob er gerade von der Integration selbst gesetzt wurde.

    Der Basic-Mode-P-Sollwert (Register 41, Slave 64, absoluter
    Watt-Sollwert) wird nur noch gelesen und nicht mehr beschrieben. Auch
    start_grid_charge/stop_grid_charge verwendet den zentral arbitrierten
    SunSpec-Schreibpfad, siehe REQ-MANUAL-GRID-CHARGE.

    PV-Leistung (Register 40045) und das komplette Meter-Modell 203 sind
    laut modbus.pdf nur mit dem Smartmeter ADW200 vollständig verfügbar.
    Mit einem ADL400 sind die Netz-Register (Ströme, Spannungen,
    Leistungen) dennoch plausibel befüllt; nur PV-Leistung bleibt
    durchgehend 0.
  acceptance_criteria:
    - "modbus_llm.yaml dokumentiert den SunSpec-Modus-Block korrekt
       (Slave-ID 100, Offset -40000) und markiert die nicht mehr
       genutzten Basic-Mode-Register 47/48 als DEPRECATED."
    - "tests/test_coordinator.py, tests/test_integration_live.py und
       tests/test_real_hardware.py laufen gegen Slave-ID 100."
    - "tests/test_sensor_descriptions.py prüft für charge_discharge_power
       positive Entlade-, negative Lade-, Null- und unbekannte Werte."
    - "README.md und die Sensortabellen verwenden die aktuellen
       Sensor-Keys."
    - "tests/test_coordinator.py deckt die Vorzeichenkonvention von
       data[\"smartmeter_power\"] ab: ein positiver Rohregisterwert (via
       apply_typed_sunssf) ergibt einen negativen data-Wert (Einspeisung) und
       umgekehrt. tests/test_integration_live.py verifiziert denselben
       negierten Wert end-to-end am Sensorzustand."

# ==============================================================================
# ANFORDERUNG: SUNSPEC-DATENTYPEN UND NOT-IMPLEMENTED-SENTINELS
# ==============================================================================
requirement_sunspec_datatypes:
  id: REQ-SUNSPEC-DATATYPES
  title: "SunSpec-Datentypen (int16/uint16/enum16/bitfield16/sunssf) und ihre Not-Implemented-Sentinels korrekt decodieren"
  status: done
  description: >
    domain/registers.py::apply_sunssf() (ersetzt durch apply_typed_sunssf())
    wandelte früher JEDEN Rohwert pauschal mit to_signed16() um, obwohl
    modbus_llm.yaml pro Register einen eigenen Datentyp dokumentiert
    (uint16, int16, sunssf - alle als 16-Bit-Register, siehe SunSpec Device
    Information Model Specification V1.1, Abschnitt 6.4). Ein unsigniertes
    0x8001 wurde dadurch fälschlich zu -32767, ein 0xFFFF ("not
    implemented" bei unsignierten/enum-/bitfield-Typen) zu -1 statt zu
    "kein Messwert", und ein "not implemented"-Scale-Factor (0x8000 bei
    int16/sunssf) erzeugte über eine extreme Zehnerpotenz einen scheinbar
    plausiblen, aber falschen Wert nahe 0 statt eines erkennbar fehlenden
    Werts.

    domain/registers.py stellt jetzt reine, typisierte Decoder bereit:
    decode_int16 (Sentinel 0x8000 -> None), decode_uint16 (auch für
    enum16/bitfield16, Sentinel 0xFFFF -> None), decode_sunssf (int16 mit
    zusätzlicher Bereichsprüfung -10..+10 einschließlich der Grenzen;
    Sentinel und jeder Exponent außerhalb liefern None), decode_bool16
    (0/1 als uint16, jeder andere Wert inkl. Sentinel -> None statt
    fälschlich True) sowie apply_typed_sunssf(raw_value, raw_scale_factor,
    *, signed=True), das Wert und Skalierungsfaktor VOR der Skalierung
    getrennt decodiert und bei jedem Sentinel oder ungültigen Exponenten
    None statt eines berechneten Werts liefert. SUNSSF_MIN/SUNSSF_MAX
    definieren den Bereich zentral; auch Sollwertschreiben und die
    SOC-Auflösung der Geldbilanz verwenden decode_sunssf. Damit gelangen
    weder extreme Zehnerpotenzen noch zu Null gerundete Unterläufe aus
    ungültigen Exponenten in Sensorwerte, Energie- oder Geldzähler (Issue
    #194). Gültige Skalierungen und deren Rundung bleiben unverändert.

    decode_high_block liefert ungültige Faktoren mit ihrer Registeradresse
    als Diagnosedaten zurück, einschließlich der zwischengespeicherten
    LOW2-Faktoren. Der Coordinator warnt pro betroffenem Register einmal
    während seiner Laufzeit mit Protokolladresse, Slave-ID und Exponent;
    der normale Not-Implemented-Sentinel erzeugt keine Warnung. Betroffene
    Messwerte bleiben unbekannt, andere Register und Basic Mode verfügbar.
    Sobald wieder ein gültiger Faktor gelesen wird, erholt sich der
    Messwert ohne Neustart und ohne nachträgliche Energieverbuchung der
    ausgefallenen Messintervalle (REQ-EXTENDED-MODE-RESILIENCE).

    Die deklarative Feldtabelle HIGH_BLOCK_FIELDS in domain/sunspec.py und
    decode_identity dort wählen für jedes Register signed=True/False anhand
    des in modbus_llm.yaml dokumentierten Datentyps (Quelle der Wahrheit, siehe
    REQ-SUNSPEC-MODE-CORRECTION - Abweichungen davon nur mit
    Vendor-/SunSpec-Beleg). storage_state/storage_event, ic_control_mode,
    battery_event sowie battery_charging_active (jetzt via decode_bool16)
    sind rohe Enum-/Bool-Register ohne Skalierung und werden dementsprechend
    direkt mit decode_int16/decode_uint16/decode_bool16 statt
    apply_typed_sunssf decodiert. ic_max_power_reference und ic_timeout
    (Register 40053/40050, unskalierte uint16-Rohwerte) werden ebenfalls
    über decode_uint16 geführt, statt einen Sentinel unbemerkt als riesigen
    Referenz-/Timeout-Wert zu übernehmen.

    Negative Sollwerte validieren in _watts_to_ic_setpoint_raw den
    Referenzwert Register 40053 und den Skalierungsfaktor Register 40049
    (Bereich -10..10, ohne Sentinel -32768) vor jedem Schreibvorgang.
    Die Ladeentscheidung reicht ihren aktuellen Messdatensatz bis in den
    Schreibpfad durch; eine fehlende Referenz wird nicht durch einen alten
    veröffentlichten Wert ersetzt. Nur der periodische Writer verwendet
    ohne neue Entscheidung den zuletzt verfügbaren Datensatz. Exakt 0 W
    benötigt weder Referenz noch Skalierungsfaktor und wird als Rohwert 0
    geschrieben (REQ-EXTENDED-MODE-RESILIENCE).

    Downstream (Energieakkumulation, PV-Überschuss-Hysterese aller drei
    Verwendungsstellen, Preisplanung, sensor.py/binary_sensor.py) prüfen
    die betroffenen data[...]-Werte bereits durchgehend auf None, bevor sie
    rechnen oder vergleichen (siehe REQ-EXTENDED-MODE-RESILIENCE) - ein
    durch einen Sentinel erzeugtes None reiht sich dort ein wie ein wegen
    nicht erreichbarem SunSpec-Modus fehlender Wert und löst weder eine
    Hysterese-Bestätigung noch einen Geräte-Write aus. Die Negation von
    smartmeter_power/grid_power_active_l1/l2/l3 (REQ-SUNSPEC-MODE-CORRECTION)
    prüft dafür explizit auf None, bevor sie das unäre Minus anwendet.
  acceptance_criteria:
    - "tests/test_sunspec_decoder.py prüft alle 65536 sunssf-Rohwerte:
       Nur -10..+10 einschließlich der Grenzen sind gültig; signed- und
       unsigned-Skalierung behalten für gültige Faktoren ihre Ergebnisse.
       HIGH-/LOW2-Faktoren, gemeinsame Faktoren mehrerer Messwerte und
       deterministische Zufallsblöcke sind abgedeckt."
    - "tests/test_coordinator.py prüft je vier Refreshs mit Lade- und
       Entladeleistung und Exponenten -32767, -11, 11, 100 und 32767:
       last_update_success bleibt True, storage_power_active bleibt None,
       Energie-, Herkunfts-, Netz- und Geldzähler bleiben unverändert,
       auch nach Speichern und Laden. Je betroffenem Register entsteht
       genau eine Warnung. Der nächste gültige Leistungswert verbucht nur
       sein aktuelles Intervall. Ungültige Schreibfaktoren lösen weiterhin
       HomeAssistantError vor dem Geräte-Write aus. Ein zusätzlicher Fuzztest
       durchläuft vollständige Refreshs mit vier Extremmustern und 32
       deterministischen Zufallsblöcken für HIGH/LOW2; Updates bleiben
       erfolgreich, numerische Messwerte endlich und Warnungen je
       Skalierungsregister dedupliziert."
    - "tests/test_coordinator.py deckt decode_int16/decode_uint16/
       decode_bool16/apply_typed_sunssf parametrisch ab: signiertes 0xFFFF
       -> -1, unsigniertes 0x8001 -> 32769, int16/sunssf-Sentinel 0x8000 ->
       None, uint16/enum16/bitfield16-Sentinel 0xFFFF -> None, ein
       Sentinel-Skalierungsfaktor an apply_typed_sunssf -> None (weder 0
       noch Exception), sowie ein Boolean-Sentinel an decode_bool16 -> None
       statt True."
    - "tests/test_sunspec_decoder.py::test_decode_high_block_decodes_all_models
       (normale Vendor-Beispielwerte, positiv und negativ) bleibt
       unverändert grün; tests/test_sunspec_mapping.py prüft die
       Signed/Unsigned-Wahl jedes Feldes zusätzlich parametrisch gegen
       modbus_llm.yaml."
    - "Ein eigener Testfall belegt, dass ein Sentinel in
       storage_power_active/smartmeter_power weder die Energieakkumulation
       noch eine PV-Überschuss-Hysterese fälschlich bestätigt."

# ==============================================================================
# ANFORDERUNG: GEMEINSAME LADEZEITENQUELLE IM ZEITVARIABLEN TARIF
# ==============================================================================
requirement_time_of_use_charge_source:
  id: REQ-TIME-OF-USE-CHARGE-SOURCE
  title: "Tarifpreisfenster als einzige Ladezeitenquelle im zeitvariablen Tarif (Issue #237)"
  status: done
  description: >
    Bei gespeichertem TIME_OF_USE-Tarif verwenden feste SOC-Ladung nach
    REQ-TIMED-SOC-CHARGE und Verbrauchsplanung nach REQ-BRIDGE-CHARGE
    dieselben erlaubten Tarifabschnitte. Niedertarif ist die niedrigste
    tatsächlich täglich vorkommende Preisstufe. Alle gleich günstigen
    Abschnitte sind freigegeben, einschließlich Basispreis in echten Lücken;
    ein durch Preisfenster vollständig verdrängter Basispreis zählt nicht.
    Halboffene Grenzen, Mitternacht und lokale Zeitzone folgen
    REQ-ECONOMICS-TARIFFS. Min.-SOC-Startschwelle, Netzlade-Max-SOC,
    globales Max-SOC und aktive Monate gelten weiter für feste SOC-Ladung;
    Bridge ersetzt ausschließlich die Startschwelle durch den Bedarf.

    Der Tarif gilt unmittelbar nach Update, Neustart und Optionsänderung.
    Gespeicherte timed_charge_start/end bleiben für andere Tarifarten
    erhalten, werden nicht zu Tarifpreisfenstern umgedeutet und sind im
    TIME_OF_USE-Modus unwirksam und nicht bearbeitbar. Alte fenstergebundene
    Laufzeitzustände ohne Tarifbindung werden auch bei gleichen Uhrzeiten
    verworfen; eine erneute Min.-SOC-Auswertung ist erforderlich. Gebundene
    Zustände gelten nur für den identischen Tarif und absoluten Abschnitt.
    Beim Rückwechsel auf andere Tarifarten werden die getrennten Zeiten
    erneut gegen die Ladepause geprüft; überlappende alte Netzladezeiten
    werden wie beim Neustart geleert. Der Writer beendet die Tarifladung
    auch ohne abgeschlossenen Poll an der absoluten Abschnittsgrenze und
    prüft Tarifänderungen nach verzögerten Modusantworten erneut. Ein
    bestätigter 0-W-Entladeschutz bei SOC-Ausfall behält seine eigene Frist.
    Ungültige Tarifdaten erlauben keine Tarifladung und keinen Rückfall auf
    alte Zeiten. Dashboard und Konfigurations-Hilfetext erklären die einzige
    Tarifquelle; es gibt keine weitere Checkbox oder Quellenwahl.
  acceptance_criteria:
    - "Feste SOC-Ladung und Bridge nutzen dieselben billigsten Tarifabschnitte; mehrere gleich niedrige Fenster und tatsächlich wirksame Basispreislücken sind abgedeckt."
    - "Ein vollständig abgedeckter Tag ignoriert den nirgendwo geltenden Basispreis. Ein teurerer Restabschnitt ersetzt keinen verpassten Niedertarif."
    - "Tests prüfen Mitternacht, lokale Zeit, angrenzende Grenzen und Monatswechsel sowie ungültige oder fehlende Tarifdaten ohne Legacy-Fallback."
    - "Update, Neustart und Tarifwechsel geben alte Lade- oder Haltezustände nicht für abweichende Tarifabschnitte frei; alte Start-/Endwerte werden weder erfunden noch als zweite Ladequelle verwendet."
    - "Das Dashboard zeigt im TIME_OF_USE-Modus keine bearbeitbaren alten Ladezeiten. Min.-SOC-Startschwelle bleibt bei fester SOC-Ladung sichtbar und entfällt bei Bridge; Max-SOC und Monate bleiben bedienbar."
    - "Der deutsch-/englischsprachige Hilfetext in der Dashboard-Tarifkarte erklärt Tarifquelle, niedrigste Preisstufe und Umgang mit bestehenden Ladezeiten."

# ==============================================================================
# ANFORDERUNG: ZEITGESTEUERTES LADEN AUF ZIEL-SOC
# ==============================================================================
requirement_timed_soc_charge:
  id: REQ-TIMED-SOC-CHARGE
  title: "Speicher innerhalb eines Zeitfensters auf einen festgelegten SOC laden, plus geräteunabhängige Max-SOC-Sperre"
  status: done
  description: >
    Im TIME_OF_USE-Modus stammen die hier beschriebenen Ladefenster
    ausschließlich aus dem gespeicherten Tarif nach
    REQ-TIME-OF-USE-CHARGE-SOURCE; bei anderen Tarifarten gilt weiterhin
    das separate Netzladezeitfenster.

    Zeitgesteuertes Laden und die Max-SOC-Sperre sind Software-Logik (kein
    natives Geräteregister für die Aktivierung selbst) und teilen sich mit
    der manuellen Netzladung (REQ-MANUAL-GRID-CHARGE), netzdienlichem und
    preisoptimiertem Laden eine zentrale Auswertung
    (SaxPowerCoordinator._async_enforce_grid_charge, bei jedem Poll-Zyklus
    sowie bei jeder Einstellungsänderung neu ausgewertet) sowie denselben
    SunSpec-Modus-Schreibpfad (_async_sun_charge_loop). Priorität pro
    Auswertung:

    1. Ist der SOC >= dem effektiven "Max. SOC" (number.py; während der
       periodischen Zellkalibrierung temporär 100 %, siehe
       REQ-PERIODIC-FULL-CALIBRATION), hält der Coordinator Register
       40051 (Steuermodus) auf 1 (Sollwertvorgabe) und Register 40049
       (Leistungsvorgabe) auf 0 % - UNABHÄNGIG davon, ob zeitgesteuertes
       Laden aktiviert ist (z. B. auch bei einem durch PV-Überschuss vollen
       Speicher). Das verhindert dauerhaftes Volladen auf 100 % zugunsten
       der Batterie-Lebensdauer; der Speicher entlädt sich währenddessen
       nicht automatisch zur Eigenverbrauchsdeckung, da Register 40049 = 0 %
       Netto-Leistungsfluss = 0 (weder Laden noch Entladen) erzwingt.

       Alle drei SOC-Einstellungen dieses Abschnitts ("Max. SOC",
       "Netzladen Max. SOC", "Netzladung Min. SOC") werden von ihrem
       jeweiligen Coordinator-Setter (async_set_max_soc/
       async_set_timed_charge_max_soc/async_set_timed_charge_min_soc,
       coordinator._clamp_int) auf ihren gültigen Bereich geklemmt:
       0-100 % für Max. SOC und Min. SOC, 0 bis zum konfigurierten
       Max. SOC für Netzladen Max. SOC. Die Validierung erfolgt
       nicht nur im NumberEntity-Schieberegler in der Oberfläche - der reguläre
       Service-Call-Pfad (async_set_native_value) ist dadurch zwar bereits
       über native_min_value/native_max_value abgesichert, der
       RestoreEntity-Pfad beim Neustart (async_added_to_hass) ruft den
       Coordinator-Setter jedoch direkt mit dem gespeicherten Zustand auf,
       ohne diese Validierung zu durchlaufen - ein korrupter oder aus einer
       künftigen Version mit engeren Grenzen stammender gespeicherter Wert
       würde sonst ungeprüft übernommen.

       Wurde der Ziel-SOC dabei INNERHALB des Netzladung- oder des
       netzdienlichen Zeitfensters beziehungsweise eines vom Preisplan
       ausgewählten Ladeslots erreicht (_max_soc_hold_is_window_bound), gilt
       die Sperre nur bis zum Ende genau dieses Zeitfensters/Slots: Register
       40051 wird bis dahin periodisch auf 1 nachgeschrieben (Timeout siehe
       Register 40050/REG_SUN_IC_TIMEOUT), danach aktiv auf 0 zurückgesetzt,
       damit der Speicher wieder von der geräteeigenen SmartMeter-
       Nullregelung gesteuert wird - ohne diesen aktiven Rücksprung bliebe
       die Sperre unbegrenzt bestehen, da ein gehaltener 0-%-Sollwert den
       SOC nie von selbst unter den Zielwert fallen lässt. Die Preis-Slot-
       Bindung bleibt auch bei einem zwischenzeitlichen SOC-Abfall aktiv;
       andernfalls würde der weiterhin ausgewählte Slot sofort erneut aus
       dem Netz laden. Bestätigter Netzbezug gibt nur die geräteweite Sperre
       außerhalb solcher Ladezeiträume frei, niemals eine gebundene Sperre.

       Wurde der Ziel-SOC dagegen AUSSERHALB jedes Zeitfensters und ohne
       ausgewählten Preis-Ladeslot erreicht (z. B. rein durch PV-Überschuss
       via Nullregelung, ohne aktives zeitgesteuertes, netzdienliches oder
       preisoptimiertes Laden), gilt die Sperre
       grundsätzlich unbegrenzt - ABER: da ein gehaltener 0-%-Sollwert auch
       hier den SOC im Normalfall nie von selbst unter den Zielwert fallen
       lässt (der Speicher deckt den Hausverbrauch währenddessen nicht mit,
       siehe oben), wertet der Coordinator zusätzlich am Smart Meter
       gemessenen Netzbezug (data["smartmeter_power"] >
       SMARTMETER_PV_SURPLUS_THRESHOLD_WATT, also mehr als 50 W Bezug -
       siehe Vorzeichenkonvention weiter unten unter "PV-Überschuss-
       Prüfung") als weiteren Freigabe-Trigger aus, mit derselben einheitlichen
       Zyklen-Hysterese (self._max_soc_grid_import_wait_cycles, siehe unten
       "PV-Überschuss-Prüfung") gegen kurze Lastspitzen: erst wenn
       PV_SURPLUS_HYSTERESIS_CYCLES aufeinanderfolgende Aufrufe von
       _async_enforce_grid_charge Netzbezug über dem Schwellwert melden,
       wird Register 40051 aktiv auf 0 zurückgesetzt. Gleichzeitig setzt der
       Coordinator den Freigabe-Latch
       self._max_soc_released_for_discharge: Solange der SOC weiterhin auf
       oder über dem wirksamen Zielwert liegt und keine erneute Ladung
       erkannt wird, bleibt die SmartMeter-Nullregelung danach freigegeben.
       Weitere Polls starten weder einen neuen 0-%-Task noch schreiben sie
       Register 40051 erneut auf Modus 1.
       Dadurch kann der Speicher den Hausverbrauch tatsächlich decken, statt
       nach jeweils zwei Polls zwischen Freigabe und Sperre zu flattern.
       max_soc_clamped ist während dieser Freigabe False und entspricht damit
       dem tatsächlich gehaltenen Gerätemodus. Ein real gemessener SOC
       unter dem wirksamen Zielwert löscht den Latch; eine spätere neue
       Überschreitung aktiviert die Sperre wieder.

       Die Entladefreigabe darf kein erneutes Laden über den Zielwert
       erlauben: Bei weiterhin erreichtem Ziel-SOC löschen bestätigte
       Batterieladung (storage_power_active <= -50 W) ODER Netzeinspeisung
       (smartmeter_power < -50 W) den Latch und setzen sofort wieder
       Register 40051 = 1 / 40049 = 0 %. Der eigene Zähler
       self._max_soc_recharge_confirm_cycles verwendet dafür dieselbe
       PV_SURPLUS_HYSTERESIS_CYCLES-Hysterese. Ohne ein solches Signal
       wird er zurückgesetzt; Entladen, Stillstand oder fehlende
       Leistungswerte allein lösen keine neue Sperre aus. Die zusätzliche
       Batterieleistung ist nötig, weil der Speicher den PV-Überschuss
       bereits aufnehmen und die Netzleistung dabei nahe 0 W halten kann.
       Steigt der gemessene SOC während der Freigabe gegenüber der letzten
       Auswertung, wird auch ohne Leistungsbestätigung sofort gesperrt:
       Das schützt bei fehlenden SunSpec-Werten oder kleiner Ladeleistung
       unterhalb der 50-W-Toleranz. Ein vorheriger SOC-Abfall unter den
       Zielwert ist für diese erneute Sperre nicht erforderlich. Die
       Freigabe wird vor dem Sperrversuch verworfen, damit ein Schreibfehler
       beim nächsten Poll erneut zur Sperre führt. Späterer bestätigter
       Netzbezug darf die Sperre weiterhin zum Entladen freigeben.

       Änderungen des wirksamen Zielwerts berücksichtigen denselben Latch:
       Eine Zielerhöhung unter den weiterhin höheren aktuellen SOC behält die
       Freigabe bei, eine Zielabsenkung löscht sie als neue Überschreitung.
       Das gilt sowohl für async_set_max_soc als auch für Beginn und Ende der
       periodischen Zellkalibrierung (effektiver Zielwert temporär 100 %).
       Die separate Zeitfenster-/Preis-Slot-Bindung
       (_max_soc_hold_is_window_bound) bleibt davon unberührt und hält bzw.
       beendet ihre Sperre weiterhin am jeweiligen Fenster-/Slotende. Endet
       ein solcher Zeitraum bei weiterhin erreichtem SOC, nutzt die aktive
       Freigabe denselben Latch, damit die geräteweite Sperre nicht schon im
       nächsten Poll allein wegen eines unveränderten SOC erneut entsteht.
       Der Schutz gegen erneutes Laden und der Reset bei Zielunterschreitung
       gelten auch hier. Das gilt gleichermaßen für zeitgesteuerte,
       netzdienliche und preisoptimierte Zeiträume sowie für das Ende des
       effektiven netzdienlichen Fensters bei ausfallender PV-Prognose.

       Ohne den Netzbezug-Trigger
       würde die Sperre in diesem Fall de facto dauerhaft bestehen bleiben
       und der Hausverbrauch dauerhaft aus dem Netz statt aus dem Speicher
       gedeckt, bis der Nutzer manuell eingreift (z. B. "Max. SOC" ändert).
       Der Zähler wird bei fehlendem oder unter dem Schwellwert liegendem
       smartmeter_power sowie beim Verlassen dieses Zweigs (SOC unter
       Zielwert, Wechsel in einen zeitfenstergebundenen Zustand) auf 0
       zurückgesetzt.
    2. Andernfalls hat ein aktiver, strikt negativer manueller
       Netzladeauftrag Vorrang vor allen Automatiken, siehe
       REQ-MANUAL-GRID-CHARGE.
    3. Andernfalls: Ist zeitgesteuertes Laden aktiviert (switch.py,
       "Netzladung aktiv"), die aktuelle Uhrzeit innerhalb des
       konfigurierten Zeitfensters (time.py, "Start"/"Ende", HH:MM, darf
       über Mitternacht laufen), im aktiven Monat, "Netzladung Min. SOC"
       (number.py, siehe unten) gesetzt UND unterschritten (bzw. bereits
       im selben unveränderten aktiven Fenster zuvor unterschritten und
       noch nicht bis "Netzladen Max. SOC" durchgeladen -
       siehe Hysterese unten) UND kein über die einheitliche
       Zyklen-Hysterese (siehe unten "PV-Überschuss-Prüfung") bestätigter
       PV-Überschuss über SMARTMETER_PV_SURPLUS_THRESHOLD_WATT (const.py,
       50 W) am Smart Meter gemessen, wird Register 40049 auf den maximal
       möglichen negativen Sollwert gesetzt (MIN_SETPOINT_POWER, sättigt in
       _watts_to_ic_setpoint_raw auf -100 %) - eine frühere, konfigurierbare
       "Max. Netzladeleistung" (number.py, SaxPowerChargeLimitNumber) wurde
       entfernt, weil der eingestellte Watt-Wert in der Praxis keinen
       Einfluss auf die tatsächliche Ladeleistung hatte (er sättigte
       ohnehin fast immer auf denselben Prozentwert).

       "Netzladen Max. SOC" (self._timed_charge_max_soc, NumberEntity
       SaxPowerTimedChargeMaxSocNumber): eigener oberer Ziel-SOC nur für
       die zeitgesteuerte Netzladung. Der Slider reicht von 0 % bis zum
       konfigurierten "Max. SOC"; diese geräteweite Obergrenze bleibt
       führend. Ein erstmalig fehlendes Netzladeziel übernimmt den
       vorhandenen Max. SOC, auch beim Upgrade und nach einmaliger
       RestoreEntity-Migration ohne Store. Erst nach Abschluss der Migration
       wird der Wert festgeschrieben, unabhängig von der Entity-Reihenfolge.
       Wird Max. SOC unter das Netzladeziel abgesenkt, wird dieses sofort
       ebenfalls reduziert und gespeichert. Ein späteres Anheben von
       Max. SOC erweitert nur den Sliderbereich, ohne das Netzladeziel
       automatisch anzuheben. Änderungen am Netzladeziel gelten sofort.

       Bei current_soc >= dem effektiven Netzladeziel wird die Netzladung
       beendet und _timed_charge_armed zurückgesetzt. Liegt das Ziel unter
       dem geräteweiten Max. SOC, gilt nach tatsächlich bestätigter
       Netzladung die unten beschriebene Entladesperre bis Fensterende;
       ohne diesen Nachweis wird die SmartMeter-Nullregelung freigegeben.
       PV-Laden bleibt bis zum geräteweiten Ziel möglich. Die Grenze erzeugt
       keine eigene geräteweite Max-SOC-Sperre und begrenzt weder manuelle
       noch preisoptimierte
       Netzladung. Während der bestehenden periodischen Zellkalibrierung
       gilt für die Netzladung ebenfalls temporär ein effektives Ziel von
       100 %, damit die Kalibrierung die nächste normale Lademöglichkeit
       nutzen kann (REQ-PERIODIC-FULL-CALIBRATION). Beide konfigurierten
       Max-SOC-Werte und die Slidergrenze bleiben dabei unverändert.

       "Netzladung Min. SOC" (self._timed_charge_min_soc, NumberEntity
       SaxPowerTimedChargeMinSocNumber, 0-100 %): unterer SOC-Schwellwert,
       unterhalb dessen die Netzladung starten darf.
       SaxPowerCoordinator._timed_charge_armed hält als Hysterese fest, ob
       der Schwellwert im aktuellen aktiven Fenster unterschritten wurde:
       nur bei eingeschalteter Netzladung, freigegebenem aktuellem Monat,
       aktiver Fensterinstanz und current_soc < "Netzladung Min. SOC" darf
       eine neue Freigabe entstehen. Eine Unterschreitung außerhalb des
       Fensters oder bei fehlender Freigabe wird nicht für später vorgemerkt.
       Im selben unveränderten Fenster bleibt die Freigabe auch oberhalb
       von "Netzladung Min. SOC" erhalten, bis der SOC "Netzladen Max. SOC"
       erreicht/überschreitet. Die einmal gestartete Netzladung kann so
       innerhalb dieses Fensters bis zum eigenen Ziel weiterladen.
       Fensterende, Wechsel zur nächsten Fensterinstanz, geänderte
       Start-/Enduhrzeiten, Deaktivierung oder Aufheben der Freigabe des
       aktuellen Monats verwerfen die Freigabe sowohl im RAM als auch im
       gespeicherten Zustand. Die Fensteridentität wird bei jeder Auswertung
       geprüft; dies gilt auch dann, wenn zwischen zwei Fenstern kein Poll
       stattgefunden hat. Jedes neue Fenster benötigt erneut einen aktuell
       unter Min. SOC liegenden SOC. Bei Min. SOC 20 % und Netzladeziel 80 %
       darf eine in Nacht 1 bei 18 % gestartete, bis Fensterende nur auf
       60 % geladene Batterie in Nacht 2 bei weiterhin 60 % nicht erneut
       netzladen und keine Freigabe für Nacht 2 speichern.
       Die offene Hysterese wird für ein aktives Netzladefenster sofort
       und unabhängig vom Konfigurations-Store je Config Entry gespeichert:
       Start-/Enduhrzeit und das konkrete UTC-Fensterende identifizieren
       genau diese Fensterinstanz, auch über Mitternacht und Zeitumstellung.
       Nach Neustart oder Neuladen wird sie erst nach vollständigem
       Konfigurations-Bootstrap und mit gültigem SOC übernommen, wenn
       exakt dasselbe unveränderte Fenster noch aktiv ist, der aktuelle
       Monat freigegeben und Netzladung weiterhin eingeschaltet ist.
       Dadurch läuft eine bei 18 % gestartete Ladung bei Min. SOC 20 %
       und Netzladeziel 80 % nach Neustart mit SOC 55 % bis 80 % weiter.
       RAM-Zustand und Persistenz verwenden dieselbe Fensterbindung.
       Zielerreichung oder Wegfall dieser Bindung entfernen den gespeicherten
       Zustand durch einen atomaren inaktiven Datensatz (logisches
       Zurücksetzen);
       ein regulärer Shutdown erhält ihn für die Wiederaufnahme.
       Fehlende, defekte, abgelaufene oder nicht passende Zustände armen
       niemals allein aufgrund eines SOC zwischen Startschwelle und Ziel.
       Die Wiederherstellung erzeugt keinen Nachweis tatsächlich gemessener
       Netzladung und damit keine Entladesperre. PV-Pausen und temporär
       ungültige SOC-Messungen löschen eine offene Hysterese innerhalb
       desselben weiterhin freigegebenen Fensters nicht; Fensterablauf oder
       Wegfall der Freigabe verwerfen sie auch bei ungültigem SOC.
       Schreibvorgänge werden durch Rücklesen bestätigt; fehlgeschlagene
       Schreib- oder Löschversuche werden protokolliert und bei der nächsten
       gültigen Auswertung erneut versucht. Die aktuelle Ladesteuerung
       bleibt dabei wirksam, insbesondere das Stoppen am Ziel. Bei einem
       Neustart vor erfolgreicher Persistenz ist nur der tatsächlich
       lesbare gespeicherte Zustand wiederherstellbar.
       Ohne vorherige Einstellung (z.
       B. direkt nach der Ersteinrichtung) steht der Wert auf
       DEFAULT_TIMED_CHARGE_MIN_SOC (const.py, 20 %,
       SaxPowerTimedChargeMinSocNumber.async_added_to_hass) statt auf 0
       oder "unbekannt" - ein bereits sinnvoll nutzbarer Schwellwert statt
       eines faktisch inaktiven 100-%-Defaults, mit dem Netzladung bei der
       Ersteinrichtung nie von selbst armt, bis der Anwender ihn bewusst
       ändert.
    4. Andernfalls stoppt die Netzladung. Wurde im aktuellen Zeitfenster
       bereits tatsächliche Netzladung bestätigt, bleibt die Entladung
       wie unten beschrieben gesperrt. Ohne diesen Nachweis wird Register
       40051 aktiv zurück auf 0 (SmartMeter-Nullregelung) gesetzt, statt nur
       passiv auf den
       geräteseitigen Timeout zu warten. Das umfasst neben Fensterende/
       Deaktivierung auch den Fall, dass
       während eines laufenden Zeitfensters PV-Überschuss über dem
       Schwellwert über die einheitliche Zyklen-Hysterese (siehe unten)
       bestätigt wird - die Netzladung wird dann innerhalb weniger
       Poll-Zyklen (nicht erst am Fensterende) beendet. Ohne bestätigte
       Netzladung übernimmt die geräteeigene SmartMeter-Nullregelung den
       PV-Überschuss, andernfalls der nachfolgend beschriebene Haltemodus.

    Entladesperre nach tatsächlicher zeitgesteuerter Netzladung (Issue #165):
    Ein eigener, ausschließlich diesem Mechanismus zugeordneter Nachweis
    entsteht nach zwei frischen HIGH-Messungen mit Netzbezug > 50 W und
    Batterieleistung < -50 W, während ein erfolgreich gestarteter
    zeitgesteuerter Netzladeauftrag den SunSpec-Writer besitzt. Beide
    Messungen müssen nach dessen Start begonnen haben und Modus 1 melden.
    Ein quittierter Ladebefehl, ein aktiver Schalter, hoher SOC, reine
    PV-Ladung, bloßer Haus-Netzbezug, wiederverwendete Messwerte aus Settern
    oder eine manuelle/preisoptimierte Netzladung genügen nicht.

    Der Nachweis hält die Entladung auch nach Erreichen von Netzladen Max.
    SOC oder während einer Ladepause bis zum konkreten ursprünglichen
    Fensterende gesperrt. Netzbezug hebt ihn nicht auf. PV-Laden bleibt
    innerhalb der globalen SOC-Grenze erlaubt: Der bestehende validierte
    SunSpec-Pfad hält min(0, storage_power_active + smartmeter_power) Watt,
    geklemmt auf den erlaubten Ladebereich. Die Summe beschreibt Hauslast
    minus Erzeugung; es wird niemals Entladung angefordert. Die Regelung
    folgt dem HIGH-Intervall von zwei Sekunden, sodass bei Last-/PV-Sprüngen
    kurze Ausregeltransienten möglich sind. Bei fehlenden, ungültigen oder
    über vier Sekunden alten Messwerten wird 0 W gehalten. Dieser 0-%-Wert
    benötigt weder eine Leistungsreferenz noch einen Skalierungsfaktor.
    Der eigene Haltemodus prüft auch im periodischen Writer Frist und
    Messfrische; ein Basic-Lesefehler versucht sofort 0 W. Es werden keine
    früher entfernten Basic-Leistungsgrenzregister verwendet. Die globale
    Max-SOC-Sperre hat weiterhin Vorrang vor PV-Laden.

    Abschalten von Netzladung aktiv verwirft den Nachweis und gibt diese
    Sperre sofort frei. Ebenso wird beim Wechsel zum preisoptimierten Laden
    der Nachweis verworfen. Preisstrategien, Ladeplanung, Slot-Bindung und
    Neutralpreiszone bleiben vollständig eigenständig; sie erzeugen und
    verlängern diesen Nachweis nicht und verwenden unverändert ihren
    bisherigen periodischen Writer. Manuelle Ladeaufträge behalten ihren
    bestehenden Vorrang.

    Die konkrete Ablaufzeit wird separat je Config Entry im Store
    sax_power.timed_discharge gespeichert und vor dem ersten Steuerlauf
    restauriert. Abgelaufene oder ungültige Ablaufzeiten erzeugen keine
    Sperre. Bei Legacy-Fenstern gilt zusätzlich eine Entfernung von maximal
    25 Stunden. Tarifgebundene Zustände werden gegen ihre exakte Identität
    geprüft; durch eine übersprungene teure Phase bei Sommerzeitwechsel
    kann ein gültiger zusammenhängender Niedertarif länger als 25 Stunden sein.
    Eine höchstens 25 Stunden alte
    Ablaufzeit dient nur noch als Endmarker: Ein nachträglich verlängertes
    Fenster darf denselben abgeschlossenen Ladezyklus auch nach Neustart
    weder neu bestätigen noch erneut an die globale Max-SOC-Sperre binden.
    Das nächste reguläre Fenster beginnt ohne aktive Sperre. Abschalten
    und Preiswechsel löschen auch den Endmarker. Mitternachts-/Monatswechsel und
    Sommer-/Winterzeit werden anhand der absoluten Ablaufzeit behandelt.
    Spätere Änderungen an Uhrzeiten/Monaten verlängern eine bestehende
    Sperre nicht; die ursprünglich gespeicherte Frist bleibt maßgeblich.
    Nach Fensterende wird aktiv freigegeben, ohne den Nachweis auf das
    nächste Fenster zu übertragen. Nach Schreibfehlern bleibt der Status
    unbekannt, bis der Steuerzustand wieder erfolgreich angewendet wurde.

    Der Enum-Sensor timed_charge_discharge_status zeigt Normalbetrieb
    (normal; kein Nachweis und keine neue Sperre), Netzladen (grid_charging;
    zeitgesteuerte Ladung mit bestätigter Netz-/Batterieleistung) oder
    Entladung wg. Netzladen gestoppt (discharge_blocked; Nachweis besteht,
    Netzladung läuft gerade nicht). Normalbetrieb bezieht sich nur auf
    diese Sperre und hebt andere Schutzfunktionen nicht auf. Anzeige im
    Dashboard siehe REQ-VUE-CHARGING.

    PV-Überschuss-Prüfung: Grundlage ist data["smartmeter_power"] (SunSpec-
    Modus, Register 40072 "Summenwirkleistung Netz", REG_SUN_METER_
    POWER_ACTIVE_SUM) - derselbe Wert, der auch im Sensor "Netzleistung"
    angezeigt wird (sensor.py, unverändert via _direct). Vorzeichenkonvention
    (Standarddarstellung, nicht offiziell in modbus.pdf dokumentiert, siehe
    REQ-SUNSPEC-MODE-CORRECTION): ein NEGATIVER Anzeigewert bedeutet
    Überschuss aus der Dachphotovoltaik (Einspeisung ins Netz), ein
    POSITIVER Anzeigewert Netzbezug; der rohe Registerinhalt meldet dagegen
    das umgekehrte Vorzeichen, weshalb domain.sunspec.decode_high_block
    den skalierten Wert beim Einlesen negiert (nicht sensor.py - der Sensor
    bleibt ein reiner Durchreicher, siehe _direct). Ist der Wert (noch)
    nicht verfügbar (z. B. SunSpec-Modus nicht erreichbar), blockiert das
    die Netzladung nicht. Der Schwellwert
    SMARTMETER_PV_SURPLUS_THRESHOLD_WATT (const.py) ist bewusst als eigene,
    wiederverwendbare Konstante ausgelagert (50 W), da er absehbar auch an
    anderer Stelle für eine PV-Überschuss-Erkennung benötigt wird.

    Zyklen-Hysterese (einheitlich): JEDER Vergleich gegen
    SMARTMETER_PV_SURPLUS_THRESHOLD_WATT - hier der PV-Überschuss-Check von
    Punkt 2/3 sowie der Netzbezug-Freigabe-Trigger und der Schutz gegen
    erneutes Laden der Max-SOC-Sperre von Punkt 1, außerdem (siehe
    REQ-GRID-SERVING-CHARGE) Schritt a, a.1 und b der
    Zustandsmaschine für netzdienliches Laden - läuft über dieselbe
    wiederverwendbare Hilfsmethode SaxPowerCoordinator._cycles_confirmed und
    dieselbe Konstante PV_SURPLUS_HYSTERESIS_CYCLES (const.py, 2): eine
    Schwellwert-Über-/Unterschreitung zählt erst als bestätigt, nachdem sie
    in so vielen aufeinanderfolgenden, erfolgreich gelesenen HIGH-Messwerten
    vorlag. Jeder Zähler berücksichtigt jede _high_sample_revision höchstens
    einmal. Erneute Auswertungen durch Preis-/PV-Prognose-Sensor-Events,
    Planner-Timer oder Einstellungsänderungen dürfen den vorhandenen Stand
    verwenden, aber nicht erhöhen; das gilt auch für preisoptimiertes Laden
    (REQ-DYNAMIC-PRICE-CHARGE). Ohne erfolgreichen HIGH-Read darf kein Zähler
    steigen. Eine nicht mehr erfüllte Bedingung setzt den jeweiligen Zähler
    sofort zurück, auch ohne neue Revision; dieselbe Messung darf danach
    keine neue Bestätigung liefern. Einstellungsänderungen wirken weiterhin
    sofort. Das gilt ebenso bei fehlenden HIGH-Messwerten nach einem
    SunSpec-Lesefehler. Auch die Wartezyklen des netzdienlichen Ladens nach
    Schritt a werden nur durch neue HIGH-Messwerte verbraucht; die
    Aktivierungsrevision zählt noch nicht zur Wartezeit und deren Messwerte
    zählen noch nicht zur Freigabebestätigung in Schritt b
    (REQ-GRID-SERVING-CHARGE). Die Zähler (je
    Verwendungsstelle ein eigenes self-Attribut, z. B.
    self._timed_charge_pv_surplus_cycles,
    self._max_soc_grid_import_wait_cycles,
    self._max_soc_recharge_confirm_cycles,
    self._grid_serving_charge_confirm_cycles,
    self._grid_serving_release_confirm_cycles,
    self._grid_serving_import_confirm_cycles) schützen
    einheitlich gegen kurze Lastspitzen/Messausreißer am Smart Meter, statt
    dass jede Verwendungsstelle unmittelbar auf einen einzelnen Messwert
    reagiert.

    Schreibmechanismus (SunSpec-Modus, Slave-ID 100, Modell 123
    "Immediate Controls", siehe modbus_llm.yaml): Erst Register 40051 auf 1
    (Sollwertvorgabe), danach Register 40049 (Leistungsvorgabe, Prozent der
    Referenz-Maximalleistung Register 40053; SaxPowerCoordinator.
    _watts_to_ic_setpoint_raw; negativ=Laden - Vorzeichenkonvention laut
    modbus.pdf nicht dokumentiert, hier analog zum Basic-Mode-P-Sollwert
    angenommen. Die Integration schreibt hier bewusst nur nicht positive
    Werte: negative Ladesollwerte oder 0 für Max-SOC-Sperre/Ladepausen -
    siehe REQ-MANUAL-DISCHARGE zum Befund bei positiven (entladenden)
    Sollwerten). Beide Register werden periodisch
    neu geschrieben (SaxPowerCoordinator._sun_ic_write_interval: die Hälfte
    des von Register 40050 gemeldeten Timeouts, gedeckelt auf 30s,
    mindestens alle 5s), da das Gerät den Sollwert sonst nach Ablauf des
    Timeouts verwirft.

    Jeder Start und jede sofortige Sollwertänderung validiert vor dem ersten
    Modbus-Write die positive, endliche Referenz-Maximalleistung, den
    SunSpec-Skalierungsfaktor (-10..10), den Watt-Bereich sowie den daraus
    berechneten int16-Rohwert für Register 40049. Erst danach wird 40051 = 1
    und anschließend 40049 geschrieben. Scheitert der zweite Write, versucht
    derselbe Fehlerpfad unmittelbar 40051 = 0 zurückzuschreiben und meldet
    den ursprünglichen Fehler zusammen mit dem Rollback-Ergebnis als
    HomeAssistantError. Ein fehlgeschlagener Rollback hält
    _sun_charge_reset_required gesetzt, bis ein späterer inaktiver Poll die
    SmartMeter-Nullregelung quittiert; Task und Aktivstatus werden nach einer
    unvollständigen Sequenz nicht veröffentlicht bzw. beendet. Dadurch kann
    weder eine Vorvalidierung noch ein schlafender Task das Gerät mit einem
    alten oder undefinierten Sollwert in Modus 1 zurücklassen. Ein eigener
    Sequenz-Lock verhindert außerdem, dass periodische Wiederholung und
    sofortige Änderung ihre jeweiligen 40051/40049-Writes verschachteln.

    Ein fehlgeschlagener Basic-Mode-Read, einschließlich eines unvollständigen
    Blocks, eines nicht ganzzahligen SOC oder eines SOC außerhalb 0–100,
    entzieht sofort die SOC-Freigabe
    für negative Sollwerte aller Ladearten, einschließlich manueller und
    preisoptimierter Netzladung (Issue #167). Ein laufender Writer mit
    negativem Sollwert wird beendet und Register 40051 aktiv auf 0
    zurückgesetzt; eine nicht quittierte Rücksetzung bleibt zur Wiederholung
    vorgemerkt. Eine zuvor angewendete Max-SOC-Sperre bleibt dagegen bei
    0 W, damit der Lesefehler keine PV-Ladung über die bereits erreichte
    Grenze freigibt. Ihr Haltegrund bleibt auch nach einem Schreibfehler
    für die erneute sichere Anwendung erhalten. Alte Smartmeterwerte dürfen
    diese Sperre nicht als neue Netzbezugsbestätigung freigeben. War die
    Sperre an ein Zeitfenster oder einen Preis-Slot gebunden, gelten dessen
    aktuelle Uhrzeiten, Monate, Aktivierung und Prognosefreigabe beziehungsweise
    der aktuelle Preisplan weiterhin; Fenster-/Slotende oder Abschalten
    geben sie auch ohne neuen SOC frei. Ein bereits
    bestätigter zeitgesteuerter Netzladenachweis wechselt auch während noch
    laufender Netzladung stattdessen auf den sicheren 0-W-Haltemodus bis zur
    ursprünglichen Frist. Im bestätigten Haltemodus bleibt auch PV-Laden
    während dieses Ausfalls gesperrt.
    Ohne neuen erfolgreichen Basic-Read dürfen weder periodische Writer
    noch Preisplan-Timer oder Einstellungsänderungen negative Sollwerte
    anhand der alten coordinator.data erneut freigeben. Neue manuelle
    Ladeaufträge werden währenddessen mit HomeAssistantError abgelehnt;
    bestehende Aufträge dürfen nach Wiederherstellung mit dem dann real
    gelesenen SOC und den aktuellen Grenzen erneut ausgewertet werden.
    Der regulär innerhalb scan_interval wiederverwendete Basic-Cache bleibt
    gültig, solange kein Read fehlgeschlagen ist. Die Wiederfreigabe wird
    unter dem gemeinsamen Steuer-Lock zuerst mit dem neuen SOC ausgewertet.
    Reine Steuerzustandsmeldungen, einschließlich der Entladesperren-Frist,
    benachrichtigen Entity-Listener, ohne last_update_success zu verändern
    oder einen fehlgeschlagenen Messdaten-Refresh als behoben darzustellen.

    Der Basic-Mode-P-Sollwert (Register 41) wird nur noch als Diagnosewert
    gelesen. Der manuelle start_grid_charge/stop_grid_charge-Service ist ein
    Adapter auf denselben zentralen SunSpec-Pfad und erlaubt ausschließlich
    negative Ladesollwerte, siehe REQ-MANUAL-GRID-CHARGE. Die Integration
    liest/schreibt die Basic-Mode-
    Register 43/44 (Ent-/Ladeleistungsgrenzwert) nicht mehr - eine frühere
    Software-Einstellung "Max. Netzladeleistung" (number.py,
    SaxPowerChargeLimitNumber), die Register 44 einmalig als Vorgabewert
    gelesen hat, wurde entfernt: der eingestellte Watt-Wert hatte in der
    Praxis keinen Einfluss auf die tatsächliche Ladeleistung. Zeitgesteuertes
    und preisoptimiertes Laden fordern stattdessen immer die maximal
    mögliche Ladeleistung an (siehe Punkt 2 oben).

    "Max. SOC", "Netzladen Max. SOC" und "Netzladung Min. SOC" sind reine
    Software-Zustände (number.py), die über den zentralen
    Konfigurations-Store Neustarts überstehen. "Max. SOC" ist die
    mechanismusübergreifende Obergrenze; Min. SOC und Netzladen Max. SOC
    gelten nur für die zeitgesteuerte Netzladung. Alle drei Setter werten
    _async_enforce_grid_charge unmittelbar neu aus. Ohne gespeicherten
    Zustand gilt für Max. SOC 100 %, für Netzladen Max. SOC der vorhandene
    Max. SOC und für Netzladung Min. SOC 20 %. Nur die schon früher
    vorhandenen Number-Entities nutzen RestoreEntity zur einmaligen
    Migration; das neue Netzladeziel wird zentral initialisiert (siehe
    REQ-CONTROL-CONFIG-BOOTSTRAP).

    Aktiviert-Zustand sowie Start-/Endzeit des zeitgesteuerten Ladens
    ("Netzladung aktiv"/"Start"/"Ende", time.py) werden ebenfalls über
    Neustarts hinweg persistiert. Maßgeblich ist dafür der versionierte
    Konfigurations-Store, der bereits vor dem ersten steuernden Refresh
    vollständig geladen wird; die RestoreEntity-Zustände sind nur noch der
    einmalige Migrationspfad für Einträge ohne Store (siehe
    REQ-CONTROL-CONFIG-BOOTSTRAP).
    Zusätzlich zeigt ein Diagnose-Sensor ("Zeitgesteuertes Laden aktiv") an,
    ob gerade zeitgesteuert nachgeladen wird - unabhängig von der
    Max-SOC-Sperre.

    Vorbelegung beim allerersten Start eines neuen Eintrags: Der
    Ersteinrichtungs-Dialog (config_flow.py) fragt nach der
    Verbindungsvalidierung einen zweiten, optionalen Schritt
    ("grid_charge") ab - Zeitfenster-Start/-Ende und Aktiviert-Status,
    alle Felder optional. Werden sie nicht ausgefüllt, gelten die Defaults
    DEFAULT_TIMED_CHARGE_START ("00:00:00"), DEFAULT_TIMED_CHARGE_END
    ("00:05:00") und DEFAULT_TIMED_CHARGE_ENABLED (False). Die im Config
    Entry gespeicherten Werte wirken sich über
    entity.initial_config_value ausschließlich dann aus, wenn die
    jeweilige RestoreEntity noch keinen gespeicherten Vorzustand hat (siehe
    SaxPowerTimedChargeSwitch/-StartTime/-EndTime.async_added_to_hass) -
    ein späterer Reconfigure-Flow (der diese Schlüssel nicht im Config
    Entry aktualisiert) hat darauf keinen Einfluss mehr, sobald einmal ein
    echter Zustand gespeichert wurde.
  acceptance_criteria:
    - "Eigenes Netzladeziel: Tests prüfen Start unter Min. SOC, Weiterladen
       oberhalb der Startschwelle, Ende exakt am Netzladen Max. SOC,
       Rückkehr zur SmartMeter-Nullregelung unterhalb des globalen Maximums
       und unveränderte geräteweite Max-SOC-Sperre. Zieländerungen sowie
       globale Absenkungen wirken sofort; spätere globale Erhöhungen ändern
       das Netzladeziel nicht. Während aktiver Kalibrierung gilt effektiv
       100 %, ohne die konfigurierten Werte zu überschreiben."
    - "tests/test_number.py prüft Anfangswert, Sliderbereich einschließlich
       globalem Max. SOC 0 %, dynamische Absenkung und Erhöhung sowie
       unveränderte UI-Werte während der Kalibrierung."
    - "Fenstergebundene Hysterese: Regressionstests prüfen zwei aufeinander
       folgende Nächte mit Min. SOC 20 % und Netzladeziel 80 %. Nach Start
       bei 18 % und Fensterende bei 60 % beginnt Nacht 2 bei 60 % ohne neue
       Netzladung und ohne neue gespeicherte Freigabe, mit und ohne
       Neustart sowie ohne Poll zwischen den Fenstern. Ein erneuter SOC
       unter 20 % im aktiven Fenster erlaubt den Start. Unterschreitungen
       außerhalb des Fensters, bei Deaktivierung oder in einem nicht
       freigegebenen Monat erzeugen keine spätere Freigabe. Fensterwechsel,
       geänderte Uhrzeiten und Entzug der Aktivierung/Monatsfreigabe
       verwerfen RAM-Zustand und Persistenz auch bei fehlendem SOC.
       Innerhalb desselben unveränderten freigegebenen Fensters bleiben
       Weiterladen oberhalb Min. SOC, PV-Pausen, temporär ungültiger SOC und
       Wiederaufnahme nach Neustart bis zum Ziel erhalten."
    - "tests/test_coordinator.py deckt _is_time_in_window (normales
       Fenster, über Mitternacht laufendes Fenster, nicht gesetztes
       Fenster), _async_enforce_grid_charge (Start/Stop des
       zeitgesteuerten Ladens bei Zielerreichung/Fensterende/
       Deaktivierung SOWIE die Max-SOC-Sperre unabhängig vom
       zeitgesteuerten Laden - Aktivierung bei Zielerreichung, Freigabe
       beim Unterschreiten - sowie die stabile Entladefreigabe nach dem Ende
       eines zeitgesteuerten oder netzdienlichen Fensters über mehrere
       Folgepolls ohne erneute Ladung), die Watt-zu-
       Prozent-Umrechnung (inkl. Klemmung auf ±100 %) sowie das
       Schreibintervall (_sun_ic_write_interval) ab."
    - "Gezielte Schreibpfadtests prüfen: fehlende/0-Referenzleistung und
       ungültiger Scale Factor ohne jeden Write; Fehler auf 40051 ohne
       Sollwert-Write; Fehler auf 40049 mit unmittelbarer Reihenfolge
       40051=1, 40049, 40051=0; erfolgreichen und fehlgeschlagenen Rollback,
       offenen Rücksetzauftrag bis zum nächsten quittierten Reset sowie
       fehlenden Task/Aktivstatus nach unvollständigem Start und sofortiger
       Sollwertänderung."
    - "tests/test_coordinator.py deckt zusätzlich den Netzbezug-Freigabe-
       Trigger der geräteunabhängigen (nicht zeitfenstergebundenen)
       Max-SOC-Sperre ab: keine Freigabe bei nur einem Zyklus Netzbezug über
       dem Schwellwert (Hysterese hält die Sperre), Freigabe erst nach zwei
       aufeinanderfolgenden Zyklen, Zurücksetzen des Zählers bei einem
       Zyklus ohne (oder mit zu geringem) Netzbezug zwischen zwei
       Netzbezug-Zyklen, sowie unveränderter Ablauf (Sperre bleibt
       unbegrenzt bestehen) bei fehlendem smartmeter_power. Nach bestätigter
       Freigabe prüfen mindestens fünf weitere Polls bei SOC >= Zielwert
       ohne erneutes Laden, dass kein erneuter Modus-1-/0-%-Write erfolgt.
       Weitere Tests decken
       Löschen des Latch unterhalb des Zielwerts, erneutes Klemmen bei einer
       späteren Überschreitung, Beibehalten bei Zielerhöhung, Löschen bei
       Zielabsenkung und unveränderte Zeitfensterbindung ab."
    - "tests/test_timed_discharge_coordinator.py prüft frische gemessene
       Netzladestarts, ausbleibende Nachweise durch veraltete/ungültige
       Messungen, PV-Halten nach Zielerreichung, Abschalten, Fensterende,
       Restore und Ausfälle. tests/test_charge_policy.py prüft die reine
       PV-Leistungsbilanz und die eigenständige Sperrenfreigabe. Die Tests
       in test_timed_discharge_price_isolation.py sichern die drei
       Preisstrategien, Neutralpreiszone und globale Preis-Slot-Sperre
       gegen Einflüsse des neuen Zustands ab. test_timed_discharge.py und
       test_timed_discharge_store.py prüfen Ablaufzeiten inklusive DST
       sowie getrennte und validierte Persistenz."
    - "Regressionstests prüfen erneutes Sperren nach zeitgesteuertem oder
       netzdienlichem Fensterende, ausfallender PV-Prognose und bestätigtem
       Netzbezug: Batterieladung bei ausgeglichener Netzleistung und
       Einspeisung ohne Batterieleistungswert lösen nach zwei HIGH-Messwerten
       die 40051=1-/40049=0-Sequenz aus. Steigender SOC sperrt auch bei
       kleiner oder fehlender Leistung sofort, ebenso nach vorheriger
       Teilentladung oberhalb des Ziels. Messlücken, Entladung und kleine
