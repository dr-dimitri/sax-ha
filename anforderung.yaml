# ==============================================================================
# ANFORDERUNG: ALLE MODBUS-REGISTER LESBAR
# ==============================================================================
requirement_all_registers_readable:
  id: REQ-ALL-REGISTERS-READABLE
  title: "Alle Modbus-Register lesbar über Home Assistant + berechnete Phasensummen"
  status: done
  description: >
    Sämtliche in modbus_llm.yaml/modbus.pdf dokumentierten Register sind
    als Home Assistant Entity abrufbar: Basic Mode (Slave-ID 64) über
    sensor.py/number.py/switch.py, SunSpec-Modus (Slave-ID 100) über
    sensor.py (~56 Sensoren, beschreibungsbasiert). Register, die bereits
    über eine NumberEntity/SwitchEntity weg-/rücklesbar sind, gelten als
    "lesbar" und benötigen keinen zusätzlichen Sensor.
  requirements:
    - "Jedes Sensor-Feld hat einen deutschen, fachlich verständlichen
       Namen (keine reinen Registernummern oder unübersetzten
       SunSpec-Rohbezeichnungen als Anzeigename)."
    - "SunSpec-Skalierungsfaktor-Register (sunssf) werden auf die
       zugehörigen Messwerte angewendet und zusätzlich selbst als
       Diagnose-Sensor (entity_category: diagnostic) exponiert."
    - "Für Registergruppen mit L1/L2/L3-Aufteilung existiert je nach
       Verfügbarkeit ein herstellerseitiger oder berechneter
       Summen-Sensor."
  acceptance_criteria:
    - "Alle dokumentierten Register sind nach dem Setup als sensor.*-Entity
       sichtbar und liefern einen Wert (SunSpec-Modus vorausgesetzt
       erreichbar, siehe REQ-EXTENDED-MODE-RESILIENCE)."
    - "README.md beschreibt die Sensoren gruppiert nach Basic Mode und
       SunSpec-Modus."

# ==============================================================================
# ANFORDERUNG: IP-ADRESSE ÜBER DIE OBERFLÄCHE ÄNDERBAR
# ==============================================================================
requirement_ip_configurable_ui:
  id: REQ-IP-CONFIGURABLE-UI
  title: "IP-Adresse des SAX Speichers über die Home-Assistant-Oberfläche eintragbar, persistiert und jederzeit änderbar"
  status: done
  description: >
    Der Config Flow (config_flow.py) unterstützt sowohl die Ersteinrichtung
    (async_step_user) als auch einen Reconfigure-Flow
    (async_step_reconfigure), erreichbar über
    "Einstellungen -> Geräte & Dienste -> SAX Power Home -> ⋮ -> Neu
    konfigurieren". Das Formular ist mit den aktuell gespeicherten Werten
    vorbelegt. Die neue Verbindung wird vor dem Speichern geprüft
    (derselbe Testread wie bei der Ersteinrichtung); bei Erfolg werden die
    Werte persistiert (entry.data) und die Integration lädt automatisch mit
    den neuen Daten neu. Eine Kollisionsprüfung verhindert Duplikate mit
    einem anderen bereits konfigurierten Speicher, ohne beim unveränderten
    Speichern der eigenen IP fälschlich abzubrechen.
  requirements:
    - "Reconfigure-Formular verwendet dieselben Felder wie die
       Ersteinrichtung (IP-Adresse, Port, Slave-IDs, Intervall)."
    - "Fehlermeldungen unterscheiden TCP-Verbindungsfehler
       ('cannot_connect') von einer Modbus-Fehlerantwort bei bestehender
       Verbindung ('invalid_response', z. B. falsche Slave-ID)."
  acceptance_criteria:
    - "tests/test_config_flow.py deckt sowohl erfolgreiche IP-Änderung
       (inkl. Persistierung + Neuladen) als auch fehlgeschlagene
       Validierung (Daten bleiben unverändert) ab."
    - "README.md beschreibt, wie die IP-Adresse nachträglich geändert
       wird."

# ==============================================================================
# ANFORDERUNG: SUNSPEC-MODUS OPTIONAL (KEIN TOTALAUSFALL BEI NICHTVERFÜGBARKEIT)
# ==============================================================================
requirement_extended_mode_resilience:
  id: REQ-EXTENDED-MODE-RESILIENCE
  title: "Nicht erreichbarer SunSpec-Modus-Block darf nicht alle Sensoren lahmlegen"
  status: done
  description: >
    Basic Mode (Slave-ID 64) und SunSpec-Modus (Slave-ID 100) werden im
    Coordinator entkoppelt gelesen (SaxPowerCoordinator._async_read_extended):
      - Scheitert der Basic-Mode-Read: UpdateFailed, da Basic Mode die
        Mindestanforderung für jede Funktion der Integration ist.
      - Scheitert der SunSpec-Modus-Read: Das Update schlägt NICHT fehl;
        die betroffenen Sensoren zeigen "unbekannt", Basic-Mode-Daten
        bleiben unverändert verfügbar. Bei Wiederherstellung werden die
        SunSpec-Sensoren automatisch wieder befüllt.
      - Zustandswechsel (verfügbar -> nicht verfügbar -> wieder verfügbar)
        werden geloggt und zusätzlich als Home-Assistant-Repair-Issue
        (extended_mode_unavailable) angezeigt.
  acceptance_criteria:
    - "Live-Test gegen einen simulierten Modbus-Server ohne SunSpec-Modus-
       Gerät zeigt: Config Entry lädt erfolgreich, Basic-Mode-Sensoren
       liefern echte Werte, SunSpec-Sensoren existieren als Entity mit
       Zustand 'unbekannt' (tests/test_integration_live.py)."
    - "Unit-Tests decken sowohl den Übergang verfügbar -> nicht verfügbar
       als auch die Wiederherstellung ab (tests/test_coordinator.py)."

# ==============================================================================
# ANFORDERUNG: TESTS GEGEN ECHTE SAX-HARDWARE
# ==============================================================================
requirement_real_hardware_tests:
  id: REQ-REAL-HARDWARE-TESTS
  title: "Testfälle lesen echte Werte von einem physischen SAX Speicher"
  status: done
  description: >
    tests/test_real_hardware.py liest Werte von einem echten SAX Power
    Home (Plus) im lokalen Netz - rein lesend, kein Schreibzugriff. Die
    Verbindungsdaten stehen in tests/real_device.yaml (Host, Port, beide
    Slave-IDs, Verbindungs-Timeout). Ist dort keine IP hinterlegt
    (Auslieferungszustand: host: null) oder der Speicher nicht erreichbar,
    werden die betroffenen Tests automatisch übersprungen (pytest.skip).
  requirements:
    - "Gelesene Basic-Mode-Werte (SOC, Leistung) werden auf plausible
       Wertebereiche geprüft statt auf feste erwartete Werte."
    - "Ist der SunSpec-Modus auf dem realen Gerät nicht erreichbar, wird
       der entsprechende Testfall übersprungen statt fehlzuschlagen
       (konsistent mit REQ-EXTENDED-MODE-RESILIENCE)."
  acceptance_criteria:
    - "pytest läuft ohne hinterlegte IP vollständig durch (betroffene
       Tests werden übersprungen, keine Fehler)."
    - "DEVELOPMENT.md (Abschnitt 'Test gegen echte Hardware') beschreibt
       tests/real_device.yaml und wie der Live-Hardware-Test aktiviert
       wird - als Entwickler-, nicht als Benutzerdokumentation."

# ==============================================================================
# ANFORDERUNG: SUNSPEC-MODUS-REGISTERKARTE (SLAVE-ID 100)
# ==============================================================================
requirement_sunspec_mode_correction:
  id: REQ-SUNSPEC-MODE-CORRECTION
  title: "SunSpec-Modus-Registerkarte (Slave-ID 100) als alleinige Quelle für Speicher-/Netz-/Akkudetails"
  status: done
  description: >
    Der SunSpec-Modus liegt auf Slave-ID 100 mit Adress-Offset -40000
    (Register 40000-40114, siehe modbus.pdf und modbus_llm.yaml) und
    enthält einen zusammenhängenden Block aus fünf SunSpec-Modellen:
    Common (Geräteidentität), "3Ph Inverter" (103, Speicherelektronik),
    "Immediate Controls" (123, Sollwertvorgabe - Register 40049/40051
    zusätzlich als Schreibpfad für zeitgesteuertes Laden, siehe
    REQ-TIMED-SOC-CHARGE), "WYE Connect 3Ph Meter" (203, Netz/Smart Meter)
    und "Battery Base" (802, Akkuzellen).

    Entlade-/Ladeleistung (discharge_power/charge_power) sowie die
    kombinierte Lade-/Entladeleistung (charge_discharge_power) werden aus
    Register 40029 ("Wirkleistung Speicher Summe") abgeleitet. Die beiden
    getrennten Sensoren zeigen jeweils einen nichtnegativen Betrag und 0 W
    für die Gegenrichtung; der kombinierte Sensor erhält das Vorzeichen des
    Registers (positiv = Entladen, negativ = Laden). Die Smart-Meter-Leistung
    stammt aus Register 40072 ("Summenwirkleistung Netz"). Die Basic-Mode-
    Register 47 ("Leistung P des Speichers") und 48 ("Leistung des Smart
    Meters") werden nicht mehr gelesen.

    Vorzeichenkonvention von data["smartmeter_power"] (Standarddarstellung,
    nicht offiziell in modbus.pdf dokumentiert): NEGATIV = Einspeisung ins
    Netz (PV-Überschuss), POSITIV = Netzbezug. Das Rohregister selbst meldet
    das umgekehrte Vorzeichen (positiv bei Einspeisung) -
    domain.sunspec.decode_high_block negiert deshalb den skalierten Wert
    (ScaledField.negate) vor der Ablage in data["smartmeter_power"]; der Sensor "Netzleistung"
    (sensor.py) bleibt dabei ein reiner Durchreicher (_direct) und zeigt
    damit direkt den bereits negierten Wert. Alle Vergleiche gegen
    SMARTMETER_PV_SURPLUS_THRESHOLD_WATT (const.py) - PV-Überschuss-Prüfung
    und Netzbezug-Freigabe-Trigger der Max-SOC-Sperre in REQ-TIMED-SOC-
    CHARGE, Schritt b der Zustandsmaschine in REQ-GRID-SERVING-CHARGE sowie
    die Neutralpreis-Pausezone in REQ-DYNAMIC-PRICE-CHARGE - sind an diese
    Konvention angepasst.

    Dieselbe Negation gilt für die drei Phasenwerte data["grid_power_active_
    l1"/"_l2"/"_l3"] (Register 40073-40075, "Netzleistung L1/L2/L3") - sie
    teilen sich denselben Registerblock und damit dasselbe rohe Vorzeichen
    wie Register 40072, ihre Summe muss weiterhin data["smartmeter_power"]
    entsprechen. data["storage_power_active"] (Register 40029, anderes
    SunSpec-Modell "3Ph Inverter") ist davon unabhängig und folgt einer
    eigenen, unverändert gebliebenen Konvention (positiv = Entladung,
    negativ = Laden, siehe README.md "Bekannte Einschränkungen") -
    storage_power_apparent/storage_power_reactive sowie grid_power_apparent_
    sum/grid_power_reactive_sum (Schein-/Blindleistung) wurden ebenfalls
    nicht angefasst, da ihr Vorzeichen eine andere physikalische Bedeutung
    hat (kapazitiv/induktiv statt Einspeisung/Bezug) und nicht Teil dieser
    Betrachtung war.

    Die "Immediate Controls"-Werte bleiben zusätzlich als
    Nur-Lese-Diagnosesensoren verfügbar (ic_power_setpoint_pct,
    ic_timeout, ic_control_mode_text, ic_max_power_reference) - diese
    Sensoren zeigen den tatsächlichen Geräte-Zustand, unabhängig davon,
    ob er gerade von der Integration selbst gesetzt wurde.

    Der Basic-Mode-P-Sollwert (Register 41, Slave 64, absoluter
    Watt-Sollwert) wird nur noch gelesen und nicht mehr beschrieben. Auch
    start_grid_charge/stop_grid_charge verwendet den zentral arbitrierten
    SunSpec-Schreibpfad, siehe REQ-MANUAL-GRID-CHARGE.

    PV-Leistung (Register 40045) und das komplette Meter-Modell 203 sind
    laut modbus.pdf nur mit dem Smartmeter ADW200 vollständig verfügbar.
    Mit einem ADL400 sind die Netz-Register (Ströme, Spannungen,
    Leistungen) dennoch plausibel befüllt; nur PV-Leistung bleibt
    durchgehend 0.
  acceptance_criteria:
    - "modbus_llm.yaml dokumentiert den SunSpec-Modus-Block korrekt
       (Slave-ID 100, Offset -40000) und markiert die nicht mehr
       genutzten Basic-Mode-Register 47/48 als DEPRECATED."
    - "tests/test_coordinator.py, tests/test_integration_live.py und
       tests/test_real_hardware.py laufen gegen Slave-ID 100."
    - "tests/test_sensor_descriptions.py prüft für charge_discharge_power
       positive Entlade-, negative Lade-, Null- und unbekannte Werte."
    - "README.md und die Sensortabellen verwenden die aktuellen
       Sensor-Keys."
    - "tests/test_coordinator.py deckt die Vorzeichenkonvention von
       data[\"smartmeter_power\"] ab: ein positiver Rohregisterwert (via
       apply_typed_sunssf) ergibt einen negativen data-Wert (Einspeisung) und
       umgekehrt. tests/test_integration_live.py verifiziert denselben
       negierten Wert end-to-end am Sensorzustand."

# ==============================================================================
# ANFORDERUNG: SUNSPEC-DATENTYPEN UND NOT-IMPLEMENTED-SENTINELS
# ==============================================================================
requirement_sunspec_datatypes:
  id: REQ-SUNSPEC-DATATYPES
  title: "SunSpec-Datentypen (int16/uint16/enum16/bitfield16/sunssf) und ihre Not-Implemented-Sentinels korrekt decodieren"
  status: done
  description: >
    domain/registers.py::apply_sunssf() (ersetzt durch apply_typed_sunssf())
    wandelte früher JEDEN Rohwert pauschal mit to_signed16() um, obwohl
    modbus_llm.yaml pro Register einen eigenen Datentyp dokumentiert
    (uint16, int16, sunssf - alle als 16-Bit-Register, siehe SunSpec Device
    Information Model Specification V1.1, Abschnitt 6.4). Ein unsigniertes
    0x8001 wurde dadurch fälschlich zu -32767, ein 0xFFFF ("not
    implemented" bei unsignierten/enum-/bitfield-Typen) zu -1 statt zu
    "kein Messwert", und ein "not implemented"-Scale-Factor (0x8000 bei
    int16/sunssf) erzeugte über eine extreme Zehnerpotenz einen scheinbar
    plausiblen, aber falschen Wert nahe 0 statt eines erkennbar fehlenden
    Werts.

    domain/registers.py stellt jetzt reine, typisierte Decoder bereit:
    decode_int16 (Sentinel 0x8000 -> None), decode_uint16 (auch für
    enum16/bitfield16, Sentinel 0xFFFF -> None), decode_sunssf (= decode_int16,
    eigener Name für Lesbarkeit an den sunssf-Aufrufstellen), decode_bool16
    (0/1 als uint16, jeder andere Wert inkl. Sentinel -> None statt
    fälschlich True) sowie apply_typed_sunssf(raw_value, raw_scale_factor,
    *, signed=True), das Wert und Skalierungsfaktor VOR der Skalierung
    getrennt decodiert und bei jedem Sentinel None statt eines berechneten
    Werts liefert.

    Die deklarative Feldtabelle HIGH_BLOCK_FIELDS in domain/sunspec.py und
    decode_identity dort wählen für jedes Register signed=True/False anhand
    des in modbus_llm.yaml dokumentierten Datentyps (Quelle der Wahrheit, siehe
    REQ-SUNSPEC-MODE-CORRECTION - Abweichungen davon nur mit
    Vendor-/SunSpec-Beleg). storage_state/storage_event, ic_control_mode,
    battery_event sowie battery_charging_active (jetzt via decode_bool16)
    sind rohe Enum-/Bool-Register ohne Skalierung und werden dementsprechend
    direkt mit decode_int16/decode_uint16/decode_bool16 statt
    apply_typed_sunssf decodiert. ic_max_power_reference und ic_timeout
    (Register 40053/40050, unskalierte uint16-Rohwerte) werden ebenfalls
    über decode_uint16 geführt, statt einen Sentinel unbemerkt als riesigen
    Referenz-/Timeout-Wert zu übernehmen.

    SaxPowerCoordinator._watts_to_ic_setpoint_raw (REQ-TIMED-SOC-CHARGE)
    validierte den Skalierungsfaktor für Register 40049 bereits vor dieser
    Änderung explizit (Bereich -10..10, schließt den Sentinel -32768
    implizit aus) und bricht bei einem ungültigen
    ic_max_power_reference/Skalierungsfaktor mit HomeAssistantError vor
    jedem Schreibvorgang ab - das gilt unverändert weiter und profitiert
    zusätzlich davon, dass ic_max_power_reference jetzt bereits als
    decode_uint16-Ergebnis (None statt 65535) ankommt.

    Downstream (Energieakkumulation, PV-Überschuss-Hysterese aller drei
    Verwendungsstellen, Preisplanung, sensor.py/binary_sensor.py) prüfen
    die betroffenen data[...]-Werte bereits durchgehend auf None, bevor sie
    rechnen oder vergleichen (siehe REQ-EXTENDED-MODE-RESILIENCE) - ein
    durch einen Sentinel erzeugtes None reiht sich dort ein wie ein wegen
    nicht erreichbarem SunSpec-Modus fehlender Wert und löst weder eine
    Hysterese-Bestätigung noch einen Geräte-Write aus. Die Negation von
    smartmeter_power/grid_power_active_l1/l2/l3 (REQ-SUNSPEC-MODE-CORRECTION)
    prüft dafür explizit auf None, bevor sie das unäre Minus anwendet.
  acceptance_criteria:
    - "tests/test_coordinator.py deckt decode_int16/decode_uint16/
       decode_bool16/apply_typed_sunssf parametrisch ab: signiertes 0xFFFF
       -> -1, unsigniertes 0x8001 -> 32769, int16/sunssf-Sentinel 0x8000 ->
       None, uint16/enum16/bitfield16-Sentinel 0xFFFF -> None, ein
       Sentinel-Skalierungsfaktor an apply_typed_sunssf -> None (weder 0
       noch Exception), sowie ein Boolean-Sentinel an decode_bool16 -> None
       statt True."
    - "tests/test_sunspec_decoder.py::test_decode_high_block_decodes_all_models
       (normale Vendor-Beispielwerte, positiv und negativ) bleibt
       unverändert grün; tests/test_sunspec_mapping.py prüft die
       Signed/Unsigned-Wahl jedes Feldes zusätzlich parametrisch gegen
       modbus_llm.yaml."
    - "Ein eigener Testfall belegt, dass ein Sentinel in
       storage_power_active/smartmeter_power weder die Energieakkumulation
       noch eine PV-Überschuss-Hysterese fälschlich bestätigt."

# ==============================================================================
# ANFORDERUNG: ZEITGESTEUERTES LADEN AUF ZIEL-SOC
# ==============================================================================
requirement_timed_soc_charge:
  id: REQ-TIMED-SOC-CHARGE
  title: "Speicher innerhalb eines Zeitfensters auf einen festgelegten SOC laden, plus geräteunabhängige Max-SOC-Sperre"
  status: done
  description: >
    Zeitgesteuertes Laden und die Max-SOC-Sperre sind Software-Logik (kein
    natives Geräteregister für die Aktivierung selbst) und teilen sich mit
    der manuellen Netzladung (REQ-MANUAL-GRID-CHARGE), netzdienlichem und
    preisoptimiertem Laden eine zentrale Auswertung
    (SaxPowerCoordinator._async_enforce_grid_charge, bei jedem Poll-Zyklus
    sowie bei jeder Einstellungsänderung neu ausgewertet) sowie denselben
    SunSpec-Modus-Schreibpfad (_async_sun_charge_loop). Priorität pro
    Auswertung:

    1. Ist der SOC >= dem effektiven "Max. SOC" (number.py; während der
       periodischen Zellkalibrierung temporär 100 %, siehe
       REQ-PERIODIC-FULL-CALIBRATION), hält der Coordinator Register
       40051 (Steuermodus) auf 1 (Sollwertvorgabe) und Register 40049
       (Leistungsvorgabe) auf 0 % - UNABHÄNGIG davon, ob zeitgesteuertes
       Laden aktiviert ist (z. B. auch bei einem durch PV-Überschuss vollen
       Speicher). Das verhindert dauerhaftes Volladen auf 100 % zugunsten
       der Batterie-Lebensdauer; der Speicher entlädt sich währenddessen
       nicht automatisch zur Eigenverbrauchsdeckung, da Register 40049 = 0 %
       Netto-Leistungsfluss = 0 (weder Laden noch Entladen) erzwingt.

       Beide Software-Einstellungen dieses Abschnitts ("Max. SOC",
       "Netzladung Min. SOC") werden von ihrem jeweiligen Coordinator-Setter
       (async_set_max_soc/async_set_timed_charge_min_soc,
       coordinator._clamp_int) auf ihren gültigen Bereich geklemmt (0-100 %),
       nicht nur vom NumberEntity-Schieberegler in der Oberfläche - der reguläre
       Service-Call-Pfad (async_set_native_value) ist dadurch zwar bereits
       über native_min_value/native_max_value abgesichert, der
       RestoreEntity-Pfad beim Neustart (async_added_to_hass) ruft den
       Coordinator-Setter jedoch direkt mit dem gespeicherten Zustand auf,
       ohne diese Validierung zu durchlaufen - ein korrupter oder aus einer
       künftigen Version mit engeren Grenzen stammender gespeicherter Wert
       würde sonst ungeprüft übernommen.

       Wurde der Ziel-SOC dabei INNERHALB des Netzladung- oder des
       netzdienlichen Zeitfensters erreicht (_max_soc_hold_is_window_bound),
       gilt die Sperre nur bis zum Ende genau dieses Zeitfensters: Register
       40051 wird bis dahin periodisch auf 1 nachgeschrieben (Timeout siehe
       Register 40050/REG_SUN_IC_TIMEOUT), danach aktiv auf 0 zurückgesetzt,
       damit der Speicher wieder von der geräteeigenen SmartMeter-
       Nullregelung gesteuert wird - ohne diesen aktiven Rücksprung bliebe
       die Sperre unbegrenzt bestehen, da ein gehaltener 0-%-Sollwert den
       SOC nie von selbst unter den Zielwert fallen lässt.

       Wurde der Ziel-SOC dagegen AUSSERHALB jedes Zeitfensters erreicht
       (z. B. rein durch PV-Überschuss via Nullregelung, ohne aktives
       zeitgesteuertes oder netzdienliches Laden), gilt die Sperre
       grundsätzlich unbegrenzt - ABER: da ein gehaltener 0-%-Sollwert auch
       hier den SOC im Normalfall nie von selbst unter den Zielwert fallen
       lässt (der Speicher deckt den Hausverbrauch währenddessen nicht mit,
       siehe oben), wertet der Coordinator zusätzlich am Smart Meter
       gemessenen Netzbezug (data["smartmeter_power"] >
       SMARTMETER_PV_SURPLUS_THRESHOLD_WATT, also mehr als 50 W Bezug -
       siehe Vorzeichenkonvention weiter unten unter "PV-Überschuss-
       Prüfung") als weiteren Freigabe-Trigger aus, mit derselben einheitlichen
       Zyklen-Hysterese (self._max_soc_grid_import_wait_cycles, siehe unten
       "PV-Überschuss-Prüfung") gegen kurze Lastspitzen: erst wenn
       PV_SURPLUS_HYSTERESIS_CYCLES aufeinanderfolgende Aufrufe von
       _async_enforce_grid_charge Netzbezug über dem Schwellwert melden,
       wird Register 40051 aktiv auf 0 zurückgesetzt. Gleichzeitig setzt der
       Coordinator den Freigabe-Latch
       self._max_soc_released_for_discharge: Solange der SOC weiterhin auf
       oder über dem wirksamen Zielwert liegt, bleibt die SmartMeter-
       Nullregelung danach freigegeben und weitere Polls starten weder einen
       neuen 0-%-Task noch schreiben sie Register 40051 erneut auf Modus 1.
       Dadurch kann der Speicher den Hausverbrauch tatsächlich decken, statt
       nach jeweils zwei Polls zwischen Freigabe und Sperre zu flattern.
       max_soc_clamped ist während dieser Freigabe False und entspricht damit
       dem tatsächlich gehaltenen Gerätemodus. Erst ein real gemessener SOC
       unter dem wirksamen Zielwert löscht den Latch; eine spätere neue
       Überschreitung aktiviert die Sperre wieder.

       Änderungen des wirksamen Zielwerts berücksichtigen denselben Latch:
       Eine Zielerhöhung unter den weiterhin höheren aktuellen SOC behält die
       Freigabe bei, eine Zielabsenkung löscht sie als neue Überschreitung.
       Das gilt sowohl für async_set_max_soc als auch für Beginn und Ende der
       periodischen Zellkalibrierung (effektiver Zielwert temporär 100 %).
       Die separate Zeitfensterbindung (_max_soc_hold_is_window_bound) bleibt
       davon unberührt und hält bzw. beendet ihre Sperre weiterhin am
       jeweiligen Fensterende.

       Ohne den Netzbezug-Trigger
       würde die Sperre in diesem Fall de facto dauerhaft bestehen bleiben
       und der Hausverbrauch dauerhaft aus dem Netz statt aus dem Speicher
       gedeckt, bis der Nutzer manuell eingreift (z. B. "Max. SOC" ändert).
       Der Zähler wird bei fehlendem oder unter dem Schwellwert liegendem
       smartmeter_power sowie beim Verlassen dieses Zweigs (SOC unter
       Zielwert, Wechsel in einen zeitfenstergebundenen Zustand) auf 0
       zurückgesetzt.
    2. Andernfalls hat ein aktiver, strikt negativer manueller
       Netzladeauftrag Vorrang vor allen Automatiken, siehe
       REQ-MANUAL-GRID-CHARGE.
    3. Andernfalls: Ist zeitgesteuertes Laden aktiviert (switch.py,
       "Netzladung aktiv"), die aktuelle Uhrzeit innerhalb des
       konfigurierten Zeitfensters (time.py, "Start"/"Ende", HH:MM, darf
       über Mitternacht laufen), im aktiven Monat, "Netzladung Min. SOC"
       (number.py, siehe unten) gesetzt UND unterschritten (bzw. bereits
       zuvor unterschritten und noch nicht bis "Max. SOC" durchgeladen -
       siehe Hysterese unten) UND kein über die einheitliche
       Zyklen-Hysterese (siehe unten "PV-Überschuss-Prüfung") bestätigter
       PV-Überschuss über SMARTMETER_PV_SURPLUS_THRESHOLD_WATT (const.py,
       50 W) am Smart Meter gemessen, wird Register 40049 auf den maximal
       möglichen negativen Sollwert gesetzt (MIN_SETPOINT_POWER, sättigt in
       _watts_to_ic_setpoint_raw auf -100 %) - eine frühere, konfigurierbare
       "Max. Netzladeleistung" (number.py, SaxPowerChargeLimitNumber) wurde
       entfernt, weil der eingestellte Watt-Wert in der Praxis keinen
       Einfluss auf die tatsächliche Ladeleistung hatte (er sättigte
       ohnehin fast immer auf denselben Prozentwert).

       "Netzladung Min. SOC" (self._timed_charge_min_soc, NumberEntity
       SaxPowerTimedChargeMinSocNumber, 0-100 %): unterer SOC-Schwellwert,
       unterhalb dessen die Netzladung starten darf - im Unterschied zu
       "Max. SOC" (oberes, geräteunabhängiges Ziel, s. o., von Netzladung
       UND netzdienlichem Laden gemeinsam genutzt) eine reine
       Netzladung-Einstellung, da nur Netzladung aktiv aus dem Netz lädt und
       daher einen Schwellwert braucht, ab dem sich das lohnt.
       SaxPowerCoordinator._timed_charge_armed hält als Hysterese fest, ob
       der Schwellwert bereits unterschritten wurde: sobald current_soc <
       "Netzladung Min. SOC", wird _timed_charge_armed auf True gesetzt und
       bleibt es (auch wenn der SOC danach wieder über "Netzladung Min.
       SOC" steigt), bis der SOC "Max. SOC" erreicht/überschreitet (dann
       zurück auf False) - Netzladung lädt also einmal gestartet bis "Max.
       SOC" durch, statt bei jedem erneuten Überschreiten von "Netzladung
       Min. SOC" sofort wieder abzubrechen. Ohne vorherige Einstellung (z.
       B. direkt nach der Ersteinrichtung) steht der Wert auf
       DEFAULT_TIMED_CHARGE_MIN_SOC (const.py, 20 %,
       SaxPowerTimedChargeMinSocNumber.async_added_to_hass) statt auf 0
       oder "unbekannt" - ein bereits sinnvoll nutzbarer Schwellwert statt
       eines faktisch inaktiven 100-%-Defaults, mit dem Netzladung bei der
       Ersteinrichtung nie von selbst armt, bis der Anwender ihn bewusst
       ändert.
    4. Andernfalls stoppt die Netzladung: Register 40051 wird aktiv zurück
       auf 0 (SmartMeter-Nullregelung) gesetzt, statt nur passiv auf den
       geräteseitigen Timeout zu warten. Das umfasst neben Fensterende/
       Deaktivierung auch den Fall, dass
       während eines laufenden Zeitfensters PV-Überschuss über dem
       Schwellwert über die einheitliche Zyklen-Hysterese (siehe unten)
       bestätigt wird - die Netzladung wird dann innerhalb weniger
       Poll-Zyklen (nicht erst am Fensterende) beendet, weil in diesem Fall
       die geräteeigene SmartMeter-Nullregelung den PV-Überschuss ohnehin
       bereits selbst zum Laden nutzt.

    PV-Überschuss-Prüfung: Grundlage ist data["smartmeter_power"] (SunSpec-
    Modus, Register 40072 "Summenwirkleistung Netz", REG_SUN_METER_
    POWER_ACTIVE_SUM) - derselbe Wert, der auch im Sensor "Netzleistung"
    angezeigt wird (sensor.py, unverändert via _direct). Vorzeichenkonvention
    (Standarddarstellung, nicht offiziell in modbus.pdf dokumentiert, siehe
    REQ-SUNSPEC-MODE-CORRECTION): ein NEGATIVER Anzeigewert bedeutet
    Überschuss aus der Dachphotovoltaik (Einspeisung ins Netz), ein
    POSITIVER Anzeigewert Netzbezug; der rohe Registerinhalt meldet dagegen
    das umgekehrte Vorzeichen, weshalb domain.sunspec.decode_high_block
    den skalierten Wert beim Einlesen negiert (nicht sensor.py - der Sensor
    bleibt ein reiner Durchreicher, siehe _direct). Ist der Wert (noch)
    nicht verfügbar (z. B. SunSpec-Modus nicht erreichbar), blockiert das
    die Netzladung nicht. Der Schwellwert
    SMARTMETER_PV_SURPLUS_THRESHOLD_WATT (const.py) ist bewusst als eigene,
    wiederverwendbare Konstante ausgelagert (50 W), da er absehbar auch an
    anderer Stelle für eine PV-Überschuss-Erkennung benötigt wird.

    Zyklen-Hysterese (einheitlich): JEDER Vergleich gegen
    SMARTMETER_PV_SURPLUS_THRESHOLD_WATT - hier der PV-Überschuss-Check von
    Punkt 2/3 sowie der Netzbezug-Freigabe-Trigger der Max-SOC-Sperre von
    Punkt 1, außerdem (siehe REQ-GRID-SERVING-CHARGE) Schritt a und b der
    Zustandsmaschine für netzdienliches Laden - läuft über dieselbe
    wiederverwendbare Hilfsmethode SaxPowerCoordinator._cycles_confirmed und
    dieselbe Konstante PV_SURPLUS_HYSTERESIS_CYCLES (const.py, 2): eine
    Schwellwert-Über-/Unterschreitung zählt erst als bestätigt, nachdem sie
    in so vielen aufeinanderfolgenden Poll-Zyklen in Folge vorlag; ein
    einzelner gegenteiliger Messwert setzt den jeweiligen Zähler (je
    Verwendungsstelle ein eigenes self-Attribut, z. B.
    self._timed_charge_pv_surplus_cycles,
    self._max_soc_grid_import_wait_cycles,
    self._grid_serving_charge_confirm_cycles,
    self._grid_serving_release_confirm_cycles) sofort auf 0 zurück. Schützt
    einheitlich gegen kurze Lastspitzen/Messausreißer am Smart Meter, statt
    dass jede Verwendungsstelle unmittelbar auf einen einzelnen Messwert
    reagiert.

    Schreibmechanismus (SunSpec-Modus, Slave-ID 100, Modell 123
    "Immediate Controls", siehe modbus_llm.yaml): Erst Register 40051 auf 1
    (Sollwertvorgabe), danach Register 40049 (Leistungsvorgabe, Prozent der
    Referenz-Maximalleistung Register 40053; SaxPowerCoordinator.
    _watts_to_ic_setpoint_raw; negativ=Laden - Vorzeichenkonvention laut
    modbus.pdf nicht dokumentiert, hier analog zum Basic-Mode-P-Sollwert
    angenommen. Die Integration schreibt hier bewusst nur nicht positive
    Werte: negative Ladesollwerte oder 0 für Max-SOC-Sperre/Ladepausen -
    siehe REQ-MANUAL-DISCHARGE zum Befund bei positiven (entladenden)
    Sollwerten). Beide Register werden periodisch
    neu geschrieben (SaxPowerCoordinator._sun_ic_write_interval: die Hälfte
    des von Register 40050 gemeldeten Timeouts, gedeckelt auf 30s,
    mindestens alle 5s), da das Gerät den Sollwert sonst nach Ablauf des
    Timeouts verwirft.

    Jeder Start und jede sofortige Sollwertänderung validiert vor dem ersten
    Modbus-Write die positive, endliche Referenz-Maximalleistung, den
    SunSpec-Skalierungsfaktor (-10..10), den Watt-Bereich sowie den daraus
    berechneten int16-Rohwert für Register 40049. Erst danach wird 40051 = 1
    und anschließend 40049 geschrieben. Scheitert der zweite Write, versucht
    derselbe Fehlerpfad unmittelbar 40051 = 0 zurückzuschreiben und meldet
    den ursprünglichen Fehler zusammen mit dem Rollback-Ergebnis als
    HomeAssistantError. Ein fehlgeschlagener Rollback hält
    _sun_charge_reset_required gesetzt, bis ein späterer inaktiver Poll die
    SmartMeter-Nullregelung quittiert; Task und Aktivstatus werden nach einer
    unvollständigen Sequenz nicht veröffentlicht bzw. beendet. Dadurch kann
    weder eine Vorvalidierung noch ein schlafender Task das Gerät mit einem
    alten oder undefinierten Sollwert in Modus 1 zurücklassen. Ein eigener
    Sequenz-Lock verhindert außerdem, dass periodische Wiederholung und
    sofortige Änderung ihre jeweiligen 40051/40049-Writes verschachteln.

    Der Basic-Mode-P-Sollwert (Register 41) wird nur noch als Diagnosewert
    gelesen. Der manuelle start_grid_charge/stop_grid_charge-Service ist ein
    Adapter auf denselben zentralen SunSpec-Pfad und erlaubt ausschließlich
    negative Ladesollwerte, siehe REQ-MANUAL-GRID-CHARGE. Die Integration
    liest/schreibt die Basic-Mode-
    Register 43/44 (Ent-/Ladeleistungsgrenzwert) nicht mehr - eine frühere
    Software-Einstellung "Max. Netzladeleistung" (number.py,
    SaxPowerChargeLimitNumber), die Register 44 einmalig als Vorgabewert
    gelesen hat, wurde entfernt: der eingestellte Watt-Wert hatte in der
    Praxis keinen Einfluss auf die tatsächliche Ladeleistung. Zeitgesteuertes
    und preisoptimiertes Laden fordern stattdessen immer die maximal
    mögliche Ladeleistung an (siehe Punkt 2 oben).

    "Max. SOC" und "Netzladung Min. SOC" sind reine Software-Zustände
    (RestoreEntity, number.py) - "Max. SOC" ist dabei eine zentrale, von
    Netzladung UND netzdienlichem Laden gemeinsam genutzte Einstellung,
    "Netzladung Min. SOC" ist eine reine Netzladung-Einstellung (siehe
    oben). Eine Änderung wirkt jeweils sofort (async_set_max_soc/
    async_set_timed_charge_min_soc werten _async_enforce_grid_charge
    unmittelbar neu aus statt erst beim nächsten Poll-Zyklus). Beide
    persistieren über Neustarts hinweg; gibt es (z. B. direkt nach der
    Ersteinrichtung) noch keinen gespeicherten Zustand, setzen sie sich
    explizit auf MAX_SOC (100 %,
    SaxPowerMaxSocNumber/SaxPowerTimedChargeMinSocNumber.
    async_added_to_hass) statt "unbekannt"/0 zu bleiben.

    Aktiviert-Zustand sowie Start-/Endzeit des zeitgesteuerten Ladens
    ("Netzladung aktiv"/"Start"/"Ende", time.py) werden ebenfalls über
    Neustarts hinweg persistiert. Maßgeblich ist dafür der versionierte
    Konfigurations-Store, der bereits vor dem ersten steuernden Refresh
    vollständig geladen wird; die RestoreEntity-Zustände sind nur noch der
    einmalige Migrationspfad für Einträge ohne Store (siehe
    REQ-CONTROL-CONFIG-BOOTSTRAP).
    Zusätzlich zeigt ein Diagnose-Sensor ("Zeitgesteuertes Laden aktiv") an,
    ob gerade zeitgesteuert nachgeladen wird - unabhängig von der
    Max-SOC-Sperre.

    Vorbelegung beim allerersten Start eines neuen Eintrags: Der
    Ersteinrichtungs-Dialog (config_flow.py) fragt nach der
    Verbindungsvalidierung einen zweiten, optionalen Schritt
    ("grid_charge") ab - Zeitfenster-Start/-Ende und Aktiviert-Status,
    alle Felder optional. Werden sie nicht ausgefüllt, gelten die Defaults
    DEFAULT_TIMED_CHARGE_START ("00:00:00"), DEFAULT_TIMED_CHARGE_END
    ("00:05:00") und DEFAULT_TIMED_CHARGE_ENABLED (False). Die im Config
    Entry gespeicherten Werte wirken sich über
    entity.initial_config_value ausschließlich dann aus, wenn die
    jeweilige RestoreEntity noch keinen gespeicherten Vorzustand hat (siehe
    SaxPowerTimedChargeSwitch/-StartTime/-EndTime.async_added_to_hass) -
    ein späterer Reconfigure-Flow (der diese Schlüssel nicht im Config
    Entry aktualisiert) hat darauf keinen Einfluss mehr, sobald einmal ein
    echter Zustand gespeichert wurde.
  acceptance_criteria:
    - "tests/test_coordinator.py deckt _is_time_in_window (normales
       Fenster, über Mitternacht laufendes Fenster, nicht gesetztes
       Fenster), _async_enforce_grid_charge (Start/Stop des
       zeitgesteuerten Ladens bei Zielerreichung/Fensterende/
       Deaktivierung SOWIE die Max-SOC-Sperre unabhängig vom
       zeitgesteuerten Laden - Aktivierung bei Zielerreichung, Freigabe
       beim Unterschreiten), die Watt-zu-Prozent-Umrechnung (inkl.
       Klemmung auf ±100 %) sowie das Schreibintervall
       (_sun_ic_write_interval) ab."
    - "Gezielte Schreibpfadtests prüfen: fehlende/0-Referenzleistung und
       ungültiger Scale Factor ohne jeden Write; Fehler auf 40051 ohne
       Sollwert-Write; Fehler auf 40049 mit unmittelbarer Reihenfolge
       40051=1, 40049, 40051=0; erfolgreichen und fehlgeschlagenen Rollback,
       offenen Rücksetzauftrag bis zum nächsten quittierten Reset sowie
       fehlenden Task/Aktivstatus nach unvollständigem Start und sofortiger
       Sollwertänderung."
    - "tests/test_coordinator.py deckt zusätzlich den Netzbezug-Freigabe-
       Trigger der geräteunabhängigen (nicht zeitfenstergebundenen)
       Max-SOC-Sperre ab: keine Freigabe bei nur einem Zyklus Netzbezug über
       dem Schwellwert (Hysterese hält die Sperre), Freigabe erst nach zwei
       aufeinanderfolgenden Zyklen, Zurücksetzen des Zählers bei einem
       Zyklus ohne (oder mit zu geringem) Netzbezug zwischen zwei
       Netzbezug-Zyklen, sowie unveränderter Ablauf (Sperre bleibt
       unbegrenzt bestehen) bei fehlendem smartmeter_power. Nach bestätigter
       Freigabe prüfen mindestens fünf weitere Polls bei SOC >= Zielwert,
       dass kein erneuter Modus-1-/0-%-Write erfolgt. Weitere Tests decken
       Löschen des Latch unterhalb des Zielwerts, erneutes Klemmen bei einer
       späteren Überschreitung, Beibehalten bei Zielerhöhung, Löschen bei
       Zielabsenkung und unveränderte Zeitfensterbindung ab."
    - "tests/test_coordinator.py deckt zusätzlich die PV-Überschuss-Prüfung
       ab: kein Start des zeitgesteuerten Ladens im Zeitfenster bei
       smartmeter_power unter -SMARTMETER_PV_SURPLUS_THRESHOLD_WATT (negativ
       = Einspeisung, siehe Vorzeichenkonvention oben), aktives Beenden einer
       bereits laufenden Netzladung, sobald der Schwellwert über
       PV_SURPLUS_HYSTERESIS_CYCLES aufeinanderfolgende Zyklen mitten im
       Zeitfenster über-/unterschritten wird (ein einzelner Zyklus reicht
       noch nicht, Zurücksetzen des Zählers bei einem Zyklus ohne
       Über-/Unterschreitung zwischendurch), normales Laden bei
       smartmeter_power auf/über -Schwellwert (inkl. positiver Werte =
       Netzbezug) sowie unveränderter Ablauf, wenn smartmeter_power fehlt
       (SunSpec-Modus nicht erreichbar)."
    - "tests/test_integration_live.py enthält End-to-End-Tests, die über
       echte Modbus-TCP-Kommunikation verifizieren, dass Aktivieren des
       zeitgesteuerten Ladens innerhalb des Zeitfensters Register 40051 auf
       Sollwertvorgabe und Register 40049 auf den erwarteten (maximal
       möglichen) Sollwert setzt (und Deaktivieren Register 40051 wieder
       auf SmartMeter-Nullregelung zurücksetzt), dass die Max-SOC-Sperre
       unabhängig davon Register 40049 auf 0 % hält, sowie Tests für die
       Vorbelegung aus dem Config Entry beim allerersten Start (mit und
       ohne hinterlegte Netzladung-Werte) und für den Max.-SOC-Default."
    - "tests/test_config_flow.py deckt den zweistufigen Ersteinrichtungs-
       Flow ab: Defaults bei leerem zweiten Schritt sowie explizit
       angegebene Werte."
    - "number.py enthält keine featurespezifische Leistungseinstellung für
       zeitgesteuertes Laden - weder eine eigene Watt-Einstellung (Ladung
       erfolgt immer mit maximal möglicher Leistung) noch eine eigene
       Ziel-SOC-Einstellung (nutzt die zentrale 'Max. SOC')."
    - "tests/test_coordinator.py deckt coordinator._clamp_int isoliert ab
       (Wert innerhalb/genau auf den Grenzen/außerhalb in beide Richtungen/
       None bleibt None). tests/test_number.py deckt zusätzlich den
       RestoreEntity-Regressionsfall für beide betroffenen Einstellungen
       ab: ein außerhalb [MIN_SOC, MAX_SOC] liegender wiederhergestellter
       Wert wird beim Neustart auf die jeweilige Grenze geklemmt statt
       ungeprüft übernommen zu werden."

# ==============================================================================
# ANFORDERUNG: MANUELLE NETZLADUNG ÜBER DEN ZENTRALEN STEUERPFAD
# ==============================================================================
requirement_manual_grid_charge:
  id: REQ-MANUAL-GRID-CHARGE
  title: "Manueller Netzladeservice als sicherer Adapter auf die zentrale SunSpec-Steuerung"
  status: done
  description: >
    Die Aktionen sax_power.start_grid_charge und
    sax_power.stop_grid_charge stellen eine nicht persistierte manuelle
    Netzladung für Automationen bereit. start_grid_charge verlangt device_id
    und einen ganzzahligen, strikt negativen Watt-Sollwert von -32768 bis -1.
    Boolesche Werte, nicht ganzzahlige Werte, 0, positive Werte und Werte
    außerhalb dieses Gerätegrenzbereichs werden vor jedem Modbus-Write als
    übersetzbare ServiceValidationError (translation_domain sax_power,
    translation_key invalid_grid_charge_power) abgelehnt. Eine positive
    manuelle Entladung bleibt ausgeschlossen (REQ-MANUAL-DISCHARGE).

    Der Service schreibt Register 41 (Basic Mode) nicht. Er hinterlegt nur
    den manuellen Ladeauftrag und wertet unter _charge_control_lock sofort
    SaxPowerCoordinator._async_enforce_grid_charge_locked aus. Die
    verbindliche Gesamtpriorität lautet: Max-SOC-Sperre > manuelle
    Netzladung > zeitgesteuertes Laden > netzdienliches Laden >
    preisoptimiertes Laden. Alle Quellen steuern ausschließlich den einen
    gemeinsamen SunSpec-Writer (_sun_charge_task) für Register 40051/40049;
    _sun_charge_write_lock hält jede Mode-/Sollwertsequenz unteilbar.
    async_start_sun_charge selbst akzeptiert als zusätzliche innere
    Sicherheitsgrenze nur Werte von MIN_SETPOINT_POWER bis 0.

    Liegt der SOC unter dem wirksamen Max-SOC, wartet ein erstmaliger Start
    die vollständige Sequenz 40051 = 1 und 40049 = berechneter negativer
    Sollwert ab. Erst nach beiden Quittungen gilt der Auftrag als
    erfolgreich; Vorvalidierungs- oder Schreibfehler werden an den
    Service-Aufruf zurückgegeben und ein neuer Auftrag wird nicht als aktiv
    veröffentlicht. Ändert start_grid_charge einen bereits laufenden
    Sollwert, schreibt der gemeinsame Pfad die neue Sequenz sofort, ohne bis
    zum periodischen Wiederholungsintervall zu warten. Ist der wirksame
    Max-SOC erreicht, gewinnt stattdessen die Sperre und der Start wartet
    deren 40051=1-/40049=0-Sequenz ab, während der manuelle Auftrag bis zu
    stop_grid_charge vorgemerkt bleibt; eine negative Ladeleistung darf in
    diesem Zustand nie gewinnen.

    stop_grid_charge läuft ebenfalls vollständig unter
    _charge_control_lock. Die Aktion löscht den manuellen Auftrag, storniert
    den gemeinsamen SunSpec-Task, wartet dessen tatsächliches Ende auch bei
    einem gleichzeitig laufenden Schreibabschnitt ab und versucht danach
    Register 40051 aktiv auf 0 (SmartMeter-Nullregelung) zurückzusetzen. Erst
    anschließend wird die zentrale Entscheidung erneut ausgewertet, sodass
    eine weiterhin berechtigte Automatik übernehmen darf. Hat ein
    unvollständiger manueller Start seinen Auftrag bereits verworfen, aber
    nach quittiertem 40051=1 sowohl den 40049-Write als auch den
    Modus-0-Rollback verloren, arbeitet stop_grid_charge den offenen
    _sun_charge_reset_required-Auftrag auch ohne sichtbaren manuellen Auftrag
    ab. Das gilt nur, wenn kein gemeinsamer SunSpec-Writer mehr tatsächlich
    läuft; ein Stop ohne manuellen Auftrag unterbricht dadurch keine laufende
    Automatik und stößt nach einem reinen Fehler-Reset auch keine neu an.

    async_shutdown beendet zuerst Polling und Planner, erwirbt anschließend
    denselben _charge_control_lock, löscht den manuellen Auftrag, storniert
    und erwartet den gemeinsamen Writer und versucht bestmöglich 40051 = 0.
    Während des Shutdowns wird keine Automatik erneut ausgewertet; danach
    existiert kein schreibender Hintergrundtask mehr.
  acceptance_criteria:
    - "tests/test_init.py prüft den echten Service-Aufruf für negative Werte
       außerhalb des int16-Bereichs, 0 und positive Werte: übersetzbare
       ServiceValidationError und kein Modbus-Write."
    - "tests/test_coordinator.py prüft zusätzlich boolesche und gebrochene
       Werte, sichtbare Fehler beim ersten 40051-Write, ausschließlich
       40051/40049 beim Start sowie die sofortige Sollwertänderung."
    - "Coordinator-Tests belegen die Priorität Max-SOC > manuell >
       Automatiken, die Freigabe einer berechtigten Automatik nach Stop,
       den erfolgreichen Stop nach fehlgeschlagenem 40049-Write und ebenfalls
       fehlgeschlagenem Rollback, den Schutz einer tatsächlich laufenden
       Automatik, abgewartete Cancellation während eines Schreibabschnitts
       sowie einen Shutdown ohne verbleibenden Auftrag oder Writer."
    - "tests/test_integration_live.py verifiziert end-to-end, dass
       start_grid_charge Register 41 unverändert lässt, 40051/40049 setzt
       und stop_grid_charge 40051 auf SmartMeter-Nullregelung zurücksetzt."

# ==============================================================================
# ANFORDERUNG: NETZDIENLICHES LADEN (NUR MIT PV-ÜBERSCHUSS)
# ==============================================================================
requirement_grid_serving_charge:
  id: REQ-GRID-SERVING-CHARGE
  title: "Netzdienliches Laden: Speicher innerhalb eines eigenen Zeitfensters mit eigenen aktiven Monaten bei einsetzendem PV-Laden aktiv stoppen, um das Laden in die ertragsreichste Zeit zu verschieben"
  status: done
  description: >
    Eigenständiges Software-Feature (Schalter "Netzdienliches Laden aktiv",
    switch.py, sowie Zeitfenster "Start"/"Ende", time.py), das sich mit
    zeitgesteuertem Laden (REQ-TIMED-SOC-CHARGE) den SunSpec-Modus-
    Schreibpfad (_async_sun_charge_loop), die zentrale Einstellung "Max.
    SOC" (Ziel-SOC) sowie die Max-SOC-Sperre teilt - siehe
    SaxPowerCoordinator._async_enforce_grid_charge/_async_step_grid_serving.
    Netzdienliches Laden schreibt nie einen Sollwert > 0. Im Unterschied zum
    zeitgesteuerten Laden schreibt netzdienliches Laden selbst NIE einen aus
    dem PV-Überschuss berechneten Ladesollwert, sondern überlässt die
    eigentliche Ladung der geräteeigenen SmartMeter-Nullregelung (Register
    40051 = 0), die von sich aus nur mit echtem PV-Überschuss lädt. Die
    Software greift als eigene Zustandsmaschine (_async_step_grid_serving)
    nur ein, um die Ladung innerhalb des konfigurierten Zeitfensters gezielt
    zu unterbrechen, sobald ein Ladevorgang erkannt wurde - Zweck: der
    Speicher soll den PV-Überschuss während dieses Zeitfensters NICHT selbst
    verbrauchen, damit das Laden stattdessen in die Zeit mit dem höchsten
    PV-Ertrag verschoben wird:

    a. Ohne aktiven Sollwertvorgabemodus wird die tatsächliche Ladeleistung
       des SAX geprüft (negativer Anteil von data["storage_power_active"],
       siehe sensor.py "SAX Ladeleistung"/_negative_part). Erreicht oder
       überschreitet sie SMARTMETER_PV_SURPLUS_THRESHOLD_WATT (50 W, Beweis,
       dass die Nullregelung bereits mit nennenswertem Überschuss lädt) über
       PV_SURPLUS_HYSTERESIS_CYCLES aufeinanderfolgende Zyklen (dieselbe
       einheitliche Zyklen-Hysterese wie bei REQ-TIMED-SOC-CHARGE, siehe
       dort "PV-Überschuss-Prüfung"; self._grid_serving_charge_confirm_
       cycles), wechselt der Speicher aktiv in den Sollwertvorgabemodus UND
       die Ladung wird in demselben Aufruf auf 0 % gestoppt (Register 40049,
       async_start_sun_charge(0)). Danach werden zusätzlich einmalig
       PV_SURPLUS_HYSTERESIS_CYCLES weitere Aktualisierungszyklen abgewartet
       (self._grid_serving_wait_cycles), bevor Schritt b ausgewertet wird,
       damit sich Moduswechsel und gestoppter Sollwert am Gerät setzen
       können.
    a.1 Netzbezugs-Schutz, mit aktivem Sollwertvorgabemodus, UNABHÄNGIG von
       den Wartezyklen aus Schritt a (self._grid_serving_import_confirm_
       cycles): Solange der Sollwert bei 0 % gehalten wird, fließt kein
       Ladestrom mehr in den Speicher - deckt der Hausverbrauch die
       PV-Erzeugung nicht mehr, entsteht dadurch Netzbezug, den die
       geräteeigene Nullregelung sonst durch eigenständiges Entladen
       abfangen würde. Deshalb wird data["smartmeter_power"] zusätzlich,
       bereits während der Wartezyklen aus Schritt a, auf tatsächlichen
       Netzbezug geprüft (positiver Wert über
       SMARTMETER_PV_SURPLUS_THRESHOLD_WATT, siehe Vorzeichenkonvention in
       REQ-SUNSPEC-MODE-CORRECTION), ebenfalls über dieselbe
       PV_SURPLUS_HYSTERESIS_CYCLES-Zyklen-Hysterese. Bleibt der Netzbezug
       so viele Zyklen in Folge über dem Schwellwert, wird der Speicher
       sofort aktiv zurück in die SmartMeter-Nullregelung gesetzt
       (async_stop_sun_charge, Register 40051 zurück auf 0) - dieser
       Schutz hat Vorrang vor und durchbricht dabei die Wartezyklen-
       Unterdrückung, unter der Schritt b sonst steht. Der Speicher lädt
       dadurch weiterhin nicht (kein PV-Überschuss vorhanden, sonst läge
       kein Netzbezug vor), entlädt sich aber smartmeter-gesteuert über die
       geräteeigene Nullregelung, um den Netzbezug zu vermeiden. Fällt der
       Netzbezug anschließend wieder unter den Schwellwert, wertet die
       Zustandsmaschine ab dem nächsten Zyklus wieder regulär ab Schritt a
       - bei weiterhin ausreichender SAX-Ladeleistung greift Schritt a nach
       erneuten PV_SURPLUS_HYSTERESIS_CYCLES Zyklen wieder ein.
    b. Erst mit aktivem Sollwertvorgabemodus (Wartezyklen abgelaufen, ohne
       durch Schritt a.1 bestätigten Netzbezug) wird die am Smart Meter
       gemessene Netzeinspeisung (data["smartmeter_power"]) gegen denselben
       Schwellwert geprüft, ebenfalls über dieselbe Zyklen-Hysterese
       (self._grid_serving_release_confirm_cycles). Fällt sie über so viele
       aufeinanderfolgende Zyklen darunter, wird der Speicher aktiv zurück
       in die SmartMeter-Nullregelung gesetzt (async_stop_sun_charge,
       Register 40051 zurück auf 0). Bleibt die Einspeisung mindestens beim
       Schwellwert (oder ist der Messwert gerade nicht bekannt, oder reißt
       die Unterschreitung zwischendurch wieder ab), bleibt die Ladung
       bewusst bei 0 % gehalten - der Speicher soll hier gezielt erst wieder
       laden, sobald ein Zeitpunkt mit dauerhaft gefallener Einspeisung
       erreicht ist, statt fortlaufend mit dem Überschuss mitzulaufen.

    Eigentumsübergabe vor Schritt a: Ist das effektive Ladepausenfenster
    freigegeben, self._grid_serving_setpoint_active aber noch False, setzt der
    Coordinator den gemeinsam genutzten SunSpec-Pfad zuerst ausdrücklich in
    die SmartMeter-Nullregelung (async_stop_sun_charge), bevor
    _async_step_grid_serving die reale SAX-Ladeleistung auswertet. Dadurch kann
    kein 0-%-Task einer zuvor höher priorisierten Max-SOC-Sperre ohne logischen
    Eigentümer weiterlaufen, wenn der konfigurierte Max-SOC angehoben oder der
    effektive Max-SOC durch die periodische Zellkalibrierung temporär auf 100 %
    gesetzt wird. Ohne diese Freigabe bliebe storage_power_active bei 0 W,
    Schritt a könnte nie auslösen und sowohl max_soc_clamped als auch
    grid_serving_active wären False, obwohl Register 40051/40049 den Speicher
    weiterhin im 0-%-Sollwertmodus hielten.

    Selbstheilung des Schreib-Tasks: Sowohl im Wartezyklen-Zweig (nach
    Schritt a, vor Ablauf von self._grid_serving_wait_cycles) als auch im
    Halte-Zweig von Schritt b (Einspeisung bleibt beim/über dem Schwellwert)
    ruft _async_step_grid_serving zusätzlich async_start_sun_charge(0) auf,
    statt sich allein auf self._grid_serving_setpoint_active zu verlassen.
    Bei unverändertem Sollwert UND weiterhin laufendem _sun_charge_task ist
    das ein No-Op (siehe async_start_sun_charge) - stirbt der Task jedoch
    unerwartet (z. B. ein einzelner transienter Modbus-Fehler in
    _async_sun_charge_loop, der den Task per re-raise beendet statt ihn zu
    retryen), wird er im selben Zyklus neu gestartet. Ursprünglich gemeldeter
    Bug ohne diese Selbstheilung: self._grid_serving_setpoint_active blieb
    dauerhaft True (Sensor "Netzdienliches Laden aktiv" zeigte weiterhin
    "aktiv"), während Register 40049/40051 nach dem toten Task nie wieder
    neu geschrieben wurden - das Gerät fiel nach seinem eigenen Timeout
    (Register 40050, max. 300 s) unbeaufsichtigt in die SmartMeter-
    Nullregelung zurück und begann unbemerkt wieder mit PV-Überschuss zu
    laden, obwohl netzdienliches Laden laut Software noch aktiv eingriff.

    Fehlt data["storage_power_active"], kann Schritt a nicht auslösen
    (Speicher bleibt in der Nullregelung); fehlt data["smartmeter_power"]
    nach dem Auslösen, können weder Schritt a.1 noch Schritt b
    zurückschalten (Ladung bleibt konservativ gehalten) - in beiden Fällen
    ohne bekannten Messwert keine aktive Entscheidung.

    Optionale PV-Prognose-Freigabe (Issues #78/#81): number.py stellt die
    über RestoreEntity persistierte Einstellung "Mindest PV-Prognose" in
    kWh bereit (0-999 kWh, Schritt 1 kWh, Default 0). Der Coordinator rundet
    jeden Schreibwert auf volle kWh; bei genau 0,5 wird kaufmännisch
    aufgerundet (8,5 -> 9), anschließend wird auf 0-999 begrenzt. Dadurch
    werden auch aus älteren Versionen restaurierte Dezimalwerte migriert.
    0 kWh deaktiviert die Zusatzbedingung vollständig und erhält damit das
    bisherige statische Verhalten für Bestandsinstallationen. Bei einem
    Wert > 0 wird der bereits im Options Flow für REQ-DYNAMIC-PRICE-CHARGE
    auswählbare CONF_PV_FORECAST_SENSOR als gemeinsame Quelle verwendet.
    price_optimizer.SaxPricePlanner.forecast_kwh liest dessen Zustand;
    domain.forecast.normalize_energy_kwh normalisiert endliche Zahlen aus
    Wh/kWh/MWh auf kWh. Der Vergleich nutzt bewusst den rohen normalisierten
    Prognosewert und NICHT CONF_PV_FORECAST_FACTOR, weil dieser Faktor nur
    den nutzbaren Anteil für die Bedarfsrechnung der Smart-Preisstrategie
    beschreibt. Ist kein CONF_PV_FORECAST_SENSOR ausgewählt, entfällt die
    Zusatzbedingung vollständig und die Ladepause bleibt unabhängig vom
    eingestellten Mindestwert freigegeben. Nur bei ausgewähltem Sensor gilt:
    forecast >= Mindestwert gibt die Ladepause frei; eine nicht vorhandene
    Entity sowie unknown/unavailable/leerer/nichtnumerischer oder nicht
    endlicher Zustand gelten als nicht freigegeben (Fail-open für die
    Ladung). Die Zustandsmaschine greift dann nicht ein und der Speicher darf
    früh über die SmartMeter-Nullregelung laden.

    ChargePolicyInput.grid_serving_forecast_allowed fließt zentral in
    grid_serving_window_active ein. Dieser Wert ist damit das EINE effektive
    Fenster für Zustandsmaschine, Max-SOC-Fensterbindung und die Priorität
    gegenüber preisoptimiertem Laden. Fällt die Prognose während
    eines aktiven 0-%-Eingriffs unter die Schwelle oder wird ungültig, wird
    grid_serving_eligible False, alle Zustandszähler werden zurückgesetzt
    und _async_enforce_grid_charge ruft async_stop_sun_charge auf. Dasselbe
    effektive False gibt den Schreibpfad für price_should_charge bzw.
    price_should_pause frei. Änderungen am Number-Wert werden über dessen
    Coordinator-Setter sofort angewendet; Zustandswechsel am gemeinsamen
    Sensor werden vom Planner beobachtet und über async_apply_price_plan
    ohne Neustart sofort auf den Coordinator übertragen.

    Jeder Übergang eines zuvor aktiven 0-%-Eingriffs auf inaktiv setzt
    Register 40051 explizit auf SmartMeter-Nullregelung zurück - unabhängig
    davon, ob der Hauptschalter ausgeschaltet, der aktuelle Monat abgewählt,
    das Zeitfenster verlassen/geändert oder die Prognosefreigabe entzogen
    wurde. Das gilt auch, wenn der periodische SunSpec-Schreib-Task zu diesem
    Zeitpunkt bereits beendet ist: Bereits der Startauftrag setzt
    _sun_charge_reset_required als dauerhaften Besitznachweis, bevor der erste
    periodische Schreibvorgang beginnt. async_stop_sun_charge storniert einen
    noch laufenden Task und schreibt Register 40051 = 0; erst nach einem
    erfolgreichen Rückschreiben wird der Besitznachweis gelöscht. Schlägt das
    Rückschreiben transient fehl, bleibt der Auftrag erhalten und jeder
    weitere inaktive Coordinator-Takt versucht die SmartMeter-Nullregelung
    erneut, obwohl _sun_charge_task bereits None ist. Jeder inaktive Pfad
    ruft async_stop_sun_charge auf. Die Methode gleicht einen einfachen
    Sollzustand ab: _sun_charge_commanded_mode startet mit None (noch nicht
    synchronisiert), daher schreibt jede neue Coordinator-Instanz bei ihrer
    ersten inaktiven Entscheidung Register 40051 genau einmal ausdrücklich
    auf 0 - auch wenn der erste Read bereits 0 meldet und kein Task existiert.
    Erst nach dieser quittierten Synchronisierung sind weitere unveränderte
    inaktive Takte No-Ops. Damit hängt die Nullregelung direkt nach Reload/
    Neuinstallation nicht mehr von einem nur im RAM vorhandenen Task- oder
    Besitzmerker und auch nicht von einer erkannten Zustandsflanke ab.
    Zusätzlich wird die tatsächliche Rückmeldung aus Register 40051 weiter
    ausgewertet: Meldet das Gerät später Modus 1, obwohl der Sollzustand 0
    ist, wird die Nullregelung erneut geschrieben. Ein transient
    fehlgeschlagener Write lässt den Sollzustand unsynchronisiert und wird im
    nächsten inaktiven Takt wiederholt.

    Das Aktivieren erzeugt nicht mehr lediglich den periodischen Task. Der
    erste Registersatz wird synchron in der dokumentierten Reihenfolge
    geschrieben und quittiert (40051 = 1, danach 40049 = berechneter Sollwert,
    für die Ladepause 0 %); erst anschließend startet die Schleife mit dem
    nächsten Refresh nach Ablauf des Schreibintervalls. Damit wird ein
    Aktivstatus erst veröffentlicht, wenn die beiden SunSpec-Register
    tatsächlich gesetzt wurden. Scheitert 40049 nach quittiertem Modus 1,
    versucht der gemeinsame Schreibpfad 40051 sofort auf 0 zurückzusetzen;
    bis dieser Rollback oder ein Folge-Reset quittiert ist, bleibt der
    Rücksetzauftrag erhalten und es läuft kein Task weiter. Beim Deaktivieren
    bleibt die Reihenfolge unverändert: Schleife beenden, anschließend
    40051 = 0 schreiben.
    Meldet ein späterer Read trotz laufender Schleife wieder 40051 = 0,
    schreibt async_start_sun_charge beide Aktivregister sofort erneut. Damit
    wird auch eine zwischenzeitliche Geräte-Rücksetzung oder ein externer
    Schreibzugriff korrigiert, ohne bis zum nächsten periodischen
    Schreibintervall zu warten. Innerhalb der Integration existiert dagegen
    kein zweiter unabhängiger Schreiber für 40049/40051: Alle Ladefunktionen
    einschließlich des manuellen Netzladeservice verwenden denselben
    serialisierten SunSpec-Pfad.

    Nach jedem erfolgreichen SunSpec-Write wird der HIGH-Readcache
    invalidiert, damit der nächste Coordinator-Takt den tatsächlichen
    Gerätewert unabhängig vom normalen Zwei-Sekunden-Intervall erneut liest.
    Der quittierte Wert von Register 40051 wird zugleich sofort in
    coordinator.data/_high_data übernommen. Der Diagnose-Sensor
    "Steuermodus" und damit das HA-Aktivitätslog zeigen die Nullregelung
    deshalb bereits mit der auslösenden Einstellungsänderung statt zunächst
    erneut den alten Cachewert zu veröffentlichen. In das lokale Ergebnis
    eines laufenden Refreshs darf dieser optimistische Wert jedoch nur dann
    übernommen werden, wenn der Write während genau dieser Auswertung
    quittiert wurde. Ohne neue Quittung gewinnt immer der tatsächliche
    Readback. Wirkt 40051 = 0 bereits am Gerät, obwohl seine Modbus-Antwort
    ausbleibt oder als Fehler ankommt, muss der folgende Read deshalb
    "SmartMeter-Nullregelung" veröffentlichen; der offene Rücksetzauftrag
    bleibt davon unberührt und wird weiter wiederholt. Ein echter Readback
    kann dadurch jede vom Gerät nicht übernommene oder extern überschriebene
    Änderung sichtbar machen und löst den erneuten Abgleich aus.

    Die komplette Auswertung und Anwendung einer Ladeentscheidung ist durch
    self._charge_control_lock serialisiert. Poll-Zyklus, Entity-Setter und
    Prognose-/Preis-Callback dürfen dadurch keine SunSpec-Schreibpfade
    parallel ausführen. Insbesondere kann eine ältere, bereits begonnene
    Aktiv-Auswertung Register 40051 nicht mehr nach einer neueren
    Deaktivierung wieder auf Sollwertvorgabe setzen: Die Deaktivierung läuft
    nach der begonnenen Entscheidung vollständig durch und endet immer mit
    Register 40051 = 0, sofern keine höher priorisierte Ladefunktion den
    Sollwertmodus benötigt. Status und physischer Steuermodus bleiben damit
    atomar konsistent.

    Für das Dashboard veröffentlicht sensor.py zusätzlich "PV-Prognose
    <Tag>.<Monat>." (grid_serving_forecast, kWh; bei fehlender Konfiguration
    oder jedem unbrauchbaren Wert unknown) und "Status"
    (grid_serving_pause_status). Als abgeleitete Anzeige statt physischem
    SAX-Messwert wird die Prognose-Entity nicht dem SAX-Gerät zugeordnet;
    dadurch verwendet Home Assistant ihren dynamischen Namen unverändert und
    stellt nicht "SAX Power Home" voran.
    Der Status beschreibt grundsätzlich das effektive Ladepausen-Fenster,
    nicht erst den späteren Eingriff nach erkannter PV-Ladung. Ist kein
    Prognosesensor konfiguriert, bleibt der reine zeitliche Aktivsatz sichtbar,
    die Mindestprognose wird nicht geprüft und auch das effektive
    Ladepausen-Fenster bleibt freigegeben. Die
    erste passende Bedingung gewinnt: Hauptschalter aus -> "Inaktiv";
    aktueller Monat aus
    -> "Inaktiv im Monat <Monat>"; Uhrzeit außerhalb -> "Außerhalb des
    Zeitfensters"; konfigurierter, aber ungültiger Sensor -> "PV-Prognose
    nicht verfügbar"; Prognose unter Mindestwert -> Satz mit
    beiden kWh-Werten und inaktiver Ladepause; Prognose > Mindestwert ->
    aktiver Satz mit "größer als"; Prognose == Mindestwert -> derselbe aktive
    Satz mit "gleich". Mindestwert 0 ergibt den aktiven Satz ohne
    Prognosezusatz. Der Aktivsatz lautet "Ladepause ist zwischen HH:MM Uhr
    und HH:MM Uhr im <Monat> aktiv." und verwendet immer den aktuellen
    deutschen Monatsnamen. kWh-Werte erscheinen ohne unnötige
    Nachkommastellen.
    is_time_in_window bleibt die gemeinsame Logik für normale,
    mitternachtsübergreifende und leere Fenster. Poll-Zyklen sowie die
    bestehenden sofortigen Setter-/Sensor-Callbacks aktualisieren beide
    Anzeigen dynamisch.

    Priorität (höchste zuerst, siehe
    SaxPowerCoordinator._async_enforce_grid_charge): 1. Max-SOC-Sperre
    ("Auch der angegebene SOC muss berücksichtigt werden" - gilt
    unverändert für alle Lademodi), 2. manuelle Netzladung
    (REQ-MANUAL-GRID-CHARGE), 3. zeitgesteuertes Laden, 4.
    netzdienliches Laden, 5. preisoptimiertes Laden (REQ-DYNAMIC-PRICE-CHARGE)
    - netzdienliches Laden hat also Vorrang vor preisoptimiertem Laden, nicht
    umgekehrt: grid_serving_eligible verlangt nur noch "not
    timed_should_charge" (kein Ausschluss mehr durch price_should_charge/
    price_should_pause), preisoptimiertes Laden schließt seinerseits über
    "not grid_serving_window_active" aus, sobald das Zeitfenster des
    netzdienlichen Ladens effektiv aktiv ist (Zeit/Monat UND optionale
    Prognosefreigabe, unabhängig davon, ob dessen eigene
    Zustandsmaschine gerade tatsächlich eingreift) - zusätzlich zur
    strukturellen if/elif-Priorisierung, damit nie zwei Automatiken im selben
    Zyklus um denselben Sollwertvorgabemodus konkurrieren. Begründung: ohne
    diesen Vorrang konnten sich beide Automatiken gegenseitig ein- und
    ausschalten, sobald ihre jeweiligen Bedingungen gleichzeitig erfüllt
    waren (ursprünglich gemeldeter Bug); netzdienliches Laden ist zudem
    typischerweise nur in den ertragsreichen Sommermonaten aktiv, in denen
    ohnehin kaum oder kein Netzbezug nötig ist, sodass es sinnvollerweise vor
    preisoptimiertem Laden entscheidet.

    Aktive Monate: Zusätzlich zum Zeitfenster hat jedes der beiden Features
    (Netzladung UND netzdienliches Laden) 12 Monats-Schalter
    (switch.SaxPowerMonthSwitch, generische Klasse für beide Features/alle
    12 Monate; translation_key timed_charge_month_1..12 bzw.
    grid_serving_month_1..12, "Netzladung/Netzdienliches Laden aktiv im
    Januar" ... "im Dezember"), die festlegen, in welchen Kalendermonaten
    das jeweilige Zeitfenster überhaupt wirksam ist - z. B. Netzladung nur
    November-Januar zwischen 1 und 5 Uhr, netzdienliches Laden nur
    Mai-August zwischen 11 und 14 Uhr (SaxPowerCoordinator.
    _timed_charge_months/_grid_serving_months, je ein set[int] aus 1-12,
    Properties timed_charge_months/grid_serving_months als frozenset,
    Setter async_set_timed_charge_month/async_set_grid_serving_month).
    Default (beide Sets initial set(const.ALL_MONTHS)): alle 12 Monate
    aktiv, damit sich bestehende Konfigurationen nach diesem Update
    unverändert verhalten, bis der Anwender einzelne Monate bewusst
    abwählt. Ist für ein Feature kein einziger Monat ausgewählt, ist es
    ganzjährig inaktiv (analog zu einem leeren Zeitfenster) -
    SaxPowerCoordinator._async_enforce_grid_charge prüft zusätzlich zum
    Zeitfenster now.month in self._timed_charge_months bzw.
    self._grid_serving_months.

    Zeitfenster-Nichtüberlappung (Tageszeit UND Monat): Das Zeitfenster des
    netzdienlichen Ladens darf sich nicht mit dem Zeitfenster der Netzladung
    überschneiden - zwei Fenster gelten dabei NUR dann als überlappend, wenn
    sich sowohl ihre Tageszeiten ALS AUCH ihre aktiven Monate überschneiden.
    Laufen beide Fenster nur in disjunkten Monaten, dürfen sich die
    Tageszeiten beliebig überlappen, da die Fenster nie gleichzeitig aktiv
    sein können (siehe Beispiel oben). SaxPowerCoordinator.
    _windows_overlap_with_months kapselt diese Prüfung (Tageszeit über
    coordinator.windows_overlap - unterstützt wie _is_time_in_window über
    Mitternacht laufende sowie unvollständige Fenster, mindestens eine der
    vier Zeiten fehlt gilt als nie überlappend; Monatsprüfung als einfache
    Set-Schnittmenge months_a & months_b). Wie darauf reagiert wird,
    unterscheidet sich je nach betroffener Entitäts-Gruppe:

    - Monats-Setter (async_set_timed_charge_month/async_set_grid_serving_
      month): _assert_windows_dont_overlap lehnt eine Änderung, die zu einer
      echten Überschneidung führen würde, weiterhin mit HomeAssistantError
      ab - die bisherige Monats-Auswahl bleibt dabei unverändert. Der Fehler
      wird über den auslösenden Service-Call an das Frontend durchgereicht
      und dem Anwender direkt als Fehlermeldung angezeigt.
    - Zeit-Setter (async_set_timed_charge_start/-end/-window,
      async_set_grid_serving_start/-end/-window): Eine echte Überschneidung
      wird NICHT mehr mit HomeAssistantError abgelehnt. Stattdessen zeigt
      _notify_time_window_overlap eine Persistent Notification
      (homeassistant.components.persistent_notification, notification_id
      f"{DOMAIN}_{entry_id}_window_overlap") mit beiden betroffenen
      Zeitfenstern (Tageszeit + aktive Monate, formatiert über
      _format_window_for_message) an, und die soeben geänderte Zeit wird auf
      None (leer) gesetzt - bei async_set_timed_charge_start/-end bzw.
      async_set_grid_serving_start/-end nur die jeweils eine geänderte
      Grenze, bei den beiden -window-Settern (siehe unten) beide Grenzen.
      Eine leere Start- oder Endzeit bewirkt immer, dass das jeweilige
      Feature nicht ausgeführt wird (_is_time_in_window/windows_overlap
      behandeln ein unvollständiges Fenster als nie aktiv bzw. nie
      überlappend) - eine geleerte Zeit muss also bewusst neu gesetzt
      werden, damit das Feature wieder aktiv wird.

    Begründung für die unterschiedliche Behandlung: Bei einem Monats-Schalter
    lässt sich eine Ablehnung sauber auf den vorherigen (binären) Zustand
    zurücksetzen. Eine Zeit-Entity dagegen bedient typischerweise nur EINE
    von zwei Grenzen eines Zeitfensters (Start und Ende sind getrennte
    Entities) - würde man eine überlappende Änderung stattdessen komplett
    ablehnen (alten Wert beibehalten), könnte ein rein durch das getrennte
    Bearbeiten von Start und Ende entstehender, in Wahrheit gar nicht
    beabsichtigter Zwischenzustand (neue Grenze + noch nicht aktualisierte
    andere Grenze) fälschlich als Überschneidung erkannt werden, obwohl das
    beabsichtigte Endergebnis nicht überlappen würde - je nachdem, ob zuerst
    Start oder Ende geändert wird. Das Leeren statt Beibehalten des alten
    Werts vermeidet diese Verwirrung, ohne die Nichtüberlappungs-Regel
    aufzuweichen (ein leeres Fenster kann per Definition nie überlappen).

    Services set_timed_charge_window/set_grid_serving_window
    (SaxPowerCoordinator.async_set_timed_charge_window/
    async_set_grid_serving_window, services.yaml): Setzen Start und Ende
    eines Zeitfensters atomar in einem einzigen Aufruf (Felder device_id,
    start, end) - die Überlappungsprüfung läuft dabei genau einmal gegen das
    fertige Ziel-Fenster, ohne den oben beschriebenen Zwischenzustand zu
    durchlaufen; bei einer echten Überschneidung werden ebenfalls beide
    übergebenen Werte geleert (siehe oben). Empfohlen für jede Änderung, bei
    der sich sowohl Start als auch Ende ändern sollen. Die einzelnen
    Start-/Ende-Entities (time.py) bleiben unverändert bestehen und eignen
    sich weiterhin für das Verschieben nur einer einzelnen Zeitgrenze. Aus
    einem verwandten Grund kann das schrittweise Umstellen von
    überlappenden Tageszeiten auf disjunkte Monate in ungünstiger
    Reihenfolge zwischenzeitlich eine Zeit leeren, obwohl das beabsichtigte
    Endergebnis nicht überlappen würde - empfohlen wird, zunächst beide
    Monats-Auswahlen anzupassen (wirkt sich dabei so lange nicht
    überlappend aus, wie mindestens eines der beiden Zeitfenster noch beim
    - nicht überlappenden - Default steht) und erst danach die Zeiten zu
    ändern.

    Die Monats-Setter unterstützen zusätzlich einen validate-Parameter
    (Default True): SaxPowerMonthSwitch.async_added_to_hass ruft sie beim
    Restaurieren eines gespeicherten Zustands mit validate=False auf, um
    False-Positives durch das sequentielle Restaurieren mehrerer
    Monats-Entities zu vermeiden (beide Monats-Sets starten intern bei
    "alle Monate", ein während der Restaurierung zwischenzeitlich noch
    voller Satz auf der jeweils anderen Seite würde sonst fälschlich als
    Überlappung erkannt). Live-Änderungen über den Schalter
    (async_turn_on/-off) validieren dagegen immer.

    Diagnose-Sensor "Netzdienliches Laden aktiv" (sensor.py,
    grid_serving_active_text, analog zu "Zeitgesteuertes Laden aktiv") zeigt
    an, ob netzdienliches Laden gerade aktiv in den Sollwertvorgabemodus
    eingreift, also die Ladung gezielt bei 0 % hält
    (self._grid_serving_setpoint_active) - nicht, ob der Speicher gerade
    über die geräteeigene Nullregelung mit PV-Überschuss lädt (dafür siehe
    Sensor "SAX Ladeleistung"). Das informiert den Anwender laufend über
    den Aktivzustand des Eingriffs.

    Aktiviert-Zustand, Start-/Endzeit, aktive Monate sowie der optionale
    Mindest-Prognosewert werden über Neustarts hinweg persistiert (analog
    zum zeitgesteuerten Laden) - im versionierten Konfigurations-Store, der
    vor dem ersten steuernden Refresh geladen wird, mit dem
    RestoreEntity-Zustand nur noch als einmaligem Migrationspfad (siehe
    REQ-CONTROL-CONFIG-BOOTSTRAP). Ohne zuvor gespeicherten Zustand gelten die
    Defaults DEFAULT_GRID_SERVING_ENABLED (False) sowie
    DEFAULT_GRID_SERVING_START/-END (const.py) - bewusst identisch (Start ==
    Ende), damit das Default-Zeitfenster leer ist und nie mit dem (beliebig
    konfigurierten) Zeitfenster der Netzladung überlappen kann. Kein
    Vorbelegungsschritt im Config Flow (im Unterschied zu
    REQ-TIMED-SOC-CHARGE) - das Feature wird ausschließlich über die
    Entitäten nach der Ersteinrichtung konfiguriert.
  acceptance_criteria:
    - "tests/test_price_optimizer.py/test_charge_policy.py/test_forecast.py
       decken die optionale Prognosefreigabe ab: 0 kWh deaktiviert sie;
       unterhalb/exakt auf/oberhalb der Schwelle gilt False/True/True;
       ohne ausgewählten Sensor bleibt die Ladepause trotz Mindestwert aktiv
       und stoppt erkannte SAX-Ladung; Wh, kWh und MWh werden normalisiert;
       bei ausgewähltem Sensor deaktivieren unknown, unavailable,
       nichtnumerische und nicht endliche Werte die Ladepause;
       ein laufender 0-%-Eingriff wird sicher per SmartMeter-Nullregelung
       beendet; bei niedriger Prognose bleibt aktives preisoptimiertes Laden
       freigegeben. tests/test_number.py deckt Default, Restore und Klemmung
       der Number-Entity sowie 1-kWh-Schritt und kaufmännische Rundung ab;
       tests/test_dashboard.py ihre Darstellung. tests/test_coordinator.py
       deckt alle priorisierten Ladepausen-Statustexte einschließlich des
       reinen Aktivsatzes ohne konfigurierten Prognosesensor und der
       getrennten Ausgaben für größer und gleich ab; die bestehende
       Policy-Abdeckung bestätigt, dass Gleichheit die Ladepause freigibt."
    - "tests/test_coordinator.py und tests/test_price_optimizer.py decken
       aktive Übergänge auf inaktiv durch Hauptschalter, Monatsauswahl,
       Zeitfenster und fallende PV-Prognose ab, nachdem der periodische
       Schreib-Task bereits beendet wurde. In jedem Fall wird Register 40051
       explizit mit SmartMeter-Nullregelung beschrieben; die Prognose ist in
       der Übergangsmatrix ausdrücklich enthalten. Weitere Tests erzwingen
       einen transienten Fehler beim ersten Rückschreiben und belegen, dass
       der Rücksetzauftrag erhalten bleibt und sowohl ein direkter Folgeaufruf
       als auch der nächste inaktive Coordinator-Takt Register 40051 erneut
       auf 0 schreibt. Der bestehende Schritt-a-Test deckt den umgekehrten
       Übergang in Sollwertvorgabe plus 0-%-Sollwert ab."
    - "tests/test_coordinator.py deckt windows_overlap (normales Fenster,
       über Mitternacht laufendes Fenster, berührende statt überlappende
       Fenster, unvollständige Fenster) ab - inklusive des Falls, dass
       identische Tageszeiten bei disjunkten aktiven Monaten NICHT als
       überlappend gelten."
    - "tests/test_coordinator.py deckt die Ablehnung überlappender
       Änderungen an den Monats-Settern (async_set_timed_charge_month,
       async_set_grid_serving_month) mit HomeAssistantError ab (bisherige
       Monats-Auswahl bleibt unverändert), sowie für die Zeit-Setter
       (async_set_timed_charge_start/-end/-window, async_set_grid_serving_
       start/-end/-window) das neue Verhalten bei echter Überschneidung:
       kein HomeAssistantError mehr, stattdessen eine Persistent
       Notification (hass.data[persistent_notification.DOMAIN], Eintrag mit
       'window_overlap' in der notification_id) mit beiden Zeitfenstern
       sowie eine geleerte (None) soeben geänderte Zeit - bei den
       -start/-end-Settern nur die jeweils geänderte Grenze, bei den
       -window-Settern beide Grenzen. Ein Regressionstest reproduziert den
       ursprünglich gemeldeten Bug direkt: ein durch getrenntes Setzen von
       Start und Ende über die einzelnen Uhrzeit-Entities entstehender,
       nicht beabsichtigter Zwischenzustand führt zum Leeren der Zeit,
       während der atomare -window-Service dasselbe Ziel-Fenster
       akzeptiert."
    - "tests/test_coordinator.py deckt die Zustandsmaschine von
       netzdienlichem Laden (_async_step_grid_serving) ab: Schritt a
       wechselt erst in den Sollwertvorgabemodus und stoppt die Ladung auf
       0 %, wenn die tatsächliche SAX-Ladeleistung
       (data['storage_power_active']) den Schwellwert über
       PV_SURPLUS_HYSTERESIS_CYCLES aufeinanderfolgende Zyklen erreicht (ein
       einzelner Zyklus reicht noch nicht), und setzt danach zusätzlich
       zwei Wartezyklen; während dieser Wartezyklen bleibt Schritt b
       unterdrückt, selbst wenn die Netzeinspeisung zwischenzeitlich unter
       den Schwellwert fällt; nach Ablauf der Wartezyklen bleibt die Ladung
       bei weiterhin hoher Einspeisung bewusst bei 0 % gehalten (kein
       Wiederanstieg des Sollwerts mehr, im Unterschied zum alten
       Verhalten), Schritt b setzt erst bei über ebenso viele
       aufeinanderfolgende Zyklen bestätigter Einspeisung unter dem
       Schwellwert aktiv in die SmartMeter-Nullregelung zurück; ohne
       bekannte SAX-Ladeleistung kann Schritt a nicht auslösen, ohne
       bekannte Netzeinspeisung nach dem Auslösen bleibt Schritt b
       konservativ gehalten statt zurückzuschalten. Zusätzlich deckt es ab:
       kein Eingriff außerhalb des Zeitfensters/außerhalb der aktiven
       Monate/deaktiviert, Vorrang der Max-SOC-Sperre sowie die
       Ausschlusslogik zu zeitgesteuertem Laden über grid_serving_eligible
       (not timed_should_charge). Ebenso deckt es das analoge
       Monats-Verhalten für zeitgesteuertes Laden ab (inaktiv außerhalb der
       ausgewählten Monate, aktiv innerhalb) sowie den Fall, dass ein
       Feature bei keinem ausgewählten Monat ganzjährig inaktiv bleibt.
       Zwei Regressionstests decken zusätzlich die Eigentumsübergabe von der
       Max-SOC-Sperre an eine noch nicht ausgelöste Ladepause ab: Sowohl das
       manuelle Anheben des konfigurierten Max-SOC als auch das automatische
       Anheben des effektiven Max-SOC durch die Zellkalibrierung beenden den
       alten 0-%-Task, schreiben Register 40051 auf SmartMeter-Nullregelung und
       lassen weder max_soc_clamped noch grid_serving_active fälschlich aktiv.
       test_enforce_grid_charge_grid_serving_import_protection_overrides_
       wait_cycles deckt zusätzlich Schritt a.1 (Netzbezugs-Schutz) ab:
       tatsächlicher Netzbezug (positiver data['smartmeter_power']) über
       dem Schwellwert schaltet über dieselbe Zyklen-Hysterese aktiv zurück
       in die SmartMeter-Nullregelung, und zwar auch während der
       Wartezyklen aus Schritt a (durchbricht deren Unterdrückung, ein
       einzelner Zyklus reicht noch nicht); anschließend wertet die
       Zustandsmaschine wieder regulär ab Schritt a, sodass sie bei
       weiterhin hoher SAX-Ladeleistung nach erneuten
       PV_SURPLUS_HYSTERESIS_CYCLES Zyklen wieder eingreift.
       test_enforce_grid_charge_grid_serving_restarts_dead_write_task_while_
       holding deckt die Selbstheilung des Schreib-Tasks ab (siehe oben):
       stirbt _sun_charge_task unerwartet (simuliert durch direktes
       Canceln außerhalb von async_stop_sun_charge, wie es ein re-raise
       nach einem transienten Modbus-Fehler in _async_sun_charge_loop
       bewirken würde), während self._grid_serving_setpoint_active True
       ist - sowohl im Wartezyklen- als auch im Halte-Zweig -, startet der
       nächste _async_enforce_grid_charge-Aufruf den Task automatisch neu,
       statt den Speicher dauerhaft unbeaufsichtigt zu lassen."
    - "tests/test_price_optimizer.py deckt den Vorrang von netzdienlichem vor
       preisoptimiertem Laden ab (test_grid_serving_takes_priority_over_
       price_charge_neutral_band, test_grid_serving_takes_priority_over_
       price_charge_active_charging): ein aktives Zeitfenster des
       netzdienlichen Ladens blockiert sowohl price_should_charge als auch
       die Neutralpreis-Pausezone, nicht umgekehrt - Regressionsschutz für
       den ursprünglich gemeldeten Bug, dass sich beide Automatiken
       gegenseitig ein- und ausschalten konnten."
    - "switch.py/time.py/sensor.py enthalten keine eigene
       Leistungseinstellung für netzdienliches Laden - es schreibt nie
       einen Sollwert > 0 und nutzt nur die zentrale Einstellung 'Max.
       SOC' wie zeitgesteuertes Laden."

# ==============================================================================
# ANFORDERUNG: MANUELLE ENTLADUNG (VERWORFEN)
# ==============================================================================
requirement_manual_discharge:
  id: REQ-MANUAL-DISCHARGE
  title: "Speicher manuell mit fester Leistung entladen - verworfen, da vom Hersteller nicht vorgesehen"
  status: verworfen
  description: >
    Ursprünglich implementiert als Software-Logik analog zu zeitgesteuertem
    Laden/Max-SOC-Sperre: Schalter "Manuelle Entladung" (switch.py) +
    Zahlenfeld "Entladeleistung" (number.py), geschrieben über denselben
    SunSpec-Modus-Pfad (Register 40051 Sollwertvorgabe + Register 40049),
    hier mit POSITIVEM statt negativem Sollwert (Vorzeichenkonvention:
    negativ = Laden, positiv = Entladen, siehe REQ-TIMED-SOC-CHARGE).

    Live-Tests gegen echte Hardware (tests/test_real_hardware.py, siehe
    Git-Historie) zeigten, dass weder dieser SunSpec-Weg noch alternativ
    der ältere Basic-Mode-P-Sollwert (Register 41, ebenfalls positiv) eine
    tatsächliche Entladung auslösten - auch nicht nach Umstellung der
    geräteseitigen Betriebsart auf "P-Sollwert (TCP)" (siehe
    modbus_llm.yaml, operation_modes). Beide Wege schrieben die Register
    nachweislich korrekt (Rücklesen stimmte), das Gerät reagierte aber
    nicht mit realer Leistungsabgabe. Auf Rückfrage hat der Hersteller
    bestätigt: eine ferngesteuerte manuelle Entladung ist auf diesem Weg
    nicht vorgesehen.

    Die Funktionalität (Schalter, Zahlenfeld, Priorisierung in
    SaxPowerCoordinator._async_enforce_grid_charge, Übersetzungen) wurde
    deshalb wieder vollständig entfernt. Warnende Kommentare bei
    REG_SETPOINT_POWER und REG_SUN_IC_POWER_SETPOINT_PCT (const.py)
    erinnern bei einer späteren Umsetzung an diesen Befund - vor einem
    erneuten Versuch unbedingt zuerst erneut beim Hersteller nachfragen,
    ob sich daran etwas geändert hat.
  acceptance_criteria:
    - "Keine Entitäten/Code-Pfade für manuelle Entladung mehr vorhanden
       (switch.py, number.py, coordinator.py, Übersetzungen)."
    - "const.py enthält bei REG_SETPOINT_POWER und
       REG_SUN_IC_POWER_SETPOINT_PCT einen Kommentar mit diesem Befund für
       spätere Umsetzungsversuche."

# ==============================================================================
# ANFORDERUNG: LOW-INTERVALL FÜR STATISCHE SUNSPEC-MODUS-REGISTER
# ==============================================================================
requirement_low_interval_registers:
  id: REQ-LOW-INTERVAL-REGISTERS
  title: "Statische SunSpec-Modus-Register (Geräteidentität, Skalierungsfaktoren) seltener abfragen als Messwerte"
  status: done
  description: >
    Der SunSpec-Modus-Block (Slave-ID 100, Register 40000-40114, siehe
    REQ-SUNSPEC-MODE-CORRECTION) enthält zwei zusammenhängende
    Teilbereiche, die laut modbus_llm.yaml ausschließlich "wellknown" fixe
    bzw. sich im laufenden Betrieb praktisch nie ändernde Werte enthalten:
    das SunSpec Common Model + den Modellkopf von "3Ph Inverter"
    (Hersteller, Gerätemodell, Firmware-Version, Seriennummer,
    Modell-ID/Länge; Register 40000-40016) sowie die
    Battery-Skalierungsfaktoren (Register 40110-40114). Beide Teilbereiche
    liegen direkt am Rand des Gesamtblocks und lassen sich deshalb ohne
    zusätzliche Requests im regulären Poll-Zyklus abtrennen.

    SaxPowerCoordinator._async_read_low_block liest diese beiden
    Teilbereiche per eigenem read_holding_registers-Aufruf nur alle
    READ_BLOCK_EXT_LOW_INTERVAL Sekunden (1 Stunde) neu ein, statt bei
    jedem regulären Poll. Der reguläre (HIGH-)Block
    (READ_BLOCK_EXT_START/READ_BLOCK_EXT_COUNT) schrumpft dadurch von 115
    auf 93 Register. Zwischen den Refreshs werden die zuletzt gelesenen
    Werte weiterverwendet (self._low_block_data bzw.
    self._battery_scale_factors, die der Coordinator beim nächsten HIGH-Read
    an domain.sunspec.decode_high_block übergibt); ein Scheitern des
    LOW-Reads lässt das Update nicht fehlschlagen, analog zu
    REQ-EXTENDED-MODE-RESILIENCE.
  requirements:
    - "Die beiden LOW-Intervall-Teilbereiche werden beim allerersten Poll
       sofort mitgelesen, damit die zugehörigen Diagnose-Sensoren nicht bis
       zum Ablauf des ersten Intervalls 'unbekannt' zeigen."
    - "Ein Scheitern des LOW-Intervall-Reads (bei ansonsten erreichbarem
       SunSpec-Modus) lässt das Update nicht fehlschlagen - die zuletzt
       gelesenen Werte bleiben erhalten, bis der nächste Refresh gelingt."
    - "Sicherheits-/steuerungsrelevante Register (SOC, Zustände,
       Fehlercodes, Smart-Meter-Leistung) bleiben ausdrücklich im
       HIGH-Block und werden weiterhin bei jedem Poll gelesen."
  acceptance_criteria:
    - "tests/test_coordinator.py deckt sowohl das Refresh-Intervall
       (kein Reread innerhalb von READ_BLOCK_EXT_LOW_INTERVAL, Reread nach
       Ablauf) als auch die Fehlerresilienz des LOW-Blocks ab."
    - "DEVELOPMENT.md beschreibt die Drei-Block-Struktur des SunSpec-Modus
       (HIGH + zwei LOW-Teilbereiche) im Abschnitt Register-Mapping."

# ==============================================================================
# ANFORDERUNG: EIGENES, FESTES HIGH-INTERVALL FÜR DYNAMISCHE SUNSPEC-MODUS-REGISTER
# ==============================================================================
requirement_high_interval_registers:
  id: REQ-HIGH-INTERVAL-REGISTERS
  title: "Dynamische SunSpec-Modus-Register (HIGH-Block) mit eigenem, festem 2s-Intervall statt gemeinsam mit Basic Mode (NORMAL)"
  status: done
  description: >
    Vor dieser Anforderung teilten sich der HIGH-Block (siehe
    REQ-LOW-INTERVAL-REGISTERS) und der Basic-Mode-Block (NORMAL, Slave-ID
    64) denselben Coordinator-Timer und damit dasselbe, über
    CONF_SCAN_INTERVAL/DEFAULT_SCAN_INTERVAL nutzerkonfigurierbare
    Intervall (Default 10s) - die Unterscheidung HIGH/NORMAL war rein
    begrifflich, ohne technische Konsequenz.

    Der HIGH-Block enthält u. a. die tatsächliche Lade-/Entladeleistung
    (storage_power_active, Register 40029) und die Netzleistung
    (smartmeter_power, Register 40072), die den Trigger für netzdienliches
    Laden bilden (siehe REQ-GRID-SERVING-CHARGE) - eine zügige Reaktion
    hängt hier direkt an der Poll-Frequenz. NORMAL (Basic Mode: SOC,
    Schaltzustand) hat dagegen keinen vergleichbaren Bedarf an einer
    kürzeren, festen Frequenz und soll über das bestehende
    Config-Flow-Feld "Aktualisierungsintervall" einstellbar bleiben.

    READ_BLOCK_EXT_HIGH_INTERVAL (fest, 2 Sekunden, nicht über die
    Oberfläche konfigurierbar) entkoppelt den HIGH-Block deshalb vom
    NORMAL-Intervall: SaxPowerCoordinator.__init__ setzt den internen
    Coordinator-Timer (update_interval) auf
    min(scan_interval, READ_BLOCK_EXT_HIGH_INTERVAL) - da das
    config_flow-Minimum für scan_interval (5s) immer über
    READ_BLOCK_EXT_HIGH_INTERVAL liegt, läuft der Timer damit faktisch
    immer mit 2s. _async_read_basic (NORMAL) und _async_read_high_block
    (HIGH) prüfen anschließend jeweils per eigenem Zeitstempel-Cache
    (analog zum LOW-Block), ob ihr Teilblock auf einem gegebenen Tick
    tatsächlich fällig ist, und liefern sonst den zuletzt gelesenen Wert.

    Ein Schreibzugriff auf ein Basic-Mode-Register
    (SaxPowerCoordinator.async_write_register, z. B. über den
    Storage-On/Off-Schalter) invalidiert den NORMAL-Cache explizit, damit
    ein direkt danach ausgelöster coordinator.async_refresh() (siehe
    DEVELOPMENT.md, "Refresh-Verhalten") nicht kurzzeitig noch den alten,
    gecachten Wert liefert.
  requirements:
    - "NORMAL (Basic Mode) bleibt über das bestehende Config-Flow-Feld
       'Aktualisierungsintervall' einstellbar (min. 5s, max. 3600s) - keine
       Änderung an config_flow.py/UI nötig."
    - "HIGH-Block-Register werden unabhängig vom NORMAL-Intervall
       spätestens alle READ_BLOCK_EXT_HIGH_INTERVAL Sekunden neu gelesen."
    - "Ein Schreibzugriff auf ein Basic-Mode-Register erzwingt beim nächsten
       _async_read_basic-Aufruf einen echten Read, unabhängig vom
       NORMAL-Intervall-Cache."
    - "Sicherheitsrelevante Fehlerresilienz bleibt unverändert: scheitert
       ausschließlich der (fällige) HIGH-Read, schlägt das Update nicht
       fehl (siehe REQ-EXTENDED-MODE-RESILIENCE); scheitert der (fällige)
       NORMAL-Read, schlägt das Update weiterhin komplett fehl
       (UpdateFailed), da Basic Mode die Mindestanforderung ist."
  acceptance_criteria:
    - "tests/test_coordinator.py deckt ab: update_interval entspricht
       min(scan_interval, READ_BLOCK_EXT_HIGH_INTERVAL); NORMAL wird
       innerhalb des scan_interval nicht erneut gelesen, HIGH dagegen
       gemäß seines eigenen (kürzeren) Intervalls; ein Basic-Mode-Write
       erzwingt einen frischen NORMAL-Read trotz aktivem Cache."
    - "tests/test_integration_live.py (Storage-On/Off-Schalter, echter
       TCP-Read/Write-Zyklus) bleibt grün - der Schalter-Zustand spiegelt
       nach dem Schreiben sofort den neuen Wert."

# ==============================================================================
# ANFORDERUNG: ENERGY-DASHBOARD-KOMPATIBILITÄT
# ==============================================================================
requirement_energy_dashboard_compatibility:
  id: REQ-ENERGY-DASHBOARD
  title: "Selbst akkumulierte kWh-Zähler (geladen/entladen) fürs Home-Assistant-Energy-Dashboard"
  status: done
  description: >
    Der SAX Speicher besitzt keine Energiezähler-Register, nur
    Momentanleistung (storage_power_active, SunSpec-Modus). Ohne einen
    monoton steigenden kWh-Sensor (state_class total_increasing) kann der
    Speicher nicht als Batterie-Ladung/-Entladung im Home-Assistant-Energy-
    Dashboard ausgewählt werden.

    SaxPowerCoordinator akkumuliert deshalb selbst zwei laufende kWh-Zähler
    (_energy_charged_kwh, _energy_discharged_kwh) aus storage_power_active
    per gehaltener Riemann-Summe (Wert seit dem letzten
    _async_update_data-Tick × verstrichene Zeit,
    SaxPowerCoordinator._accumulate_energy) - kein zusätzlicher
    Konfigurationsaufwand (z. B. ein manuell anzulegender
    "Integration"-Helfer) für den Nutzer nötig.

    Beide Zähler werden gemeinsam in einem versionierten Home-Assistant-
    Store gespeichert, dessen Schlüssel die Config-Entry-ID enthält. Diese
    Persistenz ist unabhängig vom sichtbaren RestoreEntity-Zustand: Wird die
    Entity wegen eines Basic-Mode-Fehlers unavailable und Home Assistant
    beendet, bleibt der letzte numerische In-Memory-Zählerstand maßgeblich.
    Häufige Änderungen werden fünf Minuten lang gebündelt; beim Entladen des
    Config Entry wird der neueste Stand zusätzlich best-effort sofort
    geschrieben.

    Beim ersten Start nach Einführung des Stores werden vorhandene
    numerische RestoreEntity-Zustände einmalig und für Lade-/Entladezähler
    unabhängig migriert, sofern für den jeweiligen Zähler noch kein neuer
    Snapshot existiert. Ein ganz neuer Eintrag ohne Restore-Zustand beginnt
    bei 0.0. unknown, unavailable, nicht-endliche, negative, korrupte oder
    rückläufige Zustände werden dagegen niemals als 0 interpretiert, sondern
    verworfen und diagnostisch geloggt; der betroffene Zähler bleibt ohne
    numerische Baseline uninitialisiert. Ein gültiger zweiter Zähler kann
    auch dann restauriert werden, wenn der erste gespeicherte Wert korrupt
    ist.

    Ist storage_power_active zwischenzeitlich unbekannt (SunSpec-Modus nicht
    erreichbar, siehe REQ-EXTENDED-MODE-RESILIENCE), wird die betroffene
    Zeitspanne übersprungen statt mit 0 W verbucht, damit nach Wiederkehr
    kein Nachhol-Sprung entsteht. Auch ein fehlgeschlagener Basic-Mode-Poll
    verändert die internen Zähler und ihren gespeicherten Snapshot nicht -
    er verwirft zusätzlich die Riemann-Baseline (_energy_last_ts = None,
    _async_update_data), weil _accumulate_energy in diesem Fall gar nicht
    mehr erreicht wird: Ohne dieses Verwerfen verbuchte der erste
    erfolgreiche Tick nach einem stundenlangen Geräte-/Netzausfall die
    gesamte Ausfallzeit mit der zuletzt bekannten Leistung als Energie und
    zählte sie als beobachtete Zeit des Kalendertages
    (REQ-ECONOMICS-AMORTIZATION). Der erste Tick nach einem Ausfall setzt
    damit - wie nach jedem Neustart - nur die Zeitbasis neu.
  requirements:
    - "Zwei Sensoren 'energy_charged'/'energy_discharged' (device_class
       energy, state_class total_increasing, Einheit kWh), über Neustarts
       hinweg gemeinsam und pro Config Entry in einem versionierten Store
       persistiert."
    - "Store-Schreibvorgänge werden gedrosselt und bei Shutdown/Unload
       best-effort final geflusht; es gibt keinen Schreibvorgang pro Poll."
    - "Numerische RestoreEntity-Altzustände werden nur ohne neuen Snapshot
       migriert. unknown/unavailable sowie ungültige, negative oder
       rückläufige Werte dürfen niemals einen Zähler auf 0 oder einen
       kleineren Wert setzen und werden mit Warnung verworfen."
    - "Kein Akkumulieren vor Abschluss des Restores und während
       storage_power_active unbekannt ist."
    - "Ein fehlgeschlagenes Update verwirft die Riemann-Baseline, sodass
       die Ausfallzeit weder als Energie noch als beobachtete Zeit eines
       Kalendertages verbucht wird (tests/test_coordinator.py)."
    - "Negative storage_power_active (Ladung) fließt ausschließlich in
       energy_charged, positive (Entladung) ausschließlich in
       energy_discharged."
  acceptance_criteria:
    - "tests/test_coordinator.py und tests/test_energy_persistence.py decken
       ab: Akkumulation/Vorzeichen-Split, SunSpec-Ausfall ohne Nachhol-Sprung,
       Basic-Mode-Ausfall mit exaktem Final-Flush, Legacy-Migration,
       unknown/unavailable, korrupte/negative/rückläufige Snapshots,
       Schreibdrosselung sowie zwei unabhängige Config Entries."
    - "Beide Sensoren lassen sich in der Home-Assistant-UI im
       Energy-Dashboard als Batterie-Ladung/-Entladung auswählen."

# ==============================================================================
# ANFORDERUNG: DIAGNOSEFUNKTION
# ==============================================================================
requirement_diagnostics:
  id: REQ-DIAGNOSTICS
  title: "Diagnose-Download über die Geräteseite (Coordinator-Zustand, IP redigiert)"
  status: done
  description: >
    diagnostics.py implementiert async_get_config_entry_diagnostics - Home
    Assistant bietet dadurch automatisch "Diagnose herunterladen" auf der
    Geräteseite an (keine eigene Registrierung nötig). Für Support-/
    Bugreport-Zwecke werden neben den redigierten Config-Entry-Daten auch
    coordinator.data (alle aktuellen Messwerte) sowie der relevante interne
    Coordinator-Zustand exportiert (Max-SOC-Sperre,
    Netzladung/SunSpec-Netzladung aktiv, zeitgesteuertes/netzdienliches
    Laden, SunSpec-Modus-Erreichbarkeit) - reine Aggregation bereits
    vorhandener Coordinator-Properties, keine neue Business-Logik.

    Die IP-Adresse (CONF_HOST) ist die einzige potenziell identifizierende
    Information in entry.data (lokales Modbus TCP ohne Cloud-Auth, siehe
    AGENTS.md "Security considerations") und wird über
    homeassistant.components.diagnostics.async_redact_data redigiert; Port
    und Slave-IDs sind keine Geheimnisse und bleiben sichtbar.
  acceptance_criteria:
    - "tests/test_diagnostics.py deckt ab: CONF_HOST ist im Ergebnis
       redigiert, Port bleibt unverändert sichtbar, coordinator_data und
       die relevanten state-Felder sind befüllt."

# ==============================================================================
# ANFORDERUNG: PREISOPTIMIERTES LADEN
# ==============================================================================
requirement_dynamic_price_charge:
  id: REQ-DYNAMIC-PRICE-CHARGE
  title: "Preisoptimiertes Laden aus dem Netz nach dynamischem Strompreis (+ PV-Prognose)"
  status: done
  description: >
    Dritte Lade-Automatik neben zeitgesteuertem Laden (REQ-TIMED-SOC-CHARGE)
    und netzdienlichem Laden (REQ-GRID-SERVING-CHARGE): Der Speicher wird
    automatisch dann aus dem Netz geladen, wenn der Strompreis günstig ist,
    und bleibt in teuren Phasen in der geräteeigenen
    SmartMeter-Nullregelung, sodass die günstig eingekaufte Energie den
    Hausverbrauch deckt.

    Die Integration ruft selbst keine Strompreise ab. Sie wertet
    stattdessen eine beliebige, vom Anwender im Options Flow ausgewählte
    Home-Assistant-Sensor-Entity aus (Tibber, Nordpool, EPEX Spot, ENTSO-e,
    Awattar, eigene Template-Sensoren). price_optimizer.parse_price_slots
    erkennt die verbreiteten Attributformate selbstständig - Listen von
    Dicts mit Start-/Preisfeldern ebenso wie reine Zahlenlisten für einen
    Kalendertag - und normalisiert sie auf eine Liste aus
    (Start, Ende, Preis in EUR/kWh). Stunden- und Viertelstunden-Auflösung
    werden gleichermaßen unterstützt; ct/kWh wird anhand der Sensor-Einheit
    (oder einer expliziten Vorgabe) auf EUR/kWh umgerechnet.

    Der Sensor "Aktueller Preis" (price_charge_current_price) liest den
    Preis des gerade laufenden Slots unabhängig von Strategie und
    Enabled-Schalter aus - er ist eine reine Info-Anzeige und bleibt daher
    auch bei Strategie "off" oder deaktivierter Automatik gefüllt, solange
    der konfigurierte Preis-Sensor auswertbare Daten für "jetzt" liefert
    (price_optimizer.SaxPricePlanner._evaluate_price_charge berechnet ihn
    deshalb vor den Enabled-/Strategie-Prüfungen).

    Arbeitsteilung: price_optimizer.SaxPricePlanner berechnet ohne jeden
    Modbus-Zugriff alle PRICE_EVAL_INTERVAL Sekunden (60s) einen Ladeplan
    aus Preisdaten, gewählter Strategie und optionaler PV-Prognose -
    zusätzlich sofort bei jeder Einstellungsänderung und jedem
    Zustandswechsel der beobachteten Quell-Sensoren.
    SaxPowerCoordinator._async_enforce_grid_charge wertet diesen Plan bei
    jedem Poll-Zyklus aus und setzt ihn über denselben
    SunSpec-Schreibpfad um wie die beiden anderen Automatiken
    (_async_sun_charge_loop, Register 40051 Steuermodus + Register 40049
    Leistungsvorgabe). Ist die Bedingung nicht (mehr) erfüllt, wird
    Register 40051 aktiv auf 0 (SmartMeter-Nullregelung) zurückgesetzt.
    SOC-abhängige Abbrüche greifen dadurch sofort und nicht erst beim
    nächsten 60-Sekunden-Takt.

    Strategien (select.SaxPowerPriceStrategySelect, jederzeit im laufenden
    Betrieb umschaltbar):
      off      - Automatik stillgelegt, ohne die übrigen Einstellungen zu
                 verlieren (entspricht "Manuell / Aus").
      absolute - lädt, solange der Arbeitspreis des aktuellen Slots die
                 Preisgrenze (number "Preisoptimiertes Laden Preisgrenze",
                 EUR/kWh, negative Werte zugelassen) nicht überschreitet.
      relative - lädt in den X günstigsten Stunden des Planungshorizonts
                 (number "Preisoptimiertes Laden Anzahl Stunden", 1-24).
                 Aufsummiert wird die noch verbleibende Dauer je Slot,
                 damit "3 günstigste Stunden" auch bei einer Berechnung
                 mitten in einem Slot drei nutzbare Stunden ergibt.
      smart    - wie relative, leitet die Stundenzahl aber aus dem noch
                 fehlenden Energiebedarf ab: ("Max. SOC" - SOC) × Kapazität
                 (SunSpec-Register 40097) abzüglich des nutzbaren Anteils
                 der PV-Prognose, geteilt durch die angenommene Ladeleistung
                 ("ic_max_power_reference", Register 40053 - der vom Gerät
                 selbst gemeldete Bezugspunkt, seit dem Wegfall von "Max.
                 Netzladeleistung" die realistischere Grundlage, siehe
                 REQ-TIMED-SOC-CHARGE). Deckt die Prognose den Bedarf
                 vollständig, wird gar kein Netzstrom eingekauft (Status
                 "PV-Prognose deckt Bedarf"). "Anzahl Stunden" bleibt dabei
                 Obergrenze. Fehlen Kapazität, SOC oder Ladeleistung,
                 verhält sich smart wie relative.

    Planungshorizont ist ein gleitendes Fenster von
    PRICE_PLAN_HORIZON_HOURS (24 h) über die jeweils bekannten Preisdaten
    (Rest von heute plus ggf. bereits veröffentlichtes Morgen), nicht der
    Kalendertag.

    Leistung: lädt wie das zeitgesteuerte Laden immer mit maximal möglicher
    Leistung, keine eigene (oder geteilte) Watt-Einstellung (siehe
    REQ-TIMED-SOC-CHARGE zum Wegfall von "Max. Netzladeleistung"). Ziel-SOC:
    derselbe Wert wie "Max. SOC" - keine eigene Einstellung, sondern die
    einzige, geräteweite SOC-Obergrenze; ist sie erreicht, endet die
    Netzladung UND löst zusätzlich die Max-SOC-Sperre aus (genau wie beim
    zeitgesteuerten Laden).

    Vorrang innerhalb von _async_enforce_grid_charge: Max-SOC-Sperre >
    manuelle Netzladung > zeitgesteuertes Laden > netzdienliches Laden >
    preisoptimiertes Laden.
    Preisoptimiertes Laden bricht - wie das zeitgesteuerte Laden - bei
    bestätigtem PV-Überschuss am Smart Meter sofort ab (dieselbe
    Zyklen-Hysterese, PV_SURPLUS_HYSTERESIS_CYCLES), UND weicht zusätzlich
    einem effektiven Zeitfenster des netzdienlichen Ladens
    (grid_serving_window_active: Zeit/Monat plus optionale Prognosefreigabe
    aus REQ-GRID-SERVING-CHARGE) - unabhängig davon, ob dessen eigene
    Zustandsmaschine gerade tatsächlich eingreift. Siehe
    REQ-GRID-SERVING-CHARGE für die Begründung dieses Vorrangs (netzdienliches
    Laden läuft nur in ertragsreichen Sommermonaten mit ohnehin kaum nötigem
    Netzbezug) sowie den ursprünglich gemeldeten Bug, den dieser Vorrang
    behebt: ohne ihn konnten sich beide Automatiken gegenseitig ein- und
    ausschalten, sobald ihre Bedingungen gleichzeitig erfüllt waren. Der
    Statussensor zeigt in diesem Fall "Pausiert (Netzdienliches Laden aktiv)"
    (PRICE_STATUS_PAUSED_GRID_SERVING).

    Neutralpreis-Pausezone: number "Preisoptimiertes Laden Neutralpreis"
    (EUR/kWh, muss über der Preisgrenze liegen, siehe Reparaturhinweis
    unten) erweitert das preisoptimierte Laden um einen dritten Preisbereich
    - unabhängig von der aktiven Strategie (absolute/relativ/smart), aber
    nur wenn preisoptimiertes Laden aktiv ist. Lädt die Automatik gerade
    NICHT aus dem Netz (price_should_charge in
    SaxPowerCoordinator._async_enforce_grid_charge ist False, z. B. weil der
    aktuelle Preis über der Preisgrenze liegt), aber der aktuelle Preis
    (price_planner.plan.current_price) liegt noch unterhalb des
    Neutralpreises, wird der Speicher NICHT der geräteeigenen
    SmartMeter-Nullregelung überlassen, sondern aktiv in den manuellen
    Sollwertmodus mit Sollwert 0 geschaltet (price_should_pause,
    async_start_sun_charge(0), Status "Pausiert (Preisband)") - Laden UND
    Entladen bleiben gestoppt, der komplette Hausverbrauch läuft über das
    Netz. Zweck: verhindert, dass die im Speicher gespeicherte, günstig
    eingekaufte Energie durch die Speicherverluste beim Entladen teurer wird
    als der direkte Netzbezug in diesem mittleren Preisband. Erst ab dem
    Neutralpreis lohnt sich die Entladung wieder trotz Speicherverlusten -
    der Speicher geht dann zurück in die normale SmartMeter-Nullregelung,
    die die Entladung wieder übernimmt (identisch zum bisherigen
    Rückfallverhalten, wenn kein gültiges Preisgrenze/Neutralpreis-Paar
    vorliegt). Die Pausezone teilt sich dieselben Ausschlussgründe wie
    price_should_charge (Max-SOC-Sperre, PV-Überschuss, Vorrang des
    zeitgesteuerten UND des netzdienlichen Ladens - insbesondere weicht sie
    sofort einem bestätigten PV-Überschuss, damit freie PV-Energie weiterhin
    ungehindert in den Speicher fließen kann) und hat dieselbe Priorität wie
    aktives preisoptimiertes Laden selbst: sie wird umgekehrt von
    netzdienlichem Laden blockiert, sobald dessen Zeitfenster aktiv ist
    (price_should_pause schließt grid_serving_window_active mit aus), NICHT
    mehr andersherum. Fehlt eine der beiden Preis-Einstellungen (noch nicht
    restauriert), oder liegt der Neutralpreis nicht über der Preisgrenze,
    bleibt price_should_pause bewusst False - unverändertes Verhalten wie vor
    Einführung des Neutralpreises, statt einer stillen Annahme.

    Reparaturhinweis ISSUE_PRICE_NEUTRAL_BELOW_LIMIT
    (coordinator._check_price_neutral_below_limit, aufgerufen aus
    _async_check_self_diagnostics wie die fünf Prüfungen aus
    REQ-SELF-DIAGNOSIS-REPAIRS): liegt der Neutralpreis nicht über der
    Preisgrenze (<=), legt der Coordinator ein rein informatives
    (is_fixable=False), sich selbst heilendes Issue an - statische
    Einstellungskombination wie ISSUE_MAX_SOC_BELOW_MIN_SOC, kein
    Zustandsflanken-Timer nötig, schlägt sofort an.
    translation_placeholders: max_price, neutral_price.

    Gegenseitiger Ausschluss mit der Netzladung: Beide laden aktiv aus dem
    Netz über denselben Schreibpfad und dürfen nicht gleichzeitig aktiv
    sein. Wird eines eingeschaltet, während das andere läuft, wird die
    Änderung NICHT stillschweigend ausgeführt: Der Coordinator lehnt sie
    zunächst ab (Setter geben False zurück, der Schalter springt zurück)
    und legt ein reparierbares Issue mit Bestätigen/Abbrechen-Dialog an
    (repairs.ChargeConflictRepairFlow) sowie eine Persistent Notification
    für die sofortige Sichtbarkeit. Bestätigen schaltet das jeweils andere
    Feature ab und aktiviert das gewünschte; Abbrechen lässt alles
    unverändert. Beide Artefakte werden gemeinsam entfernt, sobald der
    Konflikt auf irgendeinem Weg aufgelöst ist. Der Restore-Pfad beim Start
    sowie der Service set_price_charge_enabled (force) umgehen die
    Rückfrage bewusst - eine Automation kann auf keinen Dialog antworten,
    und beim Restaurieren hat der Anwender gerade nichts angeklickt.
  requirements:
    - "Options Flow (config_flow.SaxPowerOptionsFlow): Auswahl des
       Strompreis-Sensors, optionales Attribut-Override, Preis-Einheit
       (automatisch/EUR/ct), optionaler PV-Prognose-Sensor sowie dessen
       nutzbarer Anteil in Prozent. Keine YAML-Konfiguration. Bewusst KEIN
       eigenes Feld für die Strategie (bis einschließlich Version mit
       CONF_PRICE_STRATEGY vorhanden, seither entfernt): Ein dort
       hinterlegter Wert hätte ohnehin nur bis zum ersten gespeicherten
       Zustand der Select-Entity gewirkt (siehe unten,
       select.SaxPowerPriceStrategySelect) und dem Anwender fälschlich
       suggeriert, er ließe sich dort jederzeit ändern - vom Anwender
       gemeldet, nachdem eine Options-Flow-Änderung der Strategie im
       Dashboard folgenlos blieb."
    - "Entities am bestehenden SAX-Gerät: switch 'Preisoptimiertes Laden
       aktiv' (Hauptschalter), select 'Preisoptimiertes Laden Strategie',
       number 'Preisoptimiertes Laden Preisgrenze' (EUR/kWh), number
       'Preisoptimiertes Laden Neutralpreis' (EUR/kWh, muss über der
       Preisgrenze liegen), number 'Preisoptimiertes Laden Anzahl Stunden'
       (1-24), sensor 'Preisoptimiertes Laden nächster Start' (device_class
       timestamp), sensor 'Preisoptimiertes Laden Status' (Klartext),
       sensor 'Preisoptimiertes Laden aktiv' (Diagnose) sowie sensor
       'Aktueller Strompreis'. Kein eigenes Ziel-SOC - number 'Max. SOC' ist
       die einzige SOC-Einstellung der Integration, siehe
       REQ-TIMED-SOC-CHARGE."
    - "Alle Stellgrößen werden über Neustarts hinweg persistiert - im
       versionierten Konfigurations-Store, der vor dem ersten steuernden
       Refresh geladen wird (REQ-CONTROL-CONFIG-BOOTSTRAP); RestoreEntity
       ist nur noch der einmalige Migrationspfad. Ohne beides gelten die
       Defaults aus const.py - für die Strategie DEFAULT_PRICE_STRATEGY
       (kein Options-Flow-Fallback mehr, siehe oben)."
    - "Der Status-Sensor benennt den jeweils wirksamen Grund: Aus, Keine
       Preisdaten, Warten auf Preisabfall, Lade aus Netz, PV-Prognose deckt
       Bedarf, Pausiert (PV-Überschuss), Pausiert (Max. SOC), Pausiert
       (Netzladung aktiv), Pausiert (Preisband). Seine
       Attribute führen Strategie, aktuellen Preis, wirksame Preisgrenze,
       Neutralpreis, benötigte Stunden, eingerechnete PV-Prognose, die
       konfigurierten Quell-Sensoren und die geplanten Zeitfenster mit."
    - "Services: sax_power.refresh_price_plan (sofortige Neuberechnung) und
       sax_power.set_price_charge_enabled (nicht-interaktives Schalten mit
       optionalem force)."
    - "Die Prüfung der Ladebedingungen läuft mindestens alle 60 Sekunden."
    - "__init__.async_update_options wendet eine Options-Flow-Änderung
       (Strompreis-/PV-Prognose-Sensor) live auf den laufenden Coordinator
       an (coordinator.options ersetzen + price_planner.async_setup()
       erneut aufrufen), OHNE den Config Entry per
       hass.config_entries.async_reload neu zu laden. Ursprünglich
       gemeldeter Bug: Ein Reload baut SaxPowerCoordinator komplett neu auf
       - SaxPowerCoordinator.async_shutdown ruft dabei async_stop_sun_charge
       auf, das Register 40051 aktiv auf SmartMeter-Nullregelung
       zurücksetzt, selbst wenn netzdienliches Laden (REQ-GRID-SERVING-
       CHARGE) gerade aktiv den Sollwert bei 0 % hält. Bei echtem
       PV-Überschuss beginnt der Speicher dadurch sofort wieder zu laden,
       bis die frisch erzeugte Coordinator-Instanz die
       PV_SURPLUS_HYSTERESIS_CYCLES-Bestätigung erneut durchlaufen hat -
       sichtbar als kurzer, ungewollter Ladevorgang direkt nach dem
       Speichern der Options-Flow-Seite (z. B. beim erstmaligen Hinterlegen
       des Strompreis-/PV-Prognose-Sensors), unabhängig vom preisoptimierten
       Laden selbst. Die Options Flow betrifft ausschließlich den Preis-
       Planner, nie Modbus-Client/Slave-IDs/Scan-Intervall (die stehen
       unveränderlich in entry.data) - ein Reload ist für eine reine
       Options-Änderung deshalb nicht nötig."
  acceptance_criteria:
    - "tests/test_price_optimizer.py deckt ab: Einlesen der Attributformate
       (raw_today/raw_tomorrow, Zahlenlisten, data/start_time,
       Viertelstunden, ct-Umrechnung, Attribut-Override, unbrauchbare
       Daten), Planberechnung je Strategie inkl. Planungshorizont,
       Smart-Modus mit und ohne ausreichende PV-Prognose sowie ohne
       Kapazität, Schreibpfad und Rückkehr in die Nullregelung, Abbruch bei
       Max-SOC/PV-Überschuss, Vorrang des zeitgesteuerten Ladens,
       Konfliktdialog (Anlegen, Bestätigen, Abbrechen, force), das
       Restore-Verhalten der Select-/Switch-Entities sowie die
       Neutralpreis-Pausezone: manueller Sollwertmodus mit Sollwert 0
       zwischen Preisgrenze und Neutralpreis, Rückkehr in die Nullregelung
       ab dem Neutralpreis, Vorrang von PV-Überschuss vor der Pausezone,
       unverändertes Verhalten ohne gültige Preisgrenze/Neutralpreis-
       Kombination sowie Vorrang von netzdienlichem Laden vor
       preisoptimiertem Laden (test_grid_serving_takes_priority_over_
       price_charge_neutral_band, test_grid_serving_takes_priority_over_
       price_charge_active_charging) - ein aktives Zeitfenster des
       netzdienlichen Ladens blockiert sowohl das aktive preisoptimierte
       Laden als auch dessen Pausezone, nicht umgekehrt."
    - "tests/test_number.py deckt die Vorbelegung und Klemmung der drei
       neuen Number-Entities (Preisgrenze, Neutralpreis, Anzahl Stunden)
       ab."
    - "tests/test_config_flow.py deckt den Options Flow ab (Speichern und
       Vorbelegung)."
    - "tests/test_init.py deckt async_update_options ab:
       test_async_update_options_applies_live_without_reload verifiziert,
       dass eine Options-Änderung NICHT mehr hass.config_entries.
       async_reload aufruft, sondern coordinator.options ersetzt und
       coordinator.price_planner.async_setup() und anschließend
       coordinator.async_apply_price_plan() aufruft (Regressionsschutz
       für den oben beschriebenen Bug); test_async_update_options_noop_
       without_loaded_entry deckt den Fall ab, dass der Listener feuert,
       während der Coordinator (noch) nicht in hass.data registriert ist."
    - "tests/test_repairs.py deckt ISSUE_PRICE_NEUTRAL_BELOW_LIMIT ab:
       sofortiges Auslösen bei Neutralpreis <= Preisgrenze (auch bei
       Gleichheit), Idempotenz und Selbstheilung, sobald der Neutralpreis
       wieder über der Preisgrenze liegt."
    - "README.md beschreibt Einrichtung, Strategien und Zusammenspiel mit
       den übrigen Lademodi."

# ==============================================================================
# ANFORDERUNG: MITGELIEFERTES DASHBOARD
# ==============================================================================
requirement_bundled_dashboard:
  id: REQ-BUNDLED-DASHBOARD
  title: "Mitgeliefertes Lovelace-Dashboard (5 Tabs), optional in der Ersteinrichtung anlegbar"
  status: done
  description: >
    dashboard.py baut ein fünfteiliges Storage-Dashboard mit den
    wichtigsten Sensoren/Einstellungen, gegliedert in fünf Tabs (Lovelace-
    Views, der fünfte "Wirtschaftlichkeit" ist gesondert unter
    REQ-ECONOMICS-DASHBOARD beschrieben): "Allgemeine Informationen"
    (Speicher-Schalter, SOC, Lade-/
    Entladeleistung, Netzleistung (translation_key smartmeter_power - der
    Sensor selbst heißt weiterhin smartmeter_power/unique_id-Suffix
    "smartmeter_power", nur das angezeigte Label wurde von "Smart Meter
    Leistung" auf "Netzleistung" verkürzt, siehe translations/de.json),
    Energiezähler, Gerätedaten (ohne die fest bekannten "Hersteller"/
    "Gerätemodell" - beide boten dort keinen Mehrwert; der Sensor
    ic_control_mode_text erscheint mit dem Label "Steuermodus" direkt
    unter "Speicher Ereignis") - die reine Textanzeige "Speicher Zustand"
    wurde entfernt, der Speicher-Schalter bleibt), "Ladeautomatik" und
    "Netzdienliches Laden" sowie "Dynamisches
    Laden" (preisoptimiertes Laden: Strategie, Preisgrenze, Neutralpreis,
    Stundenzahl, Status und PV-Prognose). Die frühere Karte "Status" mit den
    vier Lade-/Automatik-binary_sensor-Entities (REQ-BINARY-SENSORS) wurde
    aus "Allgemeine Informationen" entfernt, ohne Ersatz - die Entities bleiben
    unverändert bestehen (z. B. für eigene Automationen), erscheinen aber
    in keiner Karte des mitgelieferten Dashboards mehr.

    Die Kartenzeilen der "Preisoptimiertes Laden"-Karte (Tab "Dynamisches
    Laden") tragen keinen "Preisoptimiertes Laden"-Präfix im Label mehr -
    der Kartentitel gibt den Kontext bereits vor: price_charge_strategy
    heißt nur noch "Strategie", price_charge_max_price "Netzbezug und Laden
    bis", price_charge_neutral_price "Netzbezug ohne Laden bis",
    price_charge_hours "Anzahl Stunden", price_charge_active_text "Aktiv",
    price_charge_status_text "Status", direkt gefolgt von
    grid_serving_forecast mit dem täglich aktualisierten Namen "PV-Prognose
    <Tag>.<Monat>.", sowie price_charge_next_start "Nächster Start" (jeweils
    translations/de.json; der Prognosename wird von der Entity übernommen).
    price_charge_current_price
    ("Aktueller Strompreis") und max_soc ("Max. SOC") trugen nie einen
    solchen Präfix und bleiben unverändert. Der Hauptschalter außerhalb
    dieser Karte (switch.price_charge_enabled, Tile-Karte oberhalb der
    "Preisoptimiertes Laden"-Karte) behält bewusst sein volles Label
    "Preisoptimiertes Laden aktiv" - er steht nicht innerhalb der Karte,
    die den Kontext liefert.

    "Ladeautomatik" und "Netzdienliches Laden" beginnen gleichartig mit dem
    jeweiligen Hauptschalter als Tile-Karte ("Netzladung aktiv" /
    "Netzdienliches Laden aktiv"). Die Zeit-Entities heißen in beiden Tabs
    einheitlich "Start"/"Ende" statt tabspezifisch "Netzladung Start" oder
    "Netzdienliches Laden Start". Die Karte selbst heißt bei
    "Ladeautomatik" "Zeitfenster" (das Zeitfenster löst das Laden aus), bei
    "Netzdienliches Laden" aber "Ladepause" (das Zeitfenster unterbricht
    umgekehrt gerade das PV-Laden, siehe REQ-GRID-SERVING-CHARGE). Diese
    Karte enthält in fester Reihenfolge Start, Ende, "PV-Prognose
    <Tag>.<Monat>." in kWh, die Number-Entity "Mindest PV-Prognose" und den
    dynamischen Status aus REQ-GRID-SERVING-CHARGE. Eine separate Karte
    "Einstellungen" gibt es im
    Tab "Netzdienliches Laden" nicht mehr. Am Ende folgt in beiden Tabs
    eine Karte "Aktive Monate" mit den zwölf Monats-Schaltern des
    jeweiligen Mechanismus, deren Label ebenfalls in beiden Tabs
    einheitlich nur noch der reine Monatsname ist (z. B. "Januar" statt
    "Netzladung aktiv im Januar"). Bei "Ladeautomatik" steckt zusätzlich
    eine dritte Karte "Einstellungen" dazwischen (Mindest-SOC für den
    Ladestart).
    Weder die geräteweite Max-SOC-Sperre (die
    ist mechanismus-übergreifend und gehört fachlich nicht in einen
    einzelnen Automatik-Tab) noch die reinen Status-Textanzeigen
    ("Zeitgesteuertes/Netzdienliches Laden aktiv") sind in den beiden Tabs
    enthalten - der jeweilige Hauptschalter zeigt den Zustand bereits an.

    Für einen moderneren, auf einen Blick erfassbaren Einstieg zeigt jeder
    Tab die wichtigsten Ein/Aus-Schalter (Speicher, zeitgesteuertes/
    netzdienliches/preisoptimiertes Laden) als "tile"-Karten statt als
    Listenzeile. Ladezustand und Zelltemperatur erscheinen nebeneinander
    als Gauge-Karten mit Nadel (_gauge_card, `needle: true`), beide
    ausschließlich über `segments` (nicht über das alternative
    `severity`-Mapping): SOC rot ab 0 %, gelb ab 20 %, grün ab 50 %;
    Zelltemperatur 0-5 °C rot/zu kalt, 5-32 °C grün/normal, 32-40 °C
    rot/zu heiß (ein nicht-monotones Farbmuster, mit den drei festen
    severity-Schlüsseln green/yellow/red ohnehin nicht abbildbar, "red"
    könnte dort nur einmal vorkommen). `_gauge_card` unterstützt bewusst
    nur noch `segments`, nicht mehr zusätzlich `severity`: Home Assistants
    Gauge-Karte färbt `severity`-Farben über die Theme-Variablen
    (--success-/--warning-/--error-color), `segments`-Farben dagegen als
    wörtliche CSS-Farbnamen - dieselbe Zeichenkette "red"/"green" sah in
    den beiden Modi unterschiedlich aus, wenn eine Gauge severity und die
    andere segments verwendete. Beide Gauges verwenden deshalb identische
    Farbwerte ("red"/"yellow"/"green") über denselben Mechanismus. Alle
    Kartenbeschriftungen
    verwenden nur den reinen, übersetzten Entity-Namen (z. B.
    "Ladezustand") statt des vollen, geräteweiten Anzeigenamens ("SAX Power
    Home Ladezustand") - async_build_dashboard_config lädt dazu dieselben
    Übersetzungen (component.sax_power.entity.<domain>.<translation_key>.
    name), die auch die Entity Registry selbst verwendet, und ist deshalb
    async.

    Der Service sax_power.reinstall_dashboard (SERVICE_REINSTALL_DASHBOARD,
    Schema wie stop_grid_charge: nur device_id) ruft
    dashboard.async_create_dashboard mit force=True auf und setzt damit ein
    bereits bestehendes Dashboard auf den aktuell gebauten
    Auslieferungszustand zurück (überschreibt nur den Karteninhalt,
    Panel-Registrierung/Sidebar-Sichtbarkeit bleiben unangetastet) - oder
    legt es neu an, falls es zwischenzeitlich komplett gelöscht wurde
    (_async_create_dashboard fällt für diesen Fall auf denselben
    Neuanlage-Pfad zurück wie force=False). Ersetzt eine frühere
    ButtonEntity auf der Geräteseite (SaxPowerReinstallDashboardButton,
    button.py): Anwender fanden diesen Button dort zuverlässig nicht -
    ein über Entwicklertools -> Aktionen aufrufbarer Service ist in Home
    Assistant der robustere, immer auffindbare Weg für so eine punktuelle,
    selten benötigte Aktion (kein wiederkehrender Regelbetrieb wie bei den
    Lade-Automatiken, für die eine eigene Entity mit Zustand angemessen
    wäre).

    Dritter, optionaler Schritt der Ersteinrichtung
    (config_flow.async_step_dashboard, Checkbox "Dashboard anlegen",
    Standard: aktiv). Die Entscheidung landet als CONF_CREATE_DASHBOARD im
    Config Entry; __init__.async_setup_entry legt das Dashboard danach an -
    erst nach dem Plattform-Setup möglich, weil die Kartenreferenzen echte
    Entity-IDs brauchen (Auflösung über die Entity Registry anhand der
    stabilen unique_id-Suffixe je Entity, nicht über feste Entity-ID-
    Strings). Anschließend wird CONF_CREATE_DASHBOARD im Entry auf False
    zurückgesetzt - bewusst VOR der Registrierung des Options-Update-
    Listeners, damit dieser interne Reset nicht selbst einen Reload direkt
    nach der Ersteinrichtung auslöst. Ohne den Reset würde jeder spätere
    Reload/Neustart versuchen, das Dashboard erneut anzulegen; ein vom
    Anwender bewusst gelöschtes Dashboard würde dadurch ungewollt wieder
    auftauchen. Über async_step_reconfigure (spätere IP-Änderung) wird
    dieser Schritt nicht erneut durchlaufen.

    Nachträgliches Anlegen: Der Ersteinrichtungsschritt läuft nur einmal
    durch - wer ihn abgewählt hat, das Dashboard später gelöscht hat, oder
    dessen Eintrag vor Einführung dieses Features angelegt wurde, hat sonst
    keine Möglichkeit mehr, es erneut zu erzeugen. Der Service
    sax_power.create_dashboard (SERVICE_CREATE_DASHBOARD, Schema wie
    stop_grid_charge: nur device_id) ruft dashboard.async_create_dashboard
    direkt auf und ist über Entwicklertools -> Aktionen aufrufbar; wie die
    Funktion selbst idempotent (tut nichts, wenn das Dashboard schon
    existiert).

    dashboard.async_create_dashboard baut auf zwei öffentlichen, aber
    sonst nur intern innerhalb von homeassistant.components.lovelace
    verdrahteten Bausteinen auf: eine eigene
    lovelace.dashboard.DashboardsCollection-Instanz (liest/schreibt
    denselben Speicher wie die von Home Assistant selbst verwaltete
    Instanz, prüft dabei zugleich auf einen bereits vorhandenen Eintrag -
    idempotent über Neustarts hinweg) sowie eine manuell angelegte
    lovelace.dashboard.LovelaceStorage-Instanz zusammen mit
    frontend.async_register_built_in_panel, damit das Dashboard sofort
    ohne Neustart in der Sidebar erscheint (dieselbe Sichtbarkeit, die bei
    Home Assistants eigenem Onboarding-Kartendashboard sonst über einen
    nur dort erreichbaren Listener automatisch entsteht). Rein optionale
    Komfortfunktion: Jeder Fehler beim Anlegen (z. B. weil eine künftige
    Home-Assistant-Version diese Interna ändert, oder weil Lovelace/
    Frontend gar nicht geladen ist) wird nur geloggt, niemals als
    ConfigEntryNotReady durchgereicht - die eigentliche Integration darf
    davon nie blockiert werden.
  acceptance_criteria:
    - "tests/test_dashboard.py deckt ab: async_build_dashboard_config
       erzeugt immer alle fünf Views, löst nur tatsächlich in der Entity
       Registry vorhandene Entities auf und lässt Karten ohne jede
       aufgelöste Entity komplett weg. async_create_dashboard überspringt
       sauber, wenn Lovelace nicht geladen ist, registriert Panel und
       Storage-Eintrag korrekt, ist idempotent bei wiederholtem Aufruf und
       schluckt unerwartete Fehler, statt sie durchzureichen."
    - "tests/test_config_flow.py deckt den dritten Ersteinrichtungsschritt
       ab (Default aktiv, explizite Abwahl)."
    - "tests/test_dashboard.py deckt zusätzlich die Services
       sax_power.create_dashboard und sax_power.reinstall_dashboard
       end-to-end ab (Geräte-Lookup, Aufruf von async_create_dashboard mit
       force=False bzw. force=True)."
    - "tests/test_dashboard.py deckt die beiden Gauge-Karten ab (SOC:
       Entity, needle, segments-Schwellwerte 0/20/50 %; Zelltemperatur:
       Entity, needle, min/max, nicht-monotone segments 0/5/32; beide
       verwenden identische red/green-Farbwerte), sowie dass Kartenzeilen
       den geräteprefix-freien, übersetzten Namen verwenden, und dass
       force=True ein bereits bestehendes Dashboard überschreibt, ohne das
       Panel erneut zu registrieren."
    - "tests/test_dashboard.py deckt ab, dass Tab \"Allgemeine
       Informationen\" keine Karte mit dem Titel \"Status\" mehr enthält
       und die vier zuvor dort gezeigten binary_sensor-Entities in keiner
       Karte mehr referenziert werden."
    - "tests/test_dashboard.py deckt ab, dass \"smartmeter_power\" eine
       ganz normale Zeile der \"Leistung\"-Karte ist (wie jede andere
       Sensor-Entity dort auch) und das Label \"Netzleistung\" trägt."
    - "tests/test_dashboard.py deckt ab, dass die Gerätekarte den Sensor
       ic_control_mode_text direkt nach storage_event_text aufführt und
       dabei das übersetzte Label \"Steuermodus\" verwendet."
    - "tests/test_dashboard.py deckt ab, dass keine Kartenzeile der
       \"Preisoptimiertes Laden\"-Karte (Tab \"Dynamisches Laden\") noch
       den Präfix \"Preisoptimiertes Laden\"/\"Price-optimised charging\"
       im Label trägt."
    - "tests/test_dashboard.py deckt ab, dass die beiden Preislabels
       \"Laden\" großschreiben und grid_serving_forecast direkt nach
       price_charge_status_text steht und dort den dynamischen Entity-Namen
       \"PV-Prognose <Tag>.<Monat>.\" übernimmt."
    - "tests/test_dashboard.py deckt ab, dass die Karte \"Ladepause\" ihre
       fünf Zeilen in der Reihenfolge Start, Ende, PV-Prognose mit aktuellem
       Datum, Mindest PV-Prognose, Status enthält und im Tab \"Netzdienliches
       Laden\" keine separate Karte \"Einstellungen\" mehr existiert;
       tests/test_sensor_descriptions.py prüft den täglichen Datumswechsel,
       den Registry-Namen ohne Gerätepräfix sowie das korrigierte deutsche
       Mindestprognose-Label."

# ==============================================================================
# ANFORDERUNG: BINARY_SENSOR-PLATTFORM
# ==============================================================================
requirement_binary_sensors:
  id: REQ-BINARY-SENSORS
  title: "binary_sensor-Plattform: Lade-/Problem-/Konnektivitätszustände mit device_class statt Klartext"
  status: done
  description: >
    binary_sensor.py ergänzt die bestehenden deutschen Klartext-Sensoren
    (sensor.py, *_active_text) um sieben beschreibungsbasierte
    binary_sensor-Entities mit echter device_class-Semantik (Icon,
    Zustandsfarbe, maschinenlesbarer on/off-Zustand statt Sprachvergleich).
    Rein additiv - die Text-Sensoren bleiben unverändert bestehen, weil sie
    in bestehenden Anwender-Automationen und im mitgelieferten Dashboard
    stehen.

    Entities (unique_id-Suffix = translation_key):
      - "battery_charging" (device_class BATTERY_CHARGING): storage_power_
        active < 0 (negativ = Ladung, siehe _watts_to_ic_setpoint_raw).
      - "timed_charge_active", "price_charge_active", "grid_serving_active"
        (device_class RUNNING): dieselben, bereits in coordinator.data
        veröffentlichten Flags (SaxPowerCoordinator._publish_charge_state),
        die auch die gleichnamigen Text-Sensoren speisen.
      - "max_soc_clamped" (kein device_class): coordinator.max_soc_clamped.
      - "extended_mode_available" (device_class CONNECTIVITY,
        entity_category diagnostic): coordinator.extended_available, siehe
        REQ-EXTENDED-MODE-RESILIENCE.
      - "battery_problem" (device_class PROBLEM, entity_category
        diagnostic): True, sobald storage_event oder battery_event einen
        von 0 (Normalbetrieb) abweichenden Rohcode melden - vergleicht
        bewusst die Rohcodes, nicht die übersetzten storage_event_text/
        battery_event_text-Werte, damit ein künftig geändertes Label die
        Logik nicht bricht.

    Fehlende Werte werden konsistent zum Rest der Integration als "nicht
    verfügbar" (is_on = None) abgebildet, nie fälschlich als False - gilt
    für alle sieben Entities, solange coordinator.data noch nicht befüllt
    ist, sowie zusätzlich für "battery_charging" und "battery_problem",
    solange der SunSpec-Modus-Block nicht erreichbar ist (siehe
    REQ-EXTENDED-MODE-RESILIENCE).

    __init__.PLATFORMS enthält Platform.BINARY_SENSOR. Das mitgelieferte
    Dashboard (REQ-BUNDLED-DASHBOARD) zeigt keine dieser sieben Entities
    (mehr) an - die frühere Karte "Status" im Tab "Allgemeine
    Informationen" mit den vier Lade-/Automatik-Entities ("battery_
    charging", "timed_charge_active", "price_charge_active",
    "grid_serving_active") wurde ersatzlos entfernt. Die Entities selbst
    bleiben unverändert bestehen (z. B. für eigene Anwender-Automationen),
    nur die Dashboard-Karte fällt weg.
  acceptance_criteria:
    - "tests/test_binary_sensor.py deckt jede der sieben is_on_fn-Funktionen
       ab: erwarteter Zustand bei vorhandenen Daten, None bei fehlendem
       SunSpec-Modus-Block (battery_charging, battery_problem) sowie None,
       solange coordinator.data noch None ist (vor dem ersten Update)."
    - "tests/test_binary_sensor.py stellt sicher, dass alle Entity-Keys
       eindeutig sind und jeder Key in strings.json sowie
       translations/de.json und translations/en.json eine Übersetzung hat."
    - "tests/test_dashboard.py deckt ab, dass Tab Allgemeine Informationen
       keine Karte mit dem Titel \"Status\" mehr enthält und keine der
       vier Lade-/Automatik-binary_sensor-Entities mehr referenziert, auch
       wenn sie in der Entity Registry vorhanden sind."

# ==============================================================================
# ANFORDERUNG: ABSCHLUSSSEITE DER ERSTEINRICHTUNG
# ==============================================================================
requirement_setup_finish_summary:
  id: REQ-SETUP-FINISH-SUMMARY
  title: "Abschlussseite der Ersteinrichtung: Zusammenfassung statt wortlosem Ende"
  status: done
  description: >
    Der Config Flow endete bislang nach dem dritten, optionalen Schritt
    ("dashboard", siehe REQ-BUNDLED-DASHBOARD) direkt mit async_create_entry
    - ohne jede Rückmeldung, was die Ersteinrichtung tatsächlich ergeben hat.
    config_flow.async_step_finish ergänzt einen vierten, abschließenden
    Schritt ohne eigene Eingabefelder (leeres vol.Schema({}), reiner
    "Weiter"-Button): eine Zusammenfassung über description_placeholders
    (strings.json/translations, Übersetzungsschlüssel "finish").

    Der Config Entry selbst wird jetzt erst hier angelegt (vorher in
    async_step_dashboard) - async_step_dashboard merkt die
    Dashboard-Entscheidung nur noch in self._dashboard_data vor und
    verzweigt weiter zu async_step_finish, analog zu
    self._connection_data/self._grid_charge_data aus den vorherigen
    Schritten. Ein Abbruch des Flows auf der Abschlussseite legt dadurch
    keinen unvollständigen Eintrag an.

    Angezeigte Werte, per _async_read_finish_summary ermittelt (eigener,
    einmaliger Testread analog zu _async_validate_connection - Verbindung
    zum SunSpec-Modus-Block über READ_BLOCK_EXT_LOW1_START/_COUNT,
    Slave-ID CONF_SLAVE_ID_EXTENDED):
      - "firmware": aus sun_version_master/sun_version_gateway
        zusammengesetzt ("Master V<x> / Gateway V<y>"). Der Config Flow
        verwendet dafür denselben Decoder wie der Coordinator
        (domain.sunspec.decode_identity), statt die Geräteidentität ein
        zweites Mal zu implementieren.
      - "serial_number": aus sun_serial_number (Hi-/Lo-Word kombiniert in
        domain.sunspec.decode_identity).
      - "sunspec_status": "Erreichbar"/"Nicht erreichbar".
      - "entity_count": Summe der von den sechs Plattformen (sensor,
        binary_sensor, number, select, switch, time; siehe
        __init__.PLATFORMS) tatsächlich angelegten Entities -
        config_flow._expected_entity_count() zählt sensor.py
        (SENSOR_DESCRIPTIONS + zwei Energiezähler) und binary_sensor.py
        (BINARY_SENSOR_DESCRIPTIONS) sowie die Monats-Schalter in
        switch.py (2 * len(ALL_MONTHS)) dynamisch, die übrigen, stabilen
        Plattform-Entity-Zahlen (number.py, select.py, time.py, die vier
        nicht-monatsbezogenen Schalter in switch.py) als feste, dort
        nachgeführte Konstanten - siehe Kommentar über
        config_flow._expected_entity_count.

    Fehlertoleranz: Ist der SunSpec-Modus-Block auf diesem Testread nicht
    erreichbar (TCP-Fehler, Modbus-Fehlerantwort), blockiert das nicht die
    Ersteinrichtung - analog zu REQ-EXTENDED-MODE-RESILIENCE zeigt die
    Seite dann nur "Nicht erreichbar" bzw. "Nicht verfügbar" für
    Firmware/Seriennummer, statt den Flow abzubrechen. Die Basic-Mode-
    Verbindung selbst wurde bereits im ersten Schritt
    (_async_step_connection) validiert.

    Reine Textarbeit ohne Auswirkung auf die eigentliche Gerätesteuerung:
    kein neues Register wird geschrieben, kein bestehender Schreibpfad
    verändert.
  acceptance_criteria:
    - "tests/test_config_flow.py deckt den vierten Ersteinrichtungsschritt
       ('finish') ab: description_placeholders enthalten korrekte
       Firmware-/Seriennummer-/SunSpec-Status-/Entity-Anzahl-Werte bei
       erreichbarem SunSpec-Modus-Block, sowie 'Nicht erreichbar' bzw.
       'Nicht verfügbar' bei einem auf diesem Testread fehlschlagenden
       SunSpec-Modus-Block."
    - "tests/test_config_flow.py deckt ab, dass der Config Entry weiterhin
       korrekt mit allen zuvor gesammelten Daten (Verbindung,
       Netzladung-Vorbelegung, Dashboard-Entscheidung) angelegt wird,
       jetzt aber erst nach Bestätigung der Abschlussseite."

# ==============================================================================
# ANFORDERUNG: SELBSTDIAGNOSE / ERWEITERTE REPAIRS
# ==============================================================================
requirement_self_diagnosis_repairs:
  id: REQ-SELF-DIAGNOSIS-REPAIRS
  title: "Fünf zusätzliche, selbstheilende Repair-Issues für still fehlschlagende Konfigurationen"
  status: done
  description: >
    repairs.py deckte bisher nur den Ladekonflikt zwischen Netzladung und
    preisoptimiertem Laden ab (ChargeConflictRepairFlow,
    ISSUE_PRICE_CHARGE_CONFLICT/ISSUE_TIMED_CHARGE_CONFLICT). Fünf weitere,
    rein informative (is_fixable=False) Issues über
    SaxPowerCoordinator._async_check_self_diagnostics erkennen zusätzlich
    Konfigurationen, die still fehlschlagen - eine Automatik, die
    eingeschaltet ist, aber nie greift, fällt sonst nur am unerwartet
    ausbleibenden Ladeverhalten auf, nicht an einer sichtbaren Fehlermeldung.
    Anders als der Ladekonflikt-Dialog liegen diese fünf Prüfungen direkt in
    coordinator.py statt in repairs.py, weil keine von ihnen einen
    Bestätigungs-Fix-Flow braucht (kein RepairsFlow-Eintrag nötig) - sie
    heilen sich stattdessen automatisch (ir.async_delete_issue), sobald ihre
    jeweilige Ursache behoben ist, analog zum bestehenden Muster von
    ISSUE_EXTENDED_MODE_UNAVAILABLE (_async_read_high_block).

    _async_check_self_diagnostics wird am Ende jedes _async_update_data-
    Zyklus aufgerufen (nach _publish_charge_state) und läuft damit bei jedem
    Poll-Tick - jede der fünf Einzelprüfungen legt ihr Issue aber nur auf
    einer Zustandsflanke an bzw. entfernt es wieder (je ein *_issue_active-
    Flag/-Dict), statt es bei jedem Aufruf neu anzulegen. Die beiden
    zeitdauerabhängigen Prüfungen (1 und 2) verwenden dafür denselben
    monotonic()-Zeitstempel-Ansatz wie self._energy_last_ts/
    self._basic_last_read (nicht die zyklenbasierte Hysterese von
    _cycles_confirmed/PV_SURPLUS_HYSTERESIS_CYCLES, die an den Scan-
    Intervall gekoppelt ist statt an echte Wanduhrzeit):

    1. ISSUE_PRICE_SENSOR_MISSING ("Preisoptimiertes Laden: Preis-Sensor
       liefert keine Daten"): price_planner.plan.status ==
       PRICE_STATUS_NO_PRICE_DATA impliziert bereits price_charge_enabled
       UND Strategie != "off" (siehe price_optimizer.evaluate/compute_plan)
       - deckt sowohl eine gelöschte/nie existierende CONF_PRICE_SENSOR-
       Entity (hass.states.get liefert None, parse_price_slots daraus eine
       leere Slot-Liste) als auch einen technisch vorhandenen, aber leeren
       Sensor ab. self._price_sensor_missing_since hält fest, seit wann der
       Zustand ununterbrochen anhält; erst nach
       PRICE_SENSOR_MISSING_GRACE_PERIOD (6 Stunden) wird das Issue angelegt,
       damit ein einzelner verpasster 60-Sekunden-Preis-Update-Zyklus nicht
       sofort ein Issue erzeugt. translation_placeholders: price_sensor
       (price_planner.price_entity_id).
    2. ISSUE_SUNSPEC_PERSISTENTLY_UNAVAILABLE ("SAX SunSpec-Modus dauerhaft
       nicht erreichbar"): Eskalation von ISSUE_EXTENDED_MODE_UNAVAILABLE
       (das schon bei der ERSTEN Nichterreichbarkeit ein eigenes, weniger
       dringliches Warn-Issue anlegt, siehe REQ-EXTENDED-MODE-RESILIENCE) -
       hält der Ausfall länger als SUNSPEC_PERSISTENTLY_UNAVAILABLE_
       GRACE_PERIOD (1 Stunde) an, macht das nicht mehr nur die
       SunSpec-Sensoren "unbekannt", sondern auch alle drei Lade-Automatiken
       funktionslos - eine dringlichere, ausführlichere Meldung.
       self._extended_unavailable_since wird von _async_read_high_block auf
       derselben Zustandsflanke gesetzt/zurückgesetzt wie das bestehende
       Issue. translation_placeholders: slave_id.
    3. ISSUE_MAX_SOC_BELOW_MIN_SOC ("Ziel-SOC liegt unter dem
       Nachlade-Schwellwert"): max_soc < timed_charge_min_soc - "Max. SOC"
       ist zugleich das Ziel-SOC des zeitgesteuerten Ladens, "Min. SOC" der
       untere Start-Schwellwert; liegt Ersteres darunter, greift die
       Max-SOC-Sperre schon, bevor der Ladestart überhaupt ausgelöst würde.
       Kein Zustandsflanken-Timer nötig (statische Einstellungskombination,
       kein transienter Messwert) - schlägt sofort an.
       translation_placeholders: max_soc, min_soc.
    4. ISSUE_EMPTY_CHARGE_WINDOW ("Zeitfenster ist leer"): eine der beiden
       zeitfenstergesteuerten Automatiken (zeitgesteuertes Laden ODER
       netzdienliches Laden, je eigene issue_id mit Suffix "timed_charge"/
       "grid_serving") ist aktiv, aber ihre Start- und Endzeit sind
       identisch (siehe _window_intervals: start == end gilt als leeres
       Fenster) - die Automatik läuft dadurch nie, ohne dass das an der
       Entity selbst erkennbar wäre. translation_placeholders: feature
       (voll ausgeschriebener Anzeigename der Automatik).
    5. ISSUE_NO_ACTIVE_MONTHS ("Kein Monat ausgewählt"): analog zu Punkt 4,
       aber für die zwölf Monats-Schalter je Automatik (switch.py) - ist
       aktiv, aber kein einziger Monat ausgewählt, ist das Feature
       ganzjährig inaktiv (siehe _async_enforce_grid_charge, Abschnitt
       "Aktive Monate"). Ebenfalls je Automatik eine eigene issue_id.

    Sprache aller fünf Meldungstexte: deutsch (strings.json/translations),
    konsistent zum Rest der Integration.
  acceptance_criteria:
    - "tests/test_repairs.py deckt für jede der fünf Prüfungen drei
       Aspekte ab: Auslösen (nach Ablauf der jeweiligen Karenzzeit, sofern
       vorhanden), Idempotenz (ir.async_create_issue wird bei mehrfachem
       Aufruf von _async_check_self_diagnostics mit unverändertem
       Problemzustand nur einmal aufgerufen) und Selbstheilung (Issue
       verschwindet automatisch, sobald die jeweilige Ursache behoben ist -
       Preisdaten kehren zurück, SunSpec-Modus wieder erreichbar, Max. SOC
       angehoben, Zeitfenster/Monatsauswahl korrigiert, oder die Automatik
       abgeschaltet wird)."
    - "tests/test_repairs.py deckt zusätzlich ab, dass eine unauffällige
       Standardkonfiguration (alles deaktiviert bzw. in Ordnung) keines der
       fünf Issues erzeugt."
    - "tests/test_coordinator.py deckt ab, dass
       self._extended_unavailable_since nur auf der Zustandsflanke gesetzt
       wird (nicht bei jedem weiteren Poll-Zyklus mit weiterhin nicht
       erreichbarem SunSpec-Modus-Block) und bei Wiedererreichbarkeit
       zurückgesetzt wird."

# ==============================================================================
# ANFORDERUNG: STABILE GERÄTE-/ENTITY-IDENTITÄT
# ==============================================================================
requirement_stable_device_identity:
  id: REQ-STABLE-DEVICE-IDENTITY
  title: "Geräte-/Entity-Identität nur über interne, unveränderliche IDs - nie über einen änderbaren Namen"
  status: done
  description: >
    Das Gerät (DeviceInfo in entity.py) sowie sämtliche Entity-unique_ids
    (durchgängig f"{entry_id}_{suffix}", siehe switch.py/number.py/time.py/
    select.py/binary_sensor.py) werden ausschließlich aus der von Home
    Assistant beim Anlegen des Config Entry vergebenen, intern
    feststehenden entry_id gebildet - niemals aus einem vom Anwender
    änderbaren Namen. Im Einzelnen:

    - Der Gerätename in DeviceInfo ist eine feste Code-Konstante ("SAX
      Power Home"); die Ersteinrichtung (config_flow.py) fragt keinen
      Gerätenamen ab, der in diesen Wert einfließen würde - der Titel des
      Config Entry wird bei async_create_entry() ebenfalls fest auf
      "SAX Power Home" gesetzt, nicht vom Anwender erfragt.
    - entry.title wird nirgendwo im Code gelesen (kein Zugriff darauf
      außerhalb von config_flow.py/repairs.py, wo er nur beim Anlegen
      gesetzt wird) - ein späteres Umbenennen des Eintrags über
      "Einstellungen -> Geräte & Dienste -> Umbenennen" hat daher keinerlei
      Auswirkung auf Gerät, Entities oder das mitgelieferte Dashboard.
    - Ein Umbenennen des Geräts selbst (Home Assistants eigene
      Gerätebearbeitung, "name_by_user") ändert nur die Anzeige, nie die
      device_registry-identifiers ({(DOMAIN, entry_id)}) oder die
      unique_ids der Entities - beide bleiben stabil.
    - dashboard.py (siehe REQ-BUNDLED-DASHBOARD) löst alle
      Kartenreferenzen ausschließlich über diese stabilen
      unique_id-Suffixe auf, nie über einen aus dem (änderbaren) Namen
      abgeleiteten Entity-ID-String - ein umbenanntes Gerät/Entry findet
      das mitgelieferte Dashboard deshalb unverändert wieder.
    - Die entity_id selbst (nicht nur die unique_id) wird über
      SaxPowerEntity._assign_ids (entity.py) für jede Entity explizit
      vorgegeben ("<platform>.sax_power_<suffix>"), statt sie Home
      Assistant über has_entity_name automatisch aus Gerätename +
      Entity-Name ableiten zu lassen. Grund: bietet Home Assistant nach
      der Ersteinrichtung an, das neu angelegte Gerät umzubenennen/einem
      Bereich zuzuordnen, und aktiviert der Anwender dabei zusätzlich
      "Entity-IDs aktualisieren", regeneriert Home Assistant sonst auch
      bereits vergebene entity_ids neu aus dem (jetzt geänderten)
      Gerätenamen (homeassistant.helpers.entity_registry.
      async_regenerate_entity_id) - das bereits angelegte, mitgelieferte
      Dashboard referenziert zu diesem Zeitpunkt aber schon die
      ursprüngliche entity_id fest und würde die Entity nicht mehr
      finden. Ein von der Integration explizit gesetzter `entity_id`
      wird von Home Assistant unverändert als Vorschlag übernommen
      (entity_platform._async_derive_object_ids) und bleibt dadurch auch
      über eine solche Umbenennung hinweg stabil - unabhängig vom
      Anzeigenamen des Geräts.

    Sollte ein künftiger Ersteinrichtungsschritt einen frei wählbaren
    Gerätenamen anbieten, darf dieser ausschließlich den Anzeigenamen
    (DeviceInfo.name bzw. den Entry-Titel) setzen - niemals die
    device_registry-identifiers, eine unique_id oder eine entity_id.
  acceptance_criteria:
    - "tests/test_entity.py deckt ab, dass DeviceInfo.name die feste
       Konstante \"SAX Power Home\" bleibt und identifiers bei
       {(DOMAIN, entry_id)} bleibt, auch wenn der zugehörige Config Entry
       einen davon abweichenden Titel trägt."
    - "tests/test_dashboard.py deckt ab, dass die Kartenauflösung
       ausschließlich über die unique_id erfolgt (siehe
       REQ-BUNDLED-DASHBOARD) und damit unabhängig vom Gerätenamen
       funktioniert."
    - "tests/test_entity.py deckt ab, dass ein tatsächliches Umbenennen
       des Geräts (device_registry.async_update_device, name_by_user) die
       bereits vergebene entity_id nicht verändert, auch nicht nach
       async_regenerate_entity_id (dem Mechanismus hinter der
       \"Entity-IDs aktualisieren\"-Option im Umbenennen-Dialog)."

# ==============================================================================
# ANFORDERUNG: NETZWERK-DISCOVERY PER DHCP
# ==============================================================================
requirement_dhcp_discovery:
  id: REQ-DHCP-DISCOVERY
  title: "Automatische Netzwerk-Discovery per DHCP statt manueller IP-Eingabe"
  status: done
  description: >
    manifest.json registriert einen DHCP-Discovery-Footprint
    (Hostname-Präfix "sax*") - sendet ein SAX Speicher einen DHCP-Lease mit
    passendem Hostnamen, ruft Home Assistant async_step_dhcp im Config Flow
    auf. Bewusst nur "sax*" statt zusätzlich eines generischen Musters wie
    "inverter*" (letzteres würde auf Geräte anderer Hersteller anschlagen
    und unbeteiligten Anwendern eine falsche "Erkannt"-Karte einblenden) -
    sollte sich der tatsächliche DHCP-Hostname eines SAX Speichers am
    realen Gerät als abweichend herausstellen, ist das Muster in
    manifest.json entsprechend anzupassen.

    async_step_dhcp prüft zunächst per _async_abort_entries_match, ob der
    entdeckte Host (discovery_info.ip) bereits über einen bestehenden
    Eintrag konfiguriert ist (unabhängig von Port/Slave-IDs) und bricht in
    diesem Fall mit "already_configured" ab. Danach wird die MAC-Adresse
    (normiert über homeassistant.helpers.device_registry.format_mac) als
    Flow-unique_id gesetzt und per _abort_if_unique_id_configured
    dedupliziert - SAX Speicher senden ihren DHCP-Lease wiederholt, ohne
    diese Prüfung würde jeder weitere Broadcast eine zusätzliche
    "Erkannt"-Karte für dasselbe physische Gerät erzeugen
    ("already_in_progress").

    Anschließend leitet async_step_dhcp in den normalen async_step_user
    weiter und merkt die entdeckte IP in self._discovered_ip vor; die
    Formular-Vorbelegung in _async_step_connection nutzt sie als
    suggested_value für das Host-Feld, sofern kein Reconfigure-Kontext
    vorliegt. Die restliche Ersteinrichtung (Verbindungsprüfung,
    grid_charge/dashboard/finish-Schritte, siehe REQ-IP-CONFIGURABLE-UI,
    REQ-TIMED-SOC-CHARGE, REQ-BUNDLED-DASHBOARD, REQ-SETUP-FINISH-SUMMARY)
    läuft unverändert weiter - Port, Slave-IDs und Aktualisierungsintervall
    müssen weiterhin bestätigt bzw. bei Bedarf angepasst werden, DHCP
    liefert nur die IP-Adresse. Ein manueller Start der Ersteinrichtung
    (ohne vorherige Discovery) bleibt unverändert möglich, das Host-Feld
    ist dann wie bisher leer.
  requirements:
    - "manifest.json enthält einen dhcp-Footprint (Hostname-Präfix
       \"sax*\")."
    - "async_step_dhcp dedupliziert sowohl gegen bereits konfigurierte
       Einträge (Host-Abgleich) als auch gegen parallel laufende
       Discovery-Flows desselben Geräts (MAC-Abgleich)."
    - "Das Host-Feld der Ersteinrichtung wird bei per DHCP ausgelöster
       Ersteinrichtung mit der entdeckten IP vorbelegt, bleibt bei
       manuellem Start aber leer."
  acceptance_criteria:
    - "tests/test_config_flow.py deckt ab, dass DHCP-Discovery in den
       user-Schritt mit vorbelegtem Host-Feld weiterleitet und der Flow ab
       dort normal abschließt."
    - "tests/test_config_flow.py deckt ab, dass Discovery für einen bereits
       konfigurierten Host mit \"already_configured\" abbricht."
    - "tests/test_config_flow.py deckt ab, dass ein zweiter Broadcast
       derselben MAC-Adresse während eines laufenden Discovery-Flows mit
       \"already_in_progress\" abbricht."

# ==============================================================================
# ANFORDERUNG: ENTITY-KATEGORISIERUNG (DIAGNOSTIC)
# ==============================================================================
requirement_diagnostic_entity_category:
  id: REQ-DIAGNOSTIC-ENTITY-CATEGORY
  title: "Technische Detail-/Rohwerte als entity_category=diagnostic, Kernwerte bleiben sichtbar"
  status: done
  description: >
    Von den ~63 SaxPowerSensorEntityDescription-Einträgen in sensor.py trägt
    ein Teil entity_category=EntityCategory.DIAGNOSTIC, damit Home Assistant
    sie auf der Geräteseite unter "Diagnose" einklappt statt auf der
    Hauptübersicht zu zeigen - die Gerätekarte vermischt sonst alltäglich
    relevante Werte mit technischen Detailwerten. Als diagnostic markiert
    sind: Geräteidentität (sun_manufacturer, sun_model,
    sun_version_master/gateway, sun_serial_number), Klartext-/Rohwerte
    (switch_state_text, storage_state_text, storage_event_text,
    battery_event_text, timed_charge_active_text, grid_serving_active_text,
    price_charge_active_text, battery_charging_active_text), Sollwerte/
    Immediate-Controls-Rohwerte (setpoint_power, setpoint_cosphi,
    ic_power_setpoint_pct, ic_timeout, ic_control_mode_text,
    ic_max_power_reference), sämtliche Akkuzellen-Detailwerte (battery_*)
    sowie die phasenaufgeschlüsselten bzw. abgeleiteten Speicher- und
    Netz-Elektrowerte (storage_current_*, storage_voltage_*,
    storage_power_apparent/reactive/factor, storage_frequency,
    grid_current_*, grid_voltage_*, grid_frequency, grid_power_active_l1/
    l2/l3, grid_power_apparent_sum/reactive_sum/factor_sum). Ohne
    entity_category (sichtbar) bleiben die Kernwerte: soc, discharge_power,
    charge_power, charge_discharge_power, smartmeter_power, pv_power,
    storage_max_cell_temp sowie
    die Automatik-Statuswerte des preisoptimierten Ladens
    (price_charge_status_text, price_charge_next_start,
    price_charge_current_price) - siehe REQ-DYNAMIC-PRICE-CHARGE. Der
    Binary-Sensor cell_calibration_active und der Timestamp-Sensor
    next_cell_calibration sind als leise Statusanzeigen ebenfalls
    diagnostic kategorisiert (REQ-PERIODIC-FULL-CALIBRATION).
    number.py- und switch.py-Entities blieben unverändert: die dortigen
    Number-Entities sind aktiv genutzte Einstellungen (kein diagnostic),
    die Monats-Switches tragen bereits entity_category=CONFIG.
  requirements:
    - "Kernwerte (Ladezustand, Lade-/Entladeleistung, Netzleistung,
       PV-Leistung, Zelltemperatur, Automatik-Status) bleiben ohne
       entity_category, damit sie auf der Hauptübersicht sichtbar sind."
    - "Geräteidentität, Rohwerte/Sollwerte, Klartext-Status- und
       Ereigniswerte sowie phasenaufgeschlüsselte/abgeleitete Elektrowerte
       (Strom, Spannung, Frequenz, Schein-/Blindleistung,
       Leistungsfaktor) tragen entity_category=EntityCategory.DIAGNOSTIC."
    - "README.md kennzeichnet in der Sensor-Tabelle jede diagnostic-Entity
       mit \"(Diagnose)\", damit Anwender die Kategorisierung ohne
       Quellcode-Lektüre nachvollziehen können."
  acceptance_criteria:
    - "tests/test_sensor_descriptions.py deckt stichprobenartig ab, dass
       diagnostic-Entities entity_category=DIAGNOSTIC tragen und die
       genannten Kernwerte entity_category=None bleiben."

# ==============================================================================
# ANFORDERUNG: PERIODISCHE VOLLADUNG ZUR ZELLKALIBRIERUNG
# ==============================================================================
requirement_periodic_full_calibration:
  id: REQ-PERIODIC-FULL-CALIBRATION
  title: "Reduzierten Max-SOC alle sieben Tage temporär bis 100 % anheben"
  status: done
  description: >
    Bei einem vom Benutzer konfigurierten "Max. SOC" unter 100 % hebt die
    Integration den effektiven Ziel-SOC sieben Tage nach der letzten real
    gemessenen Volladung vorübergehend auf 100 % an. Der konfigurierte Wert
    der RestoreEntity-Number bleibt dabei unverändert sichtbar und
    persistent; Coordinator und Preisplaner verwenden während der fälligen
    Phase ausschließlich den effektiven Zielwert. Die Phase endet erst bei
    einem Messwert soc >= 100, nicht bei Ladeleistung 0, einem Fensterende
    oder einer Ladepause. Dann wird der Zeitpunkt der Volladung in UTC
    gespeichert und der zuletzt konfigurierte Max-SOC wirkt im selben Poll
    wieder.

    Der Zustand besteht aus dem letzten Vollladezeitpunkt und einem
    persistenten Voll-SOC-Latch. Dadurch wird der Zeitstempel nur auf der
    Flanke von unter 100 % auf 100 % aktualisiert und wandert weder bei
    jedem Poll auf dauerhaft 100 % noch durch einen Home-Assistant-Neustart.
    Ohne gespeicherten Zustand legt der erste gültige SOC-Poll eine Baseline
    an, sodass ein Update keine sofortige, überraschende Kalibrierungsphase
    auslöst. Fehlende oder ungültige Storage-Daten werden verworfen und wie
    eine Erstinitialisierung behandelt. Persistiert wird nur bei einer
    Zustandsänderung, pro Config Entry in einem versionierten Home-Assistant-
    Store, der vor dem ersten Coordinator-Refresh geladen wird.

    Die Funktion startet keinen eigenen Netzladevorgang. Sie gibt eine
    bestehende Max-SOC-Sperre frei und erlaubt PV, zeitgesteuertem oder
    preisoptimiertem Laden, den Speicher bei der nächsten normalen
    Lademöglichkeit auf 100 % zu bringen. Ein auf 100 % geänderter
    Benutzerwert deaktiviert nur den besonderen Override; der Zähler wird
    weiterhin erst durch einen realen 100-%-Messwert zurückgesetzt. Wird
    während einer aktiven Phase ein anderer Wert unter 100 % gewählt, gilt
    nach Abschluss der zuletzt gewählte Wert.

    Zwei leise Diagnose-Entities informieren ohne Benachrichtigungs-Pop-up:
    binary_sensor cell_calibration_active zeigt die fällige/laufende Phase,
    sensor next_cell_calibration zeigt den UTC-Zeitpunkt der nächsten
    Fälligkeit mit device_class timestamp. Diagnostics exportieren
    konfigurierten und effektiven Max-SOC, Aktivzustand sowie letzten und
    nächsten Zeitpunkt.
  requirements:
    - "Die reine Policy in application/calibration.py hat keine Home-
       Assistant- oder pymodbus-Abhängigkeit; Persistenz liegt im
       infrastructure-Adapter, Modbus-Orchestrierung ausschließlich im
       Coordinator."
    - "Fälligkeit gilt exakt ab last_full_charge_at + 7 Tage und bleibt bei
       konfiguriertem Max-SOC < 100 % bis zum realen SOC 100 aktiv."
    - "price_optimizer.py und _async_enforce_grid_charge verwenden den
       effektiven Ziel-SOC, number.py weiterhin nur den Benutzerwert."
    - "Ein Storage-Fehler darf den laufenden Coordinator-/Modbus-Updatepfad
       nicht abbrechen."
  acceptance_criteria:
    - "tests/test_calibration.py deckt Erstinitialisierung, exakte
       Fälligkeit, Voll-SOC-Flanken, Einstellungswechsel, UTC-Persistenz und
       ungültige Storage-Daten ab."
    - "tests/test_coordinator.py deckt Freigabe ohne erzwungene Netzladung,
       Abschluss bei SOC 100, Wiederanwendung des Benutzerwerts, Neustart-
       Wiederherstellung und tolerierte Storage-Fehler ab."
    - "Tests der Sensor-, Binary-Sensor- und Diagnoseplattform decken beide
       Status-Entities, diagnostic-Kategorisierung, Übersetzungen und die
       exportierten Zustandswerte ab."

# ==============================================================================
# ANFORDERUNG: PERSISTENZ UND STARTREIHENFOLGE DER LADEEINSTELLUNGEN
# ==============================================================================
requirement_control_config_bootstrap:
  id: REQ-CONTROL-CONFIG-BOOTSTRAP
  title: "Ladeeinstellungen versioniert persistiert und vor dem ersten steuernden Refresh geladen"
  status: done
  description: >
    Sämtliche softwareseitigen Steuerwerte - Max. SOC, Netzladung
    (aktiv/Zeitfenster/Monate/Min. SOC), netzdienliches Laden
    (aktiv/Zeitfenster/Monate/PV-Prognose-Mindestwert) und preisoptimiertes
    Laden (aktiv/Strategie/Preisgrenze/Neutralpreis/Anzahl Stunden) - liegen
    in einem versionierten Home-Assistant-Store, dessen Schlüssel die
    Config-Entry-ID enthält (infrastructure/control_store.py,
    ControlConfig/ControlConfigStore). Mehrere Config Entries besitzen damit
    getrennte Stores; die Store-I/O läuft vollständig asynchron.

    Die Startreihenfolge in __init__.async_setup_entry ist verbindlich:
    Kalibrierungs-, Energie- und Ladekonfigurations-Store werden geladen,
    danach läuft der erste Refresh, danach das Plattform-Setup, danach genau
    eine Ladeentscheidung. SaxPowerCoordinator.async_load_control_state
    öffnet dabei ein Bootstrap-Fenster, in dem Register-Reads weiterhin
    erlaubt sind, jede steuernde Entscheidung dagegen gesperrt ist - sowohl
    die aus _async_update_data als auch die setterseitigen
    Einzelentscheidungen aus _async_apply_grid_charge_change.
    SaxPowerCoordinator.async_finish_bootstrap schließt das Fenster nach dem
    Plattform-Setup, schreibt den vollständigen Snapshot fest und wendet
    unter dem vorhandenen Control-Lock (_async_enforce_grid_charge) genau
    eine Auswertung an. Ein Neustart innerhalb eines aktiven Ladefensters
    erzeugt dadurch keinen vorübergehenden Write von Register 40051 auf
    Modus 0.

    Ein Ladeversuch endet in genau einem von drei Zuständen
    (ControlConfigLoadStatus): LOADED (lesbarer Store, alleinige Quelle),
    MISSING (noch kein Store - nur dann darf migriert werden) oder FAILED
    (vorhandener, aber nicht verwertbarer Store: I/O-Fehler, kein Objekt,
    oder eine unbekannte künftige Storage-Hauptversion). Bei FAILED gelten
    die sicheren Vorgabewerte, es wird NICHT migriert, und der vorhandene
    Store wird für die gesamte Lebensdauer dieser Coordinator-Instanz nicht
    mehr automatisch überschrieben - auch keine einzelne, danach bewusst
    geänderte Einstellung löst wieder einen Schreibvorgang aus
    (_control_store_write_blocked bleibt gesetzt): Diese Instanz kennt den
    zuvor gespeicherten Gesamtzustand nicht, ein aus lauter Initialwerten
    bestehender Snapshot würde beim Schreiben sämtliche andere, tatsächlich
    weiter im Store stehende Einstellungen mit überschreiben, sobald auch
    nur ein einzelner Wert geändert wird. Änderungen wirken in diesem
    Zustand ausschließlich im Arbeitsspeicher; erst ein Neuladen des
    Config Entry (frische Instanz, neuer Ladeversuch) kann die Sperre
    aufheben. Ein reparierbares, informatives Issue
    (ISSUE_CONTROL_CONFIG_UNREADABLE) macht diesen Zustand für den Anwender
    sichtbar.

    Innerhalb eines lesbaren Stores wird jedes Feld einzeln gegen seinen
    Wertebereich geprüft; ein ungültiger Wert wird mit Warnung verworfen und
    in ControlConfig.sanitized durch den dokumentierten Hard-Default
    ersetzt, ohne die übrigen gespeicherten Werte zu verlieren. Ein leeres
    Monats-Set bleibt dabei leer (gültiger Anwenderzustand, kein fehlender
    Wert), ebenso ein wegen Überschneidung geleertes Zeitfenster.
    ControlConfig.sanitized prüft zusätzlich die fachlichen Invarianten der
    Gesamtkonfiguration, die sonst nur die Setter garantieren - denn ein
    korrupter oder von Hand bearbeiteter Store kann aus lauter einzeln
    gültigen Werten bestehen und trotzdem eine Kombination enthalten, die
    kein Setter je erzeugt hätte: Sind Netzladung und preisoptimiertes Laden
    gleichzeitig aktiv, bleibt preisoptimiertes Laden aus; überschneiden
    sich die beiden Zeitfenster in Tageszeit UND aktiven Monaten, wird das
    Netzladefenster geleert (nur die Netzladung zieht aktiv Strom aus dem
    Netz).

    Die RestoreEntity-Zustände der Konfigurations-Entities (number.py,
    switch.py, select.py, time.py) sind nur noch der einmalige
    Migrationspfad für Config Entries, für die es noch keinen Store gibt
    (MISSING). Migriert werden dabei ausschließlich fachlich verwertbare
    Zustände: bei Schaltern nur on/off, bei Zahlen nur endliche Zahlenwerte,
    bei Zeiten nur parsebare Uhrzeiten, bei der Strategie nur ein bekannter
    Wert. Ein unknown/unavailable oder sonst unbrauchbarer Altzustand ruft
    gar keinen Setter auf; die betroffene Einstellung bleibt auf ihrem
    sicheren Vorgabewert (ControlConfig.sanitized), statt als ausdrückliches
    "Aus" oder als Vorgabewert übernommen zu werden - das allein würde
    diesen Zustand aber nicht von einer echten, künftig bestätigten
    Einstellung unterscheidbar machen. Deshalb merkt sich der Coordinator
    (mark_control_field_unresolved) zusätzlich JEDES so verworfene Feld
    namentlich in ControlConfig.unresolved_fields, mitgespeichert im
    Store: Der Store gilt dadurch nie stillschweigend als vollständig
    migriert. Diese Markierung übersteht Neustarts unverändert (bei
    LOADED läuft keine erneute RestoreEntity-Migration mehr - ein
    zweiter automatischer Versuch könnte einen inzwischen nur zufällig
    plausibel aussehenden Altzustand fälschlich als "jetzt doch aufgelöst"
    durchwinken) und wird ausschließlich durch eine spätere, ausdrückliche
    Änderung der betroffenen Einstellung über ihre Entity/ihren Service
    gelöscht (clear_control_field_unresolved, in jedem betroffenen
    async_set_*-Setter verdrahtet). Solange mindestens ein Feld unresolved
    ist, listet ein reparierbares, informatives Issue
    (ISSUE_CONTROL_CONFIG_UNRESOLVED) die betroffenen Einstellungen mit
    ihrem deutschen Anzeigenamen auf; es verschwindet automatisch, sobald
    keins mehr übrig ist.

    Zusätzlich hängen diese Entities über entity.SaxPowerConfigEntity nicht
    mehr an coordinator.last_update_success und bleiben bei einem reinen
    Basic-Mode-Ausfall verfügbar - ihre Werte stammen aus keinem Register.

    Nach abgeschlossenem Bootstrap merkt jede Einstellungsänderung den
    aktuellen Snapshot über den gemeinsamen Endpunkt
    _async_apply_grid_charge_change zum gebündelten Schreiben vor; ein
    unveränderter Snapshot löst keinen Schreibvorgang aus. Beim Entladen des
    Config Entry wird der neueste Stand zusätzlich best-effort sofort
    geschrieben.
  requirements:
    - "Ein versionierter Store je Config Entry hält alle softwareseitigen
       Steuerwerte; er wird vor async_config_entry_first_refresh geladen."
    - "Während des Bootstraps sind Reads erlaubt, steuernde Writes und
       setterseitige Einzelentscheidungen gesperrt."
    - "Nach dem Plattform-Setup wird genau eine Ladeentscheidung unter dem
       Control-Lock angewendet."
    - "Korrupte oder fehlende Einzelfelder werden fail-safe durch ihren
       Hard-Default ersetzt, ohne die übrigen gespeicherten Werte zu
       verwerfen; zusätzlich werden die fachlichen Invarianten der
       Gesamtkonfiguration erzwungen."
    - "Ein vorhandener, aber nicht verwertbarer Store erlaubt keine
       Migration und wird für die Lebensdauer der ladenden
       Coordinator-Instanz nicht automatisch überschrieben - auch nicht
       mittelbar durch eine einzelne, danach geänderte Einstellung; ein
       Issue macht das dem Anwender sichtbar."
    - "Bestehende RestoreEntity-Zustände werden einmalig migriert, solange
       kein Store existiert - und auch dann nur, wenn sie fachlich gültig
       sind. unknown/unavailable ruft keinen Setter auf und gilt nie als
       ausdrückliches Aus oder als Vorgabewert; nicht migrierbare Felder
       werden namentlich als unresolved markiert, dauerhaft mitgespeichert
       und per Issue gemeldet, statt beim nächsten Laden stillschweigend
       als vollständig migriert zu gelten - erst eine bewusste
       Einstellungsänderung löst die Markierung wieder."
    - "Reine Software-Konfigurationsentities bleiben bei einem
       Basic-Mode-Ausfall verfügbar."
  acceptance_criteria:
    - "tests/test_control_persistence.py deckt ab: Store-Round-Trip,
       korrupter/unvollständiger/alter Store, nicht lesbarer Store und
       unbekannte künftige Storage-Version (keine Migration, kein
       automatisches Überschreiben - auch nicht durch eine einzelne
       nachträgliche Änderung, dafür ein Issue, sowie Persistenz nach einem
       erfolgreichen Neuladen), überlappende Zeitfenster im Store, leeres
       Monats-Set, zwei getrennte Config Entries, vollständige Konfiguration
       vor dem ersten Refresh, keine Writes während des Bootstraps (weder
       aus dem Refresh noch aus den Settern), Max-SOC-Hold über den
       Neustart, Migration ohne Store, Basic-Mode-Ausfall,
       unknown/unavailable in allen vier Plattformen (inkl. persistenter
       unresolved_fields-Markierung, die einen simulierten Neustart
       übersteht und nur durch eine ausdrückliche Änderung wieder
       verschwindet, sowie deren Issue-Lebenszyklus) und Verfügbarkeit der
       Konfigurations-Entities."
    - "tests/test_init.py prüft die Startreihenfolge (Kalibrierung, Energie,
       Ladekonfiguration, Refresh, Plattformen, Bootstrap-Abschluss)."
    - "tests/test_integration_live.py prüft end-to-end gegen den lokalen
       Modbus-Simulator, dass ein Neustart in einem gespeicherten aktiven
       Ladefenster Register 40051 nie auf 0 schreibt und die gespeicherte
       Konfiguration vollständig sichtbar zurück ist."

# ==============================================================================
# ANFORDERUNG: TARIFMODELL DER WIRTSCHAFTLICHKEITSAUSWERTUNG
# ==============================================================================
requirement_economics_tariffs:
  id: REQ-ECONOMICS-TARIFFS
  title: "Optionales Tarifmodell: Netzbezugspreis in EUR/kWh je Zeitpunkt + Einspeisevergütung"
  status: done
  description: >
    Die Integration kann zu jedem Messzeitpunkt den wirtschaftlich
    relevanten Netzbezugspreis in EUR/kWh bestimmen. Die Konfiguration ist
    vollständig optional und standardmäßig deaktiviert: ohne
    Wirtschaftlichkeitskonfiguration verhält sich die Integration exakt wie
    bisher, bestehende Entitäten, Dienste, gespeicherte Options und
    Regelungsfunktionen bleiben unverändert. Bestehende Installationen
    werden nicht automatisch aktiviert.

    Unterstützt werden genau drei Tarifarten (TariffType in
    domain/tariff.py, stabile Options-Werte): "fixed" (ein ganztägig
    konstanter Arbeitspreis), "time_of_use" (jeden lokalen Kalendertag
    derselbe Grundpreis mit bis zu acht abweichenden Zeitfenstern) und
    "dynamic" (aktueller Preis aus dem bereits vorhandenen
    Strompreis-Sensor). "disabled" ist der Vorgabewert.

    Bei jeder aktivierten Tarifart ist die Einspeisevergütung
    (CONF_ECONOMICS_FEED_IN_PRICE, 0 bis 2 EUR/kWh) Pflichtfeld. Sie ist der
    entgangene Erlös und damit der Beschaffungspreis von PV-Energie, die in
    den Speicher statt ins Netz fließt; PV-Energie wird nie als kostenlos
    bewertet. Geprüft wird das nicht nur im Options Flow, sondern vor jeder
    Quote-Erzeugung erneut (domain.tariff.validate_tariff) - für alle
    Tarifarten einschließlich der dynamischen: Ein von Hand bearbeiteter
    oder aus einer früheren Version stammender Options-Eintrag darf keinen
    Quote ohne bewertete PV-Energie erzeugen. Dieselbe Prüfung verlangt die
    tarifeigenen Pflichtpreise (Festpreis-Arbeitspreis bzw. Grundpreis und
    alle Fensterpreise) innerhalb ihres Wertebereichs; andernfalls lautet
    der Grund TARIFF_INCOMPLETE. Alle Preise sind variable Brutto-Arbeitspreise in EUR/kWh mit
    einer Schrittweite von 0,0001 - monatlicher Grundpreis, Boni, außerhalb
    des Arbeitspreises ausgewiesene Steuern und sonstige Fixkosten sind
    ausdrücklich nicht Bestandteil der Rechnung. Arbeitspreise für den
    Netzbezug liegen zwischen -2 und 5 EUR/kWh; der negative Bereich ist
    bewusst zugelassen, weil börsengekoppelte Tarife zeitweise negative
    Arbeitspreise ausweisen. Der Wertebereich gilt auch für den fertig auf
    EUR/kWh normalisierten Preis des dynamischen Tarifs: Ein Wert außerhalb
    davon ist kein Arbeitspreis, sondern ein falsch skalierter oder schlicht
    falscher Sensorwert (typisch ein als EUR/kWh gelesener ct/kWh-Wert) und
    wird mit PRICE_OUT_OF_RANGE abgelehnt statt akzeptiert.

    Die Konfiguration liegt vollständig im Options Flow
    (config_flow.SaxPowerOptionsFlow). Die Tarifart wird auf der ersten
    Seite gewählt; danach verzweigt der Flow in genau einen
    tarifspezifischen Schritt (economics_fixed, economics_time_of_use,
    economics_dynamic) oder speichert bei "disabled" sofort - ein
    deaktivierter Tarif fragt keine Einspeisevergütung ab. Beim Speichern
    übernimmt der Flow ausschließlich die zur gewählten Tarifart passenden
    Schlüssel und entfernt alle übrigen aus ECONOMICS_OPTION_KEYS, damit ein
    alter Wert nach einem späteren Rückwechsel nicht unbemerkt wieder gilt.
    Die acht Zeitfenstergruppen (economics_tou_window_1 bis _8) werden je
    als eigene Section dargestellt und liegen deshalb als verschachtelte
    Mappings mit den Feldern start/end/price_eur_kwh in entry.options.

    Dieselbe Unterscheidung wie im Options Flow gilt auch beim erneuten
    Einlesen für die Quote-Erzeugung
    (application.economics.window_from_section): Eine schlicht leere
    Gruppe (Schlüssel fehlt, oder alle drei Felder fehlen) ist ein
    gültiger Anwenderzustand. Eine VORHANDENE, aber unvollständige,
    unlesbare oder fremdtypige Gruppe (z. B. Start/Ende gesetzt, aber ein
    fehlender oder unparsebarer Preis - nur über einen von Hand
    bearbeiteten Store erreichbar, da der Options Flow das nicht speichert)
    setzt dagegen TariffConfig.windows_valid auf False. validate_tariff()
    lehnt in diesem Fall mit TARIFF_INCOMPLETE ab, auch wenn die übrigen
    Fenster für sich genommen gültig wären - eine kaputte Gruppe darf nicht
    stillschweigend verschwinden und dadurch einen Quote aus den zufällig
    noch lesbaren Fenstern erzeugen.

    Der dynamische Tarif verwendet ausschließlich die bereits vorhandenen
    Options CONF_PRICE_SENSOR, CONF_PRICE_ATTRIBUTE und CONF_PRICE_UNIT -
    es gibt weder eine zweite Sensor-Option noch eine zweite
    Parserimplementierung. Ist kein Sensor ausgewählt, lehnt der Flow das
    Speichern mit einer übersetzten Feldfehlermeldung am Sensorfeld ab. Die
    Einheitenumrechnung liegt gemeinsam mit der Ladeplanung in
    domain/price_units.unit_factor; die Preisvorschau wird mit derselben
    Funktion price_optimizer.parse_price_slots gelesen wie für den
    Ladeplan. Sobald der Sensor überhaupt eine Preisvorschau mitbringt
    (price_optimizer.has_price_forecast), ist sie verbindlich: Weder eine
    Vorschau, die den Auswertungszeitpunkt nicht abdeckt, noch eine
    vorhandene, aber unlesbare Vorschau darf durch den Sensorzustand ersetzt
    werden - sonst entstünde ein Preis, dessen Gültigkeitszeitraum niemand
    kennt. Der Sensorzustand ist nur dann die Quelle, wenn gar keine
    Vorschau vorliegt. Ein über CONF_PRICE_ATTRIBUTE ausdrücklich benanntes
    Attribut gilt dabei schon bei jedem nicht leeren Wert als Vorschau -
    der Anwender hat genau dieses Attribut als Preisquelle bestimmt, ein
    Typwechsel ist deshalb eine unlesbare und keine fehlende Vorschau. Als
    leer gelten dort ausschließlich ein fehlender bzw. None-Wert und ein
    leerer Container (Liste, Tupel, Mapping, String); ein skalarer Wert wie
    0 oder False ist vorhanden und damit unlesbar, nicht fehlend. Ohne
    ausdrückliche Angabe wird geraten; dann zählt nur die Listenform der
    bekannten Attributnamen, damit ein gleichnamiges Attribut anderer
    Bedeutung die Auswertung nicht blockiert.

    Zeitfensterregeln für "time_of_use": Intervalle sind halboffen (Start
    inklusive, Ende exklusive); start == end ist ungültig und bedeutet
    ausdrücklich nicht "ganzer Tag"; ein Fenster darf Mitternacht
    überschreiten; zwei Fenster dürfen sich auf der zyklischen
    24-Stunden-Zeitleiste nicht überschneiden, angrenzende Grenzen sind
    erlaubt; außerhalb aller Fenster gilt der Grundpreis. Eine Gruppe ist
    entweder vollständig leer oder vollständig befüllt. Maßgeblich ist die
    lokale Home-Assistant-Zeitzone: Die Zuordnung erfolgt allein über die
    lokale Wanduhrzeit, weshalb die Sommerzeitumstellung keinen Sonderfall
    braucht - die im Frühjahr übersprungene Ortszeit tritt nie auf, und
    beide Vorkommen der im Herbst doppelten Stunde treffen dasselbe
    Fenster. Änderungen gelten nur für zukünftige Messintervalle; bereits
    persistierte Geldbeträge werden nie rückwirkend neu bewertet.

    Architektur: domain/tariff.py enthält die reinen, Home-Assistant-freien
    Typen (TariffType, DailyPriceWindow, TariffConfig, PriceQuote,
    QuoteResult, QuoteUnavailable) samt Zeitfensterregeln und der Bewertung
    der nicht-dynamischen Tarife. application/economics.py bildet
    gespeicherte Options auf diese Typen ab. economics.SaxTariffProvider ist
    der einzige Ort, der dafür hass.states liest; Coordinator und spätere
    Wirtschaftlichkeitslogik beziehen Quotes ausschließlich über
    coordinator.tariff_provider.quote(). SaxTariffProvider.async_setup()
    folgt demselben idempotenten Muster wie SaxPricePlanner.async_setup()
    (räumt vorhandene Zustandsbeobachter ab, bevor es neue registriert) und
    wird von __init__.async_update_options erneut aufgerufen: Eine
    Options-Änderung und ein State-Change des dynamischen Sensors wirken
    live, ohne Config-Entry-Reload und ohne doppelte Listener;
    coordinator.async_shutdown räumt sie beim Entladen ab.

    Ein nicht bestimmbarer Preis ist immer None plus ein maschinenlesbarer
    QuoteUnavailable-Grund - niemals 0 EUR/kWh, weil ein stiller Nullpreis
    den Netzbezug als kostenlos bewerten und jede spätere Rechnung unbemerkt
    verfälschen würde. Gründe: tariff_disabled, tariff_incomplete,
    price_sensor_not_configured, price_sensor_missing,
    price_sensor_unavailable (unknown/unavailable/leer), price_not_numeric,
    price_not_finite (NaN/Inf), price_unit_unsupported (gesetzte, aber nicht
    preisartige Einheit), price_forecast_unreadable (Preisvorschau
    vorhanden, aber nicht auswertbar), price_forecast_out_of_range
    (vorhandene Preisvorschau deckt den Auswertungszeitpunkt nicht ab) und
    price_out_of_range (normalisierter Preis außerhalb von -2 bis 5
    EUR/kWh). Der Tarifzustand samt Grund steht im Diagnose-Download
    (diagnostics.py, Schlüssel "tariff").

    Nicht Bestandteil dieser Anforderung: Energieherkunft,
    Kostenakkumulation, ROI-Sensoren und Dashboardkarten. Das Tarifmodell
    greift in keine Ladeentscheidung ein und löst keinen Modbus-Write aus.
  acceptance_criteria:
    - "Ohne Wirtschaftlichkeitskonfiguration ('disabled') verändern sich
       weder Verhalten noch vorhandene Options; es wird kein
       Zustandsbeobachter registriert."
    - "Ein Festpreis liefert zu jedem Zeitpunkt exakt denselben Quote
       (unbegrenzt gültig, valid_from/valid_until sind None)."
    - "Grundpreis, acht optionale Fenster, Mitternachtsüberschreitung,
       halboffene Grenzen, Überschneidung und beide Sommerzeitwechsel sind
       deterministisch getestet (tests/test_tariff.py)."
    - "Der dynamische Tarif nutzt denselben Sensor, dieselbe
       Attribut-Erkennung und dieselbe Einheitenlogik wie die vorhandene
       Preisfunktion; ohne ausgewählten Sensor lehnt der Options Flow das
       Speichern am Sensorfeld ab."
    - "Fehlende, nicht numerische, nicht endliche, außerhalb des
       Wertebereichs liegende, unlesbare oder zeitlich unpassende Preiswerte
       ergeben None samt Grund - nie 0."
    - "Jede aktivierte Tarifart wird vor der Quote-Erzeugung auf eine
       gültige Einspeisevergütung (0 bis 2 EUR/kWh) und ihre eigenen
       Pflichtpreise geprüft, auch wenn die Options von Hand bearbeitet
       wurden."
    - "Eine vorhandene, aber unvollständige oder unlesbare
       Zeitfenstergruppe lehnt die Quote-Erzeugung mit TARIFF_INCOMPLETE
       ab, statt mit den übrigen, zufällig noch lesbaren Fenstern
       weiterzurechnen - eine schlicht leere Gruppe bleibt dagegen ein
       gültiger Zustand (TariffConfig.windows_valid)."
    - "Eine Optionsänderung und ein Sensor-State-Change wirken ohne Reload;
       Listener werden beim Optionswechsel und beim Entladen entfernt und
       nie doppelt registriert."
    - "strings.json, translations/de.json, translations/en.json, README.md
       und DEVELOPMENT.md beschreiben das Tarifmodell."

# ==============================================================================
# ANFORDERUNG: HERKUNFT DER LADEENERGIE
# ==============================================================================
requirement_energy_origin:
  id: REQ-ENERGY-ORIGIN
  title: "Geladene Energie nach Netz/PV/unbekannter Herkunft aufteilen (Schätzung am Netzanschlusspunkt)"
  status: done
  description: >
    Zusätzlich zu den bestehenden, unveränderten Zählern energy_charged/
    energy_discharged (REQ-ENERGY-DASHBOARD) weist die Integration aus, wie
    viel der geladenen Energie rechnerisch aus dem Netz, aus PV und aus
    einer nicht sicher bestimmbaren Quelle stammt. Die Herkunftszähler
    funktionieren unabhängig davon, ob eine Wirtschaftlichkeitskonfiguration
    (REQ-ECONOMICS-TARIFFS) aktiviert ist - dieses Issue enthält weder
    Preisbewertung noch einen Geldsensor.

    Eine physikalisch eindeutige Zuordnung ist mit storage_power_active und
    smartmeter_power bei gleichzeitigem Hausverbrauch nicht möglich - die
    Aufteilung ist deshalb ausdrücklich eine konservative, reproduzierbare
    Schätzung anhand des Netzanschlusspunktes, keine physikalisch
    eindeutige Quellenzuordnung. So auch in Entity-Beschreibungen und
    README benannt.

    Verbindliche Bilanzregel je Messintervall
    (domain/energy_accounting.compute_charge_delta), mit
    charge_power_w = max(-storage_power_active, 0):

    - storage_power_active unbekannt: Intervall vollständig überspringen,
      wie bisher bei energy_charged/energy_discharged.
    - charge_power_w == 0 (Leerlauf oder Entladung): keine
      Herkunftsänderung - Entladung verändert dadurch nie einen
      Herkunftszähler.
    - smartmeter_power unbekannt: die gesamte Ladeenergie des Intervalls
      zählt als unknown_charge_power_w.
    - sonst: grid_charge_power_w = min(charge_power_w,
      max(smartmeter_power, 0)); pv_charge_power_w = charge_power_w -
      grid_charge_power_w; unknown_charge_power_w = 0. Netzbezug, der die
      Ladeleistung übersteigt (er deckt dann zusätzlich Hausverbrauch),
      zählt dadurch bewusst vollständig, aber nur bis zur tatsächlichen
      Ladeleistung, als Netzladung.

    Jede Leistung wird mit exakt derselben Zeitbasis integriert wie
    energy_charged (dieselbe Riemann-Summe in
    SaxPowerCoordinator._accumulate_energy, keine zweite Uhr) - der
    charged_kwh-Zuwachs aus compute_charge_delta ist identisch mit dem
    Zuwachs, den energy_charged verbucht. Für jedes gültige Ladeintervall
    gilt grid_kwh + pv_kwh + unknown_kwh == charged_kwh bis auf
    Gleitkomma-Rauschen in der Größenordnung einzelner ULPs - viele
    Zehnerpotenzen unterhalb der veröffentlichten Präzision. Veröffentlicht
    wird auf drei Nachkommastellen gerundet, intern bleibt volle
    Float-Präzision erhalten.

    Neue Sensoren (sensor.py, beschreibungsbasiert wie jeder andere
    berechnete Wert - kein RestoreEntity, siehe unten):
    energy_charged_from_grid, energy_charged_from_pv,
    energy_charged_origin_unknown (alle kWh, device_class energy,
    state_class total_increasing) sowie der diagnostische Prozentwert
    energy_origin_coverage (Anteil von grid+pv an grid+pv+unknown seit
    Start der Herkunftszählung; Nenner 0 ergibt 100 %, uninitialisierte
    Herkunft ergibt None - SaxPowerCoordinator._energy_origin_coverage).

    Persistenz: infrastructure/energy_store.py bleibt bei STORAGE_VERSION 1
    (Home Assistants Store-HAUPTversion) und erhöht stattdessen
    STORAGE_MINOR_VERSION auf 2 - eine erhöhte Hauptversion würde bei einem
    vorhandenen Version-1-Snapshot Home Assistants interne
    _async_migrate_func aufrufen, deren Standardimplementierung
    NotImplementedError wirft; bei unveränderter Hauptversion fängt der
    Store diesen Fehler dagegen selbst ab und behält die Rohdaten bei. Ein
    Absturz beim Setup bestehender Installationen ist damit ausgeschlossen
    (siehe SaxPowerCoordinator.async_load_energy_state, das zusätzlich
    NotImplementedError abfängt). EnergyState bekommt vier neue, gemeinsam
    behandelte Felder - grid_charged_kwh, pv_charged_kwh,
    unknown_charged_kwh (dieselbe Feldvalidierung wie charged_kwh/
    discharged_kwh: endlich, >= 0, monotonic) sowie
    origin_accounting_started_at (UTC-Zeitstempel, einmalig gesetzt und
    danach unveränderlich - ein abweichender gespeicherter Wert wird wie
    ein rückläufiger Zähler verworfen). EnergyState.origin_initialized ist
    nur wahr, wenn alle vier Felder vorhanden sind; fehlt eines (Version-1-
    Snapshot ohne diese Felder, frischer Eintrag, oder ein beim Laden
    einzeln verworfenes Feld), gilt die gesamte Herkunftsbilanz als nicht
    initialisiert - die drei Zähler sind ohne bekannten Startzeitpunkt
    nicht aussagekräftig. Das steht nicht im Widerspruch zur unabhängigen
    Feldvalidierung beim Laden: Der an den Aufrufer zurückgegebene Zustand
    behält jedes einzeln gültige Feld; nur die interne Monotonie-Baseline
    (EnergyStateStore._origin_baseline) verwirft bei einem unvollständigen
    Quartett zusätzlich dessen verbliebene Einzelwerte - sonst würde der
    vom Coordinator anschließend bei 0 neu gestartete Stand (siehe
    SaxPowerCoordinator._bootstrap_energy_origin) an den stehen gebliebenen
    alten Teilwerten bzw. dem alten Startzeitpunkt als "rückläufig" bzw.
    "abweichend" scheitern und die Herkunft bliebe über jeden Neustart
    hinweg dauerhaft unpersistiert. charged_kwh/discharged_kwh bleiben von
    dieser Bereinigung unberührt.

    SaxPowerCoordinator._bootstrap_energy_origin läuft einmalig beim Laden
    (async_load_energy_state), aber nur, wenn der Store selbst ohne
    Ausnahme gelesen werden konnte - ein I/O-Fehler beim Laden lässt die
    Herkunft absichtlich uninitialisiert (None), statt einen stillen
    Nullstart über einen eigentlich kaputten Store zu legen. Ist der Store
    bereits vollständig initialisiert, übernimmt der Coordinator seine
    Werte unverändert. Andernfalls (Version-1-Snapshot, frischer Eintrag,
    einzelnes verworfenes Feld) startet die Herkunftszählung transparent
    bei 0 mit dem aktuellen UTC-Zeitpunkt als
    origin_accounting_started_at - ohne einen sofortigen zusätzlichen
    Schreibvorgang: Der neue Stand wird über den ohnehin vorhandenen
    Speicherpfad (gedrosselte Änderung oder Shutdown-Flush) persistiert.
    Historische Ladeenergie wird dabei nicht erfunden oder nachträglich
    einer Quelle zugeordnet; der bestehende energy_charged-Gesamtzähler
    bleibt unberührt. Herkunftszähler werden gemeinsam mit den bestehenden
    Energiezählern gedrosselt gespeichert und beim Unload best-effort final
    geflusht (dieselbe EnergyStateStore-Instanz, derselbe Schreibpfad,
    dieselbe Drosselung).

    Kein RestoreEntity als primäre Persistenz für die drei neuen Zähler:
    Es gibt keinen sichtbaren Alt-Zustand zu migrieren, sie werden wie jeder
    andere berechnete Sensor direkt aus coordinator.data gelesen
    (SaxPowerSensor + SaxPowerSensorEntityDescription, kein eigener
    Migrationspfad nötig). Ausfall des SunSpec-Modus-Blocks (
    storage_power_active None) überspringt das Intervall exakt wie bei
    energy_charged/energy_discharged - kein Reset, kein Rücksprung, kein
    Nachholsprung nach Rückkehr.
  requirements:
    - "Reine PV-Ladung, reine Netzladung, gemischte Ladung, Einspeisung
       während Ladung, Netzbezug größer/kleiner als die Ladeleistung und
       unbekannter Smartmeter-Wert sind deterministisch getestet
       (tests/test_energy_accounting.py)."
    - "Die Delta-Invariante (grid + pv + unknown == charged) gilt über
       viele zufällige Intervalle ohne kumulative Rundungsabweichung."
    - "Entladung verändert keinen Herkunftszähler."
    - "Eine Version-1-Migration erhält bestehende Lade-/Entladezähler
       exakt und startet die Herkunft transparent ab einem persistierten
       UTC-Zeitpunkt, ohne historische Energie zu erfinden."
    - "Persistenz, Shutdown-Flush, zwei getrennte Config Entries, korrupte
       und rückläufige Snapshots (auch für die drei neuen Zähler und den
       Startzeitpunkt) sowie ein SunSpec-Ausfall sind getestet
       (tests/test_energy_persistence.py, tests/test_coordinator.py)."
    - "Ein echter, unentpackter Version-1-Store-Envelope (über die
       hass_storage-Fixture, nicht nur ein gemocktes _store.async_load)
       lädt ohne NotImplementedError und ohne Setup-Absturz."
    - "Nach einem unvollständigen Herkunfts-Quartett (ein einzelnes
       ungültiges Feld) lässt sich der vom Coordinator neu gestartete
       0/0/0-Stand samt neuem Startzeitpunkt sofort persistieren, statt an
       der alten Teil-Baseline als rückläufig bzw. abweichend zu
       scheitern."
    - "Sensor-Metadaten, strings.json, translations/de.json,
       translations/en.json, README.md und DEVELOPMENT.md sind
       aktualisiert."

# ==============================================================================
# ANFORDERUNG: KOSTEN UND OPERATIVES SPEICHERERGEBNIS
# ==============================================================================
requirement_economics_accounting:
  id: REQ-ECONOMICS-ACCOUNTING
  title: "Kosten/operatives Ergebnis aus Tarif (01/06) und Energieherkunft (02/06) bilanzieren"
  status: done
  description: >
    Bewertet ausschließlich tatsächlich gemessene Lade-/Entladeenergie, nie
    einen Sollwert. PV-Ladung kostet die entgangene Einspeisevergütung
    (PV-Energie ist niemals kostenlos), Netzladung den zum Ladezeitpunkt
    gültigen Netzbezugspreis (REQ-ECONOMICS-TARIFFS), Entladung ist den
    zum Entladezeitpunkt vermiedenen Netzbezug wert. Ersetzt fachlich das
    geschlossene Issue #42 vollständig - dessen Fehler (PV kostenlos,
    smartmeter_power < 0 als Netzbezug statt Einspeisung gedeutet,
    primäre RestoreEntity-Persistenz für Geldzustände) werden nicht
    übernommen.

    Verbindliche Geldbilanz je EnergyDelta (02/06,
    domain.economics_accounting.compute_economics_delta), alle Beträge
    intern ungerundet in EUR:

    ```
    grid_charge_cost_delta = charged_from_grid_kwh * import_price_at_charge
    pv_opportunity_cost_delta = charged_from_pv_kwh * feed_in_price
    avoided_grid_cost_delta = monetizable_discharged_kwh * import_price_at_discharge
    operating_result = avoided_grid_cost_total - grid_charge_cost_total - pv_opportunity_cost_total
    ```

    operating_result ist ein kumulierter operativer Cashflow, kein
    Kontostand, und wird nie separat gespeichert, sondern in
    SaxPowerCoordinator._publish_economics_balance aus den drei
    Teilsummen abgeleitet - so kann er nie von ihnen abweichen. Noch im
    Speicher liegende Energie hat bereits Beschaffungskosten, aber noch
    keinen Nutzen erzeugt: Ladeverluste werden dadurch automatisch
    sichtbar (Kosten für die volle geladene Energie, Nutzen nur für die
    tatsächlich gemessene, kleinere entladene Energie), ohne einen
    angenommenen Wirkungsgradfaktor oder eine fiktive Nachbewertung des
    Lagerbestands.

    "Ehrlicher Start": Beim erstmaligen Aktivieren steckt bereits Energie
    unbekannter Herkunft im Speicher.
    SaxPowerCoordinator._bootstrap_economics_if_ready wartet, bis
    battery_capacity (plausibel, also > 0) und battery_soc numerisch
    verfügbar sind (beide aus demselben SunSpec-Modus-Block wie
    battery_soc_min, mit demselben
    Skalierungsfaktor - bewusst nicht die Basic-Mode-SOC), und
    initialisiert dann einmalig unvalued_inventory_kwh = capacity_kwh *
    battery_soc / 100 sowie economics_started_at (UTC) - vorher bleibt die
    gesamte Bilanz wartend/unbekannt. Läuft nur einmal: Ein
    zwischenzeitliches
    Deaktivieren/Reaktivieren des Tarifs setzt weder Bestand noch
    Startzeitpunkt zurück. Nicht bepreisbare neue Ladeenergie
    (energy_charged_origin_unknown ODER ein fehlender Preis für Netz/PV)
    erhöht unvalued_inventory_kwh und den passenden
    unpriced_charge-Zähler statt einen Preis zu erfinden. Jede Entladung
    verbraucht zuerst min(discharge_delta, unvalued_inventory_kwh) - dieser
    Anteil erzeugt AUSDRÜCKLICH keinen vermiedenen Geldwert (sonst
    entstünde beim Entladen von Alt-/Unbekannt-Bestand ein kostenloser
    Scheingewinn, der Kernfehler des verworfenen Issues #42); nur der
    danach verbleibende Rest ("monetizable_discharged_kwh") ist bepreist.
    Fehlt der Importpreis bei einer monetarisierbaren Entladung, zählt sie
    als unpriced_discharge_kwh und wird nicht später rückwirkend bewertet
    (ebenso wenig wie unpriced_charge_kwh). Erreicht battery_soc das
    geräteseitig gemeldete battery_soc_min (beide numerisch,
    domain.economics_accounting.min_soc_inventory_correction), wird ein
    rechnerisch nie ganz auf 0 gelaufener Rest von unvalued_inventory_kwh
    verworfen und mit Zeitstempel diagnostisch geloggt - keine nutzbare
    unbekannte Energie kann an diesem Punkt mehr vorhanden sein.

    unvalued_inventory_kwh ist ein Lagerbestand und wird deshalb bei JEDEM
    Tick zusätzlich auf den tatsächlichen Speicherinhalt capacity_kwh *
    battery_soc / 100 gedeckelt
    (domain.economics_accounting.capacity_inventory_correction, dieselbe
    Größe wie beim "Ehrlichen Start", aus demselben SunSpec-Block). Ohne
    diesen Deckel bliebe die Ladeverlust-Differenz jedes UNBEPREISTEN
    Zyklus (geladen > entladen, siehe oben) dauerhaft als Rest im Bestand
    liegen und würde später eine bereits bepreist geladene Entladung als
    unbewertet abbuchen - economics_avoided_grid_cost und damit
    economics_operating_result fielen mit jedem Preisausfall weiter zu
    niedrig aus, und der Diagnosesensor economics_unvalued_inventory
    könnte einen physikalisch unmöglichen, über der Speicherkapazität
    liegenden Bestand melden. Der Vorsichtsgedanke aus #42 bleibt
    unberührt: er verlangt nur, dass der Bestand nicht zu KLEIN ist. Ist
    Kapazität oder SOC gerade nicht numerisch bekannt (SunSpec nicht
    erreichbar), wird nicht gedeckelt - nie gegen einen unbekannten Wert
    klemmen. Als unbekannt gilt dabei auch eine gemeldete Kapazität von 0
    oder darunter (SaxPowerCoordinator._economics_capacity_kwh): das ist
    kein plausibler Messwert, sondern ein gestörter SunSpec-Block, und
    würde sowohl den gesamten Bestand verwerfen als auch (im Bootstrap)
    einen Anfangsbestand von 0 setzen - beides erzeugte beim nächsten
    Entladen genau den kostenlosen Scheingewinn aus #42. Die Korrektur wird wie die SOC-Minimum-Korrektur mit
    Zeitstempel und Betrag geloggt, jedoch höchstens einmal je
    SaxPowerCoordinator.INVENTORY_CAP_LOG_INTERVAL_SECONDS (während einer
    unbepreisten Ladung greift der Deckel an nahezu jedem Poll-Intervall
    erneut, weil der Bestand stetig wächst, der gemeldete SOC aber nur in
    ganzen Prozentschritten); die seither insgesamt verworfene Menge steht
    ungedrosselt im Diagnose-Download (Schlüssel inventory_capped_kwh, rein
    diagnostisch, nicht persistiert).

    Eine Tarifänderung wirkt ausschließlich prospektiv: jedes künftige
    Delta verwendet einfach den dann aktuellen Preis, nichts wird
    rückwirkend neu berechnet. SaxPowerCoordinator.notify_tariff_revision
    (aufgerufen aus __init__.async_update_options bei jeder
    Options-Flow-Änderung) merkt sich dafür nur einen rein diagnostischen
    Zeitpunkt der letzten Revision.

    Läuft ausschließlich innerhalb von
    SaxPowerCoordinator._accumulate_economics, aufgerufen am Ende von
    _accumulate_energy mit demselben EnergyDelta und demselben rohen,
    ungerundeten Entladezuwachs dieses Intervalls (02/06) - keine zweite
    Uhr, keine zweite Riemann-Summe. Der einmalige Bootstrap (siehe oben)
    läuft nur, solange SaxTariffProvider.config.enabled wahr ist - "beim
    erstmaligen Aktivieren". Ist die Bilanz aber einmal gestartet
    (economics_started_at gesetzt), akkumuliert sie AUCH während einer
    späteren Tarifpause (tariff_type=disabled) unverändert weiter:
    current_price/feed_in_price sind während der Pause bereits None (siehe
    unten), jede in dieser Zeit geladene Energie landet dadurch automatisch
    im unbewerteten Bestand statt unbeobachtet zu bleiben. Würde die
    Akkumulation stattdessen komplett pausieren, würde eine spätere
    Entladung nach dem Reaktivieren die in der Pause geladene Energie
    fälschlich vollständig als vermiedenen Netzbezug monetarisieren - ein
    kostenloser Scheingewinn, exakt der bei #42 vermiedene Fehler. Nur die
    VERÖFFENTLICHTEN vier monetären Sensoren (economics_grid_charge_cost,
    economics_pv_opportunity_cost, economics_avoided_grid_cost,
    economics_operating_result) blenden während einer Pause auf None statt
    auf die weiter mitlaufenden internen Summen - ein deaktivierter Tarif
    darf keinen falschen Nullgewinn suggerieren, aber auch keine sichtbaren
    Beträge zeigen. unvalued_inventory_kwh/unpriced_charge_kwh/
    unpriced_discharge_kwh sind keine Geldwerte und bleiben davon
    unberührt sichtbar. Die Herkunfts-/Energiesensoren aus 02/06 bleiben
    ebenfalls unberührt und weiterhin verfügbar.
    economics_current_import_price/economics_feed_in_price sind reine
    Durchreichungen des aktuellen Tarifs (SaxTariffProvider) und
    unabhängig vom Bilanz-Bootstrap immer aktuell; beide validieren ihren
    jeweiligen Wertebereich selbst (feed_in_price_eur_kwh über
    is_valid_feed_in_price) statt einen aus einem von Hand beschädigten
    Store stammenden, außerhalb des zulässigen Bereichs liegenden Preis
    ungeprüft durchzureichen - validate_tariff() schützt nur die
    Quote-Erzeugung selbst, nicht diese separat gelesene Property.

    Neue Sensoren (sensor.py, beschreibungsbasiert wie jeder andere
    berechnete Wert): economics_grid_charge_cost,
    economics_pv_opportunity_cost, economics_avoided_grid_cost,
    economics_operating_result (alle EUR, device_class monetary,
    state_class total - bewusst nicht total_increasing, weil negative
    Strompreise die Summen sinken lassen dürfen), economics_unvalued_inventory
    (kWh, device_class energy_storage, state_class measurement,
    Diagnose - ein Bestand/Gauge, kein kumulierter Zähler),
    economics_unpriced_charge/economics_unpriced_discharge (kWh,
    device_class energy, state_class total), sowie
    economics_current_import_price/economics_feed_in_price (EUR/kWh,
    state_class measurement).

    Persistenz: neuer versionierter EconomicsStateStore
    (infrastructure/economics_store.py) pro Config Entry, eigener
    STORAGE_VERSION (beginnt bei 1, keine Migration von einem
    energy_store.py-artigen Vorgänger nötig). Persistiert werden die drei
    Geldsummen, unvalued_inventory_kwh, unpriced_charge_kwh/
    unpriced_discharge_kwh, economics_started_at sowie
    last_tariff_revision_at. Writes werden wie beim Energy Store gebündelt
    (kein Write je 2-Sekunden-Poll) und beim Unload best-effort final
    geflusht. Felder werden unabhängig validiert, NaN/Inf werden
    abgelehnt; anders als die monoton steigenden Energiezähler dürfen die
    drei Geldsummen wegen negativer Strompreise sinken - "kleiner als der
    zuvor gespeicherte Wert" ist dort bewusst KEIN Ablehnungsgrund.
    unpriced_charge_kwh/unpriced_discharge_kwh bleiben dagegen echte
    monotone Summen, unvalued_inventory_kwh ist ein Bestand ohne
    Monotonieprüfung (nur Wertebereich: endlich, >= 0).
    economics_started_at ist wie origin_accounting_started_at (02/06)
    einmalig gesetzt und danach unveränderlich; ein abweichender
    gespeicherter Wert wird wie ein korrupter Snapshot verworfen. Alle
    sieben Kernfelder (ohne das rein diagnostische
    last_tariff_revision_at) bilden ein gemeinsam behandeltes Bündel -
    EconomicsState.initialized ist nur wahr, wenn alle sieben vorhanden
    sind; ist auch nur eines ungültig, gilt die gesamte Bilanz als nicht
    initialisiert und wird beim nächsten Datenpunkt komplett neu
    gebootstrapped. Die zugehörige interne Monotonie-/Vergleichs-Baseline
    (EconomicsStateStore._baseline) wird in diesem Fall ebenfalls
    vollständig bereinigt, damit der anschließend vom Coordinator neu
    gestartete 0/0/0-Stand nicht an den stehen gebliebenen alten
    Teilwerten bzw. dem alten Aktivierungszeitpunkt als rückläufig bzw.
    abweichend scheitert und die Bilanz dadurch über jeden Neustart hinweg
    dauerhaft unpersistiert bliebe (aus einem Review-Befund an
    EnergyStateStore._origin_baseline, REQ-ENERGY-ORIGIN, übernommenes
    Muster). Ein korrupter Snapshot wird nie still auf 0 gesetzt.

    Scheitert das Laden selbst (I/O-Fehler, unbekannte künftige
    Storage-Hauptversion), bleiben Rechnung und Bootstrap normal im
    Arbeitsspeicher aktiv (analog zu ControlConfigLoadStatus.FAILED), aber
    SaxPowerCoordinator._economics_store_write_blocked wird gesetzt und
    unterbindet jeden weiteren Schreibversuch (gedrosselt wie sofort) bis
    zu einem erfolgreichen Neuladen des Config Entry - ohne diese Sperre
    würde eine aus lauter Nullen neu gebootstrappte Bilanz den eigentlich
    vorhandenen, nur unlesbaren Store überschreiben und dessen Inhalt
    endgültig verlieren.

    Diagnose-Download (diagnostics.py, Schlüssel "economics") zeigt
    zusätzlich zu den bereits über coordinator_data sichtbaren, gerundeten
    Sensorwerten den internen, ungerundeten Rohzustand samt beider
    Zeitstempel.

    Nicht Teil dieser Anforderung: Anschaffungskosten, ROI-/
    Amortisationsprognose, Dashboardtab, Grundgebühr, Batteriealterung
    oder Wartungskosten.
  acceptance_criteria:
    - "Fest-, Zeitfenster- und dynamischer Preis werden am jeweiligen
       Lade-/Entladezeitpunkt korrekt angewendet - über SaxTariffProvider.quote(),
       nicht über eine eigene Preislogik."
    - "PV-Ladung wird mit der Einspeisevergütung bewertet; reine
       Netz-/PV-/Mischladung stimmen mit der Herkunftsaufteilung aus
       02/06 überein (tests/test_economics_accounting.py)."
    - "Der Anfangsbestand und unbepreiste Ladung können keinen
       kostenlosen Gewinn erzeugen: Entladung aus unvalued_inventory_kwh
       erzeugt nachweislich 0 EUR vermiedenen Geldwert."
    - "Negative Preise, fehlende Preise (Ladung wie Entladung),
       Tarifwechsel (prospektiv, keine rückwirkende Neuberechnung),
       SOC-Minimum-Korrektur, Neustart und Unload sind getestet."
    - "Der unbewertete Bestand überschreitet nie den tatsächlichen
       Speicherinhalt: nach einem unbepreisten Zyklus verfällt der
       Ladeverlust-Rest, und eine spätere bepreiste Entladung wird
       nachweislich vollständig als vermiedener Netzbezug bewertet
       (Issue #132). Ohne bekannte Kapazität/SOC wird nicht gedeckelt."
    - "Ladeverluste senken das operative Ergebnis über die gemessene
       Energiedifferenz, ohne einen angenommenen Wirkungsgrad zu
       benötigen."
    - "Store-Drosselung, Korruption (inkl. eines unvollständigen
       Sieben-Felder-Bündels samt bereinigter Baseline), zwei Config
       Entries und Final-Flush sind getestet
       (tests/test_economics_persistence.py)."
    - "Ein deaktivierter Tarif lässt die vier monetären Sensoren None
       liefern, nie 0 - auch dann, wenn die Bilanz bereits vor der Pause
       initialisiert war (nicht nur bei einem nie aktivierten
       Coordinator); die Herkunfts-/Energiesensoren aus 02/06 bleiben
       unverändert verfügbar."
    - "Während einer Tarifpause geladene oder entladene Energie wird
       weiterhin als unbewertet nachgeführt; eine nach dem Reaktivieren
       erfolgende Entladung dieser Energie erzeugt nachweislich 0 EUR
       vermiedenen Geldwert (kein kostenloser Scheingewinn)."
    - "Eine außerhalb von 0 bis 2 EUR/kWh liegende, aber endliche
       gespeicherte Einspeisevergütung ergibt None statt eines
       ungeprüften Rohwerts (SaxTariffProvider.feed_in_price_eur_kwh)."
    - "Ein Lesefehler des Wirtschaftlichkeits-Stores blockiert jeden
       weiteren Schreibversuch bis zu einem erfolgreichen Neuladen des
       Config Entry, während Rechnung und Bootstrap im Arbeitsspeicher
       normal weiterlaufen."
    - "strings.json, translations/de.json, translations/en.json,
       README.md, DEVELOPMENT.md, diagnostics.py und anforderung.yaml
       sind aktualisiert."

# ==============================================================================
# ANFORDERUNG: ROI UND AMORTISATIONSPROGNOSE
# ==============================================================================
requirement_economics_amortization:
  id: REQ-ECONOMICS-AMORTIZATION
  title: "ROI- und Amortisationsprognose aus Investitionskosten und dem operativen Ergebnis (03/06)"
  status: done
  description: >
    Baut ausschließlich auf dem bereits bilanzierten operativen Ergebnis
    (REQ-ECONOMICS-ACCOUNTING) auf - keine eigene Preis- oder
    Energieherkunftslogik. Optionale, von der Tarifart unabhängige
    Investitionskosten (economics_investment_cost_eur, Options Flow, 0,01
    bis 1.000.000 EUR, Schrittweite 0,01) schalten sämtliche ROI-/
    Amortisationssensoren frei; leer/fehlend liefert für alle sieben None
    statt eines erfundenen Werts. Ein Tarifwechsel löscht die
    Investitionskosten nicht (nicht Teil von const.ECONOMICS_OPTION_KEYS).

    Reine Formeln (domain/economics_amortization.py, kein
    Home-Assistant-Bezug):

    ```
    roi_percent = operating_result_eur / investment_cost_eur * 100          # unklemmt
    amortization_progress_percent = clamp(roi_percent, 0, 100)
    remaining_to_payback_eur = max(investment_cost_eur - operating_result_eur, 0)
    ```

    roi_percent bleibt bewusst unklemmt (negativ bei Verlust, über 100 %
    bei mehrfacher Amortisation); nur amortization_progress_percent ist als
    Fortschritts-Gauge auf 0..100 begrenzt.
    SaxPowerCoordinator._publish_amortization leitet beide sowie
    economics_remaining_to_payback und economics_result_today aus demselben
    operativen Ergebnis wie economics_operating_result ab und blendet sie
    bei deaktiviertem Tarif ebenso auf None aus (monetary_available) - der
    interne Stand läuft dabei unverändert weiter, exakt wie bei den vier
    Sensoren aus REQ-ECONOMICS-ACCOUNTING. Fehlende/ungültige
    Investitionskosten deaktivieren dagegen ALLE SIEBEN Sensoren dieser
    Anforderung (auch economics_result_today und ein bereits intern
    erreichter, weiterhin persistierter payback_achieved_at), unabhängig
    vom Tarifstatus.

    Lokale Kalendertag-Buckets (domain.economics_amortization.
    DayEconomicsResult: operating_result_eur plus die vier Energiemengen
    priced_charge_kwh/unpriced_charge_kwh/priced_discharge_kwh/
    unpriced_discharge_kwh sowie die Zeitabdeckung observed_seconds/
    day_length_seconds) werden ohne eigenen Timer erkannt:
    SaxPowerCoordinator._advance_economics_day vergleicht bei jedem
    ohnehin stattfindenden Poll-Tick dt_util.now().date() (Home-Assistant-
    Zeitzone, nicht UTC) mit dem zuletzt gesehenen Tag. Ein DST-Tag mit 23
    oder 25 Stunden wird NICHT auf 24h normiert - die Erkennung beruht
    ausschließlich auf dem Kalenderdatum, nie auf verstrichener Zeit. Bei
    einem erkannten Wechsel schließt _close_economics_day den bisherigen
    Tag ab (angehängt an EconomicsState.day_results, auf MAX_STORED_DAYS =
    60 gekappt) und _start_economics_day beginnt den neuen bei 0; beides
    läuft unabhängig davon, ob dieses Intervall selbst ein Delta hatte, und
    ist idempotent gegenüber einem Neustart mittendrin (current_day plus
    seine fünf Zähler sind als eigenes Sechser-Bündel persistiert, siehe
    unten) sowie gegenüber einer doppelten Verarbeitung desselben Ticks
    (nur ein tatsächlicher Datumswechsel löst genau einen Abschluss aus).

    observed_seconds ist die tatsächlich mit Datenpunkten belegte Zeit des
    Tages. Sie stammt aus derselben Riemann-Summe wie die Energie selbst
    (SaxPowerCoordinator._accumulate_energy reicht die Dauer des gerade
    verbuchten Intervalls an _accumulate_economics durch) - keine zweite
    Uhr. Genau die Intervalle, die nicht verbucht werden, zählen auch nicht
    als beobachtet: der erste Tick nach einem Neustart (keine bekannte
    Vor-Leistung) und jede Phase ohne Leistungswert (SunSpec-Modus nicht
    erreichbar). Ein Intervall über Mitternacht zählt vollständig zum neuen
    Tag, exakt wie seine Energie und sein Geldwert. Weil sich die
    beobachtete Zeit bei jedem verbuchten Intervall bewegt, löst sie das
    verzögerte Speichern - anders als jede andere Änderung des laufenden
    Tages - nur beim Überschreiten des nächsten Rasterschritts von
    OBSERVED_TIME_SAVE_GRANULARITY_SECONDS (900 s) aus; sonst schriebe der
    Store auch auf einem völlig ruhenden System dauerhaft alle
    ECONOMICS_SAVE_DELAY Sekunden. 15 Minuten sind rund 1 % eines Tages und
    damit das Maximum, das ein ungeplanter Neustart an Beobachtungsdauer
    verlieren kann - weit innerhalb der 5 %, die
    DAY_TIME_COVERAGE_THRESHOLD_PERCENT zugesteht. Ohne diese Persistenz
    sähe jeder Neustart den laufenden Tag als unvollständiger an, als er
    war.
    day_length_seconds wird beim Tagesabschluss festgeschrieben
    (_close_economics_day über dt_util.start_of_local_day, also dieselbe
    Zeitzone wie die Tageserkennung) und ist an einer DST-Umstellung 23
    bzw. 25 Stunden - passend zu Regel 1, und immun dagegen, dass eine
    spätere Zeitzonenänderung historische Tage rückwirkend umbewertet.

    30-Tage-Prognose (domain.economics_amortization.
    compute_amortization_forecast, reine Funktion): schließt den laufenden,
    unvollständigen Tag zwingend aus (zusätzlich zur Buckets-Erzeugung
    selbst nochmals defensiv per day < today_local geprüft). Das Fenster ist
    exakt der lückenlose Kalenderbereich von `today_local -
    FORECAST_WINDOW_DAYS (30)` bis `today_local - 1 Tag` - fehlt auch nur
    einer dieser 30 konkreten Kalendertage in der Historie (z. B. nach einer
    längeren Ausfallzeit von Home Assistant), ist das
    ForecastUnavailable.INSUFFICIENT_HISTORY, statt stattdessen ältere,
    außerhalb des Fensters liegende Tage als Lückenfüller zu verwenden.
    Verlangt von JEDEM dieser 30 Tage eine Preisabdeckung
    (DayEconomicsResult.price_coverage_percent, ein Tag ganz ohne relevante
    Energie gilt als 100 % abgedeckt) von mindestens
    DAY_COVERAGE_THRESHOLD_PERCENT = 95 %, sonst ist die GESAMTE Prognose
    ForecastUnavailable.LOW_PRICE_COVERAGE (ein einzelner schlechter Tag
    wird nicht stillschweigend übersprungen); average_price_coverage_percent
    bleibt dabei als Diagnosewert gesetzt.

    Dieselbe harte Regel gilt für die ZEITABDECKUNG jedes der 30 Tage
    (DayEconomicsResult.time_coverage_percent = observed_seconds /
    day_length_seconds, auf 100 % geklemmt, Nenner ist die tatsächliche
    Länge des lokalen Kalendertages): Unterschreitet auch nur ein Tag
    DAY_TIME_COVERAGE_THRESHOLD_PERCENT = 95 %, ist die gesamte Prognose
    ForecastUnavailable.INCOMPLETE_DAYS. Ein nur teilweise beobachteter Tag
    (Home Assistant war aus, Update, Stromausfall) enthält trotz
    einwandfreier Preisabdeckung nur einen Teil seines Ergebnisses und
    würde Durchschnitt, Jahreshochrechnung und Rückzahlungsdatum
    systematisch zu pessimistisch machen. Diese Prüfung läuft VOR der
    Preisabdeckung, weil die Preisabdeckung eines nur teilweise
    beobachteten Tages selbst nicht aussagekräftig ist (sie misst nur den
    beobachteten Ausschnitt) - bei beiden Problemen zugleich benennt
    unavailable_reason damit die ursächliche Lücke (incomplete_days), nicht
    ihre Folge. average_time_coverage_percent und fully_observed_days
    bleiben wie ihre Preis-Gegenstücke als Diagnosewerte gesetzt.

    Erfüllt das Fenster alle Bedingungen: average_daily_result_eur = Summe
    der 30 Tagesergebnisse / 30, projected_annual_result_eur =
    average_daily_result_eur * 365,2425 (DAYS_PER_YEAR, mittleres
    Kalenderjahr inkl. Schaltjahren). Ein nicht
    positiver Durchschnitt lässt ausschließlich das Rückzahlungsdatum
    unbekannt (Regel 9) - average/Hochrechnung bleiben trotzdem gesetzt,
    nie "unendlich" und nie ein erfundenes Datum. Ist der Durchschnitt
    positiv und ist noch ein Restbetrag offen, ergibt sich payback_days =
    remaining_to_payback_eur / average_daily_result_eur und
    estimated_payback_date = heute + aufgerundete payback_days
    (math.ceil) - hier immer eine zukünftige Projektion. Überschreitet
    payback_days dabei die Horizontgrenze MAX_FORECAST_PAYBACK_DAYS
    (36.524 Tage, ~100 Jahre), bleibt estimated_payback_date wie bei einem
    nicht positiven Durchschnitt unbekannt, während payback_days als
    Diagnosewert erhalten bleibt: ein winziger, aber positiver
    Tagesdurchschnitt (Ladekosten und vermiedene Kosten heben sich fast
    auf) ergäbe sonst ein von date/timedelta nicht mehr darstellbares
    Datum, und der OverflowError daraus würde über _async_update_data
    sämtliche Entities der Integration - auch die steuernden - unavailable
    machen. Der dafür
    verwendete remaining_to_payback_eur ist der tatsächliche, UNMASKIERTE
    Restbetrag aus dem intern weiterlaufenden operativen Ergebnis, nicht der
    während einer Tarifpause auf None ausgeblendete - sonst würde eine Pause
    auch das Rückzahlungsdatum der Prognose verschwinden lassen.

    Payback-Erkennung (SaxPowerCoordinator._maybe_mark_payback_achieved,
    aufgerufen aus _close_economics_day): sobald das kumulierte operative
    Ergebnis (dieselben drei Teilsummen wie economics_operating_result) die
    konfigurierten Investitionskosten an einer Tagesgrenze erstmals
    erreicht oder übersteigt, wird payback_achieved_at (UTC) genau einmal
    gesetzt und bleibt danach für immer unveränderlich - auch eine spätere
    Änderung oder Entfernung der Investitionskosten wirkt nur prospektiv
    auf ROI/Restbetrag, nie rückwirkend auf diesen Zeitpunkt. Die
    Tageswechsel-Erkennung (_advance_economics_day) läuft dafür VOR der
    Anwendung des aktuellen Deltas auf die Gesamtsummen: der Payback-Check
    beim Abschluss eines Tages sieht ausschließlich den am Ende dieses
    (vorherigen) Tages tatsächlich erreichten Stand, nie bereits das erste
    Delta des NEUEN Tages - sonst würde ein erst durch dieses neue Delta
    erreichtes Payback fälschlich auf die vorherige Tagesgrenze
    zurückdatiert. Ist payback_achieved_at gesetzt, zeigt
    economics_estimated_payback_date dieses fixe historische Datum statt
    der laufenden Projektion aus der 30-Tage-Prognose
    (SaxPowerCoordinator._estimated_payback_date).

    Neue Sensoren (sensor.py, beschreibungsbasiert): economics_roi,
    economics_amortization_progress (beide %, state_class measurement),
    economics_remaining_to_payback (EUR, state_class measurement, kein
    device_class monetary - der Betrag ist kein kumulierter Zähler),
    economics_result_today (EUR, device_class monetary, state_class total -
    wie die Bilanz-Sensoren aus REQ-ECONOMICS-ACCOUNTING bewusst nicht
    total_increasing; als EINZIGER dieser Sensoren wird er zyklisch
    zurückgesetzt und meldet deshalb zusätzlich last_reset, siehe unten),
    economics_average_daily_result_30d (EUR/Tag,
    state_class measurement), economics_projected_annual_result (EUR/Jahr,
    state_class measurement), economics_estimated_payback_date
    (device_class date, ein reines Kalenderdatum ohne Uhrzeitbezug - der
    intern gespeicherte, UTC-genaue payback_achieved_at wird dafür auf den
    lokalen Kalendertag abgebildet). economics_average_daily_result_30d
    trägt zusätzlich Attribute (window_start/window_end,
    complete_days_available, accepted_days, fully_observed_days,
    average_price_coverage_percent, average_time_coverage_percent,
    average_daily_result_eur - redundant zum Sensorzustand, aber Teil
    desselben Attributsatzes -, payback_days, unavailable_reason) aus der
    Prognose.

    economics_result_today ist ein zyklisch zurückgesetzter Zähler und
    liefert deshalb als einziger Sensor der Integration einen last_reset:
    den Beginn des laufenden lokalen Kalendertages
    (dt_util.start_of_local_day des in _advance_economics_day geführten
    Datums, veröffentlicht als coordinator.data-Schlüssel
    economics_result_today_last_reset, durchgereicht über das optionale
    Feld last_reset_fn von SaxPowerSensorEntityDescription). Ohne diesen
    Zeitpunkt deutet die Langzeitstatistik den Sprung auf 0 um Mitternacht
    nicht als Reset, sondern als negativen Zuwachs in Höhe des
    Tagesergebnisses: die Statistiksumme pendelte dauerhaft um 0 und jede
    statistics-graph-Karte mit stat_types [change] zeigte zu jedem
    Mitternachtswechsel einen guten Tag als gleich großen Verlust. Ein
    Ausweichen auf state_class measurement scheidet aus, weil
    device_class monetary in Home Assistant ausschließlich total zulässt.
    Ein manueller Bilanzneustart (REQ-ECONOMICS-OBSERVABILITY,
    async_restart_economics_accounting) setzt den Tageszähler mitten am Tag
    auf 0, ohne das Datum zu ändern - last_reset ist deshalb der spätere
    der beiden Zeitpunkte Tagesbeginn/last_restart_at (beide persistiert,
    verschieben sich also durch einen Neustart von Home Assistant nicht
    nachträglich). Ohne begonnenen Kalendertag und ohne
    Investitionskosten (der Sensor ist dann selbst abgeschaltet) bleibt
    last_reset None; eine Tarifpause blendet dagegen nur den Geldwert aus
    und lässt den Reset-Zeitpunkt stehen - ein unknown-Zustand fließt
    ohnehin nicht in die Langzeitstatistik ein.
    payback_days macht
    dabei den Horizontfall sichtbar: entfällt estimated_payback_date nur
    wegen MAX_FORECAST_PAYBACK_DAYS, bleibt unavailable_reason None (der
    Durchschnitt und die Hochrechnung sind ja gültig) - ohne das Attribut
    wäre dieser Zustand von einer gesunden Prognose nicht zu
    unterscheiden.
    Anders als die vier "aktuellen" Sensoren (roi, Fortschritt, Restbetrag,
    Tagesergebnis) blendet die 30-Tage-Prognose (Durchschnitt/Hochrechnung/
    Rückzahlungsdatum) während einer Tarifpause NICHT auf None: sie beruht
    ausschließlich auf bereits abgeschlossenen, historisch korrekten Tagen
    und den Investitionskosten, nicht auf einem gerade jetzt gültigen
    Preis.

    Persistenz: EconomicsStateStore (REQ-ECONOMICS-ACCOUNTING) um
    STORAGE_MINOR_VERSION 2 erweitert (statt einer Hauptversion - ein
    Hauptversionssprung hätte bei jedem bestehenden Store
    NotImplementedError ausgelöst, siehe infrastructure/energy_store.py),
    die Zeitabdeckung mit STORAGE_MINOR_VERSION 5.
    Drei unabhängige Bündel: das ursprüngliche Sieben-Felder-Bündel aus
    REQ-ECONOMICS-ACCOUNTING (unverändert), day_results (jeder Tag für
    sich validiert - ein kaputter Eintrag verwirft nur sich selbst, Mehrfach-
    einträge zum selben Datum behalten nur den zuletzt genannten, auf
    MAX_STORED_DAYS gekappt) sowie current_day plus seiner fünf Zähler als
    eigenes Sechser-Bündel (fehlt/ist auch nur eines ungültig, gilt der
    ganze angefangene Tag als nicht aussagekräftig und verworfen - die
    abgeschlossene Historie bleibt davon unberührt).

    Für die beiden Zeitabdeckungsfelder eines abgeschlossenen Tages gilt
    dabei eine bewusste Unterscheidung: Ein schlicht FEHLENDES Feld stammt
    aus einem Store vor MINOR_VERSION 5 - der Tag bleibt als Historie
    erhalten, zählt aber mit 0 beobachteten Sekunden als unvollständig
    beobachtet (die Prognose lebt damit erst wieder auf, wenn 30 neue,
    tatsächlich beobachtete Tage vorliegen). Ein VORHANDENER, aber
    ungültiger Wert (negativ, nicht endlich, Fremdtyp, Tageslänge 0)
    bleibt dagegen ein Korruptionsindiz und verwirft den ganzen
    Tageseintrag. Beim laufenden Tag gibt es diese Nachsicht nicht: dort
    gehört current_day_observed_seconds zum Bündel, weil sich ein
    angefangener Tag ohne bekannte Beobachtungsdauer nur mit einer
    erfundenen Abdeckung abschließen ließe - verloren geht dabei
    ausschließlich der ohnehin unvollständige laufende Tag. payback_achieved_at
    ist wie economics_started_at einmalig gesetzt und danach unveränderlich;
    ein abweichender gespeicherter Wert wird wie ein korrupter Snapshot
    verworfen.

    Nicht Teil dieser Anforderung: Grundgebühr, Batteriealterung,
    Wartungskosten, ein eigener Dashboardtab.
  acceptance_criteria:
    - "ROI negativ/positiv, über 100 % sowie die Fortschritts-Klemmung auf
       0..100 und ein bereits erreichtes Payback (remaining_to_payback_eur
       = 0) sind getestet (tests/test_economics_amortization.py)."
    - "Die Prognose ist getestet für: genau 29/30/31 vorhandene Tage
       (31 verwendet nur die jüngsten 30), den ausgeschlossenen laufenden
       Tag, eine zu niedrige Preisabdeckung eines einzelnen Tages
       (gesamte Prognose unavailable) sowie einen nicht positiven
       Durchschnitt (Datum bleibt unbekannt, Durchschnitt/Hochrechnung
       bleiben gesetzt)."
    - "30 vorhandene, aber lückenhafte Tages-Buckets (z. B. nur jeder zweite
       Tag über einen längeren Zeitraum) ergeben INSUFFICIENT_HISTORY statt
       einer aus Lückenfüllern zusammengesetzten Prognose."
    - "Ein einzelner, nur zur Hälfte beobachteter Tag im Fenster ergibt
       INCOMPLETE_DAYS (nicht LOW_PRICE_COVERAGE, auch wenn zusätzlich die
       Preisabdeckung fehlt) und lässt Durchschnitt, Hochrechnung und
       Rückzahlungsdatum unbekannt; fully_observed_days und
       average_time_coverage_percent bleiben als Diagnosewerte gesetzt
       (tests/test_economics_amortization.py)."
    - "Die Zeitabdeckung misst gegen die tatsächliche Länge des lokalen
       Kalendertages: ein abgeschlossener 23h-/25h-DST-Tag trägt 82.800
       bzw. 90.000 Sekunden als day_length_seconds
       (tests/test_coordinator.py)."
    - "Der erste Tick nach einem Neustart, ein Intervall ohne
       Leistungswert und die Zeit nach einem fehlgeschlagenen Update
       zählen nicht als beobachtete Zeit; die beobachtete Zeit allein löst
       ein verzögertes Speichern genau einmal je Rasterschritt aus und
       übersteht einen Neustart mitten im Tag (tests/test_coordinator.py)."
    - "Ein gespeicherter Tag ohne observed_seconds (Store vor
       MINOR_VERSION 5) bleibt erhalten und gilt als unvollständig
       beobachtet, ein vorhandener ungültiger Wert verwirft den Tag, und
       ein laufender Tag ohne beobachtete Dauer verwirft nur sein eigenes
       Bündel (tests/test_economics_persistence.py)."
    - "Ein positiver, aber verschwindend kleiner Tagesdurchschnitt (z. B.
       0,001 EUR/Tag bei 9.000 EUR Restbetrag) liefert payback_days als
       Diagnosewert, estimated_payback_date = None und niemals einen
       OverflowError (tests/test_economics_amortization.py); der
       Coordinator veröffentlicht payback_days dabei als Attribut
       (tests/test_coordinator.py)."
    - "Tageswechsel bei einer Sommerzeit- (23h) und einer
       Winterzeitumstellung (25h), ein Neustart mit bereits laufendem Tag
       sowie eine doppelte Verarbeitung desselben Ticks erzeugen jeweils
       jeder für sich genau einen Tagesabschluss
       (tests/test_coordinator.py)."
    - "Überschreitet erst das erste Delta des NEUEN Tages die
       Investitionskosten, wird der Payback nicht auf den Abschluss des
       VORTAGES zurückdatiert - erst der nächste Tagesabschluss markiert
       ihn, mit dem am Ende des dann geschlossenen Tages tatsächlich
       erreichten Stand."
    - "Fehlende/ungültige Investitionskosten setzen alle sieben Sensoren
       dieser Anforderung auf None - einschließlich economics_result_today
       und eines bereits intern erreichten, weiterhin persistierten
       payback_achieved_at."
    - "economics_result_today meldet den Beginn des laufenden lokalen
       Kalendertages als last_reset und zieht bei jedem Tageswechsel mit,
       damit der Sprung auf 0 in der Langzeitstatistik als Reset und nicht
       als negativer Zuwachs verbucht wird; ein Bilanzneustart mitten am
       Tag verschiebt den Zeitpunkt ebenfalls, ohne Investitionskosten
       bleibt er None (Issue #133, tests/test_coordinator.py,
       tests/test_sensor_descriptions.py)."
    - "Das Rückzahlungsdatum der 30-Tage-Prognose bleibt während einer
       Tarifpause sichtbar (unmaskierter Restbetrag), auch wenn die vier
       aktuellen Sensoren (ROI, Fortschritt, Restbetrag, Tagesergebnis) auf
       None ausgeblendet sind."
    - "Eine Bewegung zu einem gültigen Preis von exakt 0 EUR/kWh (bepreiste,
       aber kostenneutrale Energie) löst ein verzögertes Speichern des
       laufenden Tages aus, obwohl keine der drei Geldsummen sich ändert."
    - "Eine Änderung oder Entfernung der Investitionskosten wirkt sofort
       auf ROI/Restbetrag, ohne day_results oder einen bereits erreichten
       payback_achieved_at rückwirkend zu verändern."
    - "Store-Round-Trip, unabhängige Validierung einzelner Tageseinträge,
       das Fünfer-Bündel des laufenden Tages, die Kappung auf
       MAX_STORED_DAYS sowie die Unveränderlichkeit von
       payback_achieved_at sind getestet
       (tests/test_economics_persistence.py)."
    - "strings.json, translations/de.json, translations/en.json,
       README.md, DEVELOPMENT.md und anforderung.yaml sind aktualisiert."

# ==============================================================================
# ANFORDERUNG: DATENQUALITÄT, DIAGNOSE UND BILANZNEUSTART
# ==============================================================================
requirement_economics_observability:
  id: REQ-ECONOMICS-OBSERVABILITY
  title: "Datenqualitäts-Statussensor, Diagnose, Preisausfall-Repair und kontrollierter Bilanzneustart"
  status: done
  description: >
    Eine Geldzahl ohne Aussage zur Datenqualität ist irreführend - dieser
    Block macht sichtbar, ob und warum die Wirtschaftlichkeitsbilanz
    (REQ-ECONOMICS-ACCOUNTING/-AMORTIZATION) gerade vertrauenswürdig ist,
    ohne selbst neue Geldwerte zu berechnen.

    Read-only Enum-Sensor `economics_status`
    (domain.economics_status.EconomicsStatus) mit sieben stabilen
    Zuständen. Priorität bei gleichzeitig zutreffenden Problemen (höchste
    zuerst, domain.economics_status.compute_economics_status):
    `disabled` (ausschließlich bei deaktiviertem Tarif, schlägt dabei jeden
    anderen Zustand) > `storage_error` > `waiting_for_initial_state` >
    `price_unavailable` > `origin_unavailable` > `partial_price_coverage` >
    `active`. Attribute: `reason` (redundant zum Sensorzustand),
    `tariff_type`, `price_sensor_entity_id` (nur bei dynamischem Tarif -
    eine Entity-ID ist keine identifizierende Information),
    `economics_started_at`/`last_tariff_revision_at`/
    `last_successful_quote_at` (UTC ISO), aktuelle Import-/
    Einspeisevergütung, kumulierte bepreiste/unbepreiste Lade-/
    Entlade-kWh sowie `charge_price_coverage_percent`/
    `discharge_price_coverage_percent` (kumuliert seit
    economics_started_at), die zustandsbestimmenden Tageswerte
    `charge_price_coverage_percent_today`/
    `discharge_price_coverage_percent_today` (siehe unten) und
    `origin_coverage_percent`. Kurze
    lokalisierte Erklärungen kommen über die Entity-Übersetzung der
    Sensorzustände (strings.json, `entity.sensor.economics_status.state`),
    nicht über ein zusätzliches Freitextattribut.

    Preisabdeckung (domain.economics_status.compute_price_coverage_percent,
    reine Funktion): energiebasiert, nicht tickbasiert - bepreiste kWh
    geteilt durch (bepreiste + unbepreiste) kWh, bei Nenner 0 (noch keine
    relevante Energie) 100 %. Braucht dafür zwei neue, seit
    economics_started_at kumulierte Lifetime-Zähler
    (`SaxPowerCoordinator._economics_priced_charge_kwh`/
    `_economics_priced_discharge_kwh`, aus denselben
    `EconomicsDelta.priced_charge_kwh_delta`/`priced_discharge_kwh_delta`
    wie die Tages-Buckets aus 04/06) - Gegenstück zu den bestehenden
    `unpriced_charge_kwh`/`unpriced_discharge_kwh`.

    `partial_price_coverage` bewertet ausdrücklich NUR den laufenden
    Kalendertag: Auslöser sind die aus den Tages-Buckets von
    REQ-ECONOMICS-AMORTIZATION gebildeten
    `charge_price_coverage_percent_today`/
    `discharge_price_coverage_percent_today` (keine zusätzlichen Zähler),
    und zwar erst unterhalb von
    domain.economics_status.PRICE_COVERAGE_THRESHOLD_PERCENT (95 %, analog
    zu DAY_COVERAGE_THRESHOLD_PERCENT), nicht schon bei exakt < 100 %. Aus
    den Lifetime-Quoten abgeleitet (und ohne Toleranz) kippte eine
    EINZIGE unbepreiste Kilowattstunde den Sensor dauerhaft und
    unwiderruflich: solche kWh sind im Normalbetrieb unvermeidbar (der
    erste Coordinator-Tick nach einem Neustart läuft oft, bevor die
    Preis-Integration ihre Entity angelegt hat; dazu jede kurze
    Tarifpause und jedes Intervall unbekannter Herkunft), Lifetime-Zähler
    gehen nie zurück, und der einzige Ausweg wäre der Bilanzneustart, der
    zugleich die gesamte Geldbilanz verwirft. Ein dauerhaft anliegender
    Warnzustand wird ignoriert - der Sensor verlöre damit genau die
    Aussage, für die er gebaut ist (Issue #134). Die kumulierten
    Lifetime-Quoten bleiben als Attribute erhalten (Langzeitinformation),
    sind aber kein Zustandsauslöser mehr.
    `origin_coverage_percent` ist unverändert
    `SaxPowerCoordinator._energy_origin_coverage()` (02/06);
    `origin_unavailable` ist wahr, wenn diese Methode `None` liefert (die
    Herkunftszählung selbst nie initialisiert wurde, z. B. nach einem
    Energiezähler-Store-Ladefehler) - unabhängig davon, ob die
    Geldbilanz selbst weiterläuft.

    Preisausfall-Erkennung
    (SaxPowerCoordinator._update_economics_price_availability, läuft nur
    solange der Tarif aktiv ist): verfolgt monotonic, seit wann
    ununterbrochen kein gültiger Netzbezugspreis mehr vorlag.
    QuoteUnavailable.TARIFF_INCOMPLETE (ein ungültig gespeicherter Fest-/
    Zeitfenstertarif - fehlender Pflichtpreis, kaputte Zeitfenstergruppe)
    ist ein sofortiger Konfigurationsfehler ohne Karenzzeit; jeder andere
    Grund (typischerweise ein transienter Ausfall des dynamischen
    Preis-Sensors) braucht ECONOMICS_PRICE_UNAVAILABLE_GRACE_PERIOD (6h,
    wie PRICE_SENSOR_MISSING_GRACE_PERIOD beim preisoptimierten Laden).
    Das daraus abgeleitete `_economics_price_unavailable`-Flag ist
    sowohl für den Status-Sensor als auch für das Repair-Issue
    `economics_price_unavailable` (rein informativ, is_fixable=False,
    Zustandsflanke wie bei den fünf bestehenden Selbstdiagnose-Issues aus
    REQ-SELF-DIAGNOSIS-REPAIRS) die alleinige Quelle - keine doppelte
    Karenzzeit-Logik. Die Löschung prüft dabei zusätzlich zum lokalen
    In-Memory-Flag den tatsächlichen Issue-Registry-Zustand
    (`SelfDiagnostics._check_economics_price_unavailable`): Das Flag lebt
    nur im Arbeitsspeicher der jeweiligen SelfDiagnostics-Instanz und
    startet nach jedem Neuladen des Config Entry wieder bei `False` - ein
    zuvor angelegtes, in der Registry aber weiterhin vorhandenes Issue
    würde sonst nach einem Reload nie gelöscht, selbst wenn der Preis
    inzwischen wieder gültig ist.

    Speicherfehler (`SaxPowerCoordinator._economics_store_write_blocked`,
    gesetzt sowohl bei einem Ladefehler als auch bei einem abgelehnten oder
    fehlgeschlagenen Schreibversuch des Wirtschaftlichkeits-Stores):
    `_async_schedule_economics_save`/`_async_flush_economics_state` prüfen
    den Rückgabewert von `async_delay_save`/`async_save` und setzen das
    Flag, sobald `_accept()`/`_valid_snapshot()` einen Snapshot ablehnt.
    Ein tatsächlicher Schreibfehler ist damit allein noch nicht erkennbar:
    Home Assistants `Store` fängt eine echte `WriteError`/
    `SerializationError` intern ab und kehrt regulär zurück
    (`Store._async_handle_write_data`), ohne sie an den Aufrufer
    weiterzureichen - weder `Store.async_save()` noch der über
    `Store.async_delay_save()` verzögerte Pfad melden einen solchen Fehler
    zurück. `EconomicsStateStore` verzichtet deshalb bewusst auf
    `Store.async_delay_save()` und verwaltet die Verzögerung selbst
    (`async_call_later`, mit einem `EVENT_HOMEASSISTANT_FINAL_WRITE`-
    Sicherheitsnetz analog zu `Store._async_ensure_final_write_listener`):
    `_write_and_verify` liest nach jedem Schreibversuch den soeben
    geschriebenen Schlüssel über die öffentliche `Store.async_load()`-API
    zurück und vergleicht ihn mit den beabsichtigten Daten - eine
    schweigend verschluckte `WriteError` lässt die Datei unverändert und
    wird dadurch als Abweichung sichtbar. Für den sofortigen Pfad
    (`async_save`/`async_reset`) fließt das Ergebnis in den normalen
    Rückgabewert ein (`async_restart_economics_accounting` meldet einen
    dadurch erkannten stillen Fehlschlag deshalb korrekt als
    `HomeAssistantError`, statt fälschlich Erfolg zu melden); für den
    zeitversetzten Pfad, der keinen wartenden Aufrufer mehr hat, über den
    optionalen `on_persist_failed`-Callback
    (`SaxPowerCoordinator._on_economics_persist_failed`). Die gesamte
    save-then-load-Sequenz aus `_write_and_verify` läuft dabei unter einem
    pro `EconomicsStateStore`-Instanz gehaltenen `asyncio.Lock`
    (`_write_and_verify_lock`): `Store.async_save()` überschreibt
    `Store._data` sofort, unabhängig von einem eventuell noch laufenden
    anderen Schreibvorgang (nur die eigentliche Schreib-E/A ist über
    `Store._write_lock` serialisiert) - ein zweiter, überlappender
    Schreibversuch (z. B. ein bereits laufender verzögerter Write parallel
    zu `async_reset()`/dem Shutdown-Flush) könnte sonst zwischen den
    Save- und den Load-Aufruf des ersten geraten und dessen
    `Store.async_load()` fälschlich die eigenen, noch ausstehenden Daten
    statt der soeben geschriebenen zurückgeben lassen - der erste,
    tatsächlich erfolgreiche Write würde dann fälschlich als
    Schreibfehler gemeldet. In beiden Fällen
    identisch: Status `storage_error`, UND - Abweichung von
    REQ-ECONOMICS-ACCOUNTING -
    `_bootstrap_economics_if_ready` bootstrapped in diesem Fall NICHT mehr
    frisch im Arbeitsspeicher, `_accumulate_economics` akkumuliert keine
    weiteren Deltas mehr auf eine ungesicherte Baseline. Vorher (03/06)
    lief die Bilanz bei einem unlesbaren Store noch normal im
    Arbeitsspeicher weiter; das barg das Risiko, beliebig viel
    unsicherbaren Fortschritt zu verlieren. Die Energiezähler und die
    Herkunftsaufteilung aus 02/06 laufen davon unberührt weiter.

    Diagnostics (diagnostics.py, Schlüssel "economics"): zusätzlich zu den
    bereits vorhandenen Rohsummen/Zeitstempeln jetzt auch `status`,
    `store_write_blocked`, `store_minor_version`, `priced_charge_kwh`/
    `priced_discharge_kwh` und `price_unavailable`/
    `last_successful_quote_at`. Schlüssel "tariff"
    (SaxTariffProvider.diagnostics) zusätzlich um `price_sensor_entity_id`
    ergänzt. Bestehende Redaction-Regeln (TO_REDACT, nur der Host) bleiben
    unverändert.

    Kontrollierter Bilanzneustart: neue Action
    `sax_power.restart_economics_accounting`
    (SaxPowerCoordinator.async_restart_economics_accounting). Pflichtfeld
    `device_id`; Pflichtfeld `confirm`, muss exakt `true` sein
    (`_require_confirm_true` in __init__.py, eine fehlende oder
    falsch geschriebene Bestätigung darf niemals als Zustimmung gelten);
    optionales `reason` (Freitext, höchstens
    MAX_ECONOMICS_RESTART_REASON_LENGTH = 120 Zeichen), rein diagnostisch:
    wird zusammen mit dem UTC-Zeitpunkt dieses Neustarts persistiert
    (`EconomicsState.last_restart_at`/`last_restart_reason`, unabhängig
    vom Sieben-Felder-Bündel) und im Diagnose-Download angezeigt -
    beeinflusst keine Berechnung. Lehnt mit ServiceValidationError ab, wenn der Tarif
    deaktiviert ist, die Bilanz noch nie initialisiert wurde, oder
    Speicherkapazität/Ladezustand gerade nicht bekannt sind. Setzt
    AUSSCHLIESSLICH zurück: die drei Economics-Geldsummen, die vier
    Preisabdeckungszähler (priced_*/unpriced_*), die Tages-Buckets
    (day_results, current_day plus seine vier Zähler), den Aktivierungs-/
    Revisionszeitpunkt (neu auf jetzt) und einen bereits erreichten
    Payback-Zeitpunkt (auf None) - initialisiert den unbekannten
    Anfangsbestand dabei erneut wie beim erstmaligen Aktivieren (03/06,
    "Ehrlicher Start"). Rührt NIEMALS `energy_charged`/`energy_discharged`
    oder die Herkunftszähler aus REQ-ENERGY-ORIGIN an - keine
    `total_increasing`-Entity darf durch diesen Service zurückspringen.
    Speichert atomar über EconomicsStateStore.async_reset (bypasst
    bewusst die sonst geltende Monotonie-/Unveränderlichkeits-Baseline aus
    _accept, prüft aber weiterhin Endlichkeit/Wertebereich) VOR jeder
    In-Memory-Änderung: schlägt das Speichern fehl, bleibt der bisherige
    Zustand vollständig und unverändert bestehen (kein halb angewendeter
    Neustart). Keine rückwirkende Neuberechnung und kein automatischer
    Reset bei einer späteren Tarif-/Investitionsänderung - das gilt
    unverändert weiter.

    Persistenz: EconomicsStateStore um STORAGE_MINOR_VERSION 3 erweitert
    (statt einer Hauptversion, aus demselben Grund wie bei 04/06).
    `priced_charge_kwh`/`priced_discharge_kwh` sind wie
    `unpriced_charge_kwh`/`unpriced_discharge_kwh` echte monotone Summen,
    unabhängig vom Sieben-Felder-Bündel aus 03/06 - ein Store aus der Zeit
    davor kennt sie noch nicht und beginnt ihre Zählung transparent bei 0
    ab jetzt (analog zur Herkunftszählung aus REQ-ENERGY-ORIGIN).

    Nicht Teil dieser Anforderung: ein eigener Dashboard-Tab (folgt in
    06/06, REQ-ECONOMICS-DASHBOARD).
  acceptance_criteria:
    - "Jeder der sieben Status ist einzeln erreichbar; kombinierte,
       gleichzeitig zutreffende Probleme ergeben genau den einen Status
       mit der höchsten Priorität (tests/test_economics_status.py,
       tests/test_coordinator.py)."
    - "Preisabdeckung ist energiebasiert (nicht tickbasiert), bleibt bei
       Nenner 0 bei 100 % und wird intern aus ungerundeten Zählern
       gebildet, erst beim Veröffentlichen gerundet."
    - "partial_price_coverage entsteht ausschließlich aus der Abdeckung
       des laufenden Kalendertages und erst unterhalb von
       PRICE_COVERAGE_THRESHOLD_PERCENT: eine einzelne unbepreiste
       Kilowattstunde lässt den Status auf active, und ein Tag mit
       echter Lücke kehrt am Folgetag ohne Bilanzneustart auf active
       zurück, während die Lifetime-Quote als Attribut sichtbar
       niedriger bleibt (Issue #134, tests/test_economics_status.py,
       tests/test_coordinator.py)."
    - "Ein ungültig gespeicherter Fest-/Zeitfenstertarif löst
       price_unavailable sofort aus; ein transienter Ausfall des
       dynamischen Preis-Sensors erst nach
       ECONOMICS_PRICE_UNAVAILABLE_GRACE_PERIOD (6h)."
    - "Das Repair-Issue economics_price_unavailable entsteht/löscht sich
       auf der jeweiligen Zustandsflanke, ohne bei unverändertem
       Problemzustand erneut angelegt zu werden
       (tests/test_repairs.py)."
    - "Ein Store-Ladefehler verhindert sowohl einen frischen 0-Bootstrap
       im Arbeitsspeicher als auch jede weitere Akkumulation - die
       Energiezähler/Herkunftsaufteilung aus 02/06 laufen davon
       unberührt weiter (tests/test_economics_persistence.py)."
    - "Der Bilanzneustart verlangt confirm=true, ist atomar (ein
       fehlgeschlagener Speicherversuch lässt den In-Memory-Zustand
       vollständig unverändert), initialisiert den Anfangsbestand neu und
       lässt alle Energie-/Herkunftszähler unangetastet
       (tests/test_coordinator.py, tests/test_init.py)."
    - "Diagnostics enthalten Status, Store-Zustand, Preisabdeckungszähler
       und - nur bei dynamischem Tarif - die Sensor-Entity-ID, aber keine
       neue identifizierende Information (tests/test_diagnostics.py)."
    - "services.yaml, strings.json, translations/de.json,
       translations/en.json, README.md, DEVELOPMENT.md und
       anforderung.yaml sind aktualisiert."

# ==============================================================================
# ANFORDERUNG: DASHBOARD-TAB UND END-TO-END-DOKUMENTATION DER WIRTSCHAFTLICHKEIT
# ==============================================================================
requirement_economics_dashboard:
  id: REQ-ECONOMICS-DASHBOARD
  title: "Eigener Dashboard-Tab \"Wirtschaftlichkeit\" sowie End-to-End-Dokumentation der gesamten Feature-Reihe"
  status: done
  description: >
    Schließt die sechsteilige Wirtschaftlichkeits-Reihe (01/06 bis 06/06)
    mit einem eigenen Dashboard-Tab und vollständiger Nutzerdokumentation
    ab, ohne selbst neue Berechnungen einzuführen. Keine Zahl darf durch
    fehlende Daten wie ein belastbarer Gewinn aussehen - der Tab zeigt
    deshalb zuerst Datenqualität, erst danach Geldwerte.

    Fünfter View (dashboard.async_build_dashboard_config), direkt nach
    "Dynamisches Laden": Titel "Wirtschaftlichkeit", Pfad
    `wirtschaftlichkeit`, Icon `mdi:cash-chart`, exakt fünf Top-Level-
    Karten. Ausschließlich Home-Assistant-Core-Kartentypen (entities,
    gauge, markdown, vertical-stack, conditional, statistics-graph) - keine
    Custom-Card-Abhängigkeit, dieselbe `_entity_id`/Entity-Registry-
    Auflösung wie die vier bestehenden Tabs. `async_build_dashboard_config`
    braucht dafür ausschließlich `hass`/`entry_id`, keine Config-Entry-
    Options: Karte 4 entscheidet ihre Sichtbarkeit zur Laufzeit über eine
    Core-"conditional"-Karte (siehe dort) statt über eine zum Build-
    Zeitpunkt gelesene Option, die nach einer späteren Options-Änderung
    veraltet wäre, ohne dass das gespeicherte Dashboard je neu gebaut wird.

    - Karte 1 "Status und Preise" (eine entities-Karte, feste
      Reihenfolge): economics_status, economics_current_import_price,
      economics_feed_in_price, energy_origin_coverage, danach drei neue
      "attribute"-Kartenzeilen (`_attribute_row`) auf economics_status:
      charge_price_coverage_percent_today,
      discharge_price_coverage_percent_today ("Preisabdeckungen für
      Laden/Entladen heute" - haben keinen eigenen Sensor, siehe
      REQ-ECONOMICS-OBSERVABILITY; bewusst die Tageswerte, weil genau sie
      den darüber stehenden Status bestimmen) sowie
      economics_started_at ("Beginn der Bilanz"). Bei deaktiviertem Tarif
      bleibt economics_status sichtbar und erklärt über seine eigene
      Zustandsübersetzung (`disabled`), dass die Konfiguration unter
      "Geräte & Dienste -> SAX Power Home -> Konfigurieren" erfolgt.
    - Karte 2 "Herkunft der Ladeenergie": ein `_stack_card`
      (vertical-stack) aus der entities-Karte (energy_charged_from_pv,
      energy_charged_from_grid, energy_charged_origin_unknown,
      energy_charged, energy_discharged) plus einer `markdown`-Karte mit
      dem Hinweis, dass die Herkunftsaufteilung eine konservative
      Schätzung am Netzanschlusspunkt ist (REQ-ENERGY-ORIGIN), keine
      physikalische Einzelstromverfolgung - als Teil derselben Karte, nicht
      als zusätzliche eigenständige Karte (bliebe sonst bei fünf Karten
      im View, aber sechs Kartenobjekten). Der Hinweis fehlt, wenn keine
      der Herkunfts-Entities registriert ist.
    - Karte 3 "Operative Geldbilanz": economics_avoided_grid_cost,
      economics_grid_charge_cost, economics_pv_opportunity_cost,
      economics_operating_result, economics_unpriced_charge,
      economics_unpriced_discharge - Kosten/Nutzen bleiben durch die
      Reihenfolge (zuerst der Nutzen, dann die beiden Kostenarten) und die
      Sensor-Übersetzungen eindeutig unterscheidbar; der Entity-Name
      bleibt "Operatives Ergebnis", kein Wort wie "Gewinn".
    - Karte 4 "Investition und Amortisation": EINE gemeinsame Karte
      (`_stack_card`, vertical-stack) in genau der geforderten Reihenfolge
      - eine entities-Zeile mit economics_roi, dann die Fortschritts-Gauge
      (economics_amortization_progress, 0..100, needle, segments rot/gelb/
      grün bei 0/50/100), dann eine zweite entities-Karte mit
      economics_remaining_to_payback, economics_result_today,
      economics_average_daily_result_30d,
      economics_projected_annual_result, economics_estimated_payback_date.
      Diese sieben Sensoren sind - anders als optional erst zur Laufzeit
      erschienene Entities anderer Tabs - immer bereits statisch
      registriert (SENSOR_DESCRIPTIONS, siehe REQ-ECONOMICS-AMORTIZATION),
      unabhängig von konfigurierten Investitionskosten; ohne konfigurierte
      Investitionskosten liefern alle sieben `None` (Sensorzustand
      "unknown"). Die ganze vertical-stack ist deshalb in eine Core-
      "conditional"-Karte eingebettet statt an eine zum Build-Zeitpunkt
      gelesene Config-Entry-Option gekoppelt zu sein: eine reine Registry-
      Prüfung wie bei den übrigen Karten würde die Karte hier immer mit
      lauter "unbekannt"-Zeilen zeigen, und eine Options-Prüfung beim
      Dashboardbau bliebe nach einer späteren Options-Änderung veraltet, da
      `__init__.async_update_options` das gespeicherte Dashboard nie neu
      baut (nur den Coordinator aktualisiert). Die "conditional"-Karte
      blendet sich dagegen automatisch ein/aus, sobald der Coordinator
      nach einer Options-Änderung neu rechnet und der zugrunde liegende
      Zustand wechselt - ganz ohne Dashboard-Neubau.

      Das Gate ist bewusst NICHT an economics_roi selbst gekoppelt: dessen
      Sensorzustand wird laut REQ-ECONOMICS-AMORTIZATION auch bei
      deaktiviertem Tarif oder noch nicht initialisierter Geldbilanz
      "unknown", obwohl Investitionskosten konfiguriert sind und die
      historische 30-Tage-Prognose davon unberührt weiter veröffentlicht
      wird - eine Kopplung an economics_roi würde die Karte in diesen
      Fällen fälschlich mit ausblenden. Stattdessen hängt die Karte am
      `unavailable_reason`-Attribut von economics_average_daily_result_30d
      (`conditions: [{entity: <economics_average_daily_result_30d-Entity-
      ID>, attribute: "unavailable_reason", state_not:
      "no_investment_cost"}]`), das ausschließlich bei fehlenden
      Investitionskosten auf `ForecastUnavailable.NO_INVESTMENT_COST`
      gesetzt wird, unabhängig von Tarifstatus oder Bilanz-
      Initialisierung.
    - Karte 5 "Verlauf (30 Tage)" (`_statistics_graph_card`): Core-
      `statistics-graph` als Balkendiagramm (`chart_type: bar`),
      `stat_types: ["change"]`, `period: "day"`, `days_to_show: 30`, für
      economics_operating_result, economics_avoided_grid_cost,
      economics_grid_charge_cost, economics_pv_opportunity_cost. `change`
      ist für `state_class: total`-Sensoren eine unterstützte
      Langzeitstatistik-Kennzahl; eine künftig fehlende Unterstützung
      wäre über die dedizierten Tages-Sensoren aus REQ-ECONOMICS-
      AMORTIZATION aufzufangen, nie über eine private Statistik-API oder
      einen nicht unterstützten Kartentyp.

    Bestehendes Verhalten unverändert: async_create_dashboard bleibt
    idempotent und überschreibt kein vorhandenes Nutzer-Dashboard; nur
    sax_power.reinstall_dashboard ersetzt ein bestehendes Dashboard (jetzt
    inklusive des neuen Tabs); ein Fehler beim Dashboardbau blockiert
    niemals Setup oder Integration (unverändertes try/except in
    async_create_dashboard); fehlende optionale Entities werden über
    dieselbe `_entities_card`-/`_gauge_card`-/`_statistics_graph_card`-
    Filterlogik wie in den bestehenden vier Tabs still ausgelassen - keine
    leeren Karten.

    Dokumentation: README.md ergänzt einen Abschnitt "Datenqualität,
    Diagnose und Bilanzneustart" (bereits in 05/06 angelegt) sowie einen
    neuen Abschnitt zum Dashboard-Tab; die drei Tarifarten sind bereits im
    Abschnitt "Tarifmodell für die Wirtschaftlichkeit" mit Formeln/
    Grenzen dokumentiert. DEVELOPMENT.md erhält einen Abschnitt zum neuen
    View sowie eine Ergänzung von REQ-BUNDLED-DASHBOARD (jetzt fünf statt
    vier Tabs). strings.json/translations sind unverändert, da der
    Dashboard-Tab ausschließlich bereits übersetzte Entities referenziert.
  acceptance_criteria:
    - "View-Reihenfolge (fünfter Tab), Titel/Pfad/Icon sowie die exakte
       Karten-/Entity-Reihenfolge aller fünf Karten sind regression-
       getestet (tests/test_dashboard.py)."
    - "Deaktivierter Tarif, aktiv ohne Investitionssumme, aktiv mit
       Investitionssumme und teilweise fehlende Entities erzeugen
       durchweg einen nicht-leeren, nutzbaren View."
    - "Die Verlaufskarte ist eine Core-statistics-graph-Karte mit
       stat_types [change], chart_type bar, period day, 30 Tagen - keine
       Custom-Card, keine private Statistik-API."
    - "async_build_dashboard_config bleibt ohne jede registrierte Entity
       fehlerfrei (leerer, aber vorhandener View); async_create_dashboard
       bleibt idempotent, sax_power.reinstall_dashboard ersetzt
       deterministisch inklusive des neuen Tabs
       (tests/test_dashboard.py)."
    - "Ein vollständiger End-to-End-Test führt je einen PV-Lade-, Netzlade-
       und Entladeabschnitt über Tarifauflösung -> Herkunft ->
       Geldsensoren -> Dashboard-Entityauflösung
       (tests/test_economics_dashboard_e2e.py)."
    - "README.md, DEVELOPMENT.md und anforderung.yaml sind aktualisiert."
