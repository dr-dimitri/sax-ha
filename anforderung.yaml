requirement_economics_amortization:
  id: REQ-ECONOMICS-AMORTIZATION
  title: "ROI und aktueller Amortisationsstand aus Investitionskosten und Netto-Ersparnis (03/06)"
  status: done
  description: >
    Baut ausschließlich auf dem bereits bilanzierten, signierten
    Nettoergebnis (REQ-ECONOMICS-ACCOUNTING) auf - ohne eigene Preis- oder
    Energieherkunftslogik. Optionale, tarifunabhängige Investitionskosten
    (economics_investment_cost_eur, 0,01 bis 1.000.000 EUR, Schrittweite
    0,01) schalten die vier Amortisationssensoren frei. Leer oder ungültig
    liefert für ROI, Fortschritt, Restbetrag und Netto-Ersparnis heute None,
    während die übrige Wirtschaftlichkeitsbilanz weiterläuft. Ein
    Tarifwechsel löscht die Investitionskosten nicht.

    Der ebenfalls optionale Vorlauf-Ertrag economics_prior_result_eur (0 bis
    1.000.000 EUR, Schrittweite 0,01) berücksichtigt einen schon vor Beginn
    dieser Integration erwirtschafteten Betrag. Er wirkt ausschließlich auf
    ROI, Fortschritt und Restbetrag, niemals auf economics_net_savings,
    economics_operating_result oder economics_net_savings_today. Damit erzeugt
    die manuelle Eingabe keinen künstlichen Zuwachs in Recorder-Auswertungen.
    Ohne laufende Bilanz bleiben auch mit Vorlauf alle Amortisationswerte
    unbekannt.

    Reine Formeln (domain/economics_amortization.py; operating_result_eur ist
    die gemessene Netto-Ersparnis zuzüglich Vorlauf):

    ```
    roi_percent = operating_result_eur / investment_cost_eur * 100
    amortization_progress_percent = clamp(roi_percent, 0, 100)
    remaining_to_payback_eur = max(investment_cost_eur - operating_result_eur, 0)
    ```

    SaxPowerCoordinator._publish_amortization veröffentlicht ROI und Fortschritt
    mit zwei Nachkommastellen, den Restbetrag mit zwei Nachkommastellen und
    economics_net_savings_today intern weiterhin mit vier Nachkommastellen.
    Die Entity-Beschreibung zeigt Währungswerte mit zwei Nachkommastellen an;
    die interne Rechen- und Recorder-Genauigkeit bleibt unverändert.

    economics_net_savings_today ist ein zyklisch zurückgesetzter monetary-
    total-Sensor und führt das signierte Tagesdelta der drei Geldsummen. Sein
    last_reset ist der späteste Zeitpunkt aus lokalem
    Tagesbeginn, economics_started_at und last_restart_at. Eine Tarifpause
    blendet die vier aktuellen Werte auf None aus, lässt interne Summen und
    Reset-Zeitpunkt aber unverändert weiterbestehen.

    Es gibt keine Hochrechnung einer künftigen Amortisation mehr.
    economics_average_daily_result_30d, economics_projected_annual_result und
    economics_estimated_payback_date werden nicht mehr als Entities
    registriert; compute_amortization_forecast und seine Coordinator-
    Veröffentlichung entfallen. Bestehende Tages-Buckets und das historische
    Store-Feld payback_achieved_at werden ausschließlich zur abwärtskompatiblen
    Persistenz alter Stores beibehalten und weder fortgeschrieben noch
    veröffentlicht.

    Der ROI-Sensor veröffentlicht prior_result_eur und
    measured_operating_result_eur als Attribute. Dadurch bleibt die Differenz
    zwischen dem um den Vorlauf erhöhten ROI und der rein gemessenen
    Netto-Ersparnis nachvollziehbar.
  acceptance_criteria:
    - "ROI bleibt unklemmt; der Fortschritt wird auf 0..100 begrenzt und der
       Restbetrag bei 0 gefloort. Fehlende Investitionskosten oder Bilanzwerte
       liefern None. Ein negatives Nettoergebnis ergibt einen negativen ROI
       und Fortschritt 0."
    - "Der Vorlauf verschiebt ausschließlich ROI, Fortschritt und Restbetrag;
       economics_net_savings und economics_net_savings_today bleiben reine
       Messwerte."
    - "Die drei früheren Prognose-Entities, ihre Übersetzungen und ihre
       Berechnung sind entfernt."
    - "Netto-Ersparnis und Netto-Ersparnis heute behalten intern vier
       Nachkommastellen, schlagen Home Assistant für die Anzeige aber zwei
       Nachkommastellen vor."
    - "Das Vorlauf-Attribut prior_result_eur bleibt numerisch. Eine separate
       Anzeigeform wird im Dashboard mit exakt zwei Nachkommastellen und dem
       Suffix € ausgegeben."
    - "Tests decken Formeln, Tarifpause, Reset-Zeitpunkt, entfernte
       Prognose-Entities und Anzeigepräzision ab."
requirement_economics_observability:
  id: REQ-ECONOMICS-OBSERVABILITY
  title: "Datenqualitäts-Statussensor, Diagnose, Preisausfall-Repair und kontrollierter Bilanzneustart"
  status: done
  description: >
    Eine Geldzahl ohne Aussage zur Datenqualität ist irreführend - dieser
    Block macht sichtbar, ob und warum die Wirtschaftlichkeitsbilanz
    (REQ-ECONOMICS-ACCOUNTING/-AMORTIZATION) gerade vertrauenswürdig ist,
    ohne selbst neue Geldwerte zu berechnen.

    Read-only Enum-Sensor `economics_status`
    (domain.economics_status.EconomicsStatus) mit sechs stabilen
    Zuständen. Priorität bei gleichzeitig zutreffenden Problemen (höchste
    zuerst, domain.economics_status.compute_economics_status):
    `disabled` (ausschließlich bei deaktiviertem Tarif, schlägt dabei jeden
    anderen Zustand) > `storage_error` > `price_unavailable` >
    `origin_unavailable` > `partial_price_coverage` >
    `active`. Attribute: `reason` (redundant zum Sensorzustand),
    `tariff_type`, `price_sensor_entity_id` (nur bei dynamischem Tarif -
    eine Entity-ID ist keine identifizierende Information),
    `economics_started_at`/`last_tariff_revision_at`/
    `last_successful_quote_at` (UTC ISO), aktuelle Import-/
    Einspeisevergütung, kumulierte bepreiste/unbepreiste Lade-/
    Entlade-kWh sowie `charge_price_coverage_percent`/
    `discharge_price_coverage_percent` (kumuliert seit
    economics_started_at), die zustandsbestimmenden Tageswerte
    `charge_price_coverage_percent_today`/
    `discharge_price_coverage_percent_today` (siehe unten). Kurze
    lokalisierte Erklärungen kommen über die Entity-Übersetzung der
    Sensorzustände (strings.json, `entity.sensor.economics_status.state`),
    nicht über ein zusätzliches Freitextattribut.

    `last_successful_quote_at` bezeichnet den ersten erfolgreichen Preis
    der laufenden ununterbrochenen Verfügbarkeitsphase. Weitere gültige Preise
    erneuern den Zeitstempel nicht. Während einer Preislücke bleibt der letzte
    erfolgreiche Zeitpunkt sichtbar; bei Wiederherstellung wird er einmalig
    erneuert. Auch eine bewusste Tarifpause beendet die Phase. Kurze Lücken
    unterhalb der Repair-Karenzzeit und unvollständige Tarife werden dabei
    berücksichtigt. tests/test_recorder_churn.py prüft diese Übergänge und
    unveränderte Zustände bei konstantem Festpreis.

    Preisabdeckung (domain.economics_status.compute_price_coverage_percent,
    reine Funktion): energiebasiert, nicht tickbasiert - bepreiste kWh
    geteilt durch (bepreiste + unbepreiste) kWh, bei Nenner 0 (noch keine
    relevante Energie) 100 %. Braucht dafür zwei neue, seit
    economics_started_at kumulierte Lifetime-Zähler
    (`SaxPowerCoordinator._economics_priced_charge_kwh`/
    `_economics_priced_discharge_kwh`, aus denselben
    `EconomicsDelta.priced_charge_kwh_delta`/`priced_discharge_kwh_delta`
    wie die Tages-Buckets aus 04/06) - Gegenstück zu den bestehenden
    `unpriced_charge_kwh`/`unpriced_discharge_kwh`.

    `partial_price_coverage` bewertet ausdrücklich NUR den laufenden
    Kalendertag: Auslöser sind die aus den Tages-Buckets von
    REQ-ECONOMICS-AMORTIZATION gebildeten
    `charge_price_coverage_percent_today`/
    `discharge_price_coverage_percent_today` (keine zusätzlichen Zähler),
    und zwar erst, wenn die Lücke einer Seite sowohl absolut als auch
    relativ ins Gewicht fällt (domain.economics_status.
    is_price_coverage_partial): mindestens
    MIN_UNPRICED_KWH_FOR_PARTIAL (0,5 kWh) unbepreist UND unterhalb von
    PRICE_COVERAGE_THRESHOLD_PERCENT (95 %, analog zu
    DAY_COVERAGE_THRESHOLD_PERCENT) - nicht schon bei exakt < 100 %. Die
    relative Schwelle allein genügt nicht: kurz nach Mitternacht ist der
    Tagesbucket leer, ein einziges unbepreistes Intervall von 0,01 kWh
    stünde dort auf 0 % Abdeckung und die Warnung bliebe den ganzen Tag
    stehen. Aus
    den Lifetime-Quoten abgeleitet (und ohne Toleranz) kippte eine
    EINZIGE unbepreiste Kilowattstunde den Sensor dauerhaft und
    unwiderruflich: solche kWh sind im Normalbetrieb unvermeidbar (der
    erste Coordinator-Tick nach einem Neustart läuft oft, bevor die
    Preis-Integration ihre Entity angelegt hat; dazu jede kurze
    Tarifpause), Lifetime-Zähler
    gehen nie zurück, und der einzige Ausweg wäre der Bilanzneustart, der
    zugleich die gesamte Geldbilanz verwirft. Ein dauerhaft anliegender
    Warnzustand wird ignoriert - der Sensor verlöre damit genau die
    Aussage, für die er gebaut ist (Issue #134). Die kumulierten
    Lifetime-Quoten bleiben als Attribute erhalten (Langzeitinformation),
    sind aber kein Zustandsauslöser mehr. Entladung aus dem unbewerteten
    Bestand (REQ-ECONOMICS-ACCOUNTING) ist bewusst nicht erfasst: sie ist
    weder bepreiste noch unbepreiste Entladung, die zugehörige Lücke wird
    an dem Tag gemeldet, an dem die nicht bepreisbare LADUNG stattfand
    (dort entsteht sie und dort ist sie behebbar), und ein späterer Tag,
    an dem dieser Bestand entladen wird, ist rechnerisch einwandfrei -
    sein Ergebnis ist korrekt 0 EUR, nicht unbekannt.
    Ein Attribut `origin_coverage_percent` gibt es nicht mehr: Seit dem
    Wegfall der Kategorie "Herkunft unbekannt" (02/06) wäre es konstant
    100 %. `origin_unavailable` ist wahr, wenn
    `SaxPowerCoordinator._energy_origin_initialized()` falsch liefert (die
    Herkunftszählung wurde nie initialisiert, z. B. nach einem
    Energiezähler-Store-Ladefehler) - unabhängig davon, ob die
    Geldbilanz selbst weiterläuft.

    Preisausfall-Erkennung
    (SaxPowerCoordinator._update_economics_price_availability, läuft nur
    solange der Tarif aktiv ist): verfolgt monotonic, seit wann
    ununterbrochen kein gültiger Netzbezugspreis mehr vorlag.
    QuoteUnavailable.TARIFF_INCOMPLETE (ein ungültig gespeicherter Fest-/
    Zeitfenstertarif - fehlender Pflichtpreis, kaputte Zeitfenstergruppe)
    ist ein sofortiger Konfigurationsfehler ohne Karenzzeit; jeder andere
    Grund (typischerweise ein transienter Ausfall des dynamischen
    Preis-Sensors) braucht ECONOMICS_PRICE_UNAVAILABLE_GRACE_PERIOD (6h,
    wie PRICE_SENSOR_MISSING_GRACE_PERIOD beim preisoptimierten Laden).
    Das daraus abgeleitete `_economics_price_unavailable`-Flag ist
    sowohl für den Status-Sensor als auch für das Repair-Issue
    `economics_price_unavailable` (rein informativ, is_fixable=False,
    Zustandsflanke wie bei den sechs bestehenden Selbstdiagnose-Issues aus
    REQ-SELF-DIAGNOSIS-REPAIRS) die alleinige Quelle - keine doppelte
    Karenzzeit-Logik. Die gemeinsame Issue-Verwaltung
    (`SelfDiagnostics._sync_issue`) prüft beim Löschen zusätzlich zu den
    lokal gemerkten aktiven Issue-IDs den tatsächlichen Issue-Registry-Zustand.
    Die lokale Menge lebt nur im Arbeitsspeicher der jeweiligen
    SelfDiagnostics-Instanz und ist nach jedem Neuladen wieder leer - ein
    zuvor angelegtes, in der Registry aber weiterhin vorhandenes Issue
    würde sonst nach einem Reload nie gelöscht, selbst wenn der Preis
    inzwischen wieder gültig ist.

    Speicherfehler (`SaxPowerCoordinator._economics_store_write_blocked`,
    gesetzt sowohl bei einem Ladefehler als auch bei einem abgelehnten oder
    fehlgeschlagenen Schreibversuch des Wirtschaftlichkeits-Stores):
    `_async_schedule_economics_save`/`_async_flush_economics_state` prüfen
    den Rückgabewert von `async_delay_save`/`async_save` und setzen das
    Flag, sobald `_accept()`/`_valid_snapshot()` einen Snapshot ablehnt.
    Ein tatsächlicher Schreibfehler ist damit allein noch nicht erkennbar:
    Home Assistants `Store` fängt eine echte `WriteError`/
    `SerializationError` intern ab und kehrt regulär zurück
    (`Store._async_handle_write_data`), ohne sie an den Aufrufer
    weiterzureichen - weder `Store.async_save()` noch der über
    `Store.async_delay_save()` verzögerte Pfad melden einen solchen Fehler
    zurück. `EconomicsStateStore` verzichtet deshalb bewusst auf
    `Store.async_delay_save()` und verwaltet die Verzögerung selbst
    (`async_call_later`, mit einem `EVENT_HOMEASSISTANT_FINAL_WRITE`-
    Sicherheitsnetz analog zu `Store._async_ensure_final_write_listener`):
    `_write_and_verify` liest nach jedem Schreibversuch den soeben
    geschriebenen Schlüssel über die öffentliche `Store.async_load()`-API
    zurück und vergleicht ihn mit den beabsichtigten Daten - eine
    schweigend verschluckte `WriteError` lässt die Datei unverändert und
    wird dadurch als Abweichung sichtbar. Für den sofortigen Pfad
    (`async_save`/`async_reset`) fließt das Ergebnis in den normalen
    Rückgabewert ein (`async_restart_economics_accounting` meldet einen
    dadurch erkannten stillen Fehlschlag deshalb korrekt als
    `HomeAssistantError`, statt fälschlich Erfolg zu melden); für den
    zeitversetzten Pfad, der keinen wartenden Aufrufer mehr hat, über den
    optionalen `on_persist_failed`-Callback
    (`SaxPowerCoordinator._on_economics_persist_failed`). Die gesamte
    save-then-load-Sequenz aus `_write_and_verify` läuft dabei unter einem
    pro `EconomicsStateStore`-Instanz gehaltenen `asyncio.Lock`
    (`_write_lock`): `Store.async_save()` überschreibt
    `Store._data` sofort, unabhängig von einem eventuell noch laufenden
    anderen Schreibvorgang (nur die eigentliche Schreib-E/A ist über
    `Store._write_lock` serialisiert) - ein zweiter, überlappender
    Schreibversuch (z. B. ein bereits laufender verzögerter Write parallel
    zu `async_reset()`/dem Shutdown-Flush) könnte sonst zwischen den
    Save- und den Load-Aufruf des ersten geraten und dessen
    `Store.async_load()` fälschlich die eigenen, noch ausstehenden Daten
    statt der soeben geschriebenen zurückgeben lassen - der erste,
    tatsächlich erfolgreiche Write würde dann fälschlich als
    Schreibfehler gemeldet. In beiden Fällen
    identisch: Status `storage_error`, UND - Abweichung von
    REQ-ECONOMICS-ACCOUNTING -
    `_bootstrap_economics_if_ready` bootstrapped in diesem Fall NICHT mehr
    frisch im Arbeitsspeicher, `_accumulate_economics` akkumuliert keine
    weiteren Deltas mehr auf eine ungesicherte Baseline. Vorher (03/06)
    lief die Bilanz bei einem unlesbaren Store noch normal im
    Arbeitsspeicher weiter; das barg das Risiko, beliebig viel
    unsicherbaren Fortschritt zu verlieren. Die Energiezähler und die
    Herkunftsaufteilung aus 02/06 laufen davon unberührt weiter.

    Home Assistants Store behandelt syntaktisch beschädigtes JSON speziell:
    Core benennt die Datei in `<path>.corrupt.<timestamp>` um, legt ein
    Repair an und gibt None zurück. EconomicsStateStore prüft deshalb vor
    dem öffentlichen Store.async_load asynchron im Executor sowohl den
    kanonischen Pfad als auch passende Korrupt-Backups und prüft nach einem
    None erneut. None gilt nur ohne jede vorherige oder aktuelle Datei als
    Neuinstallation. Andernfalls wird EconomicsStoreLoadError ausgelöst und
    der Store read-only gesetzt; der Coordinator wechselt in storage_error,
    plant keinen Save und bleibt auch beim zweiten Reload eingefroren. Ein
    bewusst zurückgespielter gültiger kanonischer Store lädt trotz eines
    verbleibenden Korrupt-Backups normal. Wiederherstellungsweg ist das
    Zurückspielen eines gültigen Backups; bloßes Reload ist weder Reparatur
    noch Zustimmung zu einer Nullbilanz (Issue #150).

    Diagnostics (diagnostics.py, Schlüssel "economics"): zusätzlich zu den
    bereits vorhandenen Rohsummen/Zeitstempeln jetzt auch `status`,
    `store_write_blocked`, `store_minor_version`, `priced_charge_kwh`/
    `priced_discharge_kwh` und `price_unavailable`/
    `last_successful_quote_at`. Schlüssel "tariff"
    (SaxTariffProvider.diagnostics) zusätzlich um `price_sensor_entity_id`
    ergänzt. Bestehende Redaction-Regeln (TO_REDACT, nur der Host) bleiben
    unverändert.

    Kontrollierter Bilanzneustart: neue Action
    `sax_power.restart_economics_accounting`
    (SaxPowerCoordinator.async_restart_economics_accounting). Pflichtfeld
    `device_id`; Pflichtfeld `confirm`, muss exakt `true` sein
    (`_require_confirm_true` in __init__.py, eine fehlende oder
    falsch geschriebene Bestätigung darf niemals als Zustimmung gelten);
    optionales `reason` (Freitext, höchstens
    MAX_ECONOMICS_RESTART_REASON_LENGTH = 120 Zeichen), rein diagnostisch:
    wird zusammen mit dem UTC-Zeitpunkt dieses Neustarts persistiert
    (`EconomicsState.last_restart_at`/`last_restart_reason`, unabhängig
    vom Sieben-Felder-Bündel) und im Diagnose-Download angezeigt -
    beeinflusst keine Berechnung. Lehnt mit ServiceValidationError ab, wenn der Tarif
    deaktiviert ist oder die Bilanz noch nie initialisiert wurde. Setzt
    AUSSCHLIESSLICH zurück: die drei Economics-Geldsummen, den
    den historischen Diagnose-Peak, die vier Preisabdeckungszähler
    (priced_*/unpriced_*), die Tages-Buckets (day_results und current_day
    einschließlich seiner Zähler), den Aktivierungs-/Revisionszeitpunkt
    (neu auf jetzt) und einen bereits erreichten
    Payback-Zeitpunkt (auf None) - setzt den unbewerteten Bestand dabei wie
    beim erstmaligen Aktivieren auf 0. Alle fünf kumulativen Geldsensoren
    melden diesen neuen Aktivierungszeitpunkt über den gemeinsamen
    Coordinator-Schlüssel economics_balance_last_reset als last_reset, damit
    ihre kontrollierten Rücksprünge auf 0 keine falschen Recorder-Änderungen
    erzeugen. Normale Preis- und Ergebnisbewegungen sowie ein Reload
    verändern diesen Zeitpunkt nicht.
    economics_net_savings_last_reset bleibt als kompatibler Alias erhalten
    (Issue #151).
    Rührt NIEMALS `energy_charged`/`energy_discharged` oder die
    Herkunftszähler aus REQ-ENERGY-ORIGIN an - keine
    `total_increasing`-Entity darf durch diesen Service zurückspringen.
    Speichert atomar über EconomicsStateStore.async_reset (bypasst
    bewusst die sonst geltende Monotonie-/Unveränderlichkeits-Baseline aus
    _accept, prüft aber weiterhin Endlichkeit/Wertebereich) VOR jeder
    In-Memory-Änderung: schlägt das Speichern fehl, bleibt der bisherige
    Zustand vollständig und unverändert bestehen (kein halb angewendeter
    Neustart). Während der asynchronen Reset-Persistierung dürfen normale
    Polls die bisherige Bilanz weiterhin fortschreiben. Erst der erfolgreich
    geschriebene und zurückgelesene Reset verwirft unter dem Store-Lock alle
    ausstehenden Altstände und ihre Timer; bei Fehlschlag bleiben auch die
    zwischenzeitlich hinzugekommenen Beträge und deren geplante Persistierung
    erhalten. Ein verzögerter Write entnimmt seinen Snapshot erst unter
    demselben Lock. Bereits wartende Sofort-Writes, etwa der Shutdown-Flush,
    tragen die beim Aufruf erfasste Bilanzgeneration: Nach einem erfolgreichen
    Reset werden Writes der alten Generation ohne Speicherfehler übersprungen.
    Ein bereits laufender Alt-Write endet vor dem Reset. Ein eigener
    Coordinator-Lock serialisiert mehrere Reset-Aufrufe einschließlich ihrer
    Snapshot-Erfassung und der anschließenden synchronen In-Memory-Umstellung;
    Modbus-Polls und Ladeentscheidungen warten nicht auf Reset-Dateizugriffe
    (Issue #168). Keine rückwirkende Neuberechnung und kein automatischer
    Reset bei einer späteren Tarif-/Investitionsänderung - das gilt
    unverändert weiter.

    Persistenz: EconomicsStateStore um STORAGE_MINOR_VERSION 3 erweitert
    (statt einer Hauptversion, aus demselben Grund wie bei 04/06).
    `priced_charge_kwh`/`priced_discharge_kwh` sind wie
    `unpriced_charge_kwh`/`unpriced_discharge_kwh` echte monotone Summen,
    unabhängig vom Sieben-Felder-Bündel aus 03/06 - ein Store aus der Zeit
    davor kennt sie noch nicht und beginnt ihre Zählung transparent bei 0
    ab jetzt (analog zur Herkunftszählung aus REQ-ENERGY-ORIGIN).

    Der Status wird im Amortisations-Tab nach
    REQ-VUE-SAVINGS verständlich eingeordnet; einen eigenen
    technischen Wirtschaftlichkeits-Tab gibt es nicht.
  acceptance_criteria:
    - "Jeder der sechs Status ist einzeln erreichbar; kombinierte,
       gleichzeitig zutreffende Probleme ergeben genau den einen Status
       mit der höchsten Priorität (tests/test_economics_status.py,
       tests/test_coordinator.py)."
    - "Preisabdeckung ist energiebasiert (nicht tickbasiert), bleibt bei
       Nenner 0 bei 100 % und wird intern aus ungerundeten Zählern
       gebildet, erst beim Veröffentlichen gerundet."
    - "partial_price_coverage entsteht ausschließlich aus der Abdeckung
       des laufenden Kalendertages und erst, wenn die Lücke absolut
       (MIN_UNPRICED_KWH_FOR_PARTIAL) UND relativ
       (PRICE_COVERAGE_THRESHOLD_PERCENT) ins Gewicht fällt: eine
       einzelne unbepreiste Kilowattstunde lässt den Status auf active -
       auch im noch leeren Tagesbucket kurz nach Mitternacht -, und ein
       Tag mit echter Lücke kehrt am Folgetag ohne Bilanzneustart auf
       active zurück, während die Lifetime-Quote als Attribut sichtbar
       niedriger bleibt (Issue #134, tests/test_economics_status.py,
       tests/test_coordinator.py)."
    - "Ein ungültig gespeicherter Fest-/Zeitfenstertarif löst
       price_unavailable sofort aus; ein transienter Ausfall des
       dynamischen Preis-Sensors erst nach
       ECONOMICS_PRICE_UNAVAILABLE_GRACE_PERIOD (6h)."
    - "Das Repair-Issue economics_price_unavailable entsteht/löscht sich
       auf der jeweiligen Zustandsflanke, ohne bei unverändertem
       Problemzustand erneut angelegt zu werden
       (tests/test_repairs.py)."
    - "Ein Store-Ladefehler verhindert sowohl einen frischen 0-Bootstrap
       im Arbeitsspeicher als auch jede weitere Akkumulation - die
       Energiezähler/Herkunftsaufteilung aus 02/06 laufen davon
       unberührt weiter (tests/test_economics_persistence.py)."
    - "Der Bilanzneustart verlangt confirm=true, ist atomar (ein
       fehlgeschlagener Speicherversuch lässt den In-Memory-Zustand
       vollständig unverändert), setzt den unbewerteten Bestand auf 0 und
       lässt alle Energie-/Herkunftszähler unangetastet
       (tests/test_coordinator.py, tests/test_init.py)."
    - "Ein Poll während Reset-Datei-I/O darf weder storage_error auslösen
       noch den erfolgreichen Reset später durch einen alten Timer-/Flush-
       Snapshot ersetzen. Bereits laufende Writes und zwei parallele
       Reset-Aufrufe sind serialisiert; ein fehlgeschlagener Reset erhält
       den währenddessen gewachsenen Altstand samt verzögerter Persistierung
       (tests/test_economics_persistence.py, Issue #168)."
    - "Alle fünf kumulativen Geldsensoren verwenden denselben persistierten
       Bilanzbeginn als last_reset. Ein echter Recorder-Test weist für alle
       vier Rohsummen nach, dass auch ein Neustart nach negativem operativem
       Ergebnis keinen falschen Geldsprung erzeugt
       (tests/test_economics_recorder.py, Issue #151)."
    - "Diagnostics enthalten Status, Store-Zustand, Preisabdeckungszähler
       und - nur bei dynamischem Tarif - die Sensor-Entity-ID, aber keine
       neue identifizierende Information (tests/test_diagnostics.py)."
    - "services.yaml, strings.json, translations/de.json,
       translations/en.json, README.md, DEVELOPMENT.md und
       anforderung.yaml sind aktualisiert."

