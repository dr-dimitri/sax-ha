# ==============================================================================
# HINWEIS FÜR KÜNFTIGE ÄNDERUNGEN AN DIESER DATEI
# ==============================================================================
# Diese Datei beschreibt ausschließlich den aktuellen Ist-Zustand der
# Anforderungen an die Integration und deren Umsetzung. Sie ist KEIN
# Änderungsprotokoll und keine Chronik:
#
#   - Kein "requested_by", keine Erzählung, wie/warum/durch wen eine
#     Anforderung entstanden ist (kein "Nutzer berichtete...", "Live-Test
#     ergab...", "frühere Version hatte fälschlich...").
#   - Keine Beschreibung vergangener Fehler, Debugging-Wege oder
#     verworfener Zwischenstände - nur das aktuell gültige Verhalten.
#   - Jeder requirement_*-Block enthält ausschließlich: id, title, status
#     (done/open/partially_done), description (reiner Ist-Zustand), sowie
#     bei Bedarf requirements/acceptance_criteria (aktuell gültige,
#     prüfbare Kriterien).
#   - Historie (wer/wann/warum eine Änderung vorgenommen wurde) gehört in
#     die Git-Historie (Commit-Nachrichten, Pull Requests), nicht hierher.
#
# Beim Hinzufügen neuer oder Ändern bestehender Anforderungen: überholte
# Formulierungen ERSETZEN statt ergänzen. Diese Datei bildet immer nur den
# aktuellen Zustand ab, nie den Weg dorthin.
# ==============================================================================

# ==============================================================================
# ARCHITEKTUR & HOME ASSISTANT STANDARDS
# ==============================================================================
# - Asynchrone Architektur: Sämtlicher I/O-Code läuft vollständig asynchron
#   (async/await) über pymodbus.client.AsyncModbusTcpClient.
# - Ein zentraler DataUpdateCoordinator (coordinator.py) bündelt alle Reads/
#   Writes; sämtliche Entitäten beziehen ihre Daten ausschließlich aus
#   coordinator.data (kein eigenes Polling einzelner Entitäten).
# - Einrichtung ausschließlich über den GUI-Config-Flow (config_flow.py):
#   IP-Adresse, Port (Default 502), Slave-ID Basic Mode (Default 64),
#   Slave-ID SunSpec-Modus (Default 100), Aktualisierungsintervall
#   (Default 10s); danach optional ein zweiter Schritt mit Vorbelegung für
#   das zeitgesteuerte Laden (siehe REQ-TIMED-SOC-CHARGE). Keine
#   YAML-Konfiguration.
# - Entitätstypen: Lese-Register -> SensorEntity (sensor.py); schreibbare
#   Leistungswerte/Limits -> NumberEntity (number.py); Schalter ->
#   SwitchEntity (switch.py); Zeitfenster -> TimeEntity (time.py).
# - Typisierung & Linting: durchgängige Type Hints (PEP 484), Konformität
#   mit Ruff/Black und PEP 8.
# - Fehlerbehandlung: ModbusException und asyncio.TimeoutError werden
#   abgefangen und auf UpdateFailed bzw. ConfigEntryNotReady gemappt.
# - Security: Transaktions- und Wertebereichsprüfung (Range Validation) vor
#   jedem Schreibzugriff.
#
# Ordnerstruktur:
#   .devcontainer/                DevContainer für lokale Entwicklung
#   custom_components/sax_power/
#     manifest.json                Metadaten, Requirements (pymodbus>=3.10.0), Domain
#     const.py                     Register-/Konfigurationskonstanten, Defaults
#     config_flow.py                GUI-Einrichtung + Reconfigure-Flow
#     coordinator.py                DataUpdateCoordinator: Reads, Writes, Software-Logik
#     entity.py                     Basisklasse mit gemeinsamer DeviceInfo
#     __init__.py                   Setup/Teardown des Config Entry, Services
#     sensor.py / number.py / switch.py / time.py   Plattformen
#     services.yaml                 Service-Schema für die UI
#     translations/                 DE/EN-Übersetzungen
#   tests/                         Testfälle (siehe README.md, Abschnitt Tests)
#
# ==============================================================================
# MODBUS-REGISTER & BERECHNUNGEN
# ==============================================================================
# - Basic Mode (Slave-ID 64): interne Registeradresse = Protokolladresse -
#   40001.
# - SunSpec-Modus (Slave-ID 100): interne Registeradresse = Protokolladresse
#   - 40000 (anderer Offset als Basic Mode).
# - SunSpec-Skalierung (sunssf): Wert * 10^sunssf (Exponent vorzeichen-
#   behaftet), siehe coordinator.apply_sunssf.
# - Die vollständige Registerzuordnung (Protokolladresse <-> interne Adresse
#   <-> Bedeutung) steht in modbus_llm.yaml, verifiziert gegen die
#   offizielle sax-power.net-Dokumentation modbus.pdf.
# - Periodische Sollwert-Writes werden wiederholt, solange der jeweilige
#   Mechanismus aktiv ist, da der Speicher einen nicht periodisch
#   aufgefrischten Sollwert nach einem Timeout verwirft: Basic-Mode-Netzladung
#   (start_grid_charge-Service, Register 41) alle 30s fest; zeitgesteuertes
#   Laden (SunSpec-Modus, Register 40049/40051) mit einem aus dem
#   geräteseitig gemeldeten Timeout (Register 40050) abgeleiteten Intervall
#   (die Hälfte des Timeouts, gedeckelt auf 30s, mindestens 5s).
#
# ==============================================================================
# ENTWICKLUNGSUMGEBUNG (DEVCONTAINER)
# ==============================================================================
# .devcontainer/devcontainer.json:
#
# {
#   "name": "Home Assistant Dev Environment",
#   "image": "mcr.microsoft.com/devcontainers/python:1-3.12-bullseye",
#   "customizations": {
#     "vscode": {
#       "extensions": [
#         "ms-python.python",
#         "ms-python.vscode-pylance",
#         "charliermarsh.ruff",
#         "ms-python.black-formatter",
#         "redhat.vscode-yaml"
#       ]
#     }
#   },
#   "postCreateCommand": "pip install homeassistant pytest-homeassistant-custom-component ruff black pymodbus",
#   "forwardPorts": [8123]
# }
#
# Im Container steht `hass -c config` bereit (lokale Home-Assistant-Instanz
# mit verlinkter Custom Component, Port 8123), außerdem pytest, ruff und
# black.

# ==============================================================================
# GIT-WORKFLOW
# ==============================================================================
# Änderungen werden nie direkt auf main vorgenommen, sondern immer auf einem
# eigenen Branch (Pull Request gegen main). Vor dem Erstellen eines neuen
# Branches wird main zuerst aktualisiert (git fetch/pull), damit der neue
# Branch auf dem aktuellen Stand basiert.

# ==============================================================================
# ANFORDERUNG: ALLE MODBUS-REGISTER LESBAR
# ==============================================================================
requirement_all_registers_readable:
  id: REQ-ALL-REGISTERS-READABLE
  title: "Alle Modbus-Register lesbar über Home Assistant + berechnete Phasensummen"
  status: done
  description: >
    Sämtliche in modbus_llm.yaml/modbus.pdf dokumentierten Register sind
    als Home Assistant Entity abrufbar: Basic Mode (Slave-ID 64) über
    sensor.py/number.py/switch.py, SunSpec-Modus (Slave-ID 100) über
    sensor.py (~56 Sensoren, beschreibungsbasiert). Register, die bereits
    über eine NumberEntity/SwitchEntity weg-/rücklesbar sind, gelten als
    "lesbar" und benötigen keinen zusätzlichen Sensor.
  requirements:
    - "Jedes Sensor-Feld hat einen deutschen, fachlich verständlichen
       Namen (keine reinen Registernummern oder unübersetzten
       SunSpec-Rohbezeichnungen als Anzeigename)."
    - "SunSpec-Skalierungsfaktor-Register (sunssf) werden auf die
       zugehörigen Messwerte angewendet und zusätzlich selbst als
       Diagnose-Sensor (entity_category: diagnostic) exponiert."
    - "Für Registergruppen mit L1/L2/L3-Aufteilung existiert je nach
       Verfügbarkeit ein herstellerseitiger oder berechneter
       Summen-Sensor."
  acceptance_criteria:
    - "Alle dokumentierten Register sind nach dem Setup als sensor.*-Entity
       sichtbar und liefern einen Wert (SunSpec-Modus vorausgesetzt
       erreichbar, siehe REQ-EXTENDED-MODE-RESILIENCE)."
    - "README.md beschreibt die Sensoren gruppiert nach Basic Mode und
       SunSpec-Modus."

# ==============================================================================
# ANFORDERUNG: IP-ADRESSE ÜBER DIE OBERFLÄCHE ÄNDERBAR
# ==============================================================================
requirement_ip_configurable_ui:
  id: REQ-IP-CONFIGURABLE-UI
  title: "IP-Adresse des SAX Speichers über die Home-Assistant-Oberfläche eintragbar, persistiert und jederzeit änderbar"
  status: done
  description: >
    Der Config Flow (config_flow.py) unterstützt sowohl die Ersteinrichtung
    (async_step_user) als auch einen Reconfigure-Flow
    (async_step_reconfigure), erreichbar über
    "Einstellungen -> Geräte & Dienste -> SAX Power Home -> ⋮ -> Neu
    konfigurieren". Das Formular ist mit den aktuell gespeicherten Werten
    vorbelegt. Die neue Verbindung wird vor dem Speichern geprüft
    (derselbe Testread wie bei der Ersteinrichtung); bei Erfolg werden die
    Werte persistiert (entry.data) und die Integration lädt automatisch mit
    den neuen Daten neu. Eine Kollisionsprüfung verhindert Duplikate mit
    einem anderen bereits konfigurierten Speicher, ohne beim unveränderten
    Speichern der eigenen IP fälschlich abzubrechen.
  requirements:
    - "Reconfigure-Formular verwendet dieselben Felder wie die
       Ersteinrichtung (IP-Adresse, Port, Slave-IDs, Intervall)."
    - "Fehlermeldungen unterscheiden TCP-Verbindungsfehler
       ('cannot_connect') von einer Modbus-Fehlerantwort bei bestehender
       Verbindung ('invalid_response', z. B. falsche Slave-ID)."
  acceptance_criteria:
    - "tests/test_config_flow.py deckt sowohl erfolgreiche IP-Änderung
       (inkl. Persistierung + Neuladen) als auch fehlgeschlagene
       Validierung (Daten bleiben unverändert) ab."
    - "README.md beschreibt, wie die IP-Adresse nachträglich geändert
       wird."

# ==============================================================================
# ANFORDERUNG: SUNSPEC-MODUS OPTIONAL (KEIN TOTALAUSFALL BEI NICHTVERFÜGBARKEIT)
# ==============================================================================
requirement_extended_mode_resilience:
  id: REQ-EXTENDED-MODE-RESILIENCE
  title: "Nicht erreichbarer SunSpec-Modus-Block darf nicht alle Sensoren lahmlegen"
  status: done
  description: >
    Basic Mode (Slave-ID 64) und SunSpec-Modus (Slave-ID 100) werden im
    Coordinator entkoppelt gelesen (SaxPowerCoordinator._async_read_extended):
      - Scheitert der Basic-Mode-Read: UpdateFailed, da Basic Mode die
        Mindestanforderung für jede Funktion der Integration ist.
      - Scheitert der SunSpec-Modus-Read: Das Update schlägt NICHT fehl;
        die betroffenen Sensoren zeigen "unbekannt", Basic-Mode-Daten
        bleiben unverändert verfügbar. Bei Wiederherstellung werden die
        SunSpec-Sensoren automatisch wieder befüllt.
      - Zustandswechsel (verfügbar -> nicht verfügbar -> wieder verfügbar)
        werden geloggt und zusätzlich als Home-Assistant-Repair-Issue
        (extended_mode_unavailable) angezeigt.
  acceptance_criteria:
    - "Live-Test gegen einen simulierten Modbus-Server ohne SunSpec-Modus-
       Gerät zeigt: Config Entry lädt erfolgreich, Basic-Mode-Sensoren
       liefern echte Werte, SunSpec-Sensoren existieren als Entity mit
       Zustand 'unbekannt' (tests/test_integration_live.py)."
    - "Unit-Tests decken sowohl den Übergang verfügbar -> nicht verfügbar
       als auch die Wiederherstellung ab (tests/test_coordinator.py)."

# ==============================================================================
# ANFORDERUNG: TESTS GEGEN ECHTE SAX-HARDWARE
# ==============================================================================
requirement_real_hardware_tests:
  id: REQ-REAL-HARDWARE-TESTS
  title: "Testfälle lesen echte Werte von einem physischen SAX Speicher"
  status: done
  description: >
    tests/test_real_hardware.py liest Werte von einem echten SAX Power
    Home (Plus) im lokalen Netz - rein lesend, kein Schreibzugriff. Die
    Verbindungsdaten stehen in tests/real_device.yaml (Host, Port, beide
    Slave-IDs, Verbindungs-Timeout). Ist dort keine IP hinterlegt
    (Auslieferungszustand: host: null) oder der Speicher nicht erreichbar,
    werden die betroffenen Tests automatisch übersprungen (pytest.skip).
  requirements:
    - "Gelesene Basic-Mode-Werte (SOC, Leistung) werden auf plausible
       Wertebereiche geprüft statt auf feste erwartete Werte."
    - "Ist der SunSpec-Modus auf dem realen Gerät nicht erreichbar, wird
       der entsprechende Testfall übersprungen statt fehlzuschlagen
       (konsistent mit REQ-EXTENDED-MODE-RESILIENCE)."
  acceptance_criteria:
    - "pytest läuft ohne hinterlegte IP vollständig durch (betroffene
       Tests werden übersprungen, keine Fehler)."
    - "README.md beschreibt tests/real_device.yaml und wie der
       Live-Hardware-Test aktiviert wird."

# ==============================================================================
# ANFORDERUNG: SUNSPEC-MODUS-REGISTERKARTE (SLAVE-ID 100)
# ==============================================================================
requirement_sunspec_mode_correction:
  id: REQ-SUNSPEC-MODE-CORRECTION
  title: "SunSpec-Modus-Registerkarte (Slave-ID 100) als alleinige Quelle für Speicher-/Netz-/Akkudetails"
  status: done
  description: >
    Der SunSpec-Modus liegt auf Slave-ID 100 mit Adress-Offset -40000
    (Register 40000-40114, siehe modbus.pdf und modbus_llm.yaml) und
    enthält einen zusammenhängenden Block aus fünf SunSpec-Modellen:
    Common (Geräteidentität), "3Ph Inverter" (103, Speicherelektronik),
    "Immediate Controls" (123, Sollwertvorgabe - Register 40049/40051
    zusätzlich als Schreibpfad für zeitgesteuertes Laden, siehe
    REQ-TIMED-SOC-CHARGE), "WYE Connect 3Ph Meter" (203, Netz/Smart Meter)
    und "Battery Base" (802, Akkuzellen).

    Entlade-/Ladeleistung (discharge_power/charge_power) werden aus
    Register 40029 ("Wirkleistung Speicher Summe") abgeleitet, die
    Smart-Meter-Leistung aus Register 40072 ("Summenwirkleistung Netz").
    Die Basic-Mode-Register 47 ("Leistung P des Speichers") und 48
    ("Leistung des Smart Meters") werden nicht mehr gelesen.

    Die "Immediate Controls"-Werte bleiben zusätzlich als
    Nur-Lese-Diagnosesensoren verfügbar (ic_power_setpoint_pct,
    ic_timeout, ic_control_mode_text, ic_max_power_reference) - diese
    Sensoren zeigen den tatsächlichen Geräte-Zustand, unabhängig davon,
    ob er gerade von der Integration selbst gesetzt wurde.

    Der Basic-Mode-P-Sollwert (Register 41, Slave 64, absoluter
    Watt-Sollwert) bleibt ausschließlich für den manuellen
    start_grid_charge/stop_grid_charge-Service in Verwendung, siehe
    REQ-TIMED-SOC-CHARGE.

    PV-Leistung (Register 40045) und das komplette Meter-Modell 203 sind
    laut modbus.pdf nur mit dem Smartmeter ADW200 vollständig verfügbar.
    Mit einem ADL400 sind die Netz-Register (Ströme, Spannungen,
    Leistungen) dennoch plausibel befüllt; nur PV-Leistung bleibt
    durchgehend 0.
  acceptance_criteria:
    - "modbus_llm.yaml dokumentiert den SunSpec-Modus-Block korrekt
       (Slave-ID 100, Offset -40000) und markiert die nicht mehr
       genutzten Basic-Mode-Register 47/48 als DEPRECATED."
    - "tests/test_coordinator.py, tests/test_integration_live.py und
       tests/test_real_hardware.py laufen gegen Slave-ID 100."
    - "README.md und die Sensortabellen verwenden die aktuellen
       Sensor-Keys."

# ==============================================================================
# ANFORDERUNG: ZEITGESTEUERTES LADEN AUF ZIEL-SOC
# ==============================================================================
requirement_timed_soc_charge:
  id: REQ-TIMED-SOC-CHARGE
  title: "Speicher innerhalb eines Zeitfensters auf einen festgelegten SOC laden, plus geräteunabhängige Max-SOC-Sperre"
  status: done
  description: >
    Zeitgesteuertes Laden und die Max-SOC-Sperre sind Software-Logik (kein
    natives Geräteregister für die Aktivierung selbst) und teilen sich eine
    zentrale Auswertung (SaxPowerCoordinator._async_enforce_grid_charge,
    bei jedem Poll-Zyklus sowie bei jeder Einstellungsänderung neu
    ausgewertet) sowie denselben SunSpec-Modus-Schreibpfad
    (_async_sun_charge_loop). Priorität pro Auswertung:

    1. Ist der SOC >= "Max. SOC" (number.py), hält der Coordinator Register
       40051 (Steuermodus) auf 1 (Sollwertvorgabe) und Register 40049
       (Leistungsvorgabe) auf 0 % - UNABHÄNGIG davon, ob zeitgesteuertes
       Laden aktiviert ist (z. B. auch bei einem durch PV-Überschuss vollen
       Speicher). Das verhindert dauerhaftes Volladen auf 100 % zugunsten
       der Batterie-Lebensdauer; der Speicher entlädt sich währenddessen
       nicht automatisch zur Eigenverbrauchsdeckung, da Register 40049 = 0 %
       Netto-Leistungsfluss = 0 (weder Laden noch Entladen) erzwingt.

       Alle drei Software-Einstellungen dieses Abschnitts ("Max. SOC",
       "Netzladung Min. SOC", "Max. Netzladeleistung") werden von ihrem
       jeweiligen Coordinator-Setter (async_set_max_soc/
       async_set_timed_charge_min_soc/async_set_max_charge_power,
       coordinator._clamp_int) auf ihren gültigen Bereich geklemmt (0-100 %
       bzw. MIN_POWER_LIMIT-MAX_POWER_LIMIT), nicht nur vom
       NumberEntity-Schieberegler in der Oberfläche - der reguläre
       Service-Call-Pfad (async_set_native_value) ist dadurch zwar bereits
       über native_min_value/native_max_value abgesichert, der
       RestoreEntity-Pfad beim Neustart (async_added_to_hass) ruft den
       Coordinator-Setter jedoch direkt mit dem gespeicherten Zustand auf,
       ohne diese Validierung zu durchlaufen - ein korrupter oder aus einer
       künftigen Version mit engeren Grenzen stammender gespeicherter Wert
       würde sonst ungeprüft übernommen.

       Wurde der Ziel-SOC dabei INNERHALB des Netzladung- oder des
       netzdienlichen Zeitfensters erreicht (_max_soc_hold_is_window_bound),
       gilt die Sperre nur bis zum Ende genau dieses Zeitfensters: Register
       40051 wird bis dahin periodisch auf 1 nachgeschrieben (Timeout siehe
       Register 40050/REG_SUN_IC_TIMEOUT), danach aktiv auf 0 zurückgesetzt,
       damit der Speicher wieder von der geräteeigenen SmartMeter-
       Nullregelung gesteuert wird - ohne diesen aktiven Rücksprung bliebe
       die Sperre unbegrenzt bestehen, da ein gehaltener 0-%-Sollwert den
       SOC nie von selbst unter den Zielwert fallen lässt.

       Wurde der Ziel-SOC dagegen AUSSERHALB jedes Zeitfensters erreicht
       (z. B. rein durch PV-Überschuss via Nullregelung, ohne aktives
       zeitgesteuertes oder netzdienliches Laden), gilt die Sperre
       grundsätzlich unbegrenzt - ABER: da ein gehaltener 0-%-Sollwert auch
       hier den SOC im Normalfall nie von selbst unter den Zielwert fallen
       lässt (der Speicher deckt den Hausverbrauch währenddessen nicht mit,
       siehe oben), wertet der Coordinator zusätzlich am Smart Meter
       gemessenen Netzbezug (data["smartmeter_power"] <
       -SMARTMETER_PV_SURPLUS_THRESHOLD_WATT, also mehr als 50 W Bezug) als
       weiteren Freigabe-Trigger aus, mit derselben einheitlichen
       Zyklen-Hysterese (self._max_soc_grid_import_wait_cycles, siehe unten
       "PV-Überschuss-Prüfung") gegen kurze Lastspitzen: erst wenn
       PV_SURPLUS_HYSTERESIS_CYCLES aufeinanderfolgende Aufrufe von
       _async_enforce_grid_charge Netzbezug über dem Schwellwert melden,
       wird Register 40051 aktiv auf 0 zurückgesetzt. Ohne diesen Trigger
       würde die Sperre in diesem Fall de facto dauerhaft bestehen bleiben
       und der Hausverbrauch dauerhaft aus dem Netz statt aus dem Speicher
       gedeckt, bis der Nutzer manuell eingreift (z. B. "Max. SOC" ändert).
       Der Zähler wird bei fehlendem oder unter dem Schwellwert liegendem
       smartmeter_power sowie beim Verlassen dieses Zweigs (SOC unter
       Zielwert, Wechsel in einen zeitfenstergebundenen Zustand) auf 0
       zurückgesetzt.
    2. Andernfalls: Ist zeitgesteuertes Laden aktiviert (switch.py,
       "Netzladung aktiv"), die aktuelle Uhrzeit innerhalb des
       konfigurierten Zeitfensters (time.py, "Netzladung Start"/"Netzladung
       Ende", HH:MM, darf über Mitternacht laufen), im aktiven Monat, "Max.
       Netzladeleistung" (number.py) gesetzt, "Netzladung Min. SOC"
       (number.py, siehe unten) gesetzt UND unterschritten (bzw. bereits
       zuvor unterschritten und noch nicht bis "Max. SOC" durchgeladen -
       siehe Hysterese unten) UND kein über die einheitliche
       Zyklen-Hysterese (siehe unten "PV-Überschuss-Prüfung") bestätigter
       PV-Überschuss über SMARTMETER_PV_SURPLUS_THRESHOLD_WATT (const.py,
       50 W) am Smart Meter gemessen, wird Register 40049 auf einen
       negativen, aus "Max. Netzladeleistung" umgerechneten Sollwert
       gesetzt.

       "Netzladung Min. SOC" (self._timed_charge_min_soc, NumberEntity
       SaxPowerTimedChargeMinSocNumber, 0-100 %): unterer SOC-Schwellwert,
       unterhalb dessen die Netzladung starten darf - im Unterschied zu
       "Max. SOC" (oberes, geräteunabhängiges Ziel, s. o., von Netzladung
       UND netzdienlichem Laden gemeinsam genutzt) eine reine
       Netzladung-Einstellung, da nur Netzladung aktiv aus dem Netz lädt und
       daher einen Schwellwert braucht, ab dem sich das lohnt.
       SaxPowerCoordinator._timed_charge_armed hält als Hysterese fest, ob
       der Schwellwert bereits unterschritten wurde: sobald current_soc <
       "Netzladung Min. SOC", wird _timed_charge_armed auf True gesetzt und
       bleibt es (auch wenn der SOC danach wieder über "Netzladung Min.
       SOC" steigt), bis der SOC "Max. SOC" erreicht/überschreitet (dann
       zurück auf False) - Netzladung lädt also einmal gestartet bis "Max.
       SOC" durch, statt bei jedem erneuten Überschreiten von "Netzladung
       Min. SOC" sofort wieder abzubrechen. Ohne vorherige Einstellung (z.
       B. direkt nach der Ersteinrichtung) steht der Wert auf MAX_SOC
       (100 %, SaxPowerTimedChargeMinSocNumber.async_added_to_hass) statt
       auf 0 oder "unbekannt" - andernfalls würde diese neu eingeführte
       Einstellung bestehende Konfigurationen brechen (SOC wäre praktisch
       nie < 0 %, Netzladung würde nie mehr armen); mit dem 100-%-Default
       verhält sich Netzladung dagegen wie vor Einführung dieser Einstellung
       (SOC ist praktisch immer < 100 %, der Schwellwert blockiert also
       zunächst nichts), bis der Anwender bewusst einen niedrigeren Wert
       setzt.
    3. Andernfalls stoppt die Netzladung: Register 40051 wird aktiv zurück
       auf 0 (SmartMeter-Nullregelung) gesetzt, statt nur passiv auf den
       geräteseitigen Timeout zu warten. Das umfasst neben Fensterende/
       Deaktivierung/fehlender Max.-Netzladeleistung auch den Fall, dass
       während eines laufenden Zeitfensters PV-Überschuss über dem
       Schwellwert über die einheitliche Zyklen-Hysterese (siehe unten)
       bestätigt wird - die Netzladung wird dann innerhalb weniger
       Poll-Zyklen (nicht erst am Fensterende) beendet, weil in diesem Fall
       die geräteeigene SmartMeter-Nullregelung den PV-Überschuss ohnehin
       bereits selbst zum Laden nutzt.

    PV-Überschuss-Prüfung: Grundlage ist data["smartmeter_power"] (SunSpec-
    Modus, Register 40072 "Summenwirkleistung Netz", REG_SUN_METER_
    POWER_ACTIVE_SUM) - derselbe, bereits vorzeichenrichtig umgerechnete Wert
    (apply_sunssf/to_signed16), der auch im Sensor "Smart Meter Leistung"
    angezeigt wird (sensor.py, unverändert via _direct). Vorzeichenkonvention
    (Anwenderangabe, nicht offiziell in modbus.pdf dokumentiert): ein
    POSITIVER Anzeigewert bedeutet Überschuss aus der Dachphotovoltaik
    (Einspeisung ins Netz); der rohe Registerinhalt selbst kann davon
    abweichende Vorzeichen tragen, deshalb wertet die Prüfung bewusst den
    bereits umgerechneten Anzeigewert aus, nicht das Rohregister direkt.
    Ist der Wert (noch) nicht verfügbar (z. B. SunSpec-Modus nicht
    erreichbar), blockiert das die Netzladung nicht. Der Schwellwert
    SMARTMETER_PV_SURPLUS_THRESHOLD_WATT (const.py) ist bewusst als eigene,
    wiederverwendbare Konstante ausgelagert (50 W), da er absehbar auch an
    anderer Stelle für eine PV-Überschuss-Erkennung benötigt wird.

    Zyklen-Hysterese (einheitlich): JEDER Vergleich gegen
    SMARTMETER_PV_SURPLUS_THRESHOLD_WATT - hier der PV-Überschuss-Check von
    Punkt 2/3 sowie der Netzbezug-Freigabe-Trigger der Max-SOC-Sperre von
    Punkt 1, außerdem (siehe REQ-GRID-SERVING-CHARGE) Schritt a und b der
    Zustandsmaschine für netzdienliches Laden - läuft über dieselbe
    wiederverwendbare Hilfsmethode SaxPowerCoordinator._cycles_confirmed und
    dieselbe Konstante PV_SURPLUS_HYSTERESIS_CYCLES (const.py, 2): eine
    Schwellwert-Über-/Unterschreitung zählt erst als bestätigt, nachdem sie
    in so vielen aufeinanderfolgenden Poll-Zyklen in Folge vorlag; ein
    einzelner gegenteiliger Messwert setzt den jeweiligen Zähler (je
    Verwendungsstelle ein eigenes self-Attribut, z. B.
    self._timed_charge_pv_surplus_cycles,
    self._max_soc_grid_import_wait_cycles,
    self._grid_serving_charge_confirm_cycles,
    self._grid_serving_release_confirm_cycles) sofort auf 0 zurück. Schützt
    einheitlich gegen kurze Lastspitzen/Messausreißer am Smart Meter, statt
    dass jede Verwendungsstelle unmittelbar auf einen einzelnen Messwert
    reagiert.

    Schreibmechanismus (SunSpec-Modus, Slave-ID 100, Modell 123
    "Immediate Controls", siehe modbus_llm.yaml): Erst Register 40051 auf 1
    (Sollwertvorgabe), danach Register 40049 (Leistungsvorgabe, Prozent der
    Referenz-Maximalleistung Register 40053; SaxPowerCoordinator.
    _watts_to_ic_setpoint_raw; negativ=Laden - Vorzeichenkonvention laut
    modbus.pdf nicht dokumentiert, hier analog zum Basic-Mode-P-Sollwert
    angenommen. Die Integration schreibt hier bewusst nur negative
    Sollwerte - siehe REQ-MANUAL-DISCHARGE zum Befund bei positiven
    (entladenden) Sollwerten). Beide Register werden periodisch
    neu geschrieben (SaxPowerCoordinator._sun_ic_write_interval: die Hälfte
    des von Register 40050 gemeldeten Timeouts, gedeckelt auf 30s,
    mindestens alle 5s), da das Gerät den Sollwert sonst nach Ablauf des
    Timeouts verwirft.

    Der ältere Basic-Mode-P-Sollwert (Register 41) bleibt ausschließlich
    für den manuellen start_grid_charge/stop_grid_charge-Service erhalten
    (absoluter Watt-Sollwert, freie Vorzeichenwahl, eigener
    Hintergrund-Task). Die Integration schreibt die Basic-Mode-Register
    43/44 (Ent-/Ladeleistungsgrenzwert) nicht mehr; Register 43 wird gar
    nicht mehr gelesen, Register 44 nur noch einmalig als Vorgabewert (s.
    u.).

    "Max. SOC", "Max. Netzladeleistung" und "Netzladung Min. SOC" sind reine
    Software-Zustände (RestoreEntity, number.py) - "Max. SOC"/"Max.
    Netzladeleistung" sind dabei zentrale, von Netzladung UND
    netzdienlichem Laden gemeinsam genutzte Einstellungen, "Netzladung Min.
    SOC" ist eine reine Netzladung-Einstellung (siehe oben). Eine Änderung
    wirkt jeweils sofort (async_set_max_soc/async_set_max_charge_power/
    async_set_timed_charge_min_soc werten _async_enforce_grid_charge
    unmittelbar neu aus statt erst beim nächsten Poll-Zyklus). Alle drei
    persistieren über Neustarts hinweg; gibt es (z. B. direkt nach der
    Ersteinrichtung) noch keinen gespeicherten Zustand, setzen sie sich
    explizit auf einen Vorgabewert statt "unbekannt"/0 zu bleiben: "Max.
    SOC" UND "Netzladung Min. SOC" auf MAX_SOC (100 %,
    SaxPowerMaxSocNumber/SaxPowerTimedChargeMinSocNumber.
    async_added_to_hass), "Max. Netzladeleistung" auf den zu diesem
    Zeitpunkt vom Gerät gelesenen Wert von Basic-Mode-Register 44
    (SaxPowerChargeLimitNumber.async_added_to_hass) - danach rein
    Software-seitig, kein weiterer Register-Write.

    Aktiviert-Zustand sowie Start-/Endzeit des zeitgesteuerten Ladens
    ("Netzladung aktiv"/"Netzladung Start"/"Netzladung Ende") werden
    ebenfalls über RestoreEntity über Neustarts hinweg persistiert.
    Zusätzlich zeigt ein Diagnose-Sensor ("Zeitgesteuertes Laden aktiv") an,
    ob gerade zeitgesteuert nachgeladen wird - unabhängig von der
    Max-SOC-Sperre.

    Vorbelegung beim allerersten Start eines neuen Eintrags: Der
    Ersteinrichtungs-Dialog (config_flow.py) fragt nach der
    Verbindungsvalidierung einen zweiten, optionalen Schritt
    ("grid_charge") ab - Zeitfenster-Start/-Ende und Aktiviert-Status,
    alle Felder optional. Werden sie nicht ausgefüllt, gelten die Defaults
    DEFAULT_TIMED_CHARGE_START ("00:00:00"), DEFAULT_TIMED_CHARGE_END
    ("00:05:00") und DEFAULT_TIMED_CHARGE_ENABLED (False). Die im Config
    Entry gespeicherten Werte wirken sich über
    entity.initial_config_value ausschließlich dann aus, wenn die
    jeweilige RestoreEntity noch keinen gespeicherten Vorzustand hat (siehe
    SaxPowerTimedChargeSwitch/-StartTime/-EndTime.async_added_to_hass) -
    ein späterer Reconfigure-Flow (der diese Schlüssel nicht im Config
    Entry aktualisiert) hat darauf keinen Einfluss mehr, sobald einmal ein
    echter Zustand gespeichert wurde.
  acceptance_criteria:
    - "tests/test_coordinator.py deckt _is_time_in_window (normales
       Fenster, über Mitternacht laufendes Fenster, nicht gesetztes
       Fenster), _async_enforce_grid_charge (Start/Stop des
       zeitgesteuerten Ladens bei Zielerreichung/Fensterende/
       Deaktivierung/fehlender Max.-Netzladeleistung SOWIE die
       Max-SOC-Sperre unabhängig vom zeitgesteuerten Laden - Aktivierung
       bei Zielerreichung, Freigabe beim Unterschreiten), die
       Watt-zu-Prozent-Umrechnung (inkl. Klemmung auf ±100 %) sowie das
       Schreibintervall (_sun_ic_write_interval) ab."
    - "tests/test_coordinator.py deckt zusätzlich den Netzbezug-Freigabe-
       Trigger der geräteunabhängigen (nicht zeitfenstergebundenen)
       Max-SOC-Sperre ab: keine Freigabe bei nur einem Zyklus Netzbezug über
       dem Schwellwert (Hysterese hält die Sperre), Freigabe erst nach zwei
