# ==============================================================================
# ANFORDERUNG (ERGÄNZUNG): SUNSPEC-MODE-KORREKTUR (Slave-ID 100 statt 40)
# ==============================================================================
requirement_sunspec_mode_correction:
  id: REQ-SUNSPEC-MODE-CORRECTION
  title: "Extended-Mode-Registerkarte war fehlerhaft - Korrektur anhand der offiziellen sax-power.net-Dokumentation (modbus.pdf)"
  status: done
  requested_by: user
  description: >
    Nutzer hat die offizielle sax-power.net-Modbus-Dokumentation
    (Datei modbus.pdf im Repo-Root, "SAX Power Home/Home Plus Modbus-TCP
    Dokumentation (SUNSPEC-Mode)") bereitgestellt und gebeten, sie mit
    modbus_llm.yaml abzugleichen. Ergebnis: modbus_llm.yaml war an
    mehreren Stellen nachweislich falsch:

      - "Extended Mode" wurde dort mit Slave-ID 40 dokumentiert. Diese
        Slave-ID existiert auf echter Hardware nicht - ein Read darauf
        liefert eine Modbus-Exception (Code 11 "Gateway Target Device
        Failed to Respond"). modbus.pdf dokumentiert stattdessen eine
        einzige, offiziell unterstützte "SUNSPEC-Mode"-Schnittstelle auf
        Slave-ID 100.
      - Der dafür verwendete Adress-Offset (-40001) war für diesen Block
        ebenfalls falsch. Der korrekte Offset (-40000) wurde über die
        SunSpec-Kennung "SunS" (0x53756E53, laut SunSpec-Standard immer an
        Wire-Adresse 0) verifiziert.
      - "Immediate Controls" wurde fälschlich als eigene Slave-ID 123 mit
        Status "noch nicht verfügbar" dokumentiert. Tatsächlich ist 123
        die SunSpec-Modell-Nummer innerhalb des einen Registerblocks auf
        Slave-ID 100, und der Modus ist aktiv nutzbar (Register
        40049-40053).
      - Die produktiven Basic-Mode-Register 47 ("Leistung P des
        Speichers") und 48 ("Leistung des Smart Meters") lieferten im
        Live-Test gegen echte Hardware wiederholt physikalisch
        unplausible Werte (~16000-16600W bei einem 4600W-Gerät im
        Leerlauf, erwartete Last unter 10W) - vermutlich ein
        Firmware-seitiger Bug (Speicherbereich dieser beiden Register
        driftete langsam um 2^14, ohne auf reale Lastwechsel zu
        reagieren).

    Der komplette, gegen echte Hardware byte-genau verifizierte
    SunSpec-Mode-Registerblock (Slave-ID 100, Adresse 0-114, siehe
    modbus_llm.yaml) ersetzt die vorherige "Extended Mode"-Implementierung
    vollständig: const.py, coordinator.py (`_parse_extended`) und
    sensor.py wurden neu aufgebaut. Die Entlade-/Ladeleistung
    (`discharge_power`/`charge_power`) sowie die Smart-Meter-Leistung
    (`smartmeter_power`) beziehen ihre Werte jetzt aus dem SunSpec-Mode
    (Register 40029 bzw. 40072) statt aus den defekten Basic-Mode-
    Registern 47/48, die von der Integration nicht mehr gelesen werden.

    Zusätzliche Randbedingung: Der Anwender nutzt als Smartmeter ein
    ADL400 (nicht das in modbus.pdf für Modell 203 vorausgesetzte
    ADW200). Am echten Gerät waren die Netz-Register (Modell 203) trotzdem
    plausibel befüllt - nur PV-Leistung (Register 40045) war durchgehend
    0, was zur Doku-Aussage passt, dass PV-Leistung ADW200 voraussetzt.
  verification:
    - "Byte-genaue Live-Verifikation gegen echte Hardware: SunSpec-Kennung
       'SunS' an Adresse 0/1, alle 'wellknown'-Scalefaktoren aus
       modbus.pdf, Hersteller-String 'SAXPOWER', Referenzwert
       Maximalleistung (4600W) - alle stimmen exakt mit modbus.pdf überein."
    - "Wirkleistung Speicher Summe (Register 40029) lieferte im Live-Test
       plausible Werte (1W bzw. -2W bei nahezu Nulllast), im Gegensatz zu
       Register 47 (16000+W bei identischer realer Last)."
  acceptance_criteria:
    - "modbus_llm.yaml dokumentiert den SunSpec-Mode-Block korrekt
       (Slave-ID 100, Offset -40000) und markiert die defekten
       Basic-Mode-Register 47/48 als DEPRECATED mit Begründung."
    - "tests/test_coordinator.py, tests/test_integration_live.py und
       tests/test_real_hardware.py sind auf Slave-ID 100 umgestellt und
       laufen gegen simulierte UND echte Hardware erfolgreich durch."
    - "README.md und die Sensortabellen sind auf die neuen Sensor-Keys
       umgestellt."
    - "Der Schreibpfad für Netzladung (`start_grid_charge`-Service) bleibt
       unverändert (Basic Mode, Register 41) - eine Umstellung auf den
       offiziellen prozentualen Immediate-Controls-Schreibpfad
       (Register 40049-40051) ist bewusst NICHT Teil dieser Änderung, da
       ein Wechsel des Schreibpfads für ein Gerät, das reale
       Leistungsflüsse in ein Haus steuert, eine eigene, gezielte
       Abstimmung mit dem Anwender verdient. Die zugehörigen Werte sind
       bereits als Nur-Lese-Sensoren verfügbar (ic_power_setpoint_pct,
       ic_timeout, ic_control_mode_text, ic_max_power_reference)."

# ==============================================================================
# ANFORDERUNG (ERGÄNZUNG): ZEITGESTEUERTES LADEN AUF ZIEL-SOC
# ==============================================================================
requirement_timed_soc_charge:
  id: REQ-TIMED-SOC-CHARGE
  title: "Speicher innerhalb eines Zeitfensters auf einen festgelegten SOC laden"
  status: done
  requested_by: user
  description: >
    Neues Feature unter "Steuerung": Der Speicher soll innerhalb eines
    konfigurierbaren Zeitfensters aktiv auf einen Ziel-SOC geladen werden,
    unabhängig von PV-Überschuss - Beispiel: "Lade auf 90 %, wenn es
    zwischen 1 und 5 Uhr ist" (klassischer Anwendungsfall: günstiger
    Nachtstromtarif).

    Reine Software-Logik (kein natives Geräteregister), analog zur
    bestehenden Max-SOC-Logik. Neue Entitäten:
      - switch.py: "Zeitgesteuertes Laden" (Ein/Aus)
      - number.py: "Ziel-SOC (Zeitfenster)" (0-100 %),
        "Ladeleistung (Zeitfenster)" (W)
      - time.py (neue Plattform): "Beginn Zeitfenster",
        "Ende Zeitfenster" (jeweils HH:MM, via TimeEntity)
      - sensor.py (Diagnose): "Zeitgesteuertes Laden aktiv"

    Umsetzung in `SaxPowerCoordinator._async_enforce_timed_charge`
    (coordinator.py), bei jedem Poll-Zyklus (und sofort bei jeder
    Einstellungsänderung) neu ausgewertet: Ist das Feature aktiviert, die
    aktuelle Uhrzeit im Zeitfenster (`_is_time_in_window`, unterstützt über
    Mitternacht laufende Fenster) und der SOC unter dem Ziel-SOC, wird
    `async_start_grid_charge(-Ladeleistung)` aufgerufen - derselbe
    Mechanismus wie der bestehende `start_grid_charge`-Service (Register
    41, periodischer Write alle 30s). Wird der Ziel-SOC erreicht, das
    Fenster verlassen oder das Feature deaktiviert, wird
    `async_stop_grid_charge()` aufgerufen.

    Alle fünf Werte sind reiner Coordinator-Zustand ohne Geräteregister
    (wie schon Max-SOC) und werden daher über `RestoreEntity` bei jedem
    Home-Assistant-Neustart aus dem zuletzt bekannten Entity-Zustand
    wiederhergestellt - sonst müsste der Zeitplan nach jedem Neustart neu
    eingerichtet werden.
  known_interaction: >
    Zeitgesteuertes Laden und der manuelle
    `start_grid_charge`/`stop_grid_charge`-Service teilen sich denselben
    Hintergrund-Task (`_grid_charge_task`). Es gibt bewusst keine eigene
    Arbitrierung zwischen beiden - bei gleichzeitiger Nutzung gewinnt der
    zuletzt schreibende Aufruf. Dokumentiert in README.md.
  testing_note: >
    Für die Zeitfenster-Logik wurde bewusst NICHT die `freezer`-Fixture
    (freezegun) verwendet, da freezegun auch die vom Event-Loop für
    `asyncio.sleep` genutzte Uhr einfriert und dadurch der in
    `async_start_grid_charge` gespawnte Hintergrund-Task nie mehr aufwacht
    - der erste Testlauf hing deshalb unbegrenzt. Stattdessen wird gezielt
    nur `coordinator.dt_util.now` gepatcht (siehe `_patched_now` in
    tests/test_coordinator.py). Zur Absicherung gegen zukünftige ähnliche
    Hänger wurde zusätzlich ein globales pytest-Timeout (60s,
    pyproject.toml) ergänzt.
  acceptance_criteria:
    - "tests/test_coordinator.py deckt _is_time_in_window (normales
       Fenster, über Mitternacht laufendes Fenster, nicht gesetztes
       Fenster) sowie _async_enforce_timed_charge (Start/Stop bei
       Zielerreichung/Fensterende/Deaktivierung) ab."
    - "tests/test_integration_live.py enthält einen End-to-End-Test, der
       über echte Modbus-TCP-Kommunikation verifiziert, dass Aktivieren
       des Features innerhalb des Zeitfensters einen echten negativen
       P-Sollwert-Write auf Register 41 auslöst."
    - "README.md beschreibt die neuen Entitäten sowie die Interaktion mit
       dem bestehenden Netzladung-Service."