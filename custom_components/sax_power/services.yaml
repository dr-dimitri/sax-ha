start_grid_charge:
  name: Netzladung starten
  description: >-
    Startet die Netzladung des SAX Speichers. Schaltet das Gerät implizit in
    den P-Sollwert-Modus (Register 40042) und schreibt den Sollwert
    periodisch (alle 30s), bis stop_grid_charge aufgerufen wird.
  fields:
    device_id:
      name: Gerät
      description: Das SAX Power Gerät.
      required: true
      selector:
        device:
          integration: sax_power
    power:
      name: Leistung
      description: >-
        Sollwert für die Netzladung in Watt. Vorzeichenkonvention ist
        herstellerseitig nicht dokumentiert und sollte am realen Gerät
        verifiziert werden.
      required: true
      selector:
        number:
          min: -32768
          max: 32767
          unit_of_measurement: W
          mode: box

stop_grid_charge:
  name: Netzladung stoppen
  description: Beendet die periodischen Sollwert-Schreibbefehle der Netzladung.
  fields:
    device_id:
      name: Gerät
      description: Das SAX Power Gerät.
      required: true
      selector:
        device:
          integration: sax_power

set_timed_charge_window:
  name: Netzladung-Zeitfenster setzen
  description: >-
    Setzt Start- und Endzeit des Zeitfensters für die zeitgesteuerte
    Netzladung atomar in einem Aufruf. Im Unterschied zum einzelnen Ändern
    der Start-/Ende-Uhrzeit-Entities wird dabei nur das tatsächliche
    Ziel-Fenster auf Überschneidung mit dem netzdienlichen Laden geprüft -
    ein rein durch die getrennte Bearbeitung beider Entities entstehendes,
    nicht beabsichtigtes Zwischenfenster kann die Änderung dadurch nicht
    mehr fälschlich blockieren.
  fields:
    device_id:
      name: Gerät
      description: Das SAX Power Gerät.
      required: true
      selector:
        device:
          integration: sax_power
    start:
      name: Start
      description: Beginn des Zeitfensters.
      required: true
      selector:
        time:
    end:
      name: Ende
      description: Ende des Zeitfensters.
      required: true
      selector:
        time:

set_grid_serving_window:
  name: Netzdienliches-Laden-Zeitfenster setzen
  description: >-
    Setzt Start- und Endzeit des Zeitfensters für das netzdienliche Laden
    atomar in einem Aufruf - siehe set_timed_charge_window.
  fields:
    device_id:
      name: Gerät
      description: Das SAX Power Gerät.
      required: true
      selector:
        device:
          integration: sax_power
    start:
      name: Start
      description: Beginn des Zeitfensters.
      required: true
      selector:
        time:
    end:
      name: Ende
      description: Ende des Zeitfensters.
      required: true
      selector:
        time:

refresh_price_plan:
  name: Ladeplan neu berechnen
  description: >-
    Berechnet den Ladeplan des preisoptimierten Ladens sofort neu und wendet
    ihn an, statt bis zur nächsten regulären Prüfung (alle 60 Sekunden) zu
    warten. Nützlich in Automationen, die den Strompreis-Sensor selbst
    aktualisieren.
  fields:
    device_id:
      name: Gerät
      description: Das SAX Power Gerät.
      required: true
      selector:
        device:
          integration: sax_power

set_price_charge_enabled:
  name: Preisoptimiertes Laden schalten
  description: >-
    Schaltet das preisoptimierte Laden ein oder aus. Nicht-interaktiver
    Gegenpart zum Schalter "Preisoptimiertes Laden aktiv": Steht die
    Netzladung (zeitgesteuertes Laden) dem Einschalten im Weg, schlägt der
    Aufruf mit einem Fehler fehl - mit "force" wird die Netzladung
    stattdessen ohne Rückfrage abgeschaltet.
  fields:
    device_id:
      name: Gerät
      description: Das SAX Power Gerät.
      required: true
      selector:
        device:
          integration: sax_power
    enabled:
      name: Aktiv
      description: Preisoptimiertes Laden ein- (true) oder ausschalten (false).
      required: true
      selector:
        boolean:
    force:
      name: Erzwingen
      description: >-
        Schaltet eine gleichzeitig aktive Netzladung ohne Rückfrage ab, statt
        den Aufruf abzulehnen.
      required: false
      default: false
      selector:
        boolean:

create_dashboard:
  name: Dashboard anlegen
  description: >-
    Legt das mitgelieferte Dashboard "SAX Power" nachträglich an - z. B. wenn
    es bei der Ersteinrichtung abgewählt oder später gelöscht wurde. Tut
    nichts, wenn es bereits existiert.
  fields:
    device_id:
      name: Gerät
      description: Das SAX Power Gerät.
      required: true
      selector:
        device:
          integration: sax_power

reinstall_dashboard:
  name: Dashboard neu installieren
  description: >-
    Setzt das Dashboard "SAX Power" auf den Auslieferungszustand zurück -
    überschreibt ein vorhandenes Dashboard mit der aktuell gebauten
    Konfiguration (z. B. nach manuellen Änderungen) oder legt es neu an,
    falls es zwischenzeitlich gelöscht wurde. Panel-Registrierung und
    Sidebar-Sichtbarkeit bleiben dabei unverändert, es wird nur der
    Karteninhalt neu geschrieben.
  fields:
    device_id:
      name: Gerät
      description: Das SAX Power Gerät.
      required: true
      selector:
        device:
          integration: sax_power

set_discharge_block_window:
  name: Entladesperre-Zeitfenster setzen
  description: >-
    Setzt Start- und Endzeit des Sperrfensters der Entladesperre (Modus
    "Zeitfenster") atomar in einem Aufruf - siehe set_timed_charge_window.
    Das Sperrfenster unterliegt keiner Überschneidungsprüfung mit den beiden
    Ladefenstern: die Entladesperre weicht ohnehin jeder Ladeautomatik.
  fields:
    device_id:
      name: Gerät
      description: Das SAX Power Gerät.
      required: true
      selector:
        device:
          integration: sax_power
    start:
      name: Start
      description: Beginn des Sperrfensters.
      required: true
      selector:
        time:
    end:
      name: Ende
      description: Ende des Sperrfensters.
      required: true
      selector:
        time:
