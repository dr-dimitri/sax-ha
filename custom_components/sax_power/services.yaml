start_grid_charge:
  name: Netzladung starten
  description: >-
    Fordert eine manuelle Netzladung über den zentralen SunSpec-Steuerpfad an.
    Die Max-SOC-Sperre hat Vorrang; der manuelle Auftrag hat Vorrang vor den
    Ladeautomatiken und bleibt bis zum Aufruf von stop_grid_charge aktiv.
  fields:
    device_id:
      name: Gerät
      description: Das SAX Power Gerät.
      required: true
      selector:
        device:
          integration: sax_power
    power:
      name: Leistung
      description: >-
        Strikt negativer Sollwert für die Netzladung in Watt. Null und positive
        Werte sind nicht zulässig; eine manuelle Entladung wird nicht unterstützt.
      required: true
      selector:
        number:
          min: -32768
          max: -1
          step: 1
          unit_of_measurement: W
          mode: box

stop_grid_charge:
  name: Netzladung stoppen
  description: >-
    Beendet den manuellen Ladeauftrag, wartet das Ende des gemeinsamen
    Schreib-Tasks ab und setzt den Speicher bestmöglich auf die
    SmartMeter-Nullregelung zurück.
  fields:
    device_id:
      name: Gerät
      description: Das SAX Power Gerät.
      required: true
      selector:
        device:
          integration: sax_power

set_timed_charge_window:
  name: Netzladung-Zeitfenster setzen
  description: >-
    Setzt Start- und Endzeit des Zeitfensters für die zeitgesteuerte
    Netzladung atomar in einem Aufruf. Im Unterschied zum einzelnen Ändern
    der Start-/Ende-Uhrzeit-Entities wird dabei nur das tatsächliche
    Ziel-Fenster auf Überschneidung mit dem netzdienlichen Laden geprüft -
    ein rein durch die getrennte Bearbeitung beider Entities entstehendes,
    nicht beabsichtigtes Zwischenfenster kann die Änderung dadurch nicht
    mehr fälschlich blockieren.
  fields:
    device_id:
      name: Gerät
      description: Das SAX Power Gerät.
      required: true
      selector:
        device:
          integration: sax_power
    start:
      name: Start
      description: Beginn des Zeitfensters.
      required: true
      selector:
        time:
    end:
      name: Ende
      description: Ende des Zeitfensters.
      required: true
      selector:
        time:

set_charging_settings:
  name: Ladeeinstellungen übernehmen
  description: >-
    Validiert alle übergebenen Ladeeinstellungen gemeinsam und übernimmt sie
    ohne Teiländerungen. Mindestens ein Zahlenwert ist erforderlich.
  fields:
    device_id:
      name: Gerät
      description: Das SAX Power Gerät.
      required: true
      selector:
        device:
          integration: sax_power
    max_soc:
      name: Max SOC
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    timed_charge_min_soc:
      name: Ladestart
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    timed_charge_max_soc:
      name: Netzladeziel
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    price_charge_max_price:
      name: Netzbezug und Laden bis
      selector:
        number:
          min: -100
          max: 200
          step: 0.1
          unit_of_measurement: ct/kWh
          mode: box
    price_charge_hours:
      name: Stunden
      selector:
        number:
          min: 1
          max: 24
          step: 1
          unit_of_measurement: h
          mode: box
    price_charge_neutral_price:
      name: Netzbezug ohne Laden bis
      selector:
        number:
          min: -100
          max: 200
          step: 0.1
          unit_of_measurement: ct/kWh
          mode: box

set_grid_serving_window:
  name: Netzdienliches-Laden-Zeitfenster setzen
  description: >-
    Setzt Start- und Endzeit des Zeitfensters für das netzdienliche Laden
    atomar in einem Aufruf - siehe set_timed_charge_window.
  fields:
    device_id:
      name: Gerät
      description: Das SAX Power Gerät.
      required: true
      selector:
        device:
          integration: sax_power
    start:
      name: Start
      description: Beginn des Zeitfensters.
      required: true
      selector:
        time:
    end:
      name: Ende
      description: Ende des Zeitfensters.
      required: true
      selector:
        time:

refresh_price_plan:
  name: Ladeplan neu berechnen
  description: >-
    Berechnet den Ladeplan des preisoptimierten Ladens sofort neu und wendet
    ihn an, statt bis zur nächsten regulären Prüfung (alle 60 Sekunden) zu
    warten. Nützlich in Automationen, die den Strompreis-Sensor selbst
    aktualisieren.
  fields:
    device_id:
      name: Gerät
      description: Das SAX Power Gerät.
      required: true
      selector:
        device:
          integration: sax_power

set_price_charge_enabled:
  name: Preisoptimiertes Laden schalten
  description: >-
    Schaltet das preisoptimierte Laden ein oder aus. Nicht-interaktiver
    Gegenpart zum Schalter "Preisoptimiertes Laden aktiv": Steht die
    Netzladung (zeitgesteuertes Laden) dem Einschalten im Weg, schlägt der
    Aufruf mit einem Fehler fehl - mit "force" wird die Netzladung
    stattdessen ohne Rückfrage abgeschaltet.
  fields:
    device_id:
      name: Gerät
      description: Das SAX Power Gerät.
      required: true
      selector:
        device:
          integration: sax_power
    enabled:
      name: Aktiv
      description: Preisoptimiertes Laden ein- (true) oder ausschalten (false).
      required: true
      selector:
        boolean:
    force:
      name: Erzwingen
      description: >-
        Schaltet eine gleichzeitig aktive Netzladung ohne Rückfrage ab, statt
        den Aufruf abzulehnen.
      required: false
      default: false
      selector:
        boolean:

restart_economics_accounting:
  name: Wirtschaftlichkeitsbilanz neu starten
  description: >-
    Setzt die Wirtschaftlichkeitsbilanz kontrolliert zurück - Geldsummen,
    Preisabdeckungszähler, Tages-Buckets, Aktivierungszeitpunkt und einen
    vorhandenen Tageszustand. Setzt den unbewerteten Bestand wie bei der
    erstmaligen Aktivierung auf 0. Rührt niemals
    die Energiezähler oder die Herkunftsaufteilung (Netz/PV/unbekannt) an.
    Lehnt ab, wenn die Wirtschaftlichkeit deaktiviert ist, noch nie
    initialisiert wurde. Keine rückwirkende Neuberechnung.
  fields:
    device_id:
      name: Gerät
      description: Das SAX Power Gerät.
      required: true
      selector:
        device:
          integration: sax_power
    confirm:
      name: Bestätigen
      description: >-
        Muss genau "true" sein - eine fehlende oder falsche Bestätigung
        lehnt den Aufruf ab, ohne irgendetwas zu verändern.
      required: true
      selector:
        boolean:
    reason:
      name: Grund
      description: >-
        Optionaler freier Text (höchstens 120 Zeichen), rein diagnostisch -
        erscheint ausschließlich im lokalen Diagnose-Download, nirgends
        sonst.
      required: false
      selector:
        text:
