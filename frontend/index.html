<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAX Power – lokale Frontend-Vorschau</title>
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <sax-power-vue-panel></sax-power-vue-panel>
    <script type="module">
      import "./src/panel.ts";
      const panel = document.querySelector("sax-power-vue-panel");
      panel.hass = { language: "de", states: {}, panels: { "sax-power": {} } };
      panel.panel = {
        config: { entry_id: "local-preview" },
        url_path: "sax-power-vue",
      };
      panel.route = {
        path:
          window.location.pathname === "/"
            ? "/allgemein"
            : window.location.pathname,
      };
      const size = window.matchMedia("(max-width: 600px)");
      panel.narrow = size.matches;
      size.addEventListener("change", (event) => {
        panel.narrow = event.matches;
      });
    </script>
  </body>
</html>
