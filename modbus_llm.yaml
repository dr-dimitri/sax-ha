# LLM: Dies ist die Beschfreibung der Modbusschnittstelle für den SAX Speicher
#
# HINWEIS (siehe anforderung.yaml, REQ-SUNSPEC-MODE-CORRECTION): Die
# ursprüngliche Version dieser Datei enthielt für "Extended Mode" eine
# Slave-ID 40 und einen Adress-Offset -40001, die beide gegen die offizielle
# sax-power.net-Dokumentation (Datei modbus.pdf im Repo-Root) sowie gegen
# echte Hardware verifiziert FALSCH waren - Slave-ID 40 existiert auf realer
# Hardware nicht (Modbus-Exception "Gateway Target Device Failed to
# Respond"). Der Abschnitt "SUNSPEC-MODE" unten ersetzt das vollständig,
# transkribiert und byte-genau gegen ein echtes Gerät verifiziert
# (SunSpec-Kennung "SunS", alle "wellknown"-Scalefaktoren, alle Werte
# plausibel). Der Basic-Mode-Abschnitt (Slave-ID 64) bleibt unverändert
# korrekt - dort stimmten Slave-ID und Offset bereits.
# ==============================================================================
# DOCUMENT METADATA & OVERVIEW
# ==============================================================================
document_title: "12 Unterstützte Protokolle - SAX Power Home (Plus)"
topic: "Modbus TCP Integration & Register Mappings"
target_audience: "Smart Home Integrators / System Engineers"
description: >
  Beschreibt die Modbus-TCP-Schnittstelle zur externen Steuerung und
  Datenabfrage des SAX Power Home (Plus) Speichersystems.

# ==============================================================================
# CONNECTION PARAMETERS & SYSTEM SETTINGS
# ==============================================================================
connection_settings:
  protocol: "Modbus TCP"
  standard_port: 502
  write_interval_recommendation:
    min_seconds: 5
    max_minutes: 5
  addressing_rule:
    offset_formula: "Interne Adresse = Protokolladresse - 40001 (NUR Basic Mode, Slave-ID 64)"
    offset_formula_sunspec_mode: "Interne Adresse = Protokolladresse - 40000 (SunSpec-Mode, Slave-ID 100 - siehe modbus.pdf)"
    function_code_03_holding_registers: true
    example:
      protocol_address: 40042
      internal_address: 41
    note: >
      Zwei unterschiedliche Register-Karten mit unterschiedlichem Offset auf
      demselben Gerät: Basic Mode (Slave-ID 64, Offset -40001) und
      SunSpec-Mode (Slave-ID 100, Offset -40000). Der SunSpec-Mode-Offset ist
      anhand der SunSpec-Kennung "SunS" an Protokolladresse 40000 gegen
      echte Hardware verifiziert (siehe anforderung.yaml,
      REQ-SUNSPEC-MODE-CORRECTION).

operation_modes:
  smart_meter_rs485:
    type: "Nullregelung via SAX Power Smart Meter"
    readable_values: ["SOC", "Momentanleistung Speicher", "Leistung Netzverknüpfungspunkt"]
    writable_values: ["Lade- und Entlade-Grenzwerte"]
  p_sollwert_tcp:
    type: "Sollwertvorgabe (Keine Smart Meter Regelung)"
    power_gradient_factory_setting: "0.27%/s"
    readable_values: ["SOC", "Momentanleistung Speicher", "Leistung Netzverknüpfungspunkt"]
    required_inputs: ["Sollwerte für Betrieb"]

# ==============================================================================
# REGISTER MAPS
# ==============================================================================
register_maps:

  # ----------------------------------------------------------------------------
  # BASIC MODE (Unit-ID: 64 / 0x40)
  # ----------------------------------------------------------------------------
  - slave_id: 64
    mode: "Basic Mode"
    device: "SAX Power Home (Plus)"
    registers:
      - protocol_addr: 40042
        internal_addr: 41
        name: "Sollwert Leistung P"
        unit: "Watt"
        datatype: "uint16"
        access: "Write"
        notes: "Nur in Betriebsart P-Sollwert (TCP) verfügbar."
      - protocol_addr: 40043
        internal_addr: 42
        name: "Sollwert cos(Phi)"
        unit: null
        datatype: "uint16"
        access: "Write"
        notes: "Nur in Betriebsart P-Sollwert (TCP) verfügbar."
      - protocol_addr: 40044
        internal_addr: 43
        name: "Leistungsgrenzwert für Entladung"
        unit: "Watt"
        datatype: "uint16"
        access: "Write"
        status: "Von der Integration nicht mehr genutzt"
        notes: "Nur nach Freischaltung verfügbar. Siehe anforderung.yaml REQ-TIMED-SOC-CHARGE: die zugehörige Number-Entity ('Max. Entladeleistung') wurde entfernt, die Integration liest/schreibt dieses Register nicht mehr."
      - protocol_addr: 40045
        internal_addr: 44
        name: "Leistungsgrenzwert für Ladung"
        unit: "Watt"
        datatype: "uint16"
        access: "Write"
        status: "Von der Integration nicht mehr genutzt"
        notes: "Nur nach Freischaltung verfügbar. Siehe anforderung.yaml REQ-TIMED-SOC-CHARGE: die zugehörige Number-Entity ('Max. Netzladeleistung') wurde entfernt, weil der eingestellte Watt-Wert in der Praxis keinen Einfluss auf die tatsächliche Ladeleistung hatte - die Integration liest/schreibt dieses Register nicht mehr."
      - protocol_addr: 40046
        internal_addr: 45
        name: "Schaltzustand des Speichers"
        unit: null
        datatype: "uint16"
        access: "Read/Write"
        notes: "Write Commands: 01=Aus, 02=Ein | Read Commands: 01=Aus, 02=Ein, 03=Verbunden"
      - protocol_addr: 40047
        internal_addr: 46
        name: "SOC des Speichers (Messwert)"
        unit: "Prozent"
        datatype: "uint16"
        access: "Read"
      - protocol_addr: 40048
        internal_addr: 47
        name: "Leistung P des Speichers (Messwert)"
        unit: "Watt"
        datatype: "uint16"
        access: "Read"
        status: "DEPRECATED - siehe anforderung.yaml REQ-SUNSPEC-MODE-CORRECTION"
        notes: >
          Live-Test gegen echte Hardware ergab hier wiederholt physikalisch
          unplausible Werte (~16000W bei einem 4600W-Gerät im Leerlauf).
          Die Integration liest dieses Register nicht mehr; die korrekte
          Entlade-/Ladeleistung kommt stattdessen aus dem SunSpec-Modus
          (Register 40029, siehe unten).
      - protocol_addr: 40049
        internal_addr: 48
        name: "Leistung des Smart Meters"
        unit: "Watt"
        datatype: "uint16"
        access: "Read"
        status: "DEPRECATED - siehe anforderung.yaml REQ-SUNSPEC-MODE-CORRECTION"
        notes: >
          Dieselbe Beobachtung wie bei Register 47. Die Integration liest
          dieses Register nicht mehr; die korrekte Netz-/Smart-Meter-
          Leistung kommt stattdessen aus dem SunSpec-Modus (Register
          40072, siehe unten).

  # ----------------------------------------------------------------------------
  # SUNSPEC-MODE (Slave-ID: 100) - siehe modbus.pdf (offizielle
  # sax-power.net-Dokumentation), verfügbar ab Firmwarekombination Master
  # V61 / Gateway V54. Byte-genau gegen eine echte SAX Power Home Plus
  # verifiziert (siehe anforderung.yaml, REQ-SUNSPEC-MODE-CORRECTION).
  #
  # WICHTIG: Adress-Offset ist hier -40000, NICHT -40001 wie im Basic Mode!
  # Verifiziert über die SunSpec-Kennung "SunS" (0x53756E53), die laut
  # SunSpec-Standard immer an Wire-Adresse 0 (= Protokolladresse 40000)
  # steht - genau das wurde am echten Gerät gemessen.
  #
  # Enthält 5 aneinandergereihte SunSpec-Modelle in einem zusammenhängenden
  # Block (40000-40114, 115 Register, ein einziger read_holding_registers-
  # Aufruf genügt): Common (1), 3Ph Inverter (103, Speicherelektronik),
  # Immediate Controls (123, Sollwertvorgabe), WYE Connect 3Ph Meter (203,
  # Netz/Smart Meter - laut modbus.pdf nur mit Smartmeter ADW200 vollständig
  # verfügbar; auf einem mit ADL400 verifizierten Gerät waren die
  # Netz-Register dennoch plausibel befüllt, einzig PV-Leistung war 0),
  # Battery Base (802, Akkuzellen).
  #
  # Hinweis zu "123": Das ist die SunSpec-Modell-Nummer (ein Datenfeld
  # innerhalb dieses einen Registerblocks), KEINE separate Modbus-Slave-ID -
  # anders als in einer früheren Version dieser Datei fälschlich behauptet.
  # ----------------------------------------------------------------------------
  - slave_id: 100
    mode: "SunSpec-Mode"
    device: "SAX Power Home (Plus)"
    scaling_rule: "Skalierungsfaktor (sunssf) ist Exponent von 10 (z.B. -1 = Multiplikator 0.1)"
    registers:
      # -- SunSpec Common Model (1) --
      - { protocol_addr: 40000, internal_addr: 0, name: "SunSpec ID (Hi)", datatype: "uint16", access: "Read", notes: "wellknown: 21365 (\"Su\")" }
      - { protocol_addr: 40001, internal_addr: 1, name: "SunSpec ID (Lo)", datatype: "uint16", access: "Read", notes: "wellknown: 28243 (\"nS\")" }
      - { protocol_addr: 40002, internal_addr: 2, name: "SunSpec Model ID", datatype: "uint16", access: "Read", notes: "wellknown: 1 (Common)" }
      - { protocol_addr: 40003, internal_addr: 3, name: "Länge", datatype: "uint16", access: "Read", notes: "wellknown: 15" }
      - { protocol_addr: 40004, internal_addr: 4, name: "Hersteller", datatype: "str (encoded uint16)", access: "Read", notes: "4 Register -> \"SAXPOWER\"" }
      - { protocol_addr: 40008, internal_addr: 8, name: "Gerätemodell", datatype: "str (encoded uint16)", access: "Read", notes: "3 Register -> \"HOME\" (+\"PL\" bei Home Plus)" }
      - { protocol_addr: 40011, internal_addr: 11, name: "Version Master", datatype: "uint16", access: "Read" }
      - { protocol_addr: 40012, internal_addr: 12, name: "Version Gateway", datatype: "uint16", access: "Read" }
      - { protocol_addr: 40013, internal_addr: 13, name: "Seriennummer (Hi)", datatype: "uint16", access: "Read" }
      - { protocol_addr: 40014, internal_addr: 14, name: "Seriennummer (Lo)", datatype: "uint16", access: "Read" }
      # -- SunSpec Model 103 "3Ph Inverter" (Speicherelektronik) --
      - { protocol_addr: 40015, internal_addr: 15, name: "Model Identifier", datatype: "uint16", access: "Read", notes: "wellknown: 103" }
      - { protocol_addr: 40016, internal_addr: 16, name: "Model Länge", datatype: "uint16", access: "Read", notes: "wellknown: 32" }
      - { protocol_addr: 40017, internal_addr: 17, name: "AC Strom Summe (Speicher)", unit: "A", datatype: "uint16", access: "Read" }
      - { protocol_addr: 40018, internal_addr: 18, name: "AC Strom Speicher A", unit: "A", datatype: "uint16", access: "Read" }
      - { protocol_addr: 40019, internal_addr: 19, name: "AC Strom Speicher B", unit: "A", datatype: "uint16", access: "Read" }
      - { protocol_addr: 40020, internal_addr: 20, name: "AC Strom Speicher C", unit: "A", datatype: "uint16", access: "Read" }
      - { protocol_addr: 40021, internal_addr: 21, name: "Scalefaktor AC Strom", unit: "sunssf", datatype: "int16", access: "Read", notes: "wellknown: -2" }
      - { protocol_addr: 40022, internal_addr: 22, name: "Spannung Speicher L1-L2", unit: "V", datatype: "uint16", access: "Read" }
      - { protocol_addr: 40023, internal_addr: 23, name: "Spannung Speicher L2-L3", unit: "V", datatype: "uint16", access: "Read" }
      - { protocol_addr: 40024, internal_addr: 24, name: "Spannung Speicher L3-L1", unit: "V", datatype: "uint16", access: "Read" }
      - { protocol_addr: 40025, internal_addr: 25, name: "Spannung Speicher A", unit: "V", datatype: "uint16", access: "Read" }
      - { protocol_addr: 40026, internal_addr: 26, name: "Spannung Speicher B", unit: "V", datatype: "uint16", access: "Read" }
      - { protocol_addr: 40027, internal_addr: 27, name: "Spannung Speicher C", unit: "V", datatype: "uint16", access: "Read" }
      - { protocol_addr: 40028, internal_addr: 28, name: "Scalefaktor Spannung", unit: "sunssf", datatype: "int16", access: "Read", notes: "wellknown: -1" }
      - { protocol_addr: 40029, internal_addr: 29, name: "Wirkleistung Speicher Summe", unit: "W", datatype: "int16", access: "Read", notes: "Ersetzt das unzuverlässige Basic-Mode-Register 47" }
      - { protocol_addr: 40030, internal_addr: 30, name: "Scalefaktor Leistung", unit: "sunssf", datatype: "int16", access: "Read", notes: "wellknown: 0" }
      - { protocol_addr: 40031, internal_addr: 31, name: "Netzfrequenz", unit: "Hz", datatype: "uint16", access: "Read" }
      - { protocol_addr: 40032, internal_addr: 32, name: "Scalefaktor Netzfrequenz", unit: "sunssf", datatype: "int16", access: "Read", notes: "wellknown: -2" }
      - { protocol_addr: 40033, internal_addr: 33, name: "Scheinleistung Speicher Summe", unit: "VA", datatype: "uint16", access: "Read" }
      - { protocol_addr: 40034, internal_addr: 34, name: "Scalefaktor Scheinleistung", unit: "sunssf", datatype: "int16", access: "Read", notes: "wellknown: 0" }
      - { protocol_addr: 40035, internal_addr: 35, name: "Blindleistung Speicher Summe", unit: "Var", datatype: "int16", access: "Read" }
      - { protocol_addr: 40036, internal_addr: 36, name: "Scalefaktor Blindleistung", unit: "sunssf", datatype: "int16", access: "Read", notes: "wellknown: 0" }
      - { protocol_addr: 40037, internal_addr: 37, name: "Leistungsfaktor Speicher Summe", datatype: "int16", access: "Read" }
      - { protocol_addr: 40038, internal_addr: 38, name: "Scalefaktor Leistungsfaktor", unit: "sunssf", datatype: "int16", access: "Read", notes: "wellknown: -3" }
      - { protocol_addr: 40039, internal_addr: 39, name: "Reserve", access: "Read", notes: "wellknown: 0" }
      - { protocol_addr: 40040, internal_addr: 40, name: "Reserve", access: "Read", notes: "wellknown: 0" }
      - { protocol_addr: 40041, internal_addr: 41, name: "Maximale Zelltemperatur", unit: "°C", datatype: "int16", access: "Read" }
      - { protocol_addr: 40042, internal_addr: 42, name: "Scalefaktor Temperatur", unit: "sunssf", datatype: "int16", access: "Read", notes: "wellknown: 0" }
      - { protocol_addr: 40043, internal_addr: 43, name: "Zustand", datatype: "int16", access: "Read", notes: "1:Aus 2:Standby 3:Wartezeit 4:Ein 7:SM-Fehler" }
      - { protocol_addr: 40044, internal_addr: 44, name: "Event", datatype: "uint16", access: "Read", notes: "0:Normalbetrieb 4:Insel-Fehler 8:f>> 9:f<< 10:U>> 11:U<< 15:Hardwarefehler" }
      - { protocol_addr: 40045, internal_addr: 45, name: "PV-Leistung", unit: "W", datatype: "uint16", access: "Read", notes: "Gemessen durch ADW200 - mit ADL400 typischerweise 0" }
      - { protocol_addr: 40046, internal_addr: 46, name: "Scalefaktor PV-Leistung", unit: "sunssf", datatype: "int16", access: "Read", notes: "wellknown: 1" }
      # -- SunSpec Model 123 "Immediate Controls" --
      - { protocol_addr: 40047, internal_addr: 47, name: "Sunspec Model ID", datatype: "uint16", access: "Read", notes: "wellknown: 123" }
      - { protocol_addr: 40048, internal_addr: 48, name: "Sunspec Length", datatype: "uint16", access: "Read", notes: "wellknown: 7" }
      - { protocol_addr: 40049, internal_addr: 49, name: "Leistungsvorgabe prozentual der Maximalleistung", unit: "%", datatype: "int16", access: "Read/Write", notes: "-100*SF bis +100*SF; Vorzeichenkonvention nicht dokumentiert (Integration nimmt an: negativ=Laden, positiv=Entladen). Schreibpfad für zeitgesteuertes Laden, siehe anforderung.yaml REQ-TIMED-SOC-CHARGE." }
      - { protocol_addr: 40050, internal_addr: 50, name: "Timeout der Leistungsvorgabe", unit: "s", datatype: "uint16", access: "Read/Write", notes: "max. 300s. Die Integration liest diesen Wert und wiederholt Schreibvorgänge auf 40049/40051 sicher innerhalb dieses Zeitfensters (nie öfter als alle 30s, nie seltener als die Hälfte des Timeouts)." }
      - { protocol_addr: 40051, internal_addr: 51, name: "Steuermodus", datatype: "uint16", access: "Read/Write", notes: "0:SmartMeter-Nullregelung 1:Sollwertvorgabe. Muss vor einem Schreibvorgang auf 40049 auf 1 gesetzt sein; die Integration setzt es beim Beenden der Netzladung aktiv wieder auf 0 zurück." }
      - { protocol_addr: 40052, internal_addr: 52, name: "Scalefaktor Leistungsvorgabe", unit: "sunssf", datatype: "int16", access: "Read", notes: "wellknown: -2 (10000=100%)" }
      - { protocol_addr: 40053, internal_addr: 53, name: "Referenzwert Maximalleistung", unit: "W", datatype: "uint16", access: "Read", notes: "Bezugspunkt für 100%: 4600/9200/13800" }
      # -- SunSpec Model 203 "WYE Connect 3Ph Meter ABC" (Netz/Smart Meter) --
      - { protocol_addr: 40054, internal_addr: 54, name: "Sunspec Model ID", datatype: "uint16", access: "Read", notes: "wellknown: 203" }
      - { protocol_addr: 40055, internal_addr: 55, name: "Sunspec Length", datatype: "uint16", access: "Read", notes: "wellknown: 41" }
      - { protocol_addr: 40056, internal_addr: 56, name: "AC Strom Summe (Netz)", unit: "A", datatype: "uint16", access: "Read" }
      - { protocol_addr: 40057, internal_addr: 57, name: "AC Strom Netz L1", unit: "A", datatype: "uint16", access: "Read" }
      - { protocol_addr: 40058, internal_addr: 58, name: "AC Strom Netz L2", unit: "A", datatype: "uint16", access: "Read" }
      - { protocol_addr: 40059, internal_addr: 59, name: "AC Strom Netz L3", unit: "A", datatype: "uint16", access: "Read" }
