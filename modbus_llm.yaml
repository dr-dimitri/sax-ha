      - { protocol_addr: 40068, internal_addr: 68, name: "Netzspannung L1-L3", unit: "V", datatype: "uint16", access: "Read" }
      - { protocol_addr: 40069, internal_addr: 69, name: "Scalefaktor Spannung", unit: "sunssf", datatype: "int16", access: "Read", notes: "wellknown: -1" }
