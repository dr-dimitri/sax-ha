      - { protocol_addr: 40071, internal_addr: 71, name: "Scalefaktor Frequenz", unit: "sunssf", datatype: "int16", access: "Read", notes: "wellknown: -2" }
      - { protocol_addr: 40072, internal_addr: 72, name: "Summenwirkleistung Netz", unit: "W", datatype: "int16", access: "Read", notes: "Ersetzt das unzuverlässige Basic-Mode-Register 48. Rohregister positiv = Einspeisung; die Integration negiert den Wert vor der Ablage in data[\"smartmeter_power\"], siehe anforderung.yaml REQ-SUNSPEC-MODE-CORRECTION - dort ist negativ = Einspeisung, positiv = Netzbezug (Standarddarstellung)." }
