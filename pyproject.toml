[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# HA 2026.11 must install its httpx alias before respx imports httpx.
addopts = "-p no:respx"
testpaths = ["tests"]
# Absicherung gegen hängende Tests (z. B. freezegun + asyncio.sleep in
# Hintergrund-Tasks, siehe tests/test_coordinator.py _patched_now).
timeout = 60
