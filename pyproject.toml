[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Absicherung gegen hängende Tests (z. B. freezegun + asyncio.sleep in
# Hintergrund-Tasks, siehe tests/test_coordinator.py _patched_now).
timeout = 60
